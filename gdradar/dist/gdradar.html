/* ============================================================
   GdRadar — stato applicativo
   Prototipo: tutto ciò che nella V1 vive su PostgreSQL qui sta
   in localStorage. La forma dei dati segue però lo schema del
   blueprint (§9), così il passaggio a un backend è una
   sostituzione di adapter, non una riscrittura.
   ============================================================ */
(function (GD) {
  'use strict';
  const U = GD.util;
  const KEY = 'gdradar.state.v1';
  const DAY = 86400000;

  const EMPTY = {
    v: 1,
    me: null,
    onboarding: { step: 0, draft: null },
    ricerca: {
      q: '',
      raggio: 25,
      tipi: ['utente', 'party', 'campagna', 'annuncio'],
      sistemi: [],
      ruolo: 'tutti',
      modalita: 'tutte',
      giorni: [],
      esperienza: 'tutte',
      newbieOnly: false,
      postiLiberi: false,
      ordine: 'compatibilita',
      vista: 'radar'
    },
    listings: [],
    requests: [],
    conversations: [],
    blocks: [],
    reports: [],
    feedback: [],
    pendingFeedback: [],
    notifications: [],
    cases: null,
    modRole: 'moderator',
    lettoPatto: false
  };

  let state = load();
  const subs = [];

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return JSON.parse(JSON.stringify(EMPTY));
      const parsed = JSON.parse(raw);
      return Object.assign(JSON.parse(JSON.stringify(EMPTY)), parsed);
    } catch (e) {
      return JSON.parse(JSON.stringify(EMPTY));
    }
  }
  function persist() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* quota o modalità privata */ }
  }

  function get() { return state; }
  function subscribe(fn) { subs.push(fn); return () => subs.splice(subs.indexOf(fn), 1); }
  function emit() { subs.forEach((f) => f(state)); }

  /* muta lo stato, salva e notifica */
  function set(mutator, opts) {
    mutator(state);
    persist();
    if (!opts || opts.render !== false) emit();
  }
  function reset() {
    state = JSON.parse(JSON.stringify(EMPTY));
    persist();
    emit();
  }

  /* ---------------- profilo ---------------- */
  function profiloVuoto() {
    return {
      id: 'me',
      tipo: 'utente',
      nome: '',
      bio: '',
      email: '',
      dataNascita: '',
      eta: null,
      ageVerification: { status: 'none', threshold: 18, provider: null, ref: null, verified_at: null },
      ruoli: [],
      esperienza: 'principiante',
      modalita: 'entrambe',
      formati: [],
      newbie: 'si',
      stili: [],
      lingue: ['Italiano'],
      games: [],
      disponibilita: { giorni: [], fasce: [], frequenza: 'quindicinale' },
      loc: null,
      visibilita: 'attivo',
      contatti: {},
      patto: false,
      tos: false,
      fairness: { n: 0, pos: 0, ultimo: null },
      creato: Date.now()
    };
  }

  const verificato = () => !!(state.me && state.me.ageVerification.status === 'verified');

  /* ---------------- inbox dimostrativa ----------------
     Alla creazione del profilo prepariamo qualche relazione già
     avviata: serve a mostrare i flussi C (contatto) e D (fairness)
     senza dover attendere giorni.                                */
  function seedDemo() {
    const users = GD.data.users;
    const parties = GD.data.parties;
    const near = users.filter((u) => state.me.loc && u.loc.cityId === state.me.loc.cityId);
    const pool = (near.length >= 3 ? near : users);
    const a = pool[0], b = pool[1] || users[3], c = pool[2] || users[5];
    const party = parties.find((p) => state.me.loc && p.loc.cityId === state.me.loc.cityId) || parties[0];
    const t = Date.now();

    state.requests = [
      { id: U.uid('req'), dir: 'in', kind: 'utente', id2: a.id, stato: 'pending', quando: t - 4 * 3600000,
        msg: 'Ciao! Ho visto che giochi negli stessi giorni. Al nostro tavolo manca una persona, ti va di parlarne?' },
      { id: U.uid('req'), dir: 'out', kind: 'party', id2: party.id, stato: 'pending', quando: t - 2 * DAY,
        msg: 'Buonasera, sono disponibile il giovedì sera e cerco un gruppo stabile.' }
    ];

    const conv = {
      id: U.uid('conv'),
      kind: 'utente',
      id2: b.id,
      apertaIl: t - 6 * DAY,
      chiusa: false,
      exchange: { mine: false, theirs: false, done: false, canali: [] },
      relazione: { qualificata: false, confermata: false },
      messages: [
        { from: 'sys', text: 'Richiesta di contatto accettata. Da qui in avanti potete scrivervi.', ts: t - 6 * DAY },
        { from: 'them', text: 'Ciao! Grazie per la richiesta. Giochiamo il mercoledì sera, di solito ogni due settimane.', ts: t - 6 * DAY + 600000 },
        { from: 'me', text: 'Perfetto, il mercoledì lo tengo libero. Che tipo di campagna avete in mente?', ts: t - 6 * DAY + 1800000 },
        { from: 'them', text: 'Investigativa, toni cupi ma niente splatter. Usiamo carta X e giro di controllo a metà sessione.', ts: t - 5 * DAY }
      ],
      unread: 1
    };

    const convVecchia = {
      id: U.uid('conv'),
      kind: 'utente',
      id2: c.id,
      apertaIl: t - 22 * DAY,
      chiusa: false,
      exchange: { mine: true, theirs: true, done: true, canali: ['telegram'], quando: t - 17 * DAY },
      relazione: { qualificata: true, confermata: false },
      messages: [
        { from: 'sys', text: 'Richiesta di contatto accettata.', ts: t - 22 * DAY },
        { from: 'them', text: 'Se ti va ci vediamo sabato al circolo, portiamo noi i manuali.', ts: t - 20 * DAY },
        { from: 'me', text: 'Ci sono. Ti lascio il contatto così ci organizziamo.', ts: t - 18 * DAY },
        { from: 'sys', text: 'Contatti scambiati con doppio consenso: Telegram.', ts: t - 17 * DAY }
      ],
      unread: 0
    };

    state.conversations = [conv, convVecchia];
    state.pendingFeedback = [
      { id: U.uid('fb'), kind: 'utente', id2: c.id, convId: convVecchia.id, quando: t - 16 * DAY }
    ];
    state.notifications = [
      { id: U.uid('n'), tipo: 'richiesta', testo: a.nome + ' ti ha inviato una richiesta di contatto', quando: t - 4 * 3600000, letto: false },
      { id: U.uid('n'), tipo: 'messaggio', testo: 'Nuovo messaggio da ' + b.nome, quando: t - 5 * DAY, letto: false },
      { id: U.uid('n'), tipo: 'fairness', testo: 'Avete giocato con ' + c.nome + '? Lascia un feedback', quando: t - 16 * DAY, letto: false }
    ];
  }

  /* ---------------- azioni di dominio ---------------- */
  function notify(tipo, testo) {
    state.notifications.unshift({ id: U.uid('n'), tipo, testo, quando: Date.now(), letto: false });
  }

  const api = {
    get, set, subscribe, reset, persist, profiloVuoto, verificato,

    creaProfilo(profile) {
      set((s) => {
        s.me = profile;
        s.ricerca.raggio = 25;
        seedDemo();
      });
    },

    /* --- richieste di contatto (flusso C) --- */
    inviaRichiesta(kind, id2, msg) {
      let ok = false;
      set((s) => {
        if (s.requests.some((r) => r.kind === kind && r.id2 === id2 && r.dir === 'out' && r.stato === 'pending')) return;
        s.requests.unshift({ id: U.uid('req'), dir: 'out', kind, id2, stato: 'pending', quando: Date.now(), msg });
        ok = true;
      });
      return ok;
    },
    rispondiRichiesta(reqId, accetta) {
      let convId = null;
      set((s) => {
        const r = s.requests.find((x) => x.id === reqId);
        if (!r) return;
        r.stato = accetta ? 'accepted' : 'declined';
        if (!accetta) return;
        const conv = {
          id: U.uid('conv'), kind: r.kind, id2: r.id2, apertaIl: Date.now(), chiusa: false,
          exchange: { mine: false, theirs: false, done: false, canali: [] },
          relazione: { qualificata: false, confermata: false },
          messages: [{ from: 'sys', text: 'Richiesta di contatto accettata. Da qui in avanti potete scrivervi.', ts: Date.now() }],
          unread: 0
        };
        s.conversations.unshift(conv);
        convId = conv.id;
      });
      return convId;
    },
    inviaMessaggio(convId, text) {
      set((s) => {
        const c = s.conversations.find((x) => x.id === convId);
        if (!c || c.chiusa) return;
        c.messages.push({ from: 'me', text, ts: Date.now() });
      });
    },
    leggiConversazione(convId) {
      set((s) => {
        const c = s.conversations.find((x) => x.id === convId);
        if (c) c.unread = 0;
      }, { render: false });
    },

    /* --- scambio contatti a doppio consenso --- */
    proponiScambio(convId, canali) {
      set((s) => {
        const c = s.conversations.find((x) => x.id === convId);
        if (!c) return;
        c.exchange.mine = true;
        c.exchange.canali = canali;
        c.messages.push({ from: 'sys', text: 'Hai proposto lo scambio dei contatti. Serve anche il consenso dell\'altra persona.', ts: Date.now() });
        /* nel prototipo l'altra parte risponde subito: nella V1 è un evento reale */
        c.exchange.theirs = true;
        c.exchange.done = true;
        c.exchange.quando = Date.now();
        c.relazione.qualificata = true;
        c.messages.push({ from: 'sys', text: 'Contatti scambiati con doppio consenso: ' + canali.map((k) => (GD.data.CANALI_CONTATTO.find((x) => x.id === k) || {}).label).join(', ') + '.', ts: Date.now() + 1 });
        s.pendingFeedback.push({ id: U.uid('fb'), kind: c.kind, id2: c.id2, convId: c.id, quando: Date.now() });
        notify('fairness', 'Fra qualche giorno ti chiederemo com\'è andata: il feedback resta anonimo.');
      });
    },
    chiudiConversazione(convId) {
      set((s) => {
        const c = s.conversations.find((x) => x.id === convId);
        if (c) { c.chiusa = true; c.messages.push({ from: 'sys', text: 'Conversazione chiusa.', ts: Date.now() }); }
      });
    },

    /* --- fairness (flusso D) --- */
    inviaFeedback(fbId, risposte) {
      set((s) => {
        const idx = s.pendingFeedback.findIndex((x) => x.id === fbId);
        if (idx === -1) return;
        const fb = s.pendingFeedback[idx];
        s.pendingFeedback.splice(idx, 1);
        s.feedback.unshift({
          id: U.uid('fbk'), kind: fb.kind, id2: fb.id2, risposte, quando: Date.now(), anonimo: true
        });
        s.notifications = s.notifications.filter((n) => n.tipo !== 'fairness' || n.letto);
      });
    },
    saltaFeedback(fbId) {
      set((s) => { s.pendingFeedback = s.pendingFeedback.filter((x) => x.id !== fbId); });
    },

    /* --- sicurezza (flusso E) --- */
    blocca(kind, id2, nome) {
      set((s) => {
        if (s.blocks.some((b) => b.kind === kind && b.id2 === id2)) return;
        s.blocks.unshift({ kind, id2, nome, quando: Date.now() });
        s.requests = s.requests.filter((r) => !(r.kind === kind && r.id2 === id2 && r.stato === 'pending'));
        s.conversations.forEach((c) => { if (c.kind === kind && c.id2 === id2) c.chiusa = true; });
      });
    },
    sblocca(kind, id2) {
      set((s) => { s.blocks = s.blocks.filter((b) => !(b.kind === kind && b.id2 === id2)); });
    },
    segnala(kind, id2, nome, motivo, dettagli, allegaChat) {
      const id = 'CASE-' + String(1100 + state.reports.length);
      set((s) => {
        s.reports.unshift({ id, kind, id2, nome, motivo, dettagli, allegaChat, quando: Date.now(), stato: 'new' });
        const cases = api.getCases();
        cases.unshift({
          id, target: { kind, id: id2, nome },
          origine: 'report', categoria: motivoCategoria(motivo),
          severity: motivoSeverity(motivo), stato: 'new', motivo,
          sintesi: dettagli || 'Segnalazione inviata dall\'utente attraverso la scheda.',
          reporterId: 'me', assegnatoA: null, apertoIl: Date.now(),
          evidenze: [{ tipo: 'segnalazione', ref: 'REP-' + id, quando: Date.now(), nota: 'Modulo di segnalazione.' }]
            .concat(allegaChat ? [{ tipo: 'messaggi', ref: 'CONV-' + id2, quando: Date.now(), nota: 'Conversazione allegata dall\'utente, accesso vincolato al case.' }] : []),
          azioni: [],
          audit: [{ quando: Date.now(), chi: 'sistema', cosa: 'Case aperto da segnalazione utente' }]
        });
        s.cases = cases;
        notify('safety', 'Segnalazione inviata. Il case ' + id + ' è in coda di triage.');
      });
      return id;
    },

    /* --- annunci --- */
    salvaAnnuncio(annuncio) {
      set((s) => {
        const idx = s.listings.findIndex((l) => l.id === annuncio.id);
        if (idx === -1) s.listings.unshift(annuncio); else s.listings[idx] = annuncio;
      });
    },
    cambiaStatoAnnuncio(id, stato) {
      set((s) => {
        const l = s.listings.find((x) => x.id === id);
        if (l) l.stato = stato;
      });
    },

    /* --- moderazione --- */
    getCases() {
      if (!state.cases) state.cases = JSON.parse(JSON.stringify(GD.data.cases));
      return state.cases;
    },
    aggiornaCase(id, patch, auditLabel) {
      set((s) => {
        const cs = api.getCases();
        const c = cs.find((x) => x.id === id);
        if (!c) return;
        Object.assign(c, patch);
        c.audit = c.audit || [];
        c.audit.push({ quando: Date.now(), chi: s.modRole, cosa: auditLabel });
        s.cases = cs;
      });
    },
    applicaAzione(id, tipo, nota) {
      const LABEL = {
        no_action: 'Nessuna azione', warning: 'Warning', content_removal: 'Rimozione contenuto',
        feature_restriction: 'Restrizione funzionalità', temp_suspension: 'Sospensione temporanea',
        permanent_ban: 'Ban permanente', safety_lock: 'Safety Lock'
      };
      set((s) => {
        const cs = api.getCases();
        const c = cs.find((x) => x.id === id);
        if (!c) return;
        c.azioni = c.azioni || [];
        c.azioni.push({ tipo, quando: Date.now(), da: s.modRole, nota: nota || '' });
        c.stato = tipo === 'no_action' ? 'dismissed' : 'resolved';
        c.audit.push({ quando: Date.now(), chi: s.modRole, cosa: 'Azione applicata: ' + (LABEL[tipo] || tipo) });
        s.cases = cs;
      });
    },

    /* --- notifiche --- */
    leggiNotifiche() {
      set((s) => { s.notifications.forEach((n) => { n.letto = true; }); });
    },

    /* --- letture derivate --- */
    isBloccato(kind, id2) { return state.blocks.some((b) => b.kind === kind && b.id2 === id2); },
    conversazioneCon(kind, id2) { return state.conversations.find((c) => c.kind === kind && c.id2 === id2) || null; },
    richiestaVerso(kind, id2) {
      return state.requests.find((r) => r.kind === kind && r.id2 === id2 && r.dir === 'out') || null;
    },
    contaNonLetti() {
      const msg = state.conversations.reduce((n, c) => n + (c.unread || 0), 0);
      const req = state.requests.filter((r) => r.dir === 'in' && r.stato === 'pending').length;
      return { msg, req, tot: msg + req };
    },
    mieiAnnunci() { return state.listings; }
  };

  function motivoCategoria(m) {
    if (m === 'molestie' || m === 'minore' || m === 'aggressivita') return 'sicurezza';
    if (m === 'no_show' || m === 'scorrettezza') return 'affidabilita';
    if (m === 'spam') return 'abuso_piattaforma';
    return 'comportamento';
  }
  function motivoSeverity(m) {
    return { molestie: 4, minore: 4, aggressivita: 3, discriminazione: 3, scorrettezza: 2, no_show: 1, spam: 2 }[m] || 1;
  }

  GD.store = api;
})(window.GD);


/* ---- assets/js/ui.js ---- */
/* ============================================================
   GdRadar — componenti condivisi e guscio dell'app
   ============================================================ */
(function (GD) {
  'use strict';
  const U = GD.util, D = GD.data, S = GD.store;
  const { html, raw, icon, avatar } = U;

  /* ---------------- navigazione ---------------- */
  function go(route) {
    if (location.hash === '#' + route) GD.app.render();
    else location.hash = route;
  }

  /* ---------------- toast ---------------- */
  function toast(text, tone) {
    const root = U.$('#toast-root');
    const node = document.createElement('div');
    node.className = 'toast' + (tone === 'warn' ? ' warn' : '');
    node.innerHTML = String(html`${icon(tone === 'warn' ? 'warn' : 'checkCircle', 15)}<span>${text}</span>`);
    root.appendChild(node);
    setTimeout(() => {
      node.style.transition = 'opacity .25s, transform .25s';
      node.style.opacity = '0';
      node.style.transform = 'translateY(6px)';
      setTimeout(() => node.remove(), 260);
    }, 3200);
  }

  /* ---------------- drawer / modal ---------------- */
  let onCloseDrawer = null;

  function openDrawer(opts) {
    const root = U.$('#drawer-root');
    onCloseDrawer = opts.onClose || null;
    root.innerHTML = String(html`
      <div class="scrim" data-act="closeOverlays"></div>
      <aside class="drawer" role="dialog" aria-modal="true" aria-label="${opts.title || 'Dettaglio'}">
        <header class="drawer-head">
          <div class="row g-10 grow">${opts.head || html`<span class="h-md">${opts.title}</span>`}</div>
          <button class="btn btn-icon btn-ghost" data-act="closeOverlays" aria-label="Chiudi">${icon('x', 18)}</button>
        </header>
        <div class="drawer-body">${opts.body}</div>
        ${opts.foot ? html`<footer class="drawer-foot">${opts.foot}</footer>` : ''}
      </aside>`);
    document.body.style.overflow = 'hidden';
    if (opts.after) opts.after();
  }

  function openModal(opts) {
    const root = U.$('#modal-root');
    root.innerHTML = String(html`
      <div class="modal-wrap">
        <div class="scrim" data-act="closeOverlays"></div>
        <div class="modal" role="dialog" aria-modal="true" aria-label="${opts.title || ''}">
          ${opts.title ? html`<h2 class="h-lg" style="padding-right:24px">${opts.title}</h2>` : ''}
          ${opts.sub ? html`<p class="small muted mt-8">${opts.sub}</p>` : ''}
          <div class="mt-16">${opts.body}</div>
          ${opts.foot ? html`<div class="mt-24 row g-10" style="justify-content:flex-end">${opts.foot}</div>` : ''}
        </div>
      </div>`);
    document.body.style.overflow = 'hidden';
    if (opts.after) opts.after();
  }

  function closeOverlays() {
    U.$('#drawer-root').innerHTML = '';
    U.$('#modal-root').innerHTML = '';
    document.body.style.overflow = '';
    if (onCloseDrawer) { const f = onCloseDrawer; onCloseDrawer = null; f(); }
  }
  GD.actions.closeOverlays = closeOverlays;

  /* ---------------- il dado a venti facce ----------------
     Un d20 visto di faccia ha per silhouette un esagono; dentro,
     la faccia illuminata è un triangolo rovesciato e tre spigoli
     la collegano ai vertici. Basta questo per riconoscerlo anche
     a dieci pixel.                                              */
  function d20Points(cx, cy, r) {
    const P = (deg, rad) => [cx + rad * Math.cos((deg * Math.PI) / 180), cy - rad * Math.sin((deg * Math.PI) / 180)];
    const hex = [90, 150, 210, 270, 330, 30].map((a) => P(a, r));
    const face = [270, 30, 150].map((a) => P(a, r * 0.5));
    const spokes = [270, 30, 150].map((a) => P(a, r));
    return { hex, face, spokes };
  }

  const fmtPts = (pts) => pts.map((p) => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');

  /* dado sul Radar: dentro un <svg> già aperto */
  function d20(cx, cy, r, color, opacity) {
    const { hex, face, spokes } = d20Points(cx, cy, r);
    const spigoli = face.map((f, i) => 'M' + f[0].toFixed(1) + ' ' + f[1].toFixed(1) +
      'L' + spokes[i][0].toFixed(1) + ' ' + spokes[i][1].toFixed(1)).join(' ');
    const op = opacity === undefined ? 1 : opacity;
    return html`<g opacity="${op.toFixed(2)}">
      <polygon points="${raw(fmtPts(hex))}" fill="${raw(color)}" fill-opacity=".26" stroke="${raw(color)}" stroke-width="1.15" stroke-linejoin="round"/>
      <path d="${raw(spigoli)}" stroke="${raw(color)}" stroke-opacity=".45" stroke-width=".9"/>
      <polygon points="${raw(fmtPts(face))}" fill="${raw(color)}" fill-opacity=".95"/>
    </g>`;
  }

  /* dado come glifo autonomo: legende, elenchi, marchio */
  function d20Icon(size, color) {
    const s = size || 14, r = s / 2 - 0.6;
    const { hex, face, spokes } = d20Points(s / 2, s / 2, r);
    const spigoli = face.map((f, i) => 'M' + f[0].toFixed(1) + ' ' + f[1].toFixed(1) +
      'L' + spokes[i][0].toFixed(1) + ' ' + spokes[i][1].toFixed(1)).join(' ');
    return raw('<svg viewBox="0 0 ' + s + ' ' + s + '" width="' + s + '" height="' + s + '" aria-hidden="true">' +
      '<polygon points="' + fmtPts(hex) + '" fill="' + color + '" fill-opacity=".26" stroke="' + color + '" stroke-width="1.1" stroke-linejoin="round"/>' +
      '<path d="' + spigoli + '" stroke="' + color + '" stroke-opacity=".45" stroke-width=".8" fill="none"/>' +
      '<polygon points="' + fmtPts(face) + '" fill="' + color + '" fill-opacity=".95"/></svg>');
  }

  /* ---------------- micro-componenti ---------------- */
  function donut(score, size, thick) {
    const s = size || 46, w = thick || 4;
    const r = (s - w) / 2, c = 2 * Math.PI * r;
    const off = c * (1 - GD.util.clamp(score, 0, 100) / 100);
    const col = score >= 64 ? 'var(--signal)' : score >= 45 ? 'var(--amber)' : 'var(--ink-4)';
    return html`<div class="donut ${raw(s > 60 ? 'donut-lg' : '')}" style="width:${s}px;height:${s}px" role="img" aria-label="Compatibilità ${score} su 100">
      <svg width="${s}" height="${s}">
        <circle cx="${s / 2}" cy="${s / 2}" r="${r}" fill="none" stroke="var(--line)" stroke-width="${w}"/>
        <circle cx="${s / 2}" cy="${s / 2}" r="${r}" fill="none" stroke="${raw(col)}" stroke-width="${w}"
          stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/>
      </svg>
      <span class="val">${score}</span>
    </div>`;
  }

  function fairPips(entity, opts) {
    const f = GD.match.fairness(entity);
    const pips = [1, 2, 3, 4, 5].map((i) => html`<i class="${raw(f.visibile && i <= f.pips ? 'on' : '')}"></i>`);
    if (!f.visibile) {
      return html`<span class="fair tip" data-tip="Servono ${GD.match.SOGLIA_FEEDBACK} feedback qualificati">
        <span class="fair-pips locked">${pips}</span>
        <span class="fair-label muted">Fairness non disponibile</span></span>`;
    }
    return html`<span class="fair tip" data-tip="${f.nota}">
      <span class="fair-pips">${pips}</span>
      <span class="fair-label">${f.label}${opts && opts.conta ? ' · ' + f.esperienze : ''}</span></span>`;
  }

  const TIPO_META = {
    utente: { label: 'Persona', badge: 'badge-accent', dot: 'dot-live', ico: 'user' },
    party: { label: 'Party', badge: 'badge-amber', dot: 'dot-amber', ico: 'users' },
    campagna: { label: 'Campagna', badge: 'badge-violet', dot: 'dot-violet', ico: 'book' },
    annuncio: { label: 'Annuncio', badge: 'badge-line', dot: 'dot-off', ico: 'document' }
  };

  const TIPO_ANNUNCIO = {
    cerco_player: 'Cerca Player',
    cerco_master: 'Cerca Master',
    cerco_party: 'Cerca Party',
    cerco_campagna: 'Cerca Campagna'
  };

  /* nome, sottotitolo, seme avatar per qualunque entità */
  function identity(e) {
    if (e.tipo === 'annuncio') {
      const autore = D.byId(e.autore.kind, e.autore.id) || S.get().me;
      return {
        nome: e.titolo,
        sotto: (autore ? autore.nome : 'Tu') + ' · ' + (TIPO_ANNUNCIO[e.sottotipo] || 'Annuncio'),
        seed: e.id, tipo: 'annuncio', autore
      };
    }
    const sotto = e.tipo === 'utente'
      ? e.ruoli.map((r) => (D.RUOLI.find((x) => x.id === r) || {}).label).join(' e ') + ' · ' + D.espById(e.esperienza).label
      : e.tipo === 'party'
        ? U.plural(e.membri.length, 'persona', 'persone') + (e.postiLiberi ? ' · ' + U.plural(e.postiLiberi, 'posto libero', 'posti liberi') : ' · al completo')
        : (D.systemById(e.systemId) || {}).nome + ' · ' + (D.FORMATI.find((f) => f.id === e.formato) || {}).label;
    return { nome: e.nome, sotto, seed: e.id, tipo: e.tipo };
  }

  function tipoBadge(tipo, sottotipo) {
    const m = TIPO_META[tipo] || TIPO_META.utente;
    const label = tipo === 'annuncio' && sottotipo ? TIPO_ANNUNCIO[sottotipo] : m.label;
    return html`<span class="badge ${raw(m.badge)}">${label}</span>`;
  }

  function newbieBadge(v) {
    if (v !== 'si') return '';
    return html`<span class="badge badge-accent">${icon('sparkles', 11)}Newbie friendly</span>`;
  }

  function luogoBadge(e, me) {
    if (e.modalita === 'online') return html`<span class="badge">${icon('globe', 11)}Online</span>`;
    const pv = GD.geo.publicView(e.loc, me && me.loc);
    return html`<span class="badge">${icon('pin', 11)}${pv.area}${pv.distanceLabel ? ' · ' + pv.distanceLabel : ''}</span>`;
  }

  function dispoBadge(e) {
    const d = e.disponibilita;
    if (!d || !d.giorni || !d.giorni.length) return '';
    const gg = d.giorni.map((g) => (D.GIORNI.find((x) => x.id === g) || {}).label).join(' ');
    return html`<span class="badge">${icon('calendar', 11)}${gg}</span>`;
  }

  function sistemaBadge(e) {
    const sysId = e.systemId || (e.games && e.games[0] && e.games[0].systemId);
    if (!sysId) return '';
    const s = D.systemById(sysId);
    const extra = e.games && e.games.length > 1 ? ' +' + (e.games.length - 1) : '';
    return html`<span class="badge badge-line">${icon('dice', 11)}${s.nome}${extra}</span>`;
  }

  /* ---------------- card risultato ---------------- */
  function resultCard(e, comp, me) {
    const id = identity(e);
    return html`<article class="card card-hover result" data-act="openSheet" data-kind="${e.tipo}" data-id="${e.id}">
      ${avatar(id.nome, 'md', id.seed)}
      <div class="grow">
        <div class="row-b" style="align-items:flex-start">
          <div class="grow">
            <div class="row g-8 wrap">
              ${tipoBadge(e.tipo, e.sottotipo)}
              ${newbieBadge(e.newbie)}
            </div>
            <h3 class="h-md mt-8" style="line-height:1.3">${id.nome}</h3>
            <p class="small muted">${id.sotto}</p>
          </div>
          ${donut(comp.score, 46)}
        </div>
        <div class="meta">
          ${sistemaBadge(e)}${luogoBadge(e, me)}${dispoBadge(e)}
        </div>
        <div class="row-b mt-12">
          ${fairPips(e)}
          <span class="tiny muted">${e.pubblicato ? U.timeAgo(e.pubblicato) : ''}</span>
        </div>
        ${comp.motivi && comp.motivi.length ? html`<div class="why">
          ${comp.motivi.slice(0, 2).map((m) => html`<span>${icon('check', 11)}${m.why}</span>`)}
        </div>` : ''}
      </div>
    </article>`;
  }

  /* ---------------- guscio applicativo ---------------- */
  const NAV = [
    { route: '/radar', label: 'Radar', ico: 'radar' },
    { route: '/annunci', label: 'Annunci', ico: 'document' },
    { route: '/messaggi', label: 'Messaggi', ico: 'message', badge: 'msg' },
    { route: '/fairness', label: 'Fairness', ico: 'scale' },
    { route: '/sicurezza', label: 'Sicurezza', ico: 'shield' }
  ];

  function draft() {

    }
    return S.get().onboarding.draft;
  }

  function setField(path, value) {
    S.set((s) => {
      const parts = path.split('.');
      let node = s.onboarding.draft;
      for (let i = 0; i < parts.length - 1; i++) node = node[parts[i]];
      node[parts[parts.length - 1]] = value;

  }
  function getField(path) {
    return path.split('.').reduce((n, k) => (n ? n[k] : undefined), draft());
  }

    const arr = (getField(path) || []).slice();

    setField(path, arr);

  GD.actions.onbSet = (ds, el) => {

  };
  GD.actions.onbToggle = (ds) => { toggleIn(ds.field, ds.value); GD.app.render(); };
  GD.actions.onbPick = (ds) => { setField(ds.field, ds.value); GD.app.render(); };
  GD.actions.onbNext = () => step(+1);

    const st = S.get();

    if (delta > 0) {
      const err = validate(STEPS[i].id);
      if (err) { UI.toast(err, 'warn'); return; }
    }
    const next = i + delta;
    if (next < 0) { UI.go('/'); return; }
    if (next >= STEPS.length) { completa(); return; }

  function validate(id) {

      if (!/^\S+@\S+\.\S+$/.test(d.email || '')) return 'Inserisci un\'email valida.';
    }
    if (id === 'profilo' && !d.ruoli.length) return 'Scegli almeno un ruolo: Player, Master o entrambi.';

      if (d.ageVerification.status !== 'verified') return 'Completa la verifica 18+ per proseguire.';
    }

    if (id === 'zona' && !d.loc) return 'Indica una zona: geolocalizzazione o ricerca manuale.';

/* ---- assets/js/view-radar.js ---- */
/* ============================================================
   GdRadar — Radar: ricerca, filtri, visualizzazione, scheda
   (flusso B: località → filtri → risultati → scheda →
   compatibilità → richiesta di contatto)
   ============================================================ */
(function (GD) {
  'use strict';
  const U = GD.util, UI = GD.ui, D = GD.data, S = GD.store;
  const { html, raw, icon } = U;

  /* ---------------- selezione candidati ---------------- */
  function candidati() {
    const st = S.get();
    const me = st.me;
    const f = st.ricerca;
    const out = [];

    const bloccato = (kind, id) => S.isBloccato(kind, id);

    if (f.tipi.indexOf('utente') !== -1) {
      D.users.forEach((u) => {
        if (u.visibilita === 'nascosto' || bloccato('utente', u.id)) return;
        out.push(u);
      });
    }
    if (f.tipi.indexOf('party') !== -1) D.parties.forEach((p) => { if (!bloccato('party', p.id)) out.push(p); });
    if (f.tipi.indexOf('campagna') !== -1) D.campaigns.forEach((c) => { if (!bloccato('campagna', c.id)) out.push(c); });
    if (f.tipi.indexOf('annuncio') !== -1) {
      D.listings.forEach((l) => {
        if (l.stato !== 'attivo') return;
        if (bloccato(l.autore.kind, l.autore.id)) return;
        out.push(l);
      });
    }

    return out.filter((e) => passaFiltri(e, f, me)).map((e) => {
      const comp = GD.match.compatibilita(me, e, { raggio: f.raggio });
      const dist = e.modalita === 'online' ? null : GD.geo.distanceKm(me.loc, e.loc);
      return { e, comp, dist };
    }).sort(ordinatore(f.ordine));
  }

  function passaFiltri(e, f, me) {
    /* raggio: chi gioca online resta sempre raggiungibile */
    if (e.modalita !== 'online') {
      const d = GD.geo.distanceKm(me.loc, e.loc);
      if (d !== null && d > f.raggio) return false;
    }
    if (f.sistemi.length) {
      const sys = e.systemId ? [e.systemId] : (e.games || []).map((g) => g.systemId);
      if (!sys.some((s) => f.sistemi.indexOf(s) !== -1)) return false;
    }
    if (f.modalita !== 'tutte') {
      if (f.modalita === 'presenza' && e.modalita === 'online') return false;
      if (f.modalita === 'online' && e.modalita === 'presenza') return false;
    }
    if (f.ruolo !== 'tutti' && !ruoloCoperto(e, f.ruolo)) return false;
    if (f.giorni.length) {
      const gg = (e.disponibilita && e.disponibilita.giorni) || [];
      if (!f.giorni.some((g) => gg.indexOf(g) !== -1)) return false;
    }
    if (f.esperienza !== 'tutte') {
      const liv = e.esperienza || e.esperienzaRichiesta;
      if (liv && liv !== f.esperienza) return false;
    }
    if (f.newbieOnly && e.newbie !== 'si') return false;
    if (f.postiLiberi) {
      const posti = e.postiLiberi !== undefined ? e.postiLiberi : (e.posti !== undefined ? e.posti : null);
      if (posti !== null && posti <= 0) return false;
    }
    if (f.q) {
      const q = f.q.toLowerCase();
      const sys = (e.systemId ? [e.systemId] : (e.games || []).map((g) => g.systemId))
        .map((s) => (D.systemById(s) || {}).nome).join(' ');
      const blob = [e.nome, e.titolo, e.bio, e.testo, sys, (e.stili || []).join(' ')].filter(Boolean).join(' ').toLowerCase();
      if (blob.indexOf(q) === -1) return false;
    }
    return true;
  }

  /* Il filtro "ruolo cercato" guarda il ruolo che l'altra parte copre:
     un annuncio che cerca Player è, dall'altro lato del tavolo, un Master. */
  function ruoloCoperto(e, ruolo) {
    if (e.tipo === 'utente') return (e.ruoli || []).indexOf(ruolo) !== -1;
    if (e.tipo === 'campagna') return ruolo === 'master';
    if (e.tipo === 'party') return true;
    if (e.tipo === 'annuncio') {
      const autore = D.byId(e.autore.kind, e.autore.id);
      if (e.sottotipo === 'cerco_player') return ruolo === 'master';
      if (e.sottotipo === 'cerco_master') return ruolo === 'player';
      return autore ? (autore.ruoli || []).indexOf(ruolo) !== -1 : true;
    }
    return true;
  }

  function ordinatore(ordine) {
    if (ordine === 'distanza') return (a, b) => (a.dist === null ? 1e9 : a.dist) - (b.dist === null ? 1e9 : b.dist);
    if (ordine === 'recenza') return (a, b) => (b.e.pubblicato || b.e.creato || 0) - (a.e.pubblicato || a.e.creato || 0);
    return (a, b) => b.comp.score - a.comp.score;
  }

  /* ---------------- filtri: azioni ---------------- */
  function setFiltro(patch) {
    S.set((s) => { Object.assign(s.ricerca, patch); });
  }
  GD.actions.filtroToggleTipo = (ds) => {
    const st = S.get(); const arr = st.ricerca.tipi.slice();
    const i = arr.indexOf(ds.value);
    if (i === -1) arr.push(ds.value); else if (arr.length > 1) arr.splice(i, 1);
    setFiltro({ tipi: arr });
  };
  GD.actions.filtroToggleSistema = (ds) => {
    const arr = S.get().ricerca.sistemi.slice();
    const i = arr.indexOf(ds.value);
    if (i === -1) arr.push(ds.value); else arr.splice(i, 1);
    setFiltro({ sistemi: arr });
  };
  GD.actions.filtroToggleGiorno = (ds) => {
    const arr = S.get().ricerca.giorni.slice();
    const i = arr.indexOf(ds.value);
    if (i === -1) arr.push(ds.value); else arr.splice(i, 1);
    setFiltro({ giorni: arr });
  };
  GD.actions.filtroSet = (ds, el) => {
    const v = el && el.type === 'checkbox' ? el.checked : (ds.value !== undefined ? ds.value : el.value);
    const patch = {}; patch[ds.field] = ds.field === 'raggio' ? Number(v) : v;
    setFiltro(patch);
  };
  GD.actions.filtroRaggio = (ds, el) => {
    const val = GD.geo.RADII[Number(el.value)];
    setFiltro({ raggio: val });
  };
  GD.actions.filtroQuery = (ds, el) => {
    S.set((s) => { s.ricerca.q = el.value; });
    const inp = U.$('#radar-q');
    if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
  };
  GD.actions.filtroReset = () => setFiltro({
    q: '', sistemi: [], giorni: [], ruolo: 'tutti', modalita: 'tutte',
    esperienza: 'tutte', newbieOnly: false, postiLiberi: false, raggio: 25
  });
  GD.actions.filtriMobile = () => {
    UI.openDrawer({ title: 'Filtri', body: filtri(true), foot: html`<div class="row g-10">
      <button class="btn grow" data-act="filtroReset">Azzera</button>
      <button class="btn btn-primary grow" data-act="closeOverlays">Vedi risultati</button></div>` });
  };

  /* ---------------- pannello filtri ---------------- */
  function filtri() {
    const f = S.get().ricerca;
    const raggioIdx = Math.max(0, GD.geo.RADII.indexOf(f.raggio));
    const attivi = (f.sistemi.length ? 1 : 0) + (f.giorni.length ? 1 : 0)

      + (f.esperienza !== 'tutte' ? 1 : 0) + (f.newbieOnly ? 1 : 0) + (f.postiLiberi ? 1 : 0);

    return html`<div class="filters-rail-inner col g-20">
      <div class="filter-group">
        <div class="h-sm">Raggio<span class="badge badge-accent">${f.raggio} km</span></div>
        <input class="range" type="range" min="0" max="${GD.geo.RADII.length - 1}" step="1" value="${raggioIdx}" data-input="filtroRaggio" aria-label="Raggio di ricerca">
        <div class="row-b tiny muted">${GD.geo.RADII.map((r) => html`<span>${r}</span>`)}</div>
      </div>

      <div class="filter-group">
        <span class="h-sm">Cosa cerchi</span>
        <div class="row g-8 wrap">
          ${[['utente', 'Persone'], ['party', 'Party'], ['campagna', 'Campagne'], ['annuncio', 'Annunci']].map((t) =>
            html`<button class="chip" aria-pressed="${f.tipi.indexOf(t[0]) !== -1}" data-act="filtroToggleTipo" data-value="${t[0]}">${t[1]}</button>`)}
        </div>
      </div>

      <div class="filter-group">
        <span class="h-sm">Ruolo cercato</span>
        <div class="segmented on-white">
          ${[['tutti', 'Tutti'], ['player', 'Player'], ['master', 'Master']].map((r) =>
            html`<button aria-pressed="${f.ruolo === r[0]}" data-act="filtroSet" data-field="ruolo" data-value="${r[0]}">${r[1]}</button>`)}
        </div>
      </div>

      <div class="filter-group">
        <span class="h-sm">Modalità</span>
        <div class="segmented on-white">
          ${[['tutte', 'Tutte'], ['presenza', 'Presenza'], ['online', 'Online']].map((r) =>
            html`<button aria-pressed="${f.modalita === r[0]}" data-act="filtroSet" data-field="modalita" data-value="${r[0]}">${r[1]}</button>`)}
        </div>
      </div>

      <div class="filter-group">
        <span class="h-sm">Giorni</span>
        <div class="row g-6 wrap">
          ${D.GIORNI.map((g) => html`<button class="chip" style="padding:0 10px" aria-pressed="${f.giorni.indexOf(g.id) !== -1}"
            data-act="filtroToggleGiorno" data-value="${g.id}">${g.label}</button>`)}
        </div>
      </div>

      <div class="filter-group">
        <span class="h-sm">Sistema</span>

            data-act="filtroToggleSistema" data-value="${s.id}">${s.nome}</button>`)}

        </select>

          <span class="track"><span class="thumb"></span></span><span class="small">Adatto alla prima esperienza</span></label>
        <label class="switch"><input type="checkbox" ${raw(f.postiLiberi ? 'checked' : '')} data-change="filtroSet" data-field="postiLiberi">

      </div>

    </div>`;

  /* ---------------- visualizzazione radar ---------------- */
  const COLORE = { utente: 'var(--signal)', party: 'var(--amber)', campagna: 'var(--violet)', annuncio: 'var(--steel)' };

  function radarSvg(risultati) {
    const st = S.get();
    const C = 300, R = 268;
    const onRing = [];
    const blips = risultati.slice(0, 44).map((r, i) => {
      const e = r.e;
      const online = e.modalita === 'online' || r.dist === null;
      let ang, frac;
      if (online) {
        onRing.push(i);
        ang = (onRing.length * 37 + 12) % 360;
        frac = 1.06;
      } else {
        ang = GD.geo.bearing(st.me.loc, e.loc);
        frac = GD.geo.radiusFraction(r.dist);
        /* separa i punti che cadrebbero uno sull'altro */
        ang += ((U.hashStr(e.id) % 22) - 11) * 0.5;
      }
      const rad = ((ang - 90) * Math.PI) / 180;
      const size = 6.5 + (r.comp.score / 100) * 6.5;
      return {
        e, r,
        x: C + Math.cos(rad) * R * frac,
        y: C + Math.sin(rad) * R * frac,
        size,
        col: COLORE[e.tipo] || COLORE.utente,
        op: 0.35 + (r.comp.score / 100) * 0.6
      };
    });

    return html`<div class="radar-canvas">
      <svg viewBox="-20 -20 640 640" role="img" aria-label="Radar: ${risultati.length} risultati intorno a te">
        <defs>
          <radialGradient id="sw" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="var(--signal)" stop-opacity=".18"/>
            <stop offset="100%" stop-color="var(--signal)" stop-opacity="0"/>
          </radialGradient>
        </defs>

        ${GD.geo.RING_FRACTIONS.map((f, i) => html`
          <circle cx="${C}" cy="${C}" r="${(R * f).toFixed(1)}" class="ring-line"/>
          <text class="ring-label" x="${C + 4}" y="${(C - R * f + 12).toFixed(1)}">${GD.geo.RADII[i]} km</text>`)}
        <circle cx="${C}" cy="${C}" r="${(R * 1.06).toFixed(1)}" class="ring-line dashed"/>
        <text class="ring-label" x="${C + 4}" y="${(C - R * 1.06 - 6).toFixed(1)}">ONLINE</text>
        <line x1="${C}" y1="${C - R}" x2="${C}" y2="${C + R}" class="cross"/>
        <line x1="${C - R}" y1="${C}" x2="${C + R}" y2="${C}" class="cross"/>

        <g class="sweep">
          <path d="M${C} ${C} L${C} ${C - R} A ${R} ${R} 0 0 1 ${(C + R * Math.cos(-Math.PI / 3)).toFixed(1)} ${(C + R * Math.sin(-Math.PI / 3)).toFixed(1)} Z" fill="url(#sw)"/>
          <line x1="${C}" y1="${C}" x2="${C}" y2="${C - R}" stroke="var(--signal)" stroke-opacity=".45" stroke-width="1.3"/>
        </g>

        ${blips.map((b) => html`<g class="blip" data-act="openSheet" data-kind="${b.e.tipo}" data-id="${b.e.id}"
            tabindex="0" role="button" aria-label="${(b.e.nome || b.e.titolo)}, compatibilità ${b.r.comp.score}">
          <circle class="halo" cx="${b.x.toFixed(1)}" cy="${b.y.toFixed(1)}" r="${b.size + 13}" fill="${raw(b.col)}" opacity=".16"/>
          <g class="core">${UI.d20(b.x, b.y, b.size, b.col, b.op)}</g>
          <title>${(b.e.nome || b.e.titolo)} · ${b.r.dist === null ? 'online' : U.fmtKm(b.r.dist)} · compatibilità ${b.r.comp.score}</title>

        <g class="me-pin">
          <circle class="pulse" cx="${C}" cy="${C}" r="30" fill="var(--accent)" opacity=".13"/>

    const bloccato = S.isBloccato(kind, e.id);
    const conv = S.conversazioneCon(kind, e.id);
    const req = S.richiestaVerso(kind, e.id);

    UI.openDrawer({
      head: html`${UI.tipoBadge(e.tipo, e.sottotipo)}

      body: html`
        <div class="sheet-hero">

              ${UI.newbieBadge(e.newbie)}
              ${UI.luogoBadge(e, st.me)}
              ${UI.sistemaBadge(e)}
            </div>
          </div>
        </div>

        ${e.bio || e.testo ? html`<p class="body mt-16">${e.bio || e.testo}</p>` : ''}

        <div class="sheet-section">
          <span class="eyebrow">Compatibilità</span>
          <div class="row g-16">
            ${UI.donut(comp.score, 72, 6)}
            <div class="grow">
              <p class="h-md">${comp.fascia.label}</p>
              <p class="small muted mt-4">Punteggio deterministico: stessi dati, stesso risultato. Nessuna Fairness dentro il calcolo.</p>
            </div>
          </div>
          <div class="mt-16">
            ${comp.parts.map((p) => html`<div class="why-row">
              <span class="lab">${p.label}<br><span class="tiny muted">${p.why}</span></span>
              <span class="bar"><span class="meter ${raw(p.neg ? 'amber' : '')}"><i style="width:${Math.round((p.got / p.max) * 100)}%"></i></span></span>
              <span class="pts">${p.got}/${p.max}</span>
            </div>`)}
          </div>
        </div>

        <div class="sheet-section">
          <span class="eyebrow">Fairness</span>
          ${fair.visibile ? html`
            <div class="row-b g-12 wrap">
              ${UI.fairPips(e, { conta: true })}
              <span class="badge badge-lg">${fair.esperienze}</span>
            </div>
            <p class="small muted mt-8">${fair.nota} Stima prudenziale (Wilson): un 5 su 5 non supera un 97 su 100.</p>`
          : html`
            <div class="row g-10">${icon('lock', 18)}<span class="small">${fair.label}</span></div>
            <p class="small muted mt-8">${fair.nota} Fino ad allora non mostriamo nessun numero: sarebbe rumore, non un segnale.</p>`}
        </div>

        ${dettagliSpecifici(e, st)}

        <div class="sheet-section">
          <span class="eyebrow">Sicurezza</span>
          <div class="row g-8 wrap mt-4">
            <button class="btn btn-sm" data-act="apriBlocco" data-kind="${kind}" data-id="${e.id}">${icon('ban', 14)}${bloccato ? 'Sbloccato' : 'Blocca'}</button>
            <button class="btn btn-sm btn-danger" data-act="apriSegnalazione" data-kind="${kind}" data-id="${e.id}">${icon('flag', 14)}Segnala</button>
          </div>
          <p class="tiny muted mt-8">Il blocco è immediato e non viene comunicato. La segnalazione è anonima verso chi la riceve e apre un caso di moderazione.</p>
        </div>`,
      foot: bloccato
        ? html`<div class="row-b"><span class="small muted">Hai bloccato questo profilo.</span>
            <button class="btn" data-act="sbloccaOra" data-kind="${kind}" data-id="${e.id}">Sblocca</button></div>`
        : conv
          ? html`<a class="btn btn-primary btn-block" href="#/messaggi/${conv.id}" data-act="closeOverlays">${icon('message', 16)}Vai alla conversazione</a>`
          : req && req.stato === 'pending'
            ? html`<button class="btn btn-block" disabled>${icon('clock', 16)}Richiesta inviata · in attesa</button>`
            : html`<button class="btn btn-primary btn-block btn-lg" data-act="apriRichiesta" data-kind="${kind}" data-id="${e.id}">
                ${icon('handshake', 16)}Richiedi il contatto</button>`
    });
  };

  function dettagliSpecifici(e, st) {
    const rows = [];
    const dd = (k, v) => rows.push({ k, v });
    if (e.tipo === 'utente') {
      dd('Ruoli', e.ruoli.map((r) => (D.RUOLI.find((x) => x.id === r) || {}).label).join(' e '));
      dd('Esperienza', D.espById(e.esperienza).label);
      dd('Sistemi', e.games.map((g) => D.systemById(g.systemId).nome + ' · ' + g.versione).join('\n'));
      dd('Stile', U.listJoin(e.stili));
      dd('Lingue', U.listJoin(e.lingue));
      dd('Attivo da', U.dateLabel(e.attivoDa));
    } else if (e.tipo === 'party') {
      dd('Persone', String(e.membri.length));
      dd('Posti liberi', e.postiLiberi ? String(e.postiLiberi) : 'nessuno al momento');
      dd('Sistemi', e.games.map((g) => D.systemById(g.systemId).nome).join(', '));
      dd('Gruppo dal', U.dateLabel(e.creato));
    } else if (e.tipo === 'campagna') {
      const master = D.byId('utente', e.masterId);
      dd('Master', master ? master.nome : '—');
      dd('Sistema', D.systemById(e.systemId).nome + ' · ' + e.versione);
      dd('Formato', (D.FORMATI.find((f) => f.id === e.formato) || {}).label);
      dd('Posti', e.postiLiberi + ' liberi su ' + e.postiTotali);
      dd('Livello atteso', D.espById(e.esperienzaRichiesta).label);
      if (e.partyId) { const p = D.byId('party', e.partyId); if (p) dd('Party collegato', p.nome); }
    } else {
      const autore = D.byId(e.autore.kind, e.autore.id);
      dd('Pubblicato da', (autore ? autore.nome : 'Tu') + ' (' + e.autore.kind + ')');
      dd('Tipo', UI.TIPO_ANNUNCIO[e.sottotipo] || '—');
      dd('Sistema', D.systemById(e.systemId).nome + ' · ' + e.versione);
      dd('Posti', String(e.posti));
      dd('Pubblicato', U.timeAgo(e.pubblicato));
    }
    const disp = e.disponibilita;
    if (disp && disp.giorni && disp.giorni.length) {
      dd('Quando', disp.giorni.map((g) => (D.GIORNI.find((x) => x.id === g) || {}).label).join(', ')
        + ' · ' + disp.fasce.map((f) => (D.FASCE.find((x) => x.id === f) || {}).label.toLowerCase()).join(', ')
        + ' · ' + (D.FREQUENZE.find((f) => f.id === disp.frequenza) || {}).label.toLowerCase());
    }
    if (e.modalita) dd('Modalità', (D.MODALITA.find((m) => m.id === e.modalita) || {}).label);
    if (e.newbie) dd('Newbie Friendly', (D.NEWBIE.find((n) => n.id === e.newbie) || {}).label);
    if (e.loc && e.modalita !== 'online') {
      const pv = GD.geo.publicView(e.loc, st.me.loc);
      dd('Zona', pv.area + (pv.distanceLabel ? ' · a ' + pv.distanceLabel + ' da te' : ''));
    }

    return html`<div class="sheet-section">
      <span class="eyebrow">Dettagli</span>
      <dl class="deflist">${rows.map((r) => html`<dt>${r.k}</dt><dd>${r.v}</dd>`)}</dl>
    </div>`;
  }

  /* ---------------- richiesta di contatto ---------------- */
  GD.actions.apriRichiesta = (ds) => {
    if (!UI.requireVerified('contattare qualcuno')) return;
    const e = D.byId(ds.kind, ds.id) || (S.get().listings || []).find((l) => l.id === ds.id);
    const nome = e.nome || e.titolo;
    UI.openModal({
      title: 'Richiesta di contatto',
      sub: 'Prima del messaggio serve un sì. Finché non accettano, non potete scrivervi.',
      body: html`
        <div class="row g-12">${U.avatar(nome, 'sm', e.id)}<div><p class="h-sm">${nome}</p>
          <p class="tiny muted">${UI.identity(e).sotto}</p></div></div>
        <div class="field mt-16">
          <label class="label" for="req-msg">Messaggio di presentazione</label>
          <textarea class="textarea" id="req-msg" maxlength="400" placeholder="Chi sei, quando puoi giocare, perché scrivi proprio a loro.">Ciao! Cerco un tavolo compatibile con i miei giorni e ho visto che potremmo incastrarci bene. Ti va di parlarne?</textarea>
          <span class="hint">Niente numeri di telefono o contatti esterni: si scambiano dopo, con doppio consenso.</span>
        </div>`,
      foot: html`<button class="btn" data-act="closeOverlays">Annulla</button>
        <button class="btn btn-primary" data-act="inviaRichiesta" data-kind="${ds.kind}" data-id="${ds.id}">Invia richiesta</button>`,
      after: () => { const t = U.$('#req-msg'); if (t) { t.focus(); t.setSelectionRange(t.value.length, t.value.length); } }
    });
  };

  GD.actions.inviaRichiesta = (ds) => {
    const msg = (U.$('#req-msg') || {}).value || '';
    const ok = S.inviaRichiesta(ds.kind, ds.id, msg.trim());
    UI.closeOverlays();
    UI.toast(ok ? 'Richiesta inviata. Ti avvisiamo appena rispondono.' : 'Hai già una richiesta in attesa con questo profilo.', ok ? null : 'warn');
  };

  /* ---------------- blocco e segnalazione ---------------- */
  GD.actions.apriBlocco = (ds) => {
    const e = D.byId(ds.kind, ds.id);
    const nome = e ? (e.nome || e.titolo) : 'questo profilo';
    if (S.isBloccato(ds.kind, ds.id)) { S.sblocca(ds.kind, ds.id); UI.toast('Sbloccato.'); UI.closeOverlays(); return; }
    UI.openModal({
      title: 'Bloccare ' + nome + '?',
      sub: 'Il blocco è immediato. Non riceve nessuna notifica.',
      body: html`<ul class="col g-8">
        ${['Sparisce dai tuoi risultati e tu dai suoi',
           'Le richieste di contatto in sospeso vengono annullate',
           'Le conversazioni aperte vengono chiuse',
           'Puoi sbloccare quando vuoi da Sicurezza'
          ].map((t) => html`<li class="row g-8"><span class="muted">${icon('check', 15)}</span><span class="small">${t}</span></li>`)}
      </ul>`,
      foot: html`<button class="btn" data-act="closeOverlays">Annulla</button>
        <button class="btn btn-danger" data-act="confermaBlocco" data-kind="${ds.kind}" data-id="${ds.id}">Blocca</button>`
    });
  };
  GD.actions.confermaBlocco = (ds) => {
    const e = D.byId(ds.kind, ds.id);
    S.blocca(ds.kind, ds.id, e ? (e.nome || e.titolo) : ds.id);
    UI.closeOverlays();
    UI.toast('Bloccato. Lo trovi in Sicurezza se cambi idea.');
  };
  GD.actions.sbloccaOra = (ds) => { S.sblocca(ds.kind, ds.id); UI.closeOverlays(); UI.toast('Sbloccato.'); };

  GD.actions.apriSegnalazione = (ds) => {
    const e = D.byId(ds.kind, ds.id);
    const nome = e ? (e.nome || e.titolo) : 'profilo';
    UI.openModal({
      title: 'Segnala ' + nome,
      sub: 'La segnalazione è anonima verso chi la riceve e apre un caso di moderazione con revisione umana.',
      body: html`
        <div class="field">
          <span class="label">Motivo</span>
          <select class="select" id="rep-motivo">
            ${D.MOTIVI_REPORT.map((m) => html`<option value="${m.id}">${m.label}</option>`)}
          </select>
        </div>
        <div class="field mt-16">
          <label class="label" for="rep-note">Cosa è successo</label>
          <textarea class="textarea" id="rep-note" placeholder="Fatti, date, cosa è stato detto. Più è concreto, più il triage è rapido."></textarea>
        </div>
        <label class="row g-10 mt-16" style="cursor:pointer;align-items:flex-start">
          <input type="checkbox" id="rep-chat" checked style="margin-top:3px;width:17px;height:17px;accent-color:var(--accent)">
          <span class="small">Allega la conversazione come evidenza.<br>
            <span class="muted tiny">Solo il moderatore assegnato al caso potrà leggerla, e ogni accesso resta a registro.</span></span>
        </label>
        <div class="callout danger mt-16">${icon('warn', 18, 'ico')}
          <div>Se sei in pericolo immediato, contatta le autorità locali. GdRadar non sostituisce un intervento di emergenza.</div></div>`,
      foot: html`<button class="btn" data-act="closeOverlays">Annulla</button>
        <button class="btn btn-danger" data-act="inviaSegnalazione" data-kind="${ds.kind}" data-id="${ds.id}">Invia segnalazione</button>`
    });
  };
  GD.actions.inviaSegnalazione = (ds) => {
    const motivo = (U.$('#rep-motivo') || {}).value || 'altro';
    const note = (U.$('#rep-note') || {}).value || '';
    const chat = (U.$('#rep-chat') || {}).checked;
    const e = D.byId(ds.kind, ds.id);
    const id = S.segnala(ds.kind, ds.id, e ? (e.nome || e.titolo) : ds.id, motivo, note.trim(), chat);
    UI.closeOverlays();
    UI.toast('Segnalazione inviata: caso ' + id + ' in coda di triage.');
  };

  /* ---------------- vista ---------------- */
  function view() {
    const st = S.get();
    const f = st.ricerca;
    const ris = candidati();
    const pv = st.me.loc ? st.me.loc.label + (st.me.loc.zona ? ' · ' + st.me.loc.zona : '') : 'zona non impostata';

    const topLeft = html`<div class="row g-10 grow" style="max-width:420px">
      <input class="input input-search" id="radar-q" placeholder="Cerca sistema, nome, stile…" value="${f.q}" data-input="filtroQuery">
    </div>`;


    const testa = html`<div class="row-b wrap g-12" style="margin-bottom:18px">
      <div>
        <h1 class="display d-3">Radar</h1>
        <p class="small muted mt-4">${U.plural(ris.length, 'risultato', 'risultati')} · ${f.raggio} km da ${pv}${st.me.visibilita !== 'attivo' ? ' · sei ' + (st.me.visibilita === 'nascosto' ? 'nascosto' : 'in pausa') : ''}</p>
      </div>
      <div class="row g-8 wrap">
        <div class="segmented">
          <button aria-pressed="${f.vista === 'radar'}" data-act="filtroSet" data-field="vista" data-value="radar">Radar</button>
          <button aria-pressed="${f.vista === 'lista'}" data-act="filtroSet" data-field="vista" data-value="lista">Lista</button>
        </div>
        <button class="btn btn-sm" data-act="filtriMobile">${icon('sliders', 15)}Filtri</button>
        <select class="select" style="min-height:34px;width:auto;font-size:13px" data-change="filtroSet" data-field="ordine">
          <option value="compatibilita" ${raw(f.ordine === 'compatibilita' ? 'selected' : '')}>Ordina per compatibilità</option>
          <option value="distanza" ${raw(f.ordine === 'distanza' ? 'selected' : '')}>Ordina per distanza</option>
          <option value="recenza" ${raw(f.ordine === 'recenza' ? 'selected' : '')}>Ordina per recenza</option>
        </select>
      </div>
    </div>`;

    const contenuto = html`<div class="radar-layout">
      <aside class="filters-rail">${filtri()}</aside>
      <div class="col g-16">
        ${testa}
        ${!ris.length ? html`<div class="card">${UI.emptyState('search', 'Nessun risultato con questi filtri',
            'Prova ad allargare il raggio, togliere qualche sistema o includere chi gioca online.',
            html`<button class="btn mt-8" data-act="filtroReset">Azzera i filtri</button>`)}</div>` : ''}

        ${ris.length && f.vista === 'radar' ? html`
          <div class="radar-stage">
            ${radarSvg(ris)}
            <div class="radar-legend">
              <span>${UI.d20Icon(13, 'var(--signal)')}Persone</span>
              <span>${UI.d20Icon(13, 'var(--amber)')}Party</span>
              <span>${UI.d20Icon(13, 'var(--violet)')}Campagne</span>
              <span>${UI.d20Icon(13, 'var(--steel)')}Annunci</span>
              <span>${UI.d20Icon(13, 'var(--accent)')}Tu</span>
              <span class="muted">· dado più grande = più compatibile · anello tratteggiato = solo online</span>
            </div>
          </div>` : ''}

        ${ris.length ? html`<div class="col g-10">
          <div class="row-b">
            <span class="eyebrow">${f.vista === 'radar' ? 'I più compatibili' : 'Risultati'}</span>
            <span class="tiny muted">${f.vista === 'radar' ? 'primi ' + Math.min(8, ris.length) + ' di ' + ris.length : ris.length + ' totali'}</span>
          </div>
          <div class="${raw(f.vista === 'radar' ? 'result-list' : 'results-grid')}">
            ${(f.vista === 'radar' ? ris.slice(0, 8) : ris).map((r) => UI.resultCard(r.e, r.comp, st.me))}
          </div>
        </div>` : ''}
      </div>
    </div>`;

    return UI.shell('/radar', contenuto, { topLeft });
  }

  GD.views = GD.views || {};
  GD.views.radar = view;
})(window.GD);


/* ---- assets/js/view-listings.js ---- */
/* ============================================================
   GdRadar — Annunci
   Un annuncio può essere pubblicato da un utente, da un Party o
   da una Campagna. Stati: bozza / attivo / sospeso / chiuso.
   Un annuncio chiuso resta come storico ma esce dal Radar.
   ============================================================ */
(function (GD) {
  'use strict';
  const U = GD.util, UI = GD.ui, D = GD.data, S = GD.store;
  const { html, raw, icon } = U;

  const STATI = {
    bozza: { label: 'Bozza', badge: 'badge-line' },
    attivo: { label: 'Attivo', badge: 'badge-accent' },
    sospeso: { label: 'Sospeso', badge: 'badge-amber' },
    chiuso: { label: 'Chiuso', badge: '' }
  };

  function nuovoAnnuncio() {
    const me = S.get().me;
    return {
      id: U.uid('ann'),
      tipo: 'annuncio',
      sottotipo: 'cerco_player',
      autore: { kind: 'utente', id: 'me' },
      titolo: '',
      testo: '',
      systemId: (me.games[0] || { systemId: 'dnd5' }).systemId,
      versione: (me.games[0] || {}).versione || D.systemById('dnd5').versioni[0],
      modalita: me.modalita,
      formato: me.formati[0] || 'breve',
      loc: me.loc,
      disponibilita: JSON.parse(JSON.stringify(me.disponibilita)),
      posti: 2,
      esperienza: 'tutte',
      newbie: me.newbie,
      stili: me.stili.slice(0, 3),
      stato: 'bozza',
      pubblicato: Date.now(),
      fairnessRef: me.fairness
    };
  }

  /* bozza in editing: resta fuori dallo store finché non si salva */
  let editing = null;

  GD.actions.nuovoAnnuncio = () => {
    if (!UI.requireVerified('pubblicare un annuncio')) return;
    editing = nuovoAnnuncio();
    apriEditor();
  };
  GD.actions.modificaAnnuncio = (ds) => {
    const l = S.mieiAnnunci().find((x) => x.id === ds.id);
    if (!l) return;
    editing = JSON.parse(JSON.stringify(l));
    apriEditor();
  };
  GD.actions.annSet = (ds, el) => {
    const v = el.type === 'checkbox' ? el.checked : el.value;
    editing[ds.field] = ds.field === 'posti' ? Number(v) : v;
    if (ds.field === 'systemId') editing.versione = D.systemById(v).versioni[0];
    if (ds.rerender) apriEditor();
  };
  GD.actions.annPick = (ds) => { salvaTesti(); editing[ds.field] = ds.value; apriEditor(); };
  GD.actions.annGiorno = (ds) => {
    salvaTesti();
    const arr = editing.disponibilita.giorni.slice();
    const i = arr.indexOf(ds.value);
    if (i === -1) arr.push(ds.value); else arr.splice(i, 1);
    editing.disponibilita.giorni = arr;
    apriEditor();
  };

  /* i campi di testo vivono nel DOM: li recuperiamo prima di ridisegnare */
  function salvaTesti() {
    const t = U.$('#ann-titolo'), d = U.$('#ann-testo');
    if (t) editing.titolo = t.value;
    if (d) editing.testo = d.value;
  }

  GD.actions.salvaAnnuncio = (ds) => {
    salvaTesti();
    if ((editing.titolo || '').trim().length < 6) { UI.toast('Dai un titolo leggibile all\'annuncio.', 'warn'); return; }
    editing.titolo = editing.titolo.trim();
    editing.testo = (editing.testo || '').trim();
    editing.stato = ds.stato;
    editing.pubblicato = Date.now();
    S.salvaAnnuncio(JSON.parse(JSON.stringify(editing)));
    UI.closeOverlays();
    UI.toast(ds.stato === 'attivo' ? 'Annuncio pubblicato: ora è indicizzato dal Radar.' : 'Bozza salvata.');
  };
  GD.actions.statoAnnuncio = (ds) => {
    S.cambiaStatoAnnuncio(ds.id, ds.stato);
    UI.toast(ds.stato === 'chiuso'
      ? 'Annuncio chiuso: resta nello storico per audit, ma non è più ricercabile.'
      : 'Stato aggiornato: ' + STATI[ds.stato].label.toLowerCase() + '.');
  };

  function chipRow(field, opts, value) {
    return html`<div class="row g-8 wrap">${opts.map((o) => html`<button class="chip"
      aria-pressed="${value === o.id}" data-act="annPick" data-field="${field}" data-value="${o.id}">${o.label}</button>`)}</div>`;
  }

  function apriEditor() {
    const a = editing;
    const sys = D.systemById(a.systemId);
    UI.openDrawer({
      title: a.stato === 'bozza' && !a.titolo ? 'Nuovo annuncio' : 'Modifica annuncio',
      body: html`
        <div class="col g-24">
          <div class="field">
            <span class="label">Tipo di annuncio</span>
            ${chipRow('sottotipo', Object.keys(UI.TIPO_ANNUNCIO).map((k) => ({ id: k, label: UI.TIPO_ANNUNCIO[k] })), a.sottotipo)}
          </div>
          <div class="field">
            <label class="label" for="ann-titolo">Titolo</label>
            <input class="input" id="ann-titolo" maxlength="80" value="${a.titolo}" placeholder="Es. Cerchiamo 2 giocatori per una campagna investigativa">
          </div>
          <div class="field">
            <label class="label" for="ann-testo">Descrizione</label>
            <textarea class="textarea" id="ann-testo" maxlength="600" placeholder="Che tavolo è, che toni, cosa vi aspettate da chi arriva.">${a.testo}</textarea>
          </div>
          <div class="row g-12 wrap">
            <div class="field grow">
              <label class="label" for="ann-sys">Sistema</label>
              <select class="select" id="ann-sys" data-change="annSet" data-field="systemId" data-rerender="1">
                ${D.SYSTEMS.map((s) => html`<option value="${s.id}" ${raw(s.id === a.systemId ? 'selected' : '')}>${s.nome}</option>`)}
              </select>
            </div>
            <div class="field grow">
              <label class="label" for="ann-ver">Versione</label>
              <select class="select" id="ann-ver" data-change="annSet" data-field="versione">
                ${sys.versioni.map((v) => html`<option value="${v}" ${raw(v === a.versione ? 'selected' : '')}>${v}</option>`)}
              </select>
            </div>
          </div>
          <div class="field">
            <span class="label">Modalità</span>
            ${chipRow('modalita', D.MODALITA, a.modalita)}
          </div>
          <div class="field">
            <span class="label">Formato</span>
            ${chipRow('formato', D.FORMATI, a.formato)}
          </div>
          <div class="field">
            <span class="label">Giorni proposti</span>
            <div class="row g-6 wrap">${D.GIORNI.map((g) => html`<button class="chip" style="padding:0 10px"
              aria-pressed="${a.disponibilita.giorni.indexOf(g.id) !== -1}" data-act="annGiorno" data-value="${g.id}">${g.label}</button>`)}</div>
          </div>
          <div class="row g-12 wrap">
            <div class="field" style="max-width:130px">

/* ---- assets/js/view-messages.js ---- */
/* ============================================================
   GdRadar — Richieste, chat e scambio contatti (flusso C)
   Richiesta → accettazione → chat → proposta di scambio →
   doppio consenso → scambio.
   ============================================================ */
(function (GD) {
  'use strict';
  const U = GD.util, UI = GD.ui, D = GD.data, S = GD.store;
  const { html, raw, icon } = U;

  const nomeDi = (kind, id) => {
    const e = D.byId(kind, id);
    return e ? (e.nome || e.titolo) : 'Profilo';
  };

  /* ---------------- azioni ---------------- */
  GD.actions.apriConv = (ds) => UI.go('/messaggi/' + ds.id);

  GD.actions.rispondiRichiesta = (ds) => {
    const accetta = ds.accetta === '1';
    if (accetta && !UI.requireVerified('accettare un contatto')) return;
    const convId = S.rispondiRichiesta(ds.id, accetta);
    UI.toast(accetta ? 'Richiesta accettata: la conversazione è aperta.' : 'Richiesta rifiutata. Non riceverà nessuna notifica.');
    if (convId) UI.go('/messaggi/' + convId);
  };

  GD.actions.inviaMsg = () => {
    const ta = U.$('#msg-input');
    if (!ta) return;
    const text = ta.value.trim();
    const convId = ta.dataset.conv;
    if (!text) return;
    S.inviaMessaggio(convId, text);
    scrollGiu();
    setTimeout(() => rispostaSimulata(convId), 1400);
  };

  const RISPOSTE = [
    'Per me va bene. Confermo appena sento gli altri del tavolo.',
    'Ottimo, allora ci sentiamo. Ti mando i dettagli quando fissiamo la data.',
    'Bella domanda: di solito partiamo alle 21 e chiudiamo verso mezzanotte.',
    'Guarda, sì. L\'unica cosa che chiediamo è di avvisare se salta una serata.',
    'Perfetto. Se ti va, quando ci siamo chiariti possiamo scambiarci i contatti.'
  ];
  function rispostaSimulata(convId) {
    const st = S.get();
    const c = st.conversations.find((x) => x.id === convId);
    if (!c || c.chiusa) return;
    const testo = RISPOSTE[(c.messages.length + U.hashStr(c.id)) % RISPOSTE.length];
    S.set((s) => {
      const cc = s.conversations.find((x) => x.id === convId);
      if (cc) cc.messages.push({ from: 'them', text: testo, ts: Date.now() });
    });
    scrollGiu();
  }

  function scrollGiu() {
    setTimeout(() => {
      const box = U.$('#msg-scroll');
      if (box) box.scrollTop = box.scrollHeight;
    }, 30);
  }

  GD.actions.apriScambio = (ds) => {
    if (!UI.requireVerified('scambiare i contatti')) return;
    const me = S.get().me;
    UI.openModal({
      title: 'Proporre lo scambio dei contatti',
      sub: 'Passano solo se anche l\'altra persona accetta. Scegli tu quali condividere.',
      body: html`
        <div class="col g-8">
          ${D.CANALI_CONTATTO.map((c) => html`<label class="card card-pad row g-10" style="padding:12px 14px;cursor:pointer">
            <input type="checkbox" class="canale" value="${c.id}" ${raw(me.contatti[c.id] ? 'checked' : '')}
              style="width:17px;height:17px;accent-color:var(--accent)">
            <span class="grow"><b class="h-sm">${c.label}</b>
              ${me.contatti[c.id] ? html`<span class="small muted"> · ${me.contatti[c.id]}</span>` : html`<span class="tiny muted"> · non impostato nel profilo</span>`}</span>
          </label>`)}
        </div>
        <div class="callout mt-16">${icon('shield', 18, 'ico')}
          <div>Lo scambio viene registrato come evento di piattaforma: è ciò che rende qualificata la relazione e sblocca il feedback Fairness.</div></div>`,
      foot: html`<button class="btn" data-act="closeOverlays">Annulla</button>
        <button class="btn btn-primary" data-act="confermaScambio" data-conv="${ds.conv}">Proponi lo scambio</button>`
    });
  };
  GD.actions.confermaScambio = (ds) => {
    const canali = U.$$('.canale').filter((c) => c.checked).map((c) => c.value);
    if (!canali.length) { UI.toast('Scegli almeno un canale.', 'warn'); return; }
    S.proponiScambio(ds.conv, canali);
    UI.closeOverlays();
    UI.toast('Contatti scambiati: entrambe le parti hanno acconsentito.');
    scrollGiu();
  };

  GD.actions.chiudiConv = (ds) => {
    UI.openModal({
      title: 'Chiudere la conversazione?',
      sub: 'Resta visibile nello storico ma nessuno dei due può più scrivere.',
      body: html`<div class="callout">${icon('info', 18, 'ico')}<div>Se il problema è la persona e non la conversazione, valuta il blocco o la segnalazione: sono strumenti diversi.</div></div>`,
      foot: html`<button class="btn" data-act="closeOverlays">Annulla</button>
        <button class="btn btn-danger" data-act="confermaChiusura" data-conv="${ds.conv}">Chiudi conversazione</button>`
    });
  };
  GD.actions.confermaChiusura = (ds) => { S.chiudiConversazione(ds.conv); UI.closeOverlays(); UI.toast('Conversazione chiusa.'); };

  /* ---------------- lista laterale ---------------- */
  function sidebar(active) {
    const st = S.get();
    const richieste = st.requests.filter((r) => r.stato === 'pending');
    return html`<aside class="msg-side">
      ${richieste.length ? html`<div style="padding:14px 15px;border-bottom:1px solid var(--line)">
        <span class="eyebrow">Richieste · ${richieste.length}</span>
        <div class="col g-8 mt-12">
          ${richieste.map((r) => html`<div class="card card-flat card-quiet card-pad" style="padding:12px">
            <div class="row g-10">
              ${U.avatar(nomeDi(r.kind, r.id2), 'sm', r.id2)}
              <div class="grow" style="min-width:0">
                <p class="h-sm truncate">${nomeDi(r.kind, r.id2)}</p>
                <p class="tiny muted">${r.dir === 'in' ? 'ti ha scritto' : 'in attesa di risposta'} · ${U.timeAgo(r.quando)}</p>
              </div>
            </div>
            ${r.msg ? html`<p class="small mt-8" style="color:var(--ink-2)">“${r.msg}”</p>` : ''}
            ${r.dir === 'in' ? html`<div class="row g-8 mt-12">
              <button class="btn btn-sm btn-primary grow" data-act="rispondiRichiesta" data-id="${r.id}" data-accetta="1">Accetta</button>
              <button class="btn btn-sm grow" data-act="rispondiRichiesta" data-id="${r.id}" data-accetta="0">Rifiuta</button>
            </div>` : html`<div class="row g-8 mt-8"><span class="badge">${icon('clock', 11)}In attesa</span></div>`}
          </div>`)}
        </div>
      </div>` : ''}

      <div class="list">
        ${st.conversations.length ? st.conversations.map((c) => html`
          <div class="msg-item ${raw(active === c.id ? 'is-on' : '')}" data-act="apriConv" data-id="${c.id}">
            ${U.avatar(nomeDi(c.kind, c.id2), 'sm', c.id2)}
            <div class="grow" style="min-width:0">
              <div class="row-b g-8">
                <span class="h-sm truncate">${nomeDi(c.kind, c.id2)}</span>
                <span class="tiny muted nowrap">${U.timeAgo(c.messages[c.messages.length - 1].ts)}</span>
              </div>
              <p class="small muted truncate">${c.messages[c.messages.length - 1].text}</p>
              ${c.exchange.done ? html`<span class="badge badge-accent mt-4">${icon('handshake', 11)}Contatti scambiati</span>` : ''}
              ${c.chiusa ? html`<span class="badge mt-4">Chiusa</span>` : ''}
            </div>
            ${c.unread ? html`<span class="un"></span>` : ''}
          </div>`)
        : UI.emptyState('message', 'Nessuna conversazione', 'Le chat si aprono solo dopo una richiesta di contatto accettata.')}
      </div>
    </aside>`;
  }

  /* ---------------- thread ---------------- */
  function thread(c) {
    if (!c) {
      return html`<section class="msg-thread">${UI.emptyState('message', 'Scegli una conversazione',
        'Le richieste in sospeso sono in cima alla colonna di sinistra.')}</section>`;
    }
    const nome = nomeDi(c.kind, c.id2);
    const entity = D.byId(c.kind, c.id2);
    S.leggiConversazione(c.id);

    return html`<section class="msg-thread">
      <header class="msg-head">
        <a class="btn btn-icon btn-ghost msg-back" href="#/messaggi" aria-label="Torna alle conversazioni">${icon('arrowLeft', 18)}</a>
        ${U.avatar(nome, 'sm', c.id2)}
        <div class="grow" style="min-width:0">
          <p class="h-sm truncate">${nome}</p>
          <p class="tiny muted truncate">${entity ? UI.identity(entity).sotto : ''}</p>
        </div>
        <button class="btn btn-sm" data-act="openSheet" data-kind="${c.kind}" data-id="${c.id2}">Scheda</button>
        <button class="btn btn-icon btn-ghost tip" data-tip="Segnala" data-act="apriSegnalazione" data-kind="${c.kind}" data-id="${c.id2}">${icon('flag', 17)}</button>
        <button class="btn btn-icon btn-ghost tip" data-tip="Blocca" data-act="apriBlocco" data-kind="${c.kind}" data-id="${c.id2}">${icon('ban', 17)}</button>
      </header>

      <div class="msg-scroll" id="msg-scroll">
        ${c.messages.map((m) => m.from === 'sys'
          ? html`<div class="sys-note">${m.text}</div>`
          : html`<div class="bubble ${raw(m.from === 'me' ? 'me' : 'them')}">${m.text}<span class="t">${U.clockTime(m.ts)}</span></div>`)}

        ${!c.exchange.done && !c.chiusa ? html`<div class="exchange-card">
          <div class="row g-10">
            <span style="color:var(--accent)">${icon('handshake', 20)}</span>
            <div class="grow">
              <p class="h-sm">Scambio dei contatti</p>
              <p class="small mt-4" style="color:var(--accent-ink)">Telefono, Discord o Telegram passano solo con il consenso di entrambi. Fino ad allora resta tutto qui dentro.</p>
              <button class="btn btn-sm btn-primary mt-12" data-act="apriScambio" data-conv="${c.id}">Proponi lo scambio</button>
            </div>
          </div>
        </div>` : ''}

        ${c.exchange.done ? html`<div class="exchange-card">
          <div class="row-b g-10 wrap">
            <div class="row g-10">
              <span style="color:var(--accent)">${icon('checkCircle', 20)}</span>
              <div>
                <p class="h-sm">Contatti scambiati</p>
                <p class="small" style="color:var(--accent-ink)">${c.exchange.canali.map((k) => (D.CANALI_CONTATTO.find((x) => x.id === k) || {}).label).join(', ')} · ${U.timeAgo(c.exchange.quando || Date.now())}</p>
              </div>
            </div>
            <span class="badge badge-accent">Relazione qualificata</span>
          </div>
        </div>` : ''}
      </div>

      ${c.chiusa
        ? html`<div class="msg-compose"><p class="small muted grow tc">Conversazione chiusa.</p></div>`
        : html`<div class="msg-compose">
            <textarea class="textarea grow" id="msg-input" data-conv="${c.id}" rows="1" placeholder="Scrivi un messaggio…"></textarea>
            <button class="btn btn-icon btn-primary" data-act="inviaMsg" aria-label="Invia">${icon('send', 17)}</button>
            <button class="btn btn-icon btn-ghost tip" data-tip="Chiudi conversazione" data-act="chiudiConv" data-conv="${c.id}">${icon('x', 17)}</button>
          </div>`}
    </section>`;
  }

  /* ---------------- vista ---------------- */
  function view(convId) {
    const st = S.get();
    let c = convId ? st.conversations.find((x) => x.id === convId) : null;
    /* su schermi larghi conviene mostrare subito l'ultima conversazione */
    if (!c && !convId && st.conversations.length && window.innerWidth > 860) c = st.conversations[0];
    const contenuto = html`
      <div class="row-b wrap g-12" style="margin-bottom:18px">
        <div>
          <h1 class="display d-3">Messaggi</h1>
          <p class="small muted mt-4">Niente file, niente vocali, niente immagini: nella V1 la chat è testo e basta.</p>
        </div>
      </div>
      <div class="msg-layout ${raw(c ? 'on-thread' : '')}">
        ${sidebar(c ? c.id : null)}
        ${thread(c)}
      </div>`;
    const out = UI.shell('/messaggi', contenuto, { title: 'Messaggi' });
    scrollGiu();
    return out;
  }

  GD.views = GD.views || {};
  GD.views.messaggi = view;
})(window.GD);


/* ---- assets/js/view-fairness.js ---- */
/* ============================================================
   GdRadar — Fairness (flusso D)
   Relazione qualificata → conferma esperienza → feedback →
   punteggio. Anonimo verso il destinatario, tracciato verso
   l'autore, mai testo libero pubblico.
   ============================================================ */
(function (GD) {
  'use strict';
  const U = GD.util, UI = GD.ui, D = GD.data, S = GD.store, M = GD.match;
  const { html, raw, icon } = U;

  const DOMANDE = [
    { id: 'corretta', testo: 'L\'esperienza è stata complessivamente corretta?' },
    { id: 'accordi', testo: 'Ha rispettato gli accordi presi?' },
    { id: 'comunicazione', testo: 'La comunicazione è stata rispettosa?' },
    { id: 'dinuovo', testo: 'Giocheresti di nuovo con questa persona o con questo Party?' }
  ];

  let risposte = {};

  GD.actions.apriFeedback = (ds) => {
    const st = S.get();
    const fb = st.pendingFeedback.find((x) => x.id === ds.id);
    if (!fb) return;
    risposte = {};
    disegnaFeedback(fb);
  };

  GD.actions.fbRisposta = (ds) => {
    risposte[ds.q] = ds.v === '1';
    const fb = S.get().pendingFeedback.find((x) => x.id === ds.fb);
    if (fb) disegnaFeedback(fb);
  };
  GD.actions.fbMotivo = (ds) => {
    risposte.motivo = ds.value;
    const fb = S.get().pendingFeedback.find((x) => x.id === ds.fb);
    if (fb) disegnaFeedback(fb);
  };

  GD.actions.inviaFeedback = (ds) => {
    if (Object.keys(risposte).filter((k) => k !== 'motivo').length < DOMANDE.length) {
      UI.toast('Rispondi a tutte e quattro le domande.', 'warn');
      return;
    }
    const negativo = DOMANDE.some((d) => risposte[d.id] === false);
    if (negativo && !risposte.motivo) { UI.toast('Indica il motivo: resta privato, serve alla moderazione.', 'warn'); return; }
    S.inviaFeedback(ds.id, JSON.parse(JSON.stringify(risposte)));
    UI.closeOverlays();
    UI.toast('Feedback inviato in forma anonima. Grazie: è così che il sistema resta utile.');
  };
  GD.actions.saltaFeedback = (ds) => {
    S.saltaFeedback(ds.id);
    UI.closeOverlays();
    UI.toast('Nessun problema: il promemoria non tornerà.');
  };
  GD.actions.nonAvvenuto = (ds) => {
    S.saltaFeedback(ds.id);
    UI.closeOverlays();
    UI.toast('Registrato: senza incontro non c\'è feedback, e la relazione non conta per la Fairness.');
  };

  function disegnaFeedback(fb) {
    const e = D.byId(fb.kind, fb.id2);
    const nome = e ? (e.nome || e.titolo) : 'questa persona';
    const negativo = DOMANDE.some((d) => risposte[d.id] === false);
    UI.openModal({
      title: 'Com\'è andata con ' + nome + '?',
      sub: 'Quattro domande chiuse. Anonime verso chi le riceve, e non servono a giudicare quanto giochi bene.',
      body: html`
        <div class="col g-12">
          ${DOMANDE.map((d) => html`<div class="card card-pad" style="padding:14px 16px">
            <div class="row-b g-12 wrap">
              <span class="small grow" style="min-width:180px">${d.testo}</span>
              <div class="segmented on-white">
                <button aria-pressed="${risposte[d.id] === true}" data-act="fbRisposta" data-fb="${fb.id}" data-q="${d.id}" data-v="1">Sì</button>
                <button aria-pressed="${risposte[d.id] === false}" data-act="fbRisposta" data-fb="${fb.id}" data-q="${d.id}" data-v="0">No</button>
              </div>
            </div>
          </div>`)}

          ${negativo ? html`<div class="field mt-4">
            <span class="label">Motivo (privato, visibile solo alla moderazione)</span>
            <div class="row g-8 wrap">
              ${D.MOTIVI_REPORT.filter((m) => ['no_show', 'scorrettezza', 'molestie', 'aggressivita', 'altro'].indexOf(m.id) !== -1)
                .map((m) => html`<button class="chip" aria-pressed="${risposte.motivo === m.id}" data-act="fbMotivo" data-fb="${fb.id}" data-value="${m.id}">${m.label}</button>`)}
            </div>
            <span class="hint">Un motivo negativo non applica sanzioni da solo: se serve, apre il percorso di moderazione.</span>
          </div>` : ''}

          <div class="callout">${icon('lock', 18, 'ico')}
            <div>${nome} vedrà solo il punteggio aggregato, mai chi ha risposto cosa. Internamente il feedback resta legato a te: serve a fermare gli abusi.</div></div>
        </div>`,
      foot: html`
        <button class="btn btn-ghost" data-act="nonAvvenuto" data-id="${fb.id}">Non ci siamo visti</button>
        <button class="btn" data-act="saltaFeedback" data-id="${fb.id}">Più tardi</button>
        <button class="btn btn-primary" data-act="inviaFeedback" data-id="${fb.id}">Invia</button>`
    });
  }

  /* ---------------- grafico Wilson ---------------- */
  function wilsonDemo() {
    const casi = [
      { l: '5 su 5', pos: 5, n: 5 },
      { l: '9 su 10', pos: 9, n: 10 },
      { l: '28 su 30', pos: 28, n: 30 },
      { l: '97 su 100', pos: 97, n: 100 }
    ];
    return html`<div class="col g-12">
      ${casi.map((c) => {
        const w = Math.round(M.wilsonLower(c.pos, c.n) * 100);
        const media = Math.round((c.pos / c.n) * 100);
        return html`<div>
          <div class="row-b tiny"><span>${c.l}</span><span class="muted">media ${media}% → stima ${w}%</span></div>
