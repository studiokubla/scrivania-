# ============================================================
# GdRadar — build iOS e caricamento su App Store Connect
#
# Serve a chi non ha un Mac: la compilazione gira sui runner macOS
# di GitHub, che hanno già Xcode, CocoaPods e Node. Il risultato
# finisce su TestFlight, da cui si promuove alla revisione.
#
# Prima del primo avvio servono quattro segreti nel repository
# (Settings → Secrets and variables → Actions):
#
#   APPSTORE_KEY_ID        ID della chiave API di App Store Connect
#   APPSTORE_ISSUER_ID     Issuer ID (stessa pagina della chiave)
#   APPSTORE_PRIVATE_KEY   contenuto del file .p8, incollato per intero
#   APPLE_TEAM_ID          Team ID (10 caratteri, in Membership)
#
# La chiave si crea in App Store Connect → Users and Access → Integrations
# → App Store Connect API, con ruolo "App Manager". Il file .p8 si scarica
# una volta sola.
#
# Va anche creata, una volta, la scheda dell'app in App Store Connect con
# bundle ID com.studiokubla.gdradar.
# ============================================================

name: iOS · TestFlight

on:
  workflow_dispatch:
    inputs:
      versione:
        description: "Versione mostrata sullo store (es. 1.0.0)"
        required: false
        default: "1.0.0"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Prepara la chiave API
        env:
          CHIAVE: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$CHIAVE" > ~/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8
          chmod 600 ~/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8

      - name: Genera il progetto iOS
        working-directory: gdradar
        run: |
          npm install
          npm run build          # scrive www/ dalla sorgente
          npx cap add ios        # crea ios/ (non è versionato: si rigenera)
          npx cap sync ios

      - name: Motivazioni richieste da iOS
        working-directory: gdradar/ios/App/App
        run: |
          # Senza questa chiave la richiesta di posizione fallisce in silenzio
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string 'Serve solo a calcolare la distanza dai tavoli vicini. La tua posizione precisa non viene mai mostrata agli altri utenti.'" Info.plist || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName GdRadar" Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" Info.plist || true

      - name: Numera build e versione
        working-directory: gdradar/ios/App
        run: |
          xcrun agvtool new-marketing-version "${{ github.event.inputs.versione || '1.0.0' }}"
          xcrun agvtool new-version -all "${{ github.run_number }}"

      - name: Archivia
        working-directory: gdradar/ios/App
        run: |
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/GdRadar.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.APPSTORE_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.APPSTORE_ISSUER_ID }} \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} \
            CODE_SIGN_STYLE=Automatic \
            archive

      - name: Esporta l'ipa
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/GdRadar.xcarchive" \
            -exportOptionsPlist gdradar/ios-export-options.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.APPSTORE_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.APPSTORE_ISSUER_ID }}

      - name: Carica su App Store Connect
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file "$RUNNER_TEMP/export/App.ipa" \
            --apiKey ${{ secrets.APPSTORE_KEY_ID }} \
            --apiIssuer ${{ secrets.APPSTORE_ISSUER_ID }}

      - name: Conserva l'ipa
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GdRadar-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: warn
