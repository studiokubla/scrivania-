 .verde{background:#3EE68C}.nero{background:#101010;color:#fff}.rosa{background:#F5B8E0}

 .piccoli{display:flex;align-items:center;gap:24px}
 .piccoli svg{width:16px;height:16px}.piccoli .m24{width:24px;height:24px}.piccoli .m32{width:32px;height:32px}
 .tondo{width:64px;height:64px;border-radius:50%;background:#101010;color:#3EE68C;display:grid;place-items:center}
 .tondo svg{width:34px;height:34px}
 .campioni{display:flex;gap:0}
 .campioni div{width:110px;height:80px;display:flex;align-items:flex-end;padding:6px;font-size:10px;font-weight:600}
