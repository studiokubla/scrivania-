<title>Dynasty League</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Archivo:wght@400;500;600;700&display=swap">

<style>
/* ─────────────────────────────────────────────────────────────
   Dynasty League — il front office di una lega da dieci squadre.

   Verde e lime. Il fondo non è nero: è una fotografia sfocata di
   macchie verdi — grandi, morbide, fuori fuoco — e sopra ci galleggia
   il contenuto su superfici di vetro che prendono il colore da quello
   che ci passa sotto. Nero pieno l'avevamo provato, e spegneva il
   vetro: senza niente da lasciar passare, un pannello di controllo.

   L'accento è uno solo, il lime, e sta dove serve una risposta: la
   cifra del tetto, il bottone che firma, la voce dove sei adesso, una
   parola per titolo. Tutto il resto è verde, grigio e trasparenza.

   È un design **deliberatamente scuro**, uno solo: non segue il tema
   di chi guarda, perché il lime su fondo chiaro perde tutto. Per
   questo ogni colore è dichiarato, nessuno ereditato.
   ───────────────────────────────────────────────────────────── */

:root {
  color-scheme: dark;

  /* Il fondo non è nero: è un verde-grigio scuro, come una fotografia
     tenuta in ombra. Il nero pieno spegne il vetro — non c'è niente da
     lasciar passare — ed è la ragione per cui la prima versione sembrava
     un pannello di controllo invece di un'app. */
  --fondo:        #171C13;

  /* Le superfici sono vetro vero: molto trasparenti, con un blur forte.
     Prendono il colore da quello che hanno sotto, che cambia mentre si
     scorre. */
  --vetro:        rgba(236, 246, 222, .10);
  --vetro-alto:   rgba(236, 246, 222, .17);
  --bordo:        rgba(255, 255, 255, .13);
  --bordo-forte:  rgba(255, 255, 255, .24);

  /* Il velo che sta *dentro* le superfici: schiarisce il bordo alto e si
     spegne verso il basso, come una lastra inclinata verso la luce. È la
     differenza fra un rettangolo trasparente e un pezzo di vetro. */
  --lucido: linear-gradient(170deg, rgba(255,255,255,.11) 0%, rgba(255,255,255,.02) 42%, rgba(255,255,255,0) 100%);

  --luce:         #F6F9F1;
  --luce-media:   #D3DAC8;
  --luce-fioca:   #AAB59A;

  --lime:         #D2F76A;
  --lime-caldo:   #B9EC45;
  --lime-fioco:   rgba(210, 247, 106, .16);

  --allarme:      #FFA48C;
  --allarme-tenue: rgba(255, 164, 140, .15);
  --avviso:       #F5D488;
  --avviso-tenue: rgba(245, 212, 136, .14);
  --ok:           var(--lime);

  --ombra:      0 1px 0 rgba(255,255,255,.06) inset, 0 12px 34px rgba(0,0,0,.35);
  --ombra-alta: 0 1px 0 rgba(255,255,255,.09) inset, 0 28px 70px rgba(0,0,0,.5);
  --alone-lime: 0 10px 34px rgba(210, 247, 106, .3);

  /* Una superficie opaca, per i pochi punti in cui il vetro non si può
     usare: sotto una colonna che resta ferma mentre la tabella scorre. */
  --superficie-piena: #1F2419;

  --raggio:   26px;
  --raggio-s: 18px;

  --display: "Manrope", system-ui, sans-serif;
  --testo:   "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --numeri:  "Archivo", system-ui, sans-serif;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--fondo);
  color: var(--luce);
  font-family: var(--testo);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  padding-bottom: env(safe-area-inset-bottom);
  min-height: 100vh;
}

/**
 * Lo sfondo.
 *
 * Non gradienti geometrici — si vedeva che erano gradienti — ma macchie
 * organiche di verdi diversi, sfocate forte: quello che in fotografia si
 * chiama bokeh. È un SVG disegnato qui dentro, quindi non c'è niente da
 * scaricare, resta nitido su qualunque schermo e pesa meno di questo
 * commento. Sta fermo mentre il contenuto scorre, così le superfici di
 * vetro cambiano colore man mano che ci passano sopra.
 */
body::before {
  content: "";
  position: fixed; inset: -12%; z-index: -2; pointer-events: none;
  background: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%201000%201000%22%20preserveAspectRatio%3D%22xMidYMid%20slice%22%3E%3Cdefs%3E%3Cfilter%20id%3D%22s%22%20x%3D%22-35%25%22%20y%3D%22-35%25%22%20width%3D%22170%25%22%20height%3D%22170%25%22%3E%3CfeGaussianBlur%20stdDeviation%3D%2288%22%2F%3E%3C%2Ffilter%3E%3C%2Fdefs%3E%3Crect%20width%3D%221000%22%20height%3D%221000%22%20fill%3D%22%23171C13%22%2F%3E%3Cg%20filter%3D%22url%28%23s%29%22%3E%3Cellipse%20cx%3D%22820%22%20cy%3D%22250%22%20rx%3D%22250%22%20ry%3D%22215%22%20fill%3D%22%23D4F86F%22%20opacity%3D%22.72%22%2F%3E%3Cellipse%20cx%3D%22660%22%20cy%3D%22430%22%20rx%3D%22200%22%20ry%3D%22175%22%20fill%3D%22%236FCB55%22%20opacity%3D%22.38%22%2F%3E%3Cellipse%20cx%3D%22240%22%20cy%3D%2270%22%20rx%3D%22420%22%20ry%3D%22300%22%20fill%3D%22%23161C12%22%20opacity%3D%22.94%22%2F%3E%3Cellipse%20cx%3D%22640%22%20cy%3D%22700%22%20rx%3D%22230%22%20ry%3D%22250%22%20fill%3D%22%232FA089%22%20opacity%3D%22.46%22%2F%3E%3Cellipse%20cx%3D%22100%22%20cy%3D%22520%22%20rx%3D%22260%22%20ry%3D%22250%22%20fill%3D%22%237ACF57%22%20opacity%3D%22.32%22%2F%3E%3Cellipse%20cx%3D%22450%22%20cy%3D%22520%22%20rx%3D%22340%22%20ry%3D%22290%22%20fill%3D%22%23121810%22%20opacity%3D%22.70%22%2F%3E%3Cellipse%20cx%3D%22560%22%20cy%3D%22900%22%20rx%3D%22300%22%20ry%3D%22230%22%20fill%3D%22%23BFEE6A%22%20opacity%3D%22.40%22%2F%3E%3Cellipse%20cx%3D%22160%22%20cy%3D%22940%22%20rx%3D%22280%22%20ry%3D%22235%22%20fill%3D%22%23246045%22%20opacity%3D%22.62%22%2F%3E%3Cellipse%20cx%3D%22880%22%20cy%3D%22990%22%20rx%3D%22280%22%20ry%3D%22230%22%20fill%3D%22%2396DE5E%22%20opacity%3D%22.28%22%2F%3E%3Cellipse%20cx%3D%22500%22%20cy%3D%221030%22%20rx%3D%22440%22%20ry%3D%22240%22%20fill%3D%22%230B100A%22%20opacity%3D%22.85%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E") center / cover no-repeat, var(--fondo);
  /* Respira. Un movimento lentissimo — un minuto e mezzo per andare e
     tornare — che non si guarda mai davvero ma toglie alla pagina
     l'aria di uno sfondo stampato. `inset: -12%` è il margine che serve
     perché spostandosi non scopra mai un bordo. */
  animation: respiro 96s ease-in-out infinite alternate;
  will-change: transform;
}
@keyframes respiro {
  from { transform: scale(1) translate3d(0, 0, 0); }
  to   { transform: scale(1.12) translate3d(-2%, -3%, 0); }
}

/* Non un velo ma una vignettatura: i bordi si spengono, il centro no.

   Un velo steso su tutto — le prime due misure — spegneva le macchie
   fino a farne una sfumatura sola, cioè il difetto da cui si partiva.
   Così invece la luce resta dov'è, e a tenere il contrasto del testo
   sono le superfici di vetro (sotto le parole ci sono quasi sempre) e
   l'ombra morbida sui titoli, che di vetro sotto non ne hanno. */
body::after {
  content: "";
  position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(130% 95% at 50% 12%, transparent 30%, rgba(11, 15, 10, .42) 100%),
    linear-gradient(180deg, transparent 55%, rgba(11, 15, 10, .40) 100%);
}

h1, h2, h3 {
  font-family: var(--display); margin: 0; text-wrap: balance;
  /* I titoli sono l'unico testo appoggiato direttamente sulle macchie:
     un'ombra larga e morbida — non un contorno — li tiene staccati anche
     quando ci passa sotto la parte più accesa del fondo. */
  text-shadow: 0 2px 22px rgba(8, 12, 7, .55);
}
/* I titoli sono grandi e **sottili**: su un fondo con delle macchie chiare
   il grassetto diventa una macchia a sua volta, mentre un peso leggero in
   corpo grande resta arioso e si legge lo stesso. */
h1 { font-size: clamp(36px, 10vw, 52px); font-weight: 300; line-height: 1.0; letter-spacing: -.04em; }
h2 { font-size: 22px; font-weight: 500; letter-spacing: -.025em; }
h3 { font-size: 16px; font-weight: 600; letter-spacing: -.01em; }

/* Una parola del titolo accesa di lime: è il modo più semplice per dire di
   cosa parla la pagina senza aggiungere una riga di testo. */
h1 .acceso { color: var(--lime); font-weight: 400; }
p { margin: 0; }

.num { font-family: var(--numeri); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }

.occhiello {
  font-size: 11px; font-weight: 600; letter-spacing: .14em;
  text-transform: uppercase; color: var(--luce-fioca);
}

button { font-family: inherit; font-size: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible, textarea:focus-visible {
  outline: 2px solid var(--lime); outline-offset: 2px;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

/* ── Impalcatura ──────────────────────────────────────────── */

.guscio { min-height: 100vh; display: flex; flex-direction: column; }

/* La testata sta ferma mentre il contenuto le scorre sotto, ed è di
   vetro come tutto il resto: un rettangolo nero pieno — la prima
   misura — tagliava il fondo verde con una riga netta a un centimetro
   dal bordo, e si vedeva solo quella. Qui invece prende il colore di
   quello che le passa sotto. Il velo è appena più fitto in alto, dove
   sta il nome, e sfuma verso il basso invece di finire di colpo. */
.testata {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; gap: 12px;
  padding: 13px 16px;
  background: linear-gradient(180deg, rgba(18, 23, 17, .72) 0%, rgba(18, 23, 17, .58) 65%, rgba(18, 23, 17, .34) 100%);
  backdrop-filter: blur(24px) saturate(150%);
  -webkit-backdrop-filter: blur(24px) saturate(150%);
  border-bottom: 1px solid rgba(255,255,255,.07);
}
.marchio {
  display: flex; align-items: center; gap: 9px; min-width: 0;
  font-family: var(--display); font-weight: 700; font-size: 16px; letter-spacing: -.02em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
/* Il pallone della testata. */
.segno { height: 26px; width: auto; flex: none; display: block; }

/* L'emblema. Il fondo dell'immagine è già stato portato sul verde
   dell'applicazione e i bordi sfumano, quindi non gli serve né cornice né
   ombra: sta appoggiato e basta. Il margine negativo in basso recupera
   l'aria che la sfumatura si porta dietro. */
.emblema {
  display: block; margin: 0 auto -6px;
  height: clamp(132px, 38vw, 176px); width: auto;
}
.testata .spinta { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.chi-sono { font-size: 12px; color: var(--luce-fioca); text-align: right; line-height: 1.25; }
.chi-sono b { display: block; color: var(--luce); font-size: 13px; font-weight: 600; }

.lavoro { flex: 1; width: 100%; max-width: 1120px; margin: 0 auto; padding: 26px 18px 150px; }
@media (min-width: 860px) { .lavoro { padding-bottom: 48px; } }

/* La navigazione galleggia in basso, dove arriva il pollice. Vetro scuro
   e la voce attiva accesa di lime: si trova senza cercarla. */
.navigazione {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: 16px; z-index: 40;
  display: flex; gap: 2px; padding: 5px;
  background: rgba(14, 18, 13, .90);
  backdrop-filter: blur(30px) saturate(160%);
  -webkit-backdrop-filter: blur(30px) saturate(160%);
  border: 1px solid var(--bordo-forte);
  border-radius: 999px;
  box-shadow: var(--ombra-alta);
  max-width: calc(100vw - 24px); overflow-x: auto; scrollbar-width: none;
  /* Le voci sono otto e in un telefono non ci stanno: la barra scorre.
     Perché si capisca — e perché non sembri una parola tagliata a metà —
     i due bordi sfumano, e la voce attiva viene portata in vista da sé. */
  -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 18px, #000 calc(100% - 18px), transparent 100%);
          mask-image: linear-gradient(90deg, transparent 0, #000 18px, #000 calc(100% - 18px), transparent 100%);
  scroll-behavior: smooth;
}
.navigazione::-webkit-scrollbar { display: none; }
.navigazione button {
  border: 0; background: transparent; color: var(--luce-media);
  padding: 10px 15px; border-radius: 999px; white-space: nowrap;
  font-size: 13px; font-weight: 500; transition: color .15s ease, background .15s ease;
}
.navigazione button:hover { color: var(--luce); }
.navigazione button[aria-current="page"] {
  background: linear-gradient(145deg, var(--lime), var(--lime-caldo));
  color: #0B0E0B; font-weight: 700;
  box-shadow: var(--alone-lime);
}

@media (min-width: 860px) {
  .navigazione {
    position: sticky; top: 68px; transform: none; left: auto; bottom: auto;
    margin: 0 auto 6px; width: fit-content; max-width: none;
    -webkit-mask-image: none; mask-image: none;
  }
}

/* ── Blocchi ──────────────────────────────────────────────── */

.sezione { margin-bottom: 24px; }
@media (min-width: 860px) { .sezione { margin-bottom: 34px; } }
.intestazione-sezione { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 13px; }
.intestazione-sezione .conteggio {
  font-size: 12px; font-weight: 600; color: var(--lime);
  background: var(--lime-fioco); padding: 3px 10px; border-radius: 999px;
}

/* Vetro: si vede attraverso, prende luce dagli aloni e ha un filo di
   bordo chiaro in cima, come una superficie inclinata verso la luce. */
.riquadro {
  background: var(--lucido), var(--vetro);
  backdrop-filter: blur(28px) saturate(145%);
  -webkit-backdrop-filter: blur(28px) saturate(145%);
  border: 1px solid var(--bordo);
  border-radius: var(--raggio);
  padding: 20px;
  box-shadow: var(--ombra);
}

/**
 * La carta del tetto salariale.
 *
 * È il numero che comanda tutto, e si prende l'unico gradiente pieno
 * della pagina — come la carta di un conto. Il testo ci sta sopra in
 * scuro, che sul lime è l'unico modo per leggerlo davvero.
 */
.tetto {
  position: relative; overflow: hidden;
  background:
    radial-gradient(120% 140% at 88% 0%, rgba(255,255,255,.35), transparent 55%),
    linear-gradient(150deg, var(--lime) 0%, var(--lime-caldo) 45%, #4E9E45 100%);
  color: #09140A;
  border-radius: var(--raggio); padding: 17px 18px;
  display: flex; flex-wrap: wrap; gap: 14px 22px; align-items: flex-end;
  box-shadow: 0 20px 50px rgba(150, 220, 60, .28), 0 0 0 1px rgba(255,255,255,.14) inset;
}
.tetto .occhiello { color: rgba(9, 20, 10, .58); }
/* La cifra era in `11vw`: su un telefono diventava alta un dito e i due
   numeri finivano uno sotto l'altro, prendendosi mezzo schermo per dire
   due cose. Sta stretta, e sta in riga. */
.tetto .cifra {
  font-family: var(--display); font-weight: 700;
  font-size: clamp(31px, 8vw, 46px); line-height: .95; letter-spacing: -.045em;
}
.tetto .sotto { font-size: 12.5px; color: rgba(9, 20, 10, .66); margin-top: 4px; font-weight: 500; }
.tetto.sforato {
  background:
    radial-gradient(120% 140% at 88% 0%, rgba(255,255,255,.3), transparent 55%),
    linear-gradient(150deg, #FFB199 0%, #F08A6E 50%, #A43F28 100%);
}

.barra-tetto { width: 100%; height: 8px; border-radius: 999px; background: rgba(9, 20, 10, .18); overflow: hidden; }
.barra-tetto span { display: block; height: 100%; background: #09140A; border-radius: 999px; transition: width .4s cubic-bezier(.2,.7,.3,1); }
.barra-tetto span.sforato { background: #5A1A0C; }

.griglia-dati { display: grid; grid-template-columns: repeat(auto-fit, minmax(112px, 1fr)); gap: 10px; }
.dato {
  background: var(--vetro); border: 1px solid var(--bordo);
  border-radius: var(--raggio-s); padding: 13px 15px;
}
.dato .etichetta { font-size: 10.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--luce-fioca); }
.dato .valore { font-family: var(--display); font-weight: 700; font-size: 23px; line-height: 1.15; margin-top: 3px; letter-spacing: -.03em; }
.dato .nota { font-size: 12px; color: var(--luce-media); }
.dato.manca .valore { color: var(--allarme); }

/* ── Giocatori ────────────────────────────────────────────── */

.elenco {
  display: flex; flex-direction: column;
  background: var(--lucido), var(--vetro);
  backdrop-filter: blur(28px) saturate(145%); -webkit-backdrop-filter: blur(28px) saturate(145%);
  border: 1px solid var(--bordo);
  border-radius: var(--raggio); overflow: hidden;
  box-shadow: var(--ombra);
}
.voce {
  display: flex; align-items: center; gap: 12px;
  padding: 13px 15px; border-bottom: 1px solid var(--bordo);
  background: none; border-left: 0; border-right: 0; border-top: 0;
  width: 100%; text-align: left; color: inherit;
  transition: background .15s ease;
}
.voce:last-child { border-bottom: 0; }
button.voce:hover {
  background: linear-gradient(90deg, rgba(210,247,106,.10) 0%, rgba(236,246,222,.06) 45%, transparent 100%);
}
.voce .nome { font-weight: 600; letter-spacing: -.01em; }
/* I ruoli Mantra accanto al nome: si leggono a colpo d'occhio e non rubano
   la scena al nome, che resta la cosa che si cerca. */
.mantra {
  font-family: var(--numeri);
  font-size: 11px; font-weight: 600; letter-spacing: .04em;
  color: var(--lime); opacity: .8; white-space: nowrap;
}
.pillola.mantra-filtro { font-family: var(--numeri); min-width: 44px; }
.voce .dettaglio { font-size: 12.5px; color: var(--luce-fioca); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.voce .corpo { min-width: 0; flex: 1; }
.voce .coda { margin-left: auto; text-align: right; flex: none; display: flex; align-items: center; gap: 10px; }
.voce .prezzo { font-family: var(--display); font-weight: 700; font-size: 15px; letter-spacing: -.02em; }

.ruolo {
  width: 30px; height: 30px; flex: none; border-radius: 10px;
  display: grid; place-items: center; font-size: 12px; font-weight: 800;
  font-family: var(--numeri);
}
/* Un colore per reparto, tenuto basso di saturazione: nel buio le tinte
   accese si prendono l'attenzione che spetta ai numeri. */
.ruolo { box-shadow: 0 1px 0 rgba(255,255,255,.10) inset; }
.ruolo.P { background: linear-gradient(160deg, rgba(245,212,136,.30), rgba(245,212,136,.11)); color: #F7DC97; }
.ruolo.D { background: linear-gradient(160deg, rgba(140,186,255,.30), rgba(140,186,255,.10)); color: #A6CDFF; }
.ruolo.C { background: linear-gradient(160deg, rgba(210,247,106,.30), rgba(210,247,106,.10)); color: var(--lime); }
.ruolo.A { background: linear-gradient(160deg, rgba(255,164,140,.30), rgba(255,164,140,.10)); color: #FFB6A2; }

.targhetta {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 999px;
  border: 1px solid transparent; white-space: nowrap;
}
.targhetta.ok { background: var(--lime-fioco); color: var(--lime); }
.targhetta.forse { background: var(--avviso-tenue); color: var(--avviso); }
.targhetta.no { background: var(--allarme-tenue); color: var(--allarme); }
.targhetta.neutra { background: var(--vetro-alto); color: var(--luce-media); }
.targhetta.contratto { background: var(--vetro-alto); color: var(--luce-media); border-color: var(--bordo); }

/* ── Comandi ──────────────────────────────────────────────── */

.filtri { display: flex; flex-wrap: wrap; gap: 7px; margin: 13px 0; }

/* I dodici ruoli Mantra stanno su una riga sola che scorre col dito.
   A capo occupavano mezzo schermo, e sopra un elenco di 531 giocatori
   metà schermo di filtri è metà schermo tolto ai giocatori. */
.filtri.scorrevoli {
  flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none;
  margin: 0 -18px 11px; padding: 2px 18px;
  scroll-snap-type: x proximity;
  -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 17px, #000 calc(100% - 30px), transparent);
          mask-image: linear-gradient(90deg, transparent 0, #000 17px, #000 calc(100% - 30px), transparent);
}
.filtri.scorrevoli::-webkit-scrollbar { display: none; }
.filtri.scorrevoli .pillola { flex: none; scroll-snap-align: start; }
.pillola {
  border: 1px solid var(--bordo); background: var(--lucido), var(--vetro); color: var(--luce-media);

/* Una tabella di sette colonne dentro un telefono: o si accetta che

/* Da una certa larghezza in su la tabella ci sta tutta e non scorre: la

<script>
"use strict";

/* ═══════════════════════════════════════════════════════════════
   IL REGOLAMENTO, IN NUMERI

   Tutte le regole della lega stanno qui e da nessun'altra parte: il
   resto del codice le legge, non le contiene. Cambiare il tetto o la
   durata di un contratto è una riga in questo oggetto, non una caccia
   dentro le funzioni.
   ═══════════════════════════════════════════════════════════════ */

const REGOLE = {
  tetto: 85,                                  // milioni, art. 3.2
  rosaMin: 25, rosaMax: 30,
  /* Questa lega **non** impone minimi per ruolo: si può stare con un portiere
     solo, purché la rosa resti fra il minimo e il massimo. È una scelta di lega
     rispetto all'art. 3.1, ed è il motivo per cui il conteggio per ruolo qui
     sotto resta un'informazione e non un vincolo. */
  slotPluriennali: 9,                         // art. 3.3
  passo: 0.25,                                // gli importi si muovono di 0,25 M
  riservaPerSlotMancante: 0.5,                // art. 8.6
  etaAl: "1° settembre",                      // art. 4.2

  contratti: {
    ANNUALE:  { nome: "Annuale",  anni: [1],          slot: false, nota: "Un anno. Nessun requisito." },
    STANDARD: { nome: "Standard", anni: [2, 3],       slot: true,  tasso: 1.1, nota: "Due o tre anni, +10% ogni anno." },
    ROOKIE:   { nome: "Rookie",   anni: [2, 3, 4],    slot: true,  tasso: 1.0, etaMax: 22, ingaggioMax: 6,  nota: "Under 23 alla firma. Ingaggio invariato, max 6 M." },
    VETERAN:  { nome: "Veteran",  anni: [2],          slot: true,  tasso: 0.8, etaMin: 30, ingaggioMax: 10, nota: "Over 30 alla firma. −20% ogni anno, max 10 M." },
    TAMPONE:  { nome: "Tampone",  anni: [1],          slot: false, ingaggioMax: 1, maxStagione: 3, nota: "Quattro giornate, max 1 M. Tre a stagione." },
  },

  primavera: {
    etaMax: 20, quotazioneMax: 3, presenzeMax: 5,   // art. 16.1

    /**
     * IL DIRITTO DI PRELAZIONE
     *
     * Il vivaio esisteva come capienza e basta: si pagava per avere nove posti
     * e dentro non c'era niente. Adesso i giovani ci stanno davvero, e valgono
     * la cosa per cui un vivaio esiste — nessun altro te li può prendere.
     *
     * Un giovane in vivaio non percepisce ingaggio, non occupa tetto, non
     * occupa slot e non conta nella rosa: costa Capitale, non spazio. Ma è
     * tuo, e quando il campo dice che è pronto — dalla sesta presenza — tu
     * puoi tesserarlo a un prezzo che nessun altro avrebbe: la sua
     * quotazione, con un Rookie, senza consumare un'offerta di mercato.
     *
     * È la regola che trasforma «ho investito nel vivaio» da una riga di
     * bilancio a una storia: hai visto il diciottenne prima degli altri, te lo
     * sei tenuto, e adesso te lo prendi al prezzo di allora.
     */
    prelazione: { contratto: "ROOKIE", allaQuotazione: true },
  },

  /**
   * Lo svincolo.
   *
   * Chi taglia un giocatore se ne tiene l'ingaggio fino a fine stagione: è la
   * regola che rende una firma una decisione e non una casella da svuotare.
   * Su un pluriennale però quella è una strada sola, e una strada sola non è
   * una scelta: chi ha sbagliato un contratto da quattro anni non ha nessuna
   * mossa, e resta fermo a guardare.
   *
   * Da qui la seconda strada, presa dal football americano. Si spalma:
   * l'ingaggio si divide sugli anni che restavano, maggiorato di un quarto.
   * Liberi spazio adesso, e te lo porti dietro fino alla fine — che è
   * esattamente il tipo di decisione difficile che una lega dynasty vuole
   * avere. La penale è quel che impedisce che diventi la scelta ovvia.
   */
  svincolo: { penaleSpalmatura: 1.25 },

  /**
   * CHI LASCIA LA SERIE A
   *
   * Non è uno svincolo e non gli somiglia. Chi taglia un giocatore fa una
   * scelta, e se la paga fino a giugno; chi si vede portare via un giocatore
   * da un trasferimento all'estero non ha scelto niente. Tenergli l'ingaggio
   * addosso sarebbe una penale per un fatto che non dipende da lui — e
   * soprattutto punirebbe chi ha scovato il giovane bravo, che è esattamente
   * il comportamento che una lega dynasty vuole premiare.
   *
   * Quindi: esce dalla rosa, libera il tetto e il posto lo stesso giorno, e
   * si porta via anche l'eventuale peso morto che aveva lasciato. Lo dichiara
   * il commissioner, perché è un fatto che succede fuori dalla lega.
   */
  partenzaEstero: { liberaSubito: true },

  /**
   * LE OFFERTE AI GIOCATORI IN SCADENZA
   *
   * Durante l'anno si può offrire a un giocatore in scadenza di un'altra
   * squadra. L'offerta la vede solo il commissioner, che la riferisce alla
   * proprietaria: se lei pareggia con un prolungamento se lo tiene, se no a
   * fine stagione il giocatore cambia squadra.
   *
   * Il passaggio dal commissioner non è burocrazia: è quello che rende la
   * cosa un gioco. Chi riceve la notizia sa quanto gli offrono ma non da chi,
   * e deve decidere se pagare quella cifra a un giocatore che magari non
   * varrebbe tanto — sapendo che dall'altra parte qualcuno lo vuole davvero.
   * È la restricted free agency del football americano, e lì funziona da
   * quarant'anni per la stessa ragione.
   */
  offerteScadenza: {
    oreRisposta: 48,       // quanto ha la proprietaria per pareggiare
    perStagione: 3,        // quante se ne possono fare
  },

  /**
   * IL DRAFT
   *
   * La cosa che mancava. In una lega a dieci, da marzo in poi cinque squadre
   * non hanno più niente da giocarsi: senza un motivo per restare, quelle
   * cinque persone smettono di aprire l'applicazione, e una lega si sfalda
   * sempre da lì. Il draft è il motivo — chi arriva ultimo sceglie per primo.
   *
   * Le scelte sono oggetti: si posseggono, si scambiano, e valgono anche per
   * le stagioni che verranno. È quello che rende viva la seconda metà della
   * stagione anche per chi è fuori dai giochi, perché una squadra che non
   * vincerà ha comunque qualcosa da vendere a una che ci prova.
   *
   * A serpentina: chi sceglie ultimo al primo giro sceglie primo al secondo.
   * Senza, il primo della fila prende i tre migliori e il draft è già finito.
   */
  draft: {
    giri: 3,
    serpente: true,
    /* Al draft l'ingaggio non si tratta: è la quotazione del listone. Un
       draft in cui si contratta è un'asta, e l'asta la lega la fa già al
       tavolo, a settembre. */
    ingaggioAllaQuotazione: true,
  },

  /**
   * Le competizioni della lega (artt. 19-20).
   *
   * I premi in Capitale entrano nel conto societario e cambiano quello che una
   * squadra può costruire; quelli in denaro no — sono fra le persone, e il
   * software si limita a ricordarli, perché una lega che discute su chi doveva
   * quanto a fine stagione è una lega che litiga.
   */
  competizioni: [
    { id: "APERTURA", nome: "Dynasty Apertura", formato: "Girone unico, 18 giornate · dalla 3ª alla 20ª di Serie A",
      capitale: [27, 25, 23, 21, 19, 17, 15, 13, 12, 10], denaro: [130, 100, 70] },
    { id: "CLAUSURA", nome: "Dynasty Clausura", formato: "Girone unico, 18 giornate · dalla 21ª alla 38ª",
      capitale: [27, 25, 23, 21, 19, 17, 15, 13, 12, 10], denaro: [130, 100, 70] },
    { id: "CUP", nome: "Dynasty Cup", formato: "Due gironi, poi andata e ritorno",
      capitale: [15, 10, 7, 7, 5, 5, 5, 5], denaro: [75, 50] },
    { id: "SUPERCUP", nome: "Super Cup", formato: "Le prime quattro di Apertura e di Clausura",
      capitale: [7, 5, 3, 3], denaro: [25] },
    { id: "YOUTH", nome: "Dynasty Youth", formato: "Media voto dei primavera, più il bonus del vivaio",
      capitale: [5, 3, 1], denaro: [30, 15] },
  ],

  /* Art. 9-11 — il mercato. L'asta di settembre si fa al tavolo, non qui:
     quello che passa dall'applicazione è ciò che succede dopo. */
  mercato: {
    offertePerStagione: 5,       // art. 9.1
    oreFreeAgency: 24,           // art. 9.2
    oreWaiver: 48,               // art. 10.1
    oreAccettazioneScambio: 48,  // art. 11.1.3
    oreAnnullamentoScambio: 24,  // art. 11.1.3 — la finestra del commissioner
  },

  /* Il Capitale è l'altro conto della società, e non va confuso col tetto: il
     tetto è un limite agli ingaggi, il Capitale è denaro che si accumula e si
     investe. Nessuna operazione converte l'uno nell'altro (art. 14). */
  capitale: {
    dotazione: 40,                    // art. 14 — con cui parte ogni squadra
    gareInCasa: 19,
    operativoDallaGiornata: 20,       // art. 15.1 — sei mesi di cantiere

    /* Art. 15.2 — la manutenzione è il 10% della costruzione e l'incasso è per
       gara casalinga: a ogni livello il saldo annuo è positivo. Lo stadio è un
       investimento lento, non una tassa.

       I fantapunti in casa salgono di 0,3 per livello e non di 0,5: a mezzo
       punto a gara la Cattedrale valeva quarantasette punti a stagione, in una
       lega dove le squadre si separano per tre punti a giornata. E il vantaggio
       si compra col Capitale, che è il premio di chi ha già vinto — vince,
       incassa, costruisce, vince di più. Il freno va messo qui, dove il
       Capitale tocca il campo. */
    stadi: [
      { livello: 1, nome: "Comunale",        costruzione: 30,  manutenzione: 3,  incassoPerGara: 0.5, fantapunti: 0.5 },
      { livello: 2, nome: "Rinnovato",       costruzione: 60,  manutenzione: 6,  incassoPerGara: 0.9, fantapunti: 0.8 },

const SQUADRE_SERIE_A = LISTONE_GREZZO.squadre;
const STAGIONE = LISTONE_GREZZO.stagione;

/** Il listone in forma comoda, con un identificatore stabile per ogni
 *  giocatore: serve a legarlo ai contratti nel database. */
const ORDINE_MANTRA = LISTONE_GREZZO.mantra;

const LISTONE = LISTONE_GREZZO.righe.map((r, i) => ({
  id: "g" + i,
  nome: r[0],
  ruolo: r[1],
  squadra: SQUADRE_SERIE_A[r[2]],
  quotazione: r[3],
  valore: r[4],
  eta: r[5] === -1 ? null : r[5],
  /* I ruoli Mantra, nell'ordine del listone: dalla porta all'attacco. */
  mantra: (r[6] ?? []).map((i) => ORDINE_MANTRA[i]).filter(Boolean),
  /* L'identificativo di Leghe Fantacalcio: è la chiave con cui i loro file
     parlano dei giocatori. Riconoscerli per somiglianza di nome — «Thuram M.»
     contro «Thuram Marcus» — è un modo per sbagliare in silenzio. */
  lfc: r[7] || null,
}));

/** «E · W» — i ruoli Mantra come si scrivono accanto a un nome. */
const scriviMantra = (giocatore) => (giocatore.mantra ?? []).join(" · ");

const PER_ID = new Map(LISTONE.map((g) => [g.id, g]));
const PER_LFC = new Map(LISTONE.filter((g) => g.lfc).map((g) => [g.lfc, g]));

/**
 * Le quotazioni aggiornate.
 *
 * Il listone incorporato è quello di inizio stagione e non cambia mai; le
 * quotazioni invece si muovono ogni settimana, e qui contano — decidono chi è
 * idoneo al settore giovanile e quanto vale un giocatore in una trattativa.
 * Il commissioner carica il file di Leghe Fantacalcio e gli scostamenti
 * finiscono nel database, sopra il listone di partenza.
 */
function applicaAggiornamento(aggiornamento) {
  if (!aggiornamento) return;
  for (const [lfc, q] of Object.entries(aggiornamento.quotazioni ?? {})) {
    const g = PER_LFC.get(Number(lfc));
    if (g) g.quotazione = q;
  }
  for (const [lfc, ruoli] of Object.entries(aggiornamento.mantra ?? {})) {
    const g = PER_LFC.get(Number(lfc));
    if (g && ruoli.length) g.mantra = ruoli;
  }
  /* I giocatori arrivati dopo: nel listone di partenza non ci sono, e senza
     questo passaggio non si potrebbero né cercare né tesserare. */
  for (const nuovo of aggiornamento.nuovi ?? []) {
    if (PER_LFC.has(nuovo.lfc)) continue;
    const g = { ...nuovo, id: "n" + nuovo.lfc, valore: nuovo.valore ?? 0, eta: nuovo.eta ?? null };
    LISTONE.push(g);
    PER_ID.set(g.id, g);
    PER_LFC.set(g.lfc, g);
  }
}

/* ═══════════════════════════════════════════════════════════════
   ARITMETICA DEGLI INGAGGI

   Gli importi si contano in quarti di milione, in numeri interi. In
   virgola mobile 0.1 + 0.2 non fa 0.3, e un tetto salariale sbagliato
   di un centesimo è un tetto salariale sbagliato. Si torna ai milioni
   solo per scriverli a schermo.
   ═══════════════════════════════════════════════════════════════ */

const QUARTI = 4;
const aQuarti = (milioni) => Math.round(Number(milioni) * QUARTI);
const aMilioni = (quarti) => quarti / QUARTI;

/** «7,5 M» — con la virgola, come si scrive in italiano. */
function soldi(quarti, conUnita = true) {
  const m = aMilioni(quarti);
  const testo = Number.isInteger(m) ? String(m) : m.toFixed(2).replace(/0$/, "");
  return testo.replace(".", ",") + (conUnita ? " M" : "");
}

/* ═══════════════════════════════════════════════════════════════
   LE REGOLE, COME FUNZIONI

   Funzioni pure: prendono una rosa e restituiscono un giudizio. Non
   toccano il database e non disegnano niente, così si possono leggere
   una per una e verificare che dicano quello che dice il regolamento.
   ═══════════════════════════════════════════════════════════════ */

/** Quanto pesa un contratto sul tetto di quest'anno: il primo anno. */
const pesoAnnuale = (contratto) => contratto.ingaggio;

/** Il conto della rosa: speso, spazio, slot, composizione per ruolo. */
function contoRosa(contratti, pesiMorti = []) {
  const ingaggi = contratti.reduce((somma, c) => somma + pesoAnnuale(c), 0);
  /* Chi svincola non libera niente: l'ingaggio resta sul tetto fino a fine
     stagione. È la regola che rende il mercato una cosa seria — un contratto
     firmato è una decisione che si porta fino in fondo, non una casella da
     svuotare quando il giocatore delude. */
  const pesoMorto = pesiMorti.reduce((somma, x) => somma + x.ingaggio, 0);
  const speso = ingaggi + pesoMorto;
  const tetto = aQuarti(REGOLE.tetto);
  const perRuolo = { P: 0, D: 0, C: 0, A: 0 };
  for (const c of contratti) perRuolo[c.ruolo] = (perRuolo[c.ruolo] || 0) + 1;

  const slotUsati = contratti.filter((c) => REGOLE.contratti[c.tipo]?.slot).length;

  const postiDaRiempire = Math.max(0, REGOLE.rosaMin - contratti.length);

  return {
    numero: contratti.length,
    ingaggi,
    pesoMorto,
    speso,
    tetto,
    spazio: tetto - speso,
    sforato: speso > tetto,
    perRuolo,
    postiDaRiempire,
    slotUsati,
    slotLiberi: REGOLE.slotPluriennali - slotUsati,
    /* Art. 8.6 — quanto va tenuto da parte per poter completare la rosa
       minima. Senza questa riserva una squadra spende tutto su tre nomi
       e poi non può più tesserare un portiere. */
    riserva: aQuarti(postiDaRiempire * REGOLE.riservaPerSlotMancante),
  };
}

 */
function perchéNo({ giocatore, tipo, ingaggio, ingaggioScritto, anni, conto, contrattiTampone }) {
  const regola = REGOLE.contratti[tipo];
  const no = [];
  if (!regola) return ["Questo tipo di contratto non esiste."];

  if (!Number.isFinite(ingaggio) || ingaggio <= 0) no.push("Manca l'ingaggio.");
  /* Il passo va controllato sull'importo come è stato scritto: `aQuarti`
     arrotonda, e dopo l'arrotondamento 3,30 M è indistinguibile da 3,25 M. */
  if (ingaggioScritto != null && Math.abs(ingaggioScritto * 4 - Math.round(ingaggioScritto * 4)) > 1e-9) {
    no.push(`Gli ingaggi si muovono a passi di 0,25 M: ${soldi(ingaggio)} è il più vicino.`);
  }
  if (!regola.anni.includes(anni)) {
    no.push(`Un ${regola.nome} dura ${regola.anni.join(" o ")} ${regola.anni.length === 1 && regola.anni[0] === 1 ? "anno" : "anni"}.`);
  }

  const eta = etaAllaFirma(giocatore);
  if (regola.etaMax != null) {
    if (eta == null) no.push(`Il ${regola.nome} dipende dall'età, e del giocatore non la conosciamo.`);
    else if (eta > regola.etaMax) no.push(`Il ${regola.nome} è per gli Under ${regola.etaMax + 1}: ne ha ${eta} al ${REGOLE.etaAl}.`);
  }
  if (regola.etaMin != null) {
    if (eta == null) no.push(`Il ${regola.nome} dipende dall'età, e del giocatore non la conosciamo.`);
    else if (eta < regola.etaMin) no.push(`Il ${regola.nome} è per gli Over ${regola.etaMin}: ne ha ${eta} al ${REGOLE.etaAl}.`);
  }
  if (regola.ingaggioMax != null && ingaggio > aQuarti(regola.ingaggioMax)) {
    no.push(`Un ${regola.nome} non supera ${regola.ingaggioMax} M.`);
  }
  if (regola.slot && conto.slotLiberi < 1) {
    no.push(`Gli slot pluriennali sono finiti: ne sono ammessi ${REGOLE.slotPluriennali}.`);
  }
  if (tipo === "TAMPONE" && contrattiTampone >= regola.maxStagione) {
    no.push(`I contratti Tampone sono ${regola.maxStagione} a stagione, e sono già stati usati.`);
  }
  if (conto.numero >= REGOLE.rosaMax) {
    no.push(`La rosa è al massimo: ${REGOLE.rosaMax} giocatori.`);
  }

  /* Il tetto, e la riserva per completare la rosa. Il posto che si sta
     riempiendo adesso non conta più fra quelli da riempire. */
  const postiDopo = Math.max(0, REGOLE.rosaMin - (conto.numero + 1));
  const riservaDopo = aQuarti(postiDopo * REGOLE.riservaPerSlotMancante);
  const spazioDopo = conto.spazio - ingaggio;
  if (spazioDopo < 0) {
    no.push(`Sfora il tetto di ${soldi(-spazioDopo)}: lo spazio è ${soldi(conto.spazio)}.`);
  } else if (spazioDopo < riservaDopo) {
    no.push(
      `Restano ${soldi(spazioDopo)}, ma servono almeno ${soldi(riservaDopo)} ` +
      `per completare la rosa (${postiDopo} posti × ${String(REGOLE.riservaPerSlotMancante).replace(".", ",")} M).`,
    );
  }
  return no;
}

/* ── Gli scambi (art. 11.1) ───────────────────────────────── */

/**
 * Come resterebbe una rosa dopo uno scambio.
 *
 * Si scambiano giocatori **con il loro contratto** e Capitale, mai spazio
 * salariale (art. 11.1.1): l'ingaggio viaggia con il giocatore, e la squadra
 * che lo riceve se lo prende com'è.
 */
function rosaDopoScambio(squadraId, cede, riceve) {
  const restano = rosaDi(squadraId).filter((c) => !cede.includes(c.giocatoreId));
  return [...restano, ...riceve];
}

/**
 * Perché lo scambio non si può fare — su **entrambi i lati** (art. 11.1.2).
 *
 * Validare un lato solo sarebbe peggio che non validare: farebbe passare la
 * proposta e lascerebbe l'altra squadra a scoprire il problema quando ormai
 * ha accettato. Qui la proposta non parte proprio, e dice di chi è il guaio.
 */
function perchéNoScambio({ daId, aId, cedeDa, cedeA, capitaleDa, capitaleA }) {
  const no = [];
  const nomeDa = squadraDi(daId)?.nome ?? "la prima squadra";
  const nomeA = squadraDi(aId)?.nome ?? "l'altra squadra";

  if (!cedeDa.length && !cedeA.length && !capitaleDa && !capitaleA) {
    return ["Lo scambio è vuoto: metti almeno un giocatore o del Capitale."];
  }

  const contrattiDa = rosaDi(daId);
  const contrattiA = rosaDi(aId);
  const pacchettoDa = contrattiDa.filter((c) => cedeDa.includes(c.giocatoreId));
  const pacchettoA = contrattiA.filter((c) => cedeA.includes(c.giocatoreId));

  for (const [nome, rosaNuova, pesi] of [
    [nomeDa, rosaDopoScambio(daId, cedeDa, pacchettoA), pesiMortiDi(daId)],
    [nomeA, rosaDopoScambio(aId, cedeA, pacchettoDa), pesiMortiDi(aId)],
  ]) {
    const conto = contoRosa(rosaNuova, pesi);
    if (conto.sforato) no.push(`${nome} sforerebbe il tetto di ${soldi(conto.speso - conto.tetto)}.`);
    if (conto.numero > REGOLE.rosaMax) no.push(`${nome} arriverebbe a ${conto.numero} giocatori, oltre i ${REGOLE.rosaMax}.`);
    if (conto.slotLiberi < 0) no.push(`${nome} avrebbe ${conto.slotUsati} contratti pluriennali, oltre i ${REGOLE.slotPluriennali}.`);
    /* Nessun controllo sui ruoli: in questa lega la composizione della rosa la
       decide il presidente, e uno scambio che lo lascia con un portiere solo è
       una sua scelta, non un errore da impedire. */
  }

  if (capitaleDa > societaDi(daId).capitale) no.push(`${nomeDa} non ha ${soldi(capitaleDa)} di Capitale.`);
  if (capitaleA > societaDi(aId).capitale) no.push(`${nomeA} non ha ${soldi(capitaleA)} di Capitale.`);

  return no;
}

/* ── L'economia della società (artt. 14-17) ───────────────── */

/** Lo stadio a un certo livello. Livello 0 = non c'è ancora. */
const stadioAl = (livello) => REGOLE.capitale.stadi.find((s) => s.livello === livello) ?? null;

/** Il conto annuo dello stadio: quanto incassa, quanto costa, quanto resta. */
function contoStadio(livello) {
  const s = stadioAl(livello);
  if (!s) return null;
  const incasso = s.incassoPerGara * REGOLE.capitale.gareInCasa;
  return { ...s, incasso, netto: incasso - s.manutenzione, rientro: s.costruzione / (incasso - s.manutenzione) };
}

/**
 * Quanto costa passare da un livello all'altro (art. 15.2).
 *
 * Si sale **un livello alla volta** pagando la differenza fra i due costi di
 * costruzione. Per saltare un livello si demolisce e si ricostruisce da zero,
 * e allora si paga tutto: è la ragione per cui conviene pianificare invece di
 * rincorrere.
 */
function costoSalto(da, a) {
  const arrivo = stadioAl(a);
  if (!arrivo) return null;
  if (a === da + 1) return { costo: arrivo.costruzione - (stadioAl(da)?.costruzione ?? 0), ricostruzione: false };
  return { costo: arrivo.costruzione, ricostruzione: true };
}

/** Il gradino del settore giovanile che tiene una certa capienza. */
const giovanileDa = (capienza) =>
  REGOLE.capitale.giovanile.find((g) => g.capienza === capienza) ?? REGOLE.capitale.giovanile[0];

/** Quanto costa ampliare il settore giovanile da una capienza alla successiva. */
function costoAmpliamento(capienzaAttuale) {
  const indice = REGOLE.capitale.giovanile.findIndex((g) => g.capienza === capienzaAttuale);
  const prossimo = REGOLE.capitale.giovanile[indice + 1];
  if (!prossimo) return null;
  return { ...prossimo, costo: prossimo.investimento - giovanileDa(capienzaAttuale).investimento };
}

/** Il mantenimento che la società paga ogni anno: stadio più settore giovanile. */
function manutenzioneAnnua(societa) {
  const stadio = stadioAl(societa.stadio)?.manutenzione ?? 0;
  const giovanile = giovanileDa(societa.capienzaGiovanile).mantenimento;
  return aQuarti(stadio + giovanile);
}

/**
 * Idoneità al settore giovanile (art. 16.1).
 *
 * Tre requisiti — età, presenze in Serie A, quotazione — che la lega
 * possiede in momenti diversi. Età e quotazione arrivano col listone il
 * primo giorno; le presenze della stagione precedente, alla prima
 * stagione, non esistono e nessuno può darle a posteriori.
 *
 * Perciò la risposta non è sì o no: è sì, no, oppure «non ancora». Dire
 * «non idoneo» a un ragazzo di diciotto anni perché manca un dato
 * sarebbe una bugia comoda; dire «idoneo» sarebbe una bugia pericolosa.
 */
function primavera(giocatore) {
  const motivi = [];
  if (giocatore.quotazione > REGOLE.primavera.quotazioneMax) {
    motivi.push(`quotato ${giocatore.quotazione} M, oltre i ${REGOLE.primavera.quotazioneMax} M`);
  }
  if (giocatore.eta != null && giocatore.eta > REGOLE.primavera.etaMax) {
    motivi.push(`ha ${giocatore.eta} anni, oltre i ${REGOLE.primavera.etaMax}`);
  }
  if (motivi.length) return { stato: "no", motivo: motivi.join("; ") };
  if (giocatore.eta == null) return { stato: "forse", motivo: "manca la sua età" };
  return { stato: "forse", motivo: "mancano le presenze della stagione precedente" };
}

/* ═══════════════════════════════════════════════════════════════
   LO STATO CONDIVISO

   Quello che cambia — squadre, rose, registro — vive nel database
   dell'artifact: dieci persone lo leggono e lo scrivono insieme, e
   ognuno vede le mosse degli altri mentre accadono. Non c'è un server
   da tenere acceso e non c'è niente da configurare.

   Struttura:
     lega/config          nome della lega, stagione, fase
     squadre/<id>         nome, sigla, colore, presidente, PIN
     rose/<id>            i contratti di quella squadra
     registro/<id>        una riga per operazione
   ═══════════════════════════════════════════════════════════════ */

let db = null;

const stato = {
  pronto: false,
  config: null,
  squadre: [],
  rose: new Map(),
  societa: new Map(),
  mercato: [],
  scambi: [],
  draft: new Map(),
  offerte: [],
  albo: [],
  aggiornamentoListone: null,
  esitoQuotazioni: null,   // il risultato dell'ultimo import, che deve sopravvivere al ridisegno
  registro: [],
  io: null,                // { ruolo: "commissioner" | "presidente", squadraId }
  vista: "lega",
  errore: null,
};

const CHIAVE_IO = "dynasty-league-io";

function ricordaIo(io) {
  stato.io = io;
  try { localStorage.setItem(CHIAVE_IO, JSON.stringify(io)); } catch { /* finestra privata: pazienza */ }
}
function dimenticaIo() {
  stato.io = null;
  try { localStorage.removeItem(CHIAVE_IO); } catch { /* niente */ }
}
function riprendiIo() {
  try {
    const salvato = localStorage.getItem(CHIAVE_IO);
    if (salvato) stato.io = JSON.parse(salvato);
  } catch { stato.io = null; }
}

/** La rosa di una squadra, sempre un array (anche se il documento non c'è). */
const rosaDi = (squadraId) => stato.rose.get(squadraId)?.contratti ?? [];

/**
 * Quanto pesa e per quanto un giocatore svincolato.
 *
 * `secco` è la regola di sempre: l'ingaggio intero, questa stagione e basta.
 * `spalmato` esiste solo per i pluriennali e divide l'ingaggio sugli anni che
 * restavano, con un quarto di penale. Gli importi si arrotondano al quarto di
 * milione per eccesso, come tutto il resto della lega.
 */
function modiSvincolo(contratto) {
  const secco = { modo: "secco", ingaggio: contratto.ingaggio, anni: 1,
                  totale: contratto.ingaggio };
  const residui = Number(contratto.anni) || 1;
  if (residui < 2) return { secco, spalmato: null };
  const totale = Math.ceil(contratto.ingaggio * REGOLE.svincolo.penaleSpalmatura);
  const spalmato = { modo: "spalmato", ingaggio: Math.ceil(totale / residui),
                     anni: residui, totale };
  return { secco, spalmato };
}

/**
 * Tutti quelli che oggi pesano sul tetto di qualcuno: in rosa o come peso
 * morto. Sono le due categorie che una partenza per l'estero cancella.
 *
 * La chiave è «squadra|giocatore|dove», perché lo stesso nome può stare in
 * rosa da una parte e pesare da svincolato da un'altra.
 */
function tesseratiEsvincolati() {
  const fuori = [];
  for (const sq of stato.squadre) {
    for (const c of rosaDi(sq.id))
      fuori.push({ chiave: `${sq.id}|${c.giocatoreId}|rosa`, squadraId: sq.id,
                   squadra: sq.nome, nome: c.nome, ingaggio: c.ingaggio, pesoMorto: false });
    for (const x of pesiMortiDi(sq.id))
      fuori.push({ chiave: `${sq.id}|${x.giocatoreId}|peso`, squadraId: sq.id,
                   squadra: sq.nome, nome: x.nome, ingaggio: x.ingaggio, pesoMorto: true });
  }
  return fuori.sort((a, b) => a.nome.localeCompare(b.nome));
}

/* ── Le offerte ai giocatori in scadenza ──────────────────────────
   La restricted free agency: si offre a un giocatore di un altro, e la
   sua squadra decide se pareggiare. Il passaggio dal commissioner tiene
   segreto chi ha offerto, che è metà del gioco. */

/**
 * È in scadenza?
 *
 * Oggi vuol dire «contratto di un anno»: gli annuali finiscono a giugno e
 * i pluriennali no. Quando l'applicazione saprà far passare le stagioni,
 * questa funzione guarderà gli anni che restano invece di quelli firmati —
 * ed è l'unico punto da cambiare, che è la ragione per cui esiste.
 */
const inScadenza = (contratto) => contratto.tipo !== "TAMPONE" && Number(contratto.anni) === 1;

/** I giocatori in scadenza di tutte le squadre tranne una. */
function inScadenzaAltrui(esclusa) {
  const fuori = [];
  for (const sq of stato.squadre) {
    if (sq.id === esclusa) continue;
    for (const c of rosaDi(sq.id)) if (inScadenza(c)) fuori.push({ ...c, squadraId: sq.id, squadra: sq.nome });
  }
  return fuori.sort((a, b) => b.ingaggio - a.ingaggio);
}

/** Le offerte vive su un giocatore: una alla volta, per non fare l'asta. */
const offertaSu = (giocatoreId) =>
  stato.offerte.find((o) => o.giocatoreId === giocatoreId &&
    ["SEGRETA", "RIFERITA"].includes(o.stato)) ?? null;

/** Quante ne ha già presentate questa squadra in questa stagione. */
const offerteFatteDa = (squadraId) =>
  stato.offerte.filter((o) => o.daChi === squadraId && o.stagione === STAGIONE &&
    o.stato !== "RITIRATA").length;

/**
 * La proprietaria può pareggiare? L'elenco dei motivi per cui no.
 *
 * Pareggiare vuol dire riscrivere il contratto alle condizioni offerte, e
 * il costo si sente da subito. È la versione prudente — nel football il
 * prolungamento partirebbe l'anno dopo — ma finché l'applicazione non sa
 * far passare le stagioni è anche l'unica onesta: un impegno che non pesa
 * su nessun bilancio non è un impegno.
 */
function perchéNoPareggio(offerta) {
  const contratto = rosaDi(offerta.proprietaria).find((c) => c.giocatoreId === offerta.giocatoreId);
  if (!contratto) return ["Il giocatore non è più in rosa."];
  const g = PER_ID.get(offerta.giocatoreId);
  /* Il conto si fa come se il vecchio contratto non ci fosse: si sostituisce,
     non si somma. */
  const senzaDiLui = rosaDi(offerta.proprietaria).filter((c) => c.giocatoreId !== offerta.giocatoreId);
  const conto = contoRosa(senzaDiLui, pesiMortiDi(offerta.proprietaria));
  return perchéNo({
    giocatore: g, tipo: offerta.tipo, ingaggio: offerta.ingaggio,
    ingaggioScritto: aMilioni(offerta.ingaggio), anni: offerta.anni, conto,
    contrattiTampone: senzaDiLui.filter((c) => c.tipo === "TAMPONE").length,
  });
}

/* ── Il draft ─────────────────────────────────────────────────────
   Un documento per stagione, con dentro le sue scelte. Le scelte sono
   un array e non una collezione a parte: sono trenta, si leggono e si
   riscrivono sempre insieme, e trenta documenti per una cosa che si
   guarda tutta in un colpo sono trenta documenti di troppo. */

/** «2027/28» → «2027-28», che è un identificativo e non un percorso. */
const idDraft = (stagione) => String(stagione).replace("/", "-");

/** I draft dal più recente al più vecchio. */
const draftDellaLega = () =>
  [...stato.draft.values()].sort((a, b) => String(b.stagione).localeCompare(String(a.stagione)));

/** Quello su cui si sta scegliendo adesso, se c'è. */
const draftAperto = () => draftDellaLega().find((d) => d.stato === "APERTO") ?? null;

/**
 * A chi tocca. È la prima scelta non ancora usata in ordine di numero — e
 * `null` quando sono finite, che è anche il modo in cui il draft sa di
 * essere finito.
 */
function turnoDi(draft) {
  if (!draft || draft.stato !== "APERTO") return null;
  return [...(draft.scelte ?? [])]
    .filter((x) => x.numero != null && !x.giocatoreId)
    .sort((a, b) => a.numero - b.numero)[0] ?? null;
}

/**
 * Il turno di draft che è mio adesso, se lo è.
 *
 * Vale solo mentre si guarda la pagina del draft: altrove la firma è
 * quella normale, con l'ingaggio libero, e un turno che si porta dietro
 * il prezzo bloccato in tutte le pagine sarebbe una trappola.
 */
function mioTurnoAlDraft() {
  if (stato.vista !== "draft") return null;
  const mia = squadraCorrente();
  if (!mia || !possoToccare(mia.id)) return null;
  const d = draftAperto();
  const t = turnoDi(d);
  return t && t.diChi === mia.id ? { draft: d.id, numero: t.numero, stagione: d.stagione } : null;
}

/** Le scelte che una squadra possiede, in tutti i draft non ancora chiusi. */
function sceltePosseduteDa(squadraId) {
  const fuori = [];
  for (const d of draftDellaLega()) {
    if (d.stato === "CHIUSO") continue;
    for (const x of d.scelte ?? []) {
      if (x.diChi === squadraId && !x.giocatoreId) fuori.push({ ...x, draft: d.id, stagione: d.stagione });
    }
  }
  return fuori.sort((a, b) =>
    String(a.stagione).localeCompare(String(b.stagione)) || a.giro - b.giro || (a.numero ?? 99) - (b.numero ?? 99));
}

/** Le scelte di uno scambio, come targhette da mettere nel riepilogo. */
function nomiScelte(chiavi) {
  if (!chiavi?.length) return "";
  return chiavi.map((chiave) => {
    const [draftId, giro, origine] = String(chiave).split("|");
    const d = stato.draft.get(draftId);
    const suo = squadraDi(origine);
    return `<br><span class="targhetta ok">${giro}º giro ${pulito(d?.stagione ?? draftId)}${
      suo ? ` · ${pulito(suo.nome)}` : ""}</span>`;
  }).join("");
}

/** Come si chiama una scelta quando se ne parla: «1º giro 2027/28 (da Torre Nera)». */
function nomeScelta(x) {
  const origine = squadraDi(x.origine);
  const suo = x.origine === x.diChi;
  return `${x.giro}º giro ${x.stagione}${x.numero != null ? ` · n. ${x.numero}` : ""}` +
         (suo || !origine ? "" : ` (da ${origine.nome})`);
}

/**
 * L'ordine del draft: l'inverso della classifica.
 *
 * Si somma il piazzamento in Apertura e in Clausura dell'ultima stagione
 * che ha entrambi i verdetti, e si va dal peggiore al migliore. Se l'albo
 * è vuoto — la prima stagione lo è sempre — resta l'ordine d'iscrizione,
 * che è arbitrario ma almeno è scritto da qualche parte.
 */
function ordineInverso() {
  const perStagione = new Map();
  for (const v of stato.albo ?? []) {
    if (!["APERTURA", "CLAUSURA"].includes(v.competizione)) continue;
    if (!perStagione.has(v.stagione)) perStagione.set(v.stagione, []);
    perStagione.get(v.stagione).push(v);
  }
  const complete = [...perStagione.entries()]
    .filter(([, v]) => v.length >= 2)
    .sort((a, b) => String(b[0]).localeCompare(String(a[0])));

  if (!complete.length) return stato.squadre.map((s) => s.id);

  const punti = new Map(stato.squadre.map((s) => [s.id, 0]));
  for (const v of complete[0][1])
    v.classifica.forEach((riga, i) => punti.set(riga.squadraId, (punti.get(riga.squadraId) ?? 0) + i + 1));
  /* Somma alta = piazzamenti bassi = si sceglie prima. */
  return [...punti.entries()].sort((a, b) => b[1] - a[1]).map(([id]) => id);
}

/** Gli ingaggi di chi è stato svincolato: pesano sul tetto fino a fine stagione. */
const pesiMortiDi = (squadraId) => stato.rose.get(squadraId)?.pesiMorti ?? [];

/* ── Il vivaio ────────────────────────────────────────────────────
   I giovani stanno nel documento della rosa, accanto ai contratti e ai
   pesi morti: sono la terza cosa che una squadra possiede, e tenerli in
   una collezione a parte vorrebbe dire due letture per disegnare una
   pagina che li mostra insieme. */

/** I giovani che una squadra tiene in vivaio. */
const vivaioDi = (squadraId) => stato.rose.get(squadraId)?.vivaio ?? [];

/** Chi ha in vivaio questo giocatore, se qualcuno ce l'ha. */
function inVivaioDi(giocatoreId) {
  for (const sq of stato.squadre)
    if (vivaioDi(sq.id).some((x) => x.giocatoreId === giocatoreId)) return sq.id;
  return null;
}

/**
 * Si può mettere in vivaio? L'elenco dei motivi per cui no.
 *
 * I posti sono quelli comprati con il Capitale: il vivaio è l'unica cosa
 * della società che limita davvero le mosse di mercato, ed è giusto che
 * sia così — è per quello che lo si amplia.
 */
function perchéNoVivaio(giocatore, squadraId) {
  const motivi = [];
  const p = primavera(giocatore);
  if (p.stato === "no") motivi.push(`Non è idoneo al vivaio: ${p.motivo}.`);
  const posti = giovanileDa(societaDi(squadraId).capienzaGiovanile).capienza;
  const dentro = vivaioDi(squadraId).length;
  if (dentro >= posti)
    motivi.push(`Il vivaio è pieno: ${dentro} su ${posti} posti. Amplialo dalla pagina Società.`);
  if (tesserati().has(giocatore.id)) motivi.push("È già sotto contratto con qualcuno.");
  const altro = inVivaioDi(giocatore.id);
  if (altro && altro !== squadraId) motivi.push(`È già nel vivaio di ${squadraDi(altro)?.nome ?? "un'altra squadra"}.`);
  return motivi;
}

/* ── L'albo d'oro ──────────────────────────────────────────── */

/** Il verdetto di una competizione in una stagione, se è già stato scritto. */
const verdettoDi = (stagione, competizione) =>
  stato.albo.find((a) => a.stagione === stagione && a.competizione === competizione) ?? null;

/** Le stagioni di cui l'albo conserva qualcosa, dalla più recente. */
const stagioniDellAlbo = () =>
  [...new Set([STAGIONE, ...stato.albo.map((a) => a.stagione)])].sort().reverse();

/**
 * Quante volte ogni squadra ha vinto qualcosa.
 *
 * Conta i nomi, non gli identificativi: una squadra che cambia presidente o si
 * ritira resta nell'albo con il nome che aveva quando ha vinto, ed è giusto
 * così — l'albo racconta cos'è successo, non chi c'è adesso.
 */
function bacheca() {
  const conteggio = new Map();
  for (const verdetto of stato.albo) {
    const primo = verdetto.classifica?.[0];
    if (!primo) continue;
    const riga = conteggio.get(primo.nome) ?? { nome: primo.nome, totale: 0, per: {} };
    riga.totale += 1;
    riga.per[verdetto.competizione] = (riga.per[verdetto.competizione] ?? 0) + 1;
    conteggio.set(primo.nome, riga);
  }
  return [...conteggio.values()].sort((a, b) => b.totale - a.totale || a.nome.localeCompare(b.nome, "it"));
}

/** Il conto di una squadra, ingaggi e pesi morti insieme. */
const contoDi = (squadraId) => contoRosa(rosaDi(squadraId), pesiMortiDi(squadraId));

const squadraDi = (id) => stato.squadre.find((s) => s.id === id) ?? null;

/** Il conto societario di una squadra. Una squadra appena iscritta ha la
 *  dotazione dell'art. 14, nessuno stadio e la capienza base del vivaio. */
function societaDi(squadraId) {
  const salvata = stato.societa.get(squadraId);
  return {
    capitale: salvata?.capitale ?? aQuarti(REGOLE.capitale.dotazione),
    stadio: salvata?.stadio ?? 0,
    capienzaGiovanile: salvata?.capienzaGiovanile ?? REGOLE.capitale.giovanile[0].capienza,
    osservatori: salvata?.osservatori ?? [],
    movimenti: salvata?.movimenti ?? [],
  };
}

/** La squadra su cui sto lavorando: la mia, o quella che il commissioner ha scelto. */
function squadraCorrente() {
  if (!stato.io) return null;
  if (stato.io.ruolo === "presidente") return squadraDi(stato.io.squadraId);
  return squadraDi(stato.squadraScelta ?? stato.squadre[0]?.id) ?? null;
}

const sonoCommissioner = () => stato.io?.ruolo === "commissioner";

/**
 * In che momento della stagione siamo.
 *
 * `COMPOSIZIONE` è il giorno dopo l'asta, che si fa al tavolo: si scrivono in
 * fretta i venticinque nomi con la cifra segnata a matita, e chiedere una busta
 * chiusa per ognuno sarebbe assurdo. `MERCATO` è tutto il resto della stagione:
 * lì un giocatore libero se lo contendono in più squadre, e passa dalle buste.
 */
const fase = () => stato.config?.fase ?? "COMPOSIZIONE";

/**
 * La lega chiede un codice per entrare?
 *
 * Di norma no: chi ha il link tocca la sua squadra ed è dentro. Fra dieci
 * amici il codice non difendeva granché — chiunque avesse il link poteva
 * leggere tutta la lega comunque — e in cambio costava una scocciatura a
 * ognuno, ogni volta, dal telefono. Chi preferisce tenerlo lo riaccende dal
 * pannello: allora serve a non entrare per sbaglio nella squadra di un altro.
 */
const serveIlCodice = () => stato.config?.chiediCodice === true;
const siamoAlMercato = () => fase() === "MERCATO";

/** Posso muovere questa rosa? Il presidente la propria, il commissioner tutte. */
const possoToccare = (squadraId) =>
  sonoCommissioner() || (stato.io?.ruolo === "presidente" && stato.io.squadraId === squadraId);

/** Tutti i giocatori sotto contratto, con la squadra che li ha. */
function tesserati() {
  const mappa = new Map();
  for (const [squadraId, rosa] of stato.rose) {
    for (const c of rosa.contratti ?? []) mappa.set(c.giocatoreId, squadraId);
    /* Anche i giovani in vivaio: è in questa riga che vive il diritto di
       prelazione. Non c'è nessun altro controllo da nessuna parte — chi è
       nel vivaio di qualcuno semplicemente non compare mai come libero. */
    for (const g of rosa.vivaio ?? []) mappa.set(g.giocatoreId, squadraId);
  }
  return mappa;
}

/* ── Il tempo del mercato ─────────────────────────────────── */

/**
 * Le scadenze si risolvono quando qualcuno apre la pagina, non con un
 * processo che gira di notte.
 *
 * Per una lega di dieci persone basta, e ha una proprietà che conta più della
 * puntualità: l'esito dipende solo dall'orario di scadenza scritto nel
 * documento, non da chi guarda né da quando. Chi apre per primo non vince
 * niente — si limita a far succedere una cosa che era già decisa.
 */
let staRisolvendo = false;

async function risolviScadenze() {
  if (staRisolvendo || !db || !stato.io) return;
  const adesso = Date.now();

  const scadute = stato.mercato.filter((m) => m.stato === "APERTA" && Date.parse(m.scadeIl) <= adesso);
  const scambiScaduti = stato.scambi.filter((s) => s.stato === "PROPOSTO" && Date.parse(s.scadeIl) <= adesso);
  /* Chi non pareggia entro il tempo perde il giocatore: non subito, a fine
     stagione. Il silenzio è una risposta anche qui. */
  const offerteScadute = stato.offerte.filter((o) => o.stato === "RIFERITA" && Date.parse(o.scadeIl) <= adesso);
  if (!scadute.length && !scambiScaduti.length && !offerteScadute.length) return;

  staRisolvendo = true;
  try {
    for (const trattativa of scadute) await chiudiTrattativa(trattativa);
    for (const scambio of scambiScaduti) {
      await db.collection("scambi").doc(scambio.id).set({ ...scambio, stato: "SCADUTO" });
      await annota("scambio", `Proposta di scambio scaduta senza risposta`, scambio.da);
    }
    for (const o of offerteScadute) {
      await db.collection("offerte").doc(o.id).set({ ...o, stato: "VINTA", chiusa: new Date().toISOString() });
      await annota("offerta",
        `${squadraDi(o.proprietaria)?.nome} non pareggia per ${o.nome}: a fine stagione cambia squadra`,
        o.proprietaria);
    }
  } catch (e) {
    console.warn("scadenze non risolte", e);
  } finally {
    staRisolvendo = false;
  }
}

/**
 * Chi vince un'offerta (art. 9.3-9.4).
 *
 * Vince l'ingaggio più alto; a parità la durata maggiore; a parità ancora la
 * squadra **peggio piazzata** in classifica. Quest'ultimo criterio è
 * rovesciato rispetto ai regolamenti vecchi, dove vinceva chi stava meglio:
 * dare la precedenza a chi va male è il modo delle leghe americane di non far
 * scappare via i primi.
 */
function vincitoreFra(offerte) {
  if (!offerte.length) return null;
  return [...offerte].sort((a, b) =>
    b.ingaggio - a.ingaggio ||
    b.anni - a.anni ||
    (posizioneDi(b.squadraId) - posizioneDi(a.squadraId))
  )[0];
}

/** La posizione in classifica, o l'ordine di iscrizione se non c'è ancora. */
const posizioneDi = (squadraId) =>
  squadraDi(squadraId)?.posizione ?? squadraDi(squadraId)?.ordine ?? 99;

/** Chiude una trattativa scaduta e, se qualcuno ha offerto, assegna. */
async function chiudiTrattativa(trattativa) {
  const valide = (trattativa.offerte ?? []).filter((o) => {
    /* Un'offerta fatta ieri può essere diventata impossibile: la squadra ha
       riempito la rosa o speso lo spazio. Si scarta, non si forza. */
    const conto = contoDi(o.squadraId);
    const g = PER_ID.get(trattativa.giocatoreId);
    if (!g) return false;
    return perchéNo({
      giocatore: g, tipo: o.tipo, ingaggio: o.ingaggio, ingaggioScritto: aMilioni(o.ingaggio),
      anni: o.anni, conto, contrattiTampone: rosaDi(o.squadraId).filter((c) => c.tipo === "TAMPONE").length,
    }).length === 0;
  });

  const vince = vincitoreFra(valide);
  await db.collection("mercato").doc(trattativa.id).set({
    ...trattativa, stato: "CHIUSA", chiusaIl: new Date().toISOString(),
    vincitore: vince?.squadraId ?? null,
    scartate: (trattativa.offerte ?? []).length - valide.length,
  });

  if (!vince) {
    await annota("mercato", `${trattativa.nome}: nessuna offerta valida, resta libero`, null);
    return;
  }

  const g = PER_ID.get(trattativa.giocatoreId);
  const squadra = squadraDi(vince.squadraId);
  await scriviRosa(vince.squadraId, [...rosaDi(vince.squadraId), {
    giocatoreId: g.id, nome: g.nome, ruolo: g.ruolo,
    tipo: vince.tipo, anni: vince.anni, ingaggio: vince.ingaggio,
    firmato: new Date().toISOString(),
  }]);
  await annota("mercato",
    `${g.nome} va a ${squadra?.nome ?? "—"} per ${soldi(vince.ingaggio)} × ${vince.anni} ` +
    `${vince.anni === 1 ? "anno" : "anni"} (${(trattativa.offerte ?? []).length} offerte)`,
    vince.squadraId);
}

/** Quante offerte ha già speso una squadra in questa stagione (art. 9.1). */
const offerteSpeseDa = (squadraId) =>
  stato.mercato.filter((m) => (m.offerte ?? []).some((o) => o.squadraId === squadraId)).length;

/** Il giocatore è già in trattativa? Non se ne aprono due sullo stesso. */
const trattativaAperta = (giocatoreId) =>
  stato.mercato.find((m) => m.stato === "APERTA" && m.giocatoreId === giocatoreId) ?? null;

/** Quanto manca, detto come lo direbbe una persona. */
function fraQuanto(scadenza) {
  const minuti = Math.max(0, Math.round((Date.parse(scadenza) - Date.now()) / 60000));
  if (minuti < 1) return "sta per chiudersi";
  if (minuti < 60) return `fra ${minuti} ${minuti === 1 ? "minuto" : "minuti"}`;
  const ore = Math.round(minuti / 60);
  if (ore < 24) return `fra ${ore} ${ore === 1 ? "ora" : "ore"}`;
  const giorni = Math.round(ore / 24);
  return `fra ${giorni} ${giorni === 1 ? "giorno" : "giorni"}`;
}

/* ── Scritture ────────────────────────────────────────────── */

/** Scrive nel registro. Una riga per operazione, con chi e quando. */
async function annota(cosa, dettaglio, squadraId) {
  if (!db) return;
  const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  try {
    await db.collection("registro").doc(id).set({
      quando: new Date().toISOString(),
      cosa,
      dettaglio,
      squadraId: squadraId ?? null,
      chi: sonoCommissioner() ? "Commissioner" : squadraDi(stato.io?.squadraId)?.nome ?? "—",
    });
  } catch (e) {
    console.warn("registro non scritto", e);
  }
}

/** Sostituisce la rosa di una squadra. Il documento è uno per squadra:
 *  chi tocca la propria non disturba quella degli altri. */
async function scriviRosa(squadraId, contratti, pesiMorti, vivaio) {
  if (!db) throw new Error("Il database non è disponibile.");
  await db.collection("rose").doc(squadraId).set({
    contratti,
    pesiMorti: pesiMorti ?? pesiMortiDi(squadraId),
    vivaio: vivaio ?? vivaioDi(squadraId),
    aggiornata: new Date().toISOString(),
  });
}

/**
 * Muove il Capitale e lascia la traccia di com'è cambiato.
 *
 * Ogni movimento porta il saldo che c'era prima e quello dopo: un conto in cui
 * si legge solo il totale corrente non permette a nessuno di ricostruire dove
 * sono finiti i soldi, ed è esattamente la discussione che il registro deve
 * evitare (art. 14).
 */
async function muoviCapitale(squadraId, quanto, causale) {
  if (!db) throw new Error("Il database non è disponibile.");
  const societa = societaDi(squadraId);
  const dopo = societa.capitale + quanto;
  if (dopo < 0) throw new Error("Il Capitale non basta.");

  const movimenti = [
    { quando: new Date().toISOString(), causale, quanto, saldo: dopo },
    ...societa.movimenti,
  ].slice(0, 60);

  await db.collection("societa").doc(squadraId).set({ ...societa, capitale: dopo, movimenti });
  await annota("capitale",
    `${squadraDi(squadraId)?.nome ?? "—"}: ${quanto < 0 ? "−" : "+"}${soldi(Math.abs(quanto))} — ${causale}`,
    squadraId);
  return dopo;
}

/** Cambia una voce del conto societario (stadio, vivaio, osservatori). */
async function scriviSocieta(squadraId, modifiche) {
  if (!db) throw new Error("Il database non è disponibile.");
  await db.collection("societa").doc(squadraId).set({ ...societaDi(squadraId), ...modifiche });
}

async function scriviSquadra(squadra) {
  if (!db) throw new Error("Il database non è disponibile.");
  const { id, ...corpo } = squadra;
  await db.collection("squadre").doc(id).set(corpo);
}

/* ── Ascolto ──────────────────────────────────────────────── */

function ascolta() {
  db.doc("lega/config").onSnapshot(
    (istantanea) => {
      stato.config = istantanea.exists ? istantanea.data() : null;
      stato.pronto = true;
      disegna();
    },
    (e) => { stato.errore = e; stato.pronto = true; disegna(); },
  );

  db.collection("squadre").onSnapshot((istantanea) => {
    stato.squadre = istantanea.docs
      .map((d) => ({ id: d.id, ...d.data() }))
      .sort((a, b) => (a.ordine ?? 0) - (b.ordine ?? 0) || a.nome.localeCompare(b.nome, "it"));
    disegna();
  });

  db.collection("rose").onSnapshot((istantanea) => {
    stato.rose = new Map(istantanea.docs.map((d) => [d.id, d.data()]));
    disegna();
  });

  db.collection("offerte").onSnapshot((istantanea) => {
    stato.offerte = istantanea.docs.map((d) => ({ id: d.id, ...d.data() }));
    disegna();
  });

  db.collection("draft").onSnapshot((istantanea) => {
    stato.draft = new Map(istantanea.docs.map((d) => [d.id, { id: d.id, ...d.data() }]));
    disegna();
  });

  db.collection("albo").onSnapshot((istantanea) => {
    stato.albo = istantanea.docs.map((d) => ({ id: d.id, ...d.data() }));
    disegna();
  });

  db.doc("listone/aggiornamento").onSnapshot((istantanea) => {
    stato.aggiornamentoListone = istantanea.exists ? istantanea.data() : null;
    applicaAggiornamento(stato.aggiornamentoListone);
    disegna();
  });

  db.collection("mercato").onSnapshot((istantanea) => {
    stato.mercato = istantanea.docs.map((d) => ({ id: d.id, ...d.data() }));
    risolviScadenze();
    disegna();
  });

  db.collection("scambi").onSnapshot((istantanea) => {
    stato.scambi = istantanea.docs.map((d) => ({ id: d.id, ...d.data() }));
    risolviScadenze();
    disegna();
  });

  db.collection("societa").onSnapshot((istantanea) => {
    stato.societa = new Map(istantanea.docs.map((d) => [d.id, d.data()]));
    disegna();
  });

  db.collection("registro").orderBy("quando", "desc").limit(120).onSnapshot((istantanea) => {
    stato.registro = istantanea.docs.map((d) => ({ id: d.id, ...d.data() }));
    disegna();
  });
}

/* ═══════════════════════════════════════════════════════════════
   I FILE DI LEGHE FANTACALCIO

   Leghe Fantacalcio non ha un'API pubblica: i dati escono dai file che
   pubblica, e quelli si caricano a mano. È un passaggio in più, ma è
   l'unico che non si rompe quando un sito terzo cambia pagina.

   Il file delle quotazioni ha queste colonne:
     Id · R · RM · Nome · Squadra · Qt.A · Qt.I · FVM
   «Qt.A» è la quotazione attuale, «RM» i ruoli Mantra separati da punto
   e virgola. Le intestazioni si normalizzano, così un file salvato con
   maiuscole diverse o spazi in più continua a funzionare.
   ═══════════════════════════════════════════════════════════════ */

/** «Qt.A» → «qt_a»: nomi di colonna che sopravvivono alla formattazione. */
const normalizzaIntestazione = (s) =>
  String(s ?? "").trim().toLowerCase()
    .replace(/[.\s]+/g, "_").replace(/[^a-z0-9_]/g, "").replace(/^_+|_+$/g, "");

/** La prima colonna che esiste fra quelle che possono contenere il dato. */
function colonna(riga, ...nomi) {
  for (const n of nomi) {
    const v = riga[n];
    if (v !== undefined && v !== null && String(v).trim() !== "") return String(v).trim();
  }
  return null;
}

const numero = (v) => {
  if (v == null) return null;
  const n = Number(String(v).replace(",", "."));
  return Number.isFinite(n) ? n : null;
};

/**
 * Legge un CSV con il separatore che ci trova, punto e virgola o virgola.
 *
 * Le intestazioni non sono per forza sulla prima riga: i file ufficiali ci
 * mettono sopra un titolo («Quotazioni Fantacalcio Stagione…»). Si cerca quindi
 * la riga che parla di «Nome», come si fa con i fogli di calcolo — prendere la
 * prima e sperare vuol dire leggere zero giocatori e non capire perché.
 */
function leggiCsv(testo) {
  const righe = testo.split(/\r?\n/).filter((r) => r.trim());
  if (!righe.length) return [];

  const separatore = (r) => ((r.match(/;/g)?.length ?? 0) >= (r.match(/,/g)?.length ?? 0) ? ";" : ",");
  const iIntestazioni = righe.findIndex((r) =>
    r.split(separatore(r)).map(normalizzaIntestazione)
      .some((c) => ["nome", "calciatore", "giocatore"].includes(c)));
  if (iIntestazioni < 0) return [];

  const sep = separatore(righe[iIntestazioni]);
  const intestazioni = righe[iIntestazioni].split(sep).map(normalizzaIntestazione);
  return righe.slice(iIntestazioni + 1).map((r) => {
    const celle = r.split(sep);
    return Object.fromEntries(intestazioni.map((h, i) => [h, celle[i]]));
  });
}

/**
 * Legge il foglio, qualunque forma abbia.
 *
 * I file di Leghe Fantacalcio sono `.xlsx`, e per aprirli serve una libreria;
 * si carica solo quando serve davvero, perché chi non aggiorna mai il listone
 * non ha motivo di scaricarla. Se il file è un CSV se la cava da sé.
 */
async function leggiFoglio(file) {
  const nome = file.name.toLowerCase();
  if (nome.endsWith(".csv") || nome.endsWith(".txt")) return leggiCsv(await file.text());

  if (!window.XLSX) {
    await new Promise((risolvi, rifiuta) => {
      const s = document.createElement("script");
      s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
      s.onload = risolvi;
      s.onerror = () => rifiuta(new Error("non sono riuscito a caricare il lettore di fogli di calcolo"));
      document.head.appendChild(s);
    });
  }
  const libro = window.XLSX.read(await file.arrayBuffer(), { type: "array" });
  const foglio = libro.Sheets[libro.SheetNames[0]];
  /* Le prime righe dei file ufficiali portano un titolo prima delle
     intestazioni vere: si cerca la riga che contiene «Nome». */
  const griglia = window.XLSX.utils.sheet_to_json(foglio, { header: 1, blankrows: false });
  const iIntestazioni = griglia.findIndex((r) =>
    r.some((c) => ["nome", "calciatore", "giocatore"].includes(normalizzaIntestazione(c))));
  if (iIntestazioni < 0) return [];
  const intestazioni = griglia[iIntestazioni].map(normalizzaIntestazione);
  return griglia.slice(iIntestazioni + 1)
    .filter((r) => r.length)
    .map((r) => Object.fromEntries(intestazioni.map((h, i) => [h, r[i]])));
}

/**
 * Trasforma le righe del file nell'aggiornamento da salvare.
 *
 * L'aggancio è l'identificativo di Leghe Fantacalcio, non il nome: due
 * giocatori possono chiamarsi uguale, e un abbinamento sbagliato sposterebbe
 * la quotazione sul giocatore di un'altra squadra — un errore che nessuno
 * noterebbe finché non conta.
 */
function leggiQuotazioni(righe) {
  const quotazioni = {}, mantra = {}, nuovi = [];
  let lette = 0, senzaId = 0;

  for (const riga of righe) {
    const nome = colonna(riga, "nome", "calciatore", "giocatore");
    const lfc = numero(colonna(riga, "id", "id_giocatore"));
    if (!nome) continue;
    lette += 1;
    if (lfc == null) { senzaId += 1; continue; }

    const q = numero(colonna(riga, "qt_a", "qt_a_m", "quotazione", "qta", "qtа"));
    const ruoliMantra = (colonna(riga, "rm", "ruolo_mantra") ?? "")
      .split(/[;,/]/).map((r) => r.trim()).filter((r) => ORDINE_MANTRA.includes(r));

    if (q != null) quotazioni[lfc] = q;
    if (ruoliMantra.length) mantra[lfc] = ruoliMantra;

    if (!PER_LFC.has(lfc)) {
      const ruolo = (colonna(riga, "r", "ruolo") ?? "").toUpperCase().slice(0, 1);
      nuovi.push({
        lfc, nome,
        ruolo: ["P", "D", "C", "A"].includes(ruolo) ? ruolo : "C",
        squadra: colonna(riga, "squadra", "team") ?? "—",
        quotazione: q ?? 1,
        valore: numero(colonna(riga, "fvm", "fvm_m")) ?? 0,
        eta: null,
        mantra: ruoliMantra,
      });
    }
  }
  return { quotazioni, mantra, nuovi, lette, senzaId };
}

/* ═══════════════════════════════════════════════════════════════
   DISEGNO

   Un solo punto che ridisegna, chiamato ogni volta che il database
   manda qualcosa di nuovo. Le pagine sono funzioni che restituiscono
   HTML; gli effetti si riattaccano dopo, in `dopoIlDisegno`.
   ═══════════════════════════════════════════════════════════════ */

const radice = document.getElementById("radice");

/** Testo dell'utente dentro l'HTML: sempre passato di qui. */
function pulito(testo) {
  return String(testo ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
}

let foglioAperto = null;   // { tipo, ...dati }

function apriFoglio(foglio) { foglioAperto = foglio; disegna(); }
function chiudiFoglio() { foglioAperto = null; disegna(); }

function disegna() {
  const dentro = [];

  if (!stato.pronto) {
    dentro.push(`<div class="lavoro" style="display:grid;place-items:center;min-height:70vh">
      ${marchio()}
      <p class="occhiello" style="margin-top:-10px">Apro la lega…</p></div>`);
  } else if (!db) {
    dentro.push(vistaSenzaDatabase());
  } else if (!stato.config) {
    dentro.push(vistaFondazione());
  } else if (!stato.io || !identitàValida()) {
    dentro.push(vistaIngresso());
  } else {
    dentro.push(vistaApplicazione());
  }

  if (foglioAperto) dentro.push(disegnaFoglio());
  radice.innerHTML = dentro.join("");
  dopoIlDisegno();
}

/** Chi dice di essere esiste ancora? Una squadra cancellata non deve
 *  lasciare il suo presidente dentro una pagina che non ha più senso. */
function identitàValida() {
  if (stato.io.ruolo === "commissioner") return true;
  return Boolean(squadraDi(stato.io.squadraId));
}

/* ── Prima di tutto: la lega non esiste ancora ────────────── */

function vistaSenzaDatabase() {
  return `<div class="lavoro">
    <p class="occhiello">Dynasty League</p>
    <h1 style="margin:6px 0 14px">Il listone, e nient'altro</h1>
    <div class="avviso attenzione" style="margin-bottom:18px">
      Questa copia della pagina non raggiunge il database della lega, quindi rose e
      contratti non si vedono. Apri il link dell'app pubblicata per lavorare sulla lega.
    </div>
    ${bloccoListone({ soloLettura: true })}
  </div>`;
}

function vistaFondazione() {
  return `<div class="lavoro" style="max-width:560px">
    ${marchio()}
    <p class="occhiello" style="margin-top:26px">${pulito(STAGIONE)}</p>
    <h1 style="margin:6px 0 14px">Fondiamo la <span class="acceso">lega</span></h1>
    <p style="color:var(--luce-media); margin-bottom:20px; max-width:52ch">
      Dieci squadre, un commissioner, ${LISTONE.length} giocatori di Serie A da contendersi.
      Serve un nome e un codice per te: sei tu che iscrivi i presidenti.
    </p>
    <form id="modulo-fondazione" class="moduli riquadro">
      <label class="campo"><span>Come si chiama la lega</span>
        <input type="text" id="nome-lega" value="Dynasty League" maxlength="40" required></label>
      <p style="font-size:12.5px; color:var(--luce-media)">
        Si entra toccando la propria squadra, senza codice: chi ha il link è della lega.
        Se preferisci un codice per ciascuno, lo accendi dopo dal pannello.
      </p>
      <button class="bottone primario largo" type="submit">Apri la lega</button>
      <div id="esito-fondazione"></div>
    </form>
  </div>`;
}

/* ── Chi sei ──────────────────────────────────────────────── */

function vistaIngresso() {
  const squadre = stato.squadre.map((s) => {
    const conto = contoDi(s.id);
    return `<button class="voce" data-entra="${pulito(s.id)}">
      <span class="ruolo" style="background:${pulito(s.colore || "#DADDD2")};color:#12140F">${pulito(s.sigla)}</span>
      <span class="corpo">
        <span class="nome">${pulito(s.nome)}</span>
        <span class="dettaglio">${s.presidente ? pulito(s.presidente) + " · " : ""}${conto.numero} in rosa</span>
      </span>
      <span class="coda"><span class="prezzo num">${soldi(conto.speso)}</span></span>
    </button>`;
  }).join("");

  return `<div class="lavoro" style="max-width:560px">
    ${marchio()}
    <p class="occhiello" style="margin-top:24px">${pulito(stato.config.nome)} · ${pulito(STAGIONE)}</p>
    <h1 style="margin:6px 0 18px">Chi <span class="acceso">sei</span>?</h1>
    ${stato.squadre.length === 0
      ? `<div class="avviso neutro" style="margin-bottom:14px">Non c'è ancora nessuna squadra:
         entra da commissioner e iscrivi i dieci presidenti.</div>`
      : `<div class="elenco" style="margin-bottom:14px">${squadre}</div>
         ${!serveIlCodice()
           ? `<p style="font-size:12.5px;color:var(--luce-media);margin:-4px 0 14px">
                Tocca la tua squadra: si entra senza codice.</p>`
           : stato.squadre.every((s) => s.pin === CODICE_PREDEFINITO)
           ? `<p style="font-size:12.5px;color:var(--luce-media);margin:-4px 0 14px">
                Il codice per tutti, per ora, è <b>${CODICE_PREDEFINITO}</b>.</p>` : ""}`}
    <button class="bottone largo" data-entra="commissioner">Entro da commissioner</button>
  </div>`;
}

/* ── L'applicazione ───────────────────────────────────────── */
