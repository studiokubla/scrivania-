            ${REGOLE.capitale.dotazione} M (art. 14) e con il codice ${CODICE_PREDEFINITO}.
          </p>
          <form id="modulo-iscrizioni" class="moduli">
            <textarea id="elenco-squadre" rows="10" spellcheck="false"
              placeholder="Real Marasca, Giulio&#10;Atletico Sorata, Marta&#10;Borgo United, Ivan"
              style="width:100%;padding:11px 13px;font:inherit;font-size:14px;line-height:1.7;
                     color:var(--luce);background:var(--vetro);
                     border:1px solid var(--bordo-forte);border-radius:var(--raggio-s);resize:vertical"></textarea>

    </div>

    <div class="sezione">
      <div class="intestazione-sezione"><h2>A che punto siamo</h2></div>
      <div class="riquadro">
        <p style="font-size:13.5px;color:var(--luce-media);margin-bottom:12px">
          Il giorno dopo l'asta si scrivono le rose così come sono uscite dal tavolo: si cerca il
          giocatore e si mette dentro. A stagione avviata invece un giocatore libero se lo
          contendono in più squadre, e allora passa dalle buste chiuse
          (${REGOLE.mercato.oreFreeAgency} ore, art. 9).
        </p>
        <div class="scelte">
          <button class="scelta" data-fase="COMPOSIZIONE" aria-pressed="${fase() === "COMPOSIZIONE"}">
            <b>Si compongono le rose</b><small>Dal listone si firma subito, senza aspettare.</small></button>
          <button class="scelta" data-fase="MERCATO" aria-pressed="${fase() === "MERCATO"}">
            <b>Mercato aperto</b><small>Sui liberi si depositano buste e vince la più alta.</small></button>

      <div class="intestazione-sezione"><h2>Classifica</h2></div>
      <div class="riquadro">
        <p style="font-size:13.5px;color:var(--luce-media);margin-bottom:12px">

        </p>
        <div class="scelte">
          ${stato.squadre.map((s) => `<label class="campo"><span>${pulito(s.nome)}</span>
            <input type="number" min="1" max="${stato.squadre.length}" data-posizione="${pulito(s.id)}"
                   value="${s.posizione ?? ""}" placeholder="${s.ordine ?? ""}"></label>`).join("")}
        </div>

    <div class="sezione">
      <div class="intestazione-sezione"><h2>La lega</h2></div>
      <div class="riquadro moduli">
        <label class="campo"><span>Nome della lega</span>
          <input type="text" id="rinomina-lega" value="${pulito(stato.config.nome)}" maxlength="40"></label>

    <div class="sezione">
      <div class="intestazione-sezione"><h2>Quotazioni</h2>
        ${stato.aggiornamentoListone
          ? `<span class="conteggio">aggiornate il ${new Date(stato.aggiornamentoListone.quando).toLocaleDateString("it-IT", { day: "numeric", month: "long" })}</span>`

          arrivato dopo entra nel listone, gli altri aggiornano quotazione e ruoli Mantra.

        <div id="esito-quotazioni" style="margin-top:10px">${

    <div class="sezione">
      <div class="intestazione-sezione"><h2>Fine stagione</h2>

          Rose, contratti e Capitale non si toccano.
        </p>
        ${stato.squadre.some((s) => contoDi(s.id).pesoMorto > 0)
          ? `<div class="elenco" style="margin-bottom:12px">
              ${stato.squadre.filter((s) => contoDi(s.id).pesoMorto > 0).map((s) => `<div class="voce">
                <span class="corpo"><span class="nome">${pulito(s.nome)}</span>
                  <span class="dettaglio">${pesiMortiDi(s.id).map((x) => pulito(x.nome)).join(", ")}</span></span>
                <span class="coda"><span class="prezzo num" style="color:var(--allarme)">${soldi(contoDi(s.id).pesoMorto)}</span></span>
              </div>`).join("")}
            </div>
            <button class="bottone" id="libera-pesi">Libera gli ingaggi degli svincolati</button>`
          : `<p style="font-size:13.5px;color:var(--luce-media)">Nessuno ha svincolato: non c'è niente da liberare.</p>`}
      </div>
    </div>

    ${stato.offerte.some((o) => o.stato === "VINTA") ? `
    <div class="sezione">
      <div class="intestazione-sezione"><h2>Passaggi promessi</h2>
        <span class="conteggio">${stato.offerte.filter((o) => o.stato === "VINTA").length}</span></div>
      <div class="riquadro">
        <p style="font-size:13.5px;color:var(--luce-media);margin-bottom:12px">
          Offerte che nessuno ha pareggiato. Quando la stagione è finita davvero, questo comando
          sposta i giocatori con il contratto offerto. Se a chi li riceve non basta il tetto o il
          posto in rosa, il passaggio si ferma e te lo dico.
        </p>
        <div class="elenco" style="margin-bottom:12px">
          ${stato.offerte.filter((o) => o.stato === "VINTA").map((o) => `<div class="voce">
            <span class="corpo"><span class="nome">${pulito(o.nome)}</span>
              <span class="dettaglio">${pulito(squadraDi(o.proprietaria)?.nome ?? "—")} →
                ${pulito(squadraDi(o.daChi)?.nome ?? "—")} · ${soldi(o.ingaggio)} × ${o.anni}</span></span>
          </div>`).join("")}
        </div>
        <button class="bottone" id="esegui-passaggi">Esegui i passaggi</button>
      </div>
    </div>` : ""}

    <div class="sezione">
      <div class="intestazione-sezione"><h2>Chi lascia la Serie A</h2></div>
      <div class="riquadro">
        <p style="font-size:13.5px;color:var(--luce-media);margin-bottom:12px">
          Un trasferimento all'estero non è uno svincolo: chi taglia sceglie, chi si vede
          portare via un giocatore non ha scelto niente. L'ingaggio si libera <b>subito</b>,
          insieme al posto in rosa, e se ne va anche l'eventuale peso morto che quel giocatore
          aveva lasciato.
        </p>
        ${tesseratiEsvincolati().length ? `
          <label class="campo" style="margin-bottom:12px"><span>Chi è partito</span>
            <select id="chi-parte">
              <option value="">— scegli —</option>
              ${tesseratiEsvincolati().map((x) => `<option value="${pulito(x.chiave)}">${
                pulito(x.nome)} · ${pulito(x.squadra)}${x.pesoMorto ? " (svincolato)" : ` · ${soldi(x.ingaggio)}`}</option>`).join("")}
            </select></label>
          <button class="bottone pericolo" id="parte-per-estero">Toglilo e libera l'ingaggio</button>`
          : `<p style="font-size:13.5px;color:var(--luce-media)">Non c'è nessun giocatore sotto contratto.</p>`}
      </div>
    </div>

    <div class="sezione">
      <div class="intestazione-sezione"><h2>Ripartire da zero</h2></div>
      <div class="riquadro">
        <p style="font-size:13.5px;color:var(--luce-media);margin-bottom:12px">
          Toglie squadre, rose e registro. Il listone e la lega restano.
          Scrivi <b>${pulito(stato.config.nome)}</b> per confermare.
        </p>
        <div class="moduli">
          <input type="text" id="conferma-azzera" placeholder="Nome della lega">
          <button class="bottone pericolo" id="azzera">Cancella squadre e rose</button>
        </div>
      </div>
    </div>`;
}

function foglioSquadra(squadraId) {
  const s = squadraId ? squadraDi(squadraId) : null;
  const nuova = !s;
  return `<div class="velo" data-velo><div class="foglio" role="dialog" aria-modal="true">
    <div class="foglio-testa">
      <h2>${nuova ? "Nuova squadra" : pulito(s.nome)}</h2>
      <button class="chiudi" data-chiudi aria-label="Chiudi">×</button>
    </div>
    <form id="modulo-squadra" class="moduli" data-id="${pulito(squadraId ?? "")}">
      <label class="campo"><span>Nome della squadra</span>
        <input type="text" id="sq-nome" value="${pulito(s?.nome ?? "")}" maxlength="30" required></label>
      <label class="campo"><span>Sigla — due o tre lettere</span>
        <input type="text" id="sq-sigla" value="${pulito(s?.sigla ?? "")}" maxlength="3" required></label>
      <label class="campo"><span>Presidente</span>
        <input type="text" id="sq-presidente" value="${pulito(s?.presidente ?? "")}" maxlength="30"></label>
      ${serveIlCodice() ? `<label class="campo"><span>Codice d'ingresso — quattro cifre</span>
        <input type="text" id="sq-pin" value="${pulito(s?.pin ?? CODICE_PREDEFINITO)}" inputmode="numeric"
               pattern="[0-9]{4}" maxlength="4" required></label>` : ""}
      <label class="campo"><span>Colore</span>
        <input type="color" id="sq-colore" value="${pulito(s?.colore ?? "#2C7A52")}"
               style="height:44px;padding:4px"></label>
      <button class="bottone primario largo" type="submit">${nuova ? "Iscrivi la squadra" : "Salva"}</button>
      ${!nuova && rosaDi(squadraId).length === 0
        ? `<button type="button" class="bottone pericolo largo" data-ritira="${pulito(squadraId)}">Ritira dalla lega</button>`
        : !nuova ? `<p style="font-size:12px;color:var(--luce-media);text-align:center">
            Una squadra con dei contratti non si ritira: i suoi giocatori resterebbero senza squadra.</p>` : ""}
    </form>
  </div></div>`;
}

function foglioCodice(chi) {
  const squadra = chi === "commissioner" ? null : squadraDi(chi);
  return `<div class="velo" data-velo><div class="foglio" role="dialog" aria-modal="true" style="max-width:400px">
    <div class="foglio-testa">
      <h2>${squadra ? pulito(squadra.nome) : "Commissioner"}</h2>
      <button class="chiudi" data-chiudi aria-label="Chiudi">×</button>
    </div>
    <form id="modulo-codice" class="moduli" data-chi="${pulito(chi)}">
      <label class="campo"><span>Il tuo codice — quattro cifre</span>
        <input type="text" id="codice" inputmode="numeric" pattern="[0-9]{4}" maxlength="4"
               autocomplete="off" autofocus required></label>
      <div id="esito-codice"></div>
      <button class="bottone primario largo" type="submit">Entra</button>
    </form>
  </div></div>`;
}

/* ═══════════════════════════════════════════════════════════════
   GLI EFFETTI

   Il disegno rifà l'HTML da capo, quindi gli ascoltatori si
   riattaccano ogni volta. È il prezzo di non avere una libreria, e
   per una pagina di questa misura è un prezzo basso.
   ═══════════════════════════════════════════════════════════════ */

const su = (selettore, evento, azione) => {
  radice.querySelectorAll(selettore).forEach((elemento) => elemento.addEventListener(evento, azione));
};

function dopoIlDisegno() {
  /* Navigazione, uscita, identità */
  su("[data-vista]", "click", (e) => {
    stato.vista = e.currentTarget.dataset.vista;
    /* Al draft si sceglie fra chi è libero: accendere il filtro a mano ogni
       volta è un passaggio che nessuno ricorda e che fa perdere il turno a
       chi tocca un nome già preso. */
    if (stato.vista === "draft") filtri.soloLiberi = true;
    disegna();
  });

  /* La barra in basso non ci sta in un telefono: scorre. Se però la voce
     attiva finisce fuori — e succede appena si va in Registro o in
     Gestione — la barra sembra ferma su un'altra pagina. Qui la si porta
     in vista dopo ogni disegno, che è l'unico momento in cui può essere
     cambiata. `block: "nearest"` perché scorra in orizzontale e basta:
     senza, trascina anche la pagina. */
  const attiva = radice.querySelector('.navigazione [aria-current="page"]');
  if (attiva) attiva.scrollIntoView({ block: "nearest", inline: "center" });
  su("#esci", "click", () => { dimenticaIo(); stato.vista = "lega"; disegna(); });
  su("[data-entra]", "click", (e) => {
    const chi = e.currentTarget.dataset.entra;
    if (serveIlCodice()) { apriFoglio({ tipo: "codice", chi }); return; }
    ricordaIo(chi === "commissioner" ? { ruolo: "commissioner" } : { ruolo: "presidente", squadraId: chi });
    stato.vista = "lega";
    disegna();
  });
  su("[data-chiudi], [data-velo]", "click", (e) => { if (e.target === e.currentTarget) chiudiFoglio(); });

  /* Fondazione */
  const fondazione = radice.querySelector("#modulo-fondazione");
  if (fondazione) fondazione.addEventListener("submit", async (e) => {
    e.preventDefault();
    const nome = radice.querySelector("#nome-lega").value.trim();
    const esito = radice.querySelector("#esito-fondazione");
    try {
      await db.doc("lega/config").set({
        nome: nome || "Dynasty League",
        stagione: STAGIONE,
        chiediCodice: false,
        pinCommissioner: CODICE_PREDEFINITO,
        fondata: new Date().toISOString(),
      });
      ricordaIo({ ruolo: "commissioner" });
      await annota("lega", `Lega «${nome}» aperta per la stagione ${STAGIONE}`, null);
    } catch (errore) {
      esito.innerHTML = `<div class="avviso errore">Non sono riuscito ad aprire la lega: ${pulito(errore.message ?? errore.code ?? errore)}</div>`;
    }
  });

  /* Codice d'ingresso */
  const campoCodice = radice.querySelector("#codice");
  if (campoCodice && document.activeElement !== campoCodice) campoCodice.focus();

  const moduloCodice = radice.querySelector("#modulo-codice");
  if (moduloCodice) moduloCodice.addEventListener("submit", (e) => {
    e.preventDefault();
    const chi = moduloCodice.dataset.chi;
    const scritto = radice.querySelector("#codice").value.trim();
    const atteso = chi === "commissioner" ? stato.config.pinCommissioner : squadraDi(chi)?.pin;
    if (scritto !== atteso) {
      radice.querySelector("#esito-codice").innerHTML =
        `<div class="avviso errore">Codice sbagliato. Se l'hai perso, chiedilo al commissioner.</div>`;
      return;
    }
    ricordaIo(chi === "commissioner" ? { ruolo: "commissioner" } : { ruolo: "presidente", squadraId: chi });
    foglioAperto = null;
    stato.vista = "lega";
    disegna();
  });

  /* Listone: filtri e ricerca */
  const cerca = radice.querySelector("#cerca-listone");
  if (cerca) cerca.addEventListener("input", (e) => {
    filtri.testo = e.target.value;
    const posizione = e.target.selectionStart;
    disegna();
    const nuovo = radice.querySelector("#cerca-listone");
    if (nuovo) { nuovo.focus(); nuovo.setSelectionRange(posizione, posizione); }
  });
  su("[data-ruolo]", "click", (e) => {
    const r = e.currentTarget.dataset.ruolo;
    /* «Tutti» spegne anche il ruolo Mantra: due filtri accesi che si
       contraddicono sono il modo più rapido per non trovare nessuno. */
    if (r === "") { filtri.ruolo = null; filtri.mantra = null; }
    else { filtri.ruolo = r === filtri.ruolo ? null : r; }
    disegna();
  });
  su("[data-mantra]", "click", (e) => {
    const r = e.currentTarget.dataset.mantra;
    filtri.mantra = filtri.mantra === r ? null : r;
    if (filtri.mantra) filtri.ruolo = null;
    disegna();
  });
  su("[data-eta]", "click", (e) => {
    const eta = Number(e.currentTarget.dataset.eta);
    filtri.etaMax = filtri.etaMax === eta ? null : eta;
    disegna();
  });
  su("#filtro-primavera", "click", () => { filtri.soloPrimavera = !filtri.soloPrimavera; disegna(); });
  su("#filtro-liberi", "click", () => { filtri.soloLiberi = !filtri.soloLiberi; disegna(); });

  /* Dal listone al foglio della firma */
  su("[data-giocatore]", "click", (e) => {
    /* Un click nato dentro un foglio appartiene al foglio, non all'elenco che
       sta sotto: senza questa riga un modulo che portasse lo stesso attributo
       riaprirebbe la scheda invece di lasciar lavorare il suo bottone. */
    if (e.currentTarget.closest(".velo")) return;
    const id = e.currentTarget.dataset.giocatore;
    if (tesserati().has(id)) return;
    if (!squadraCorrente() || !possoToccare(squadraCorrente().id)) return;
    bozza = { tipo: "ANNUALE", anni: 1, ingaggio: "" };
    const turno = mioTurnoAlDraft();
    if (turno) {
      /* Al draft l'ingaggio non si tratta: è la quotazione, e nel foglio
         il campo è di sola lettura. Resta da scegliere il contratto, che
         è la parte in cui c'è ancora da pensare. */
      bozza.ingaggio = String(PER_ID.get(id)?.quotazione ?? "");
      apriFoglio({ tipo: "firma", giocatoreId: id, daDraft: turno });
    } else if (siamoAlMercato()) {
      const aperta = trattativaAperta(id);
      apriFoglio({ tipo: "busta", trattativaId: aperta?.id ?? null, giocatoreId: id });
    } else {
      apriFoglio({ tipo: "firma", giocatoreId: id });
    }
  });

  /* Ricerca dentro la pagina Rosa */
  const cercaRosa = radice.querySelector("#cerca-per-rosa");
  if (cercaRosa) {
    cercaRosa.addEventListener("input", (e) => mostraRisultatiRosa(e.target.value));
    if (cercaRosa.dataset.testo) cercaRosa.value = cercaRosa.dataset.testo;
  }

  /* Il commissioner cambia squadra su cui lavora */
  const scegli = radice.querySelector("#scegli-squadra");
  if (scegli) scegli.addEventListener("change", (e) => { stato.squadraScelta = e.target.value; disegna(); });

  /* Firma */
  su("[data-tipo]", "click", (e) => {
    const tipo = e.currentTarget.dataset.tipo;
    bozza.tipo = tipo;
    const anni = REGOLE.contratti[tipo].anni;
    if (!anni.includes(bozza.anni)) bozza.anni = anni[0];
    disegna();
  });
  su("[data-anni]", "click", (e) => { bozza.anni = Number(e.currentTarget.dataset.anni); disegna(); });

  const ingaggio = radice.querySelector("#ingaggio");
  if (ingaggio) {
    ingaggio.addEventListener("input", (e) => {
      bozza.ingaggio = e.target.value;
      const posizione = e.target.selectionStart;
      disegna();
      const nuovo = radice.querySelector("#ingaggio");
      if (nuovo) { nuovo.focus(); try { nuovo.setSelectionRange(posizione, posizione); } catch { /* number input */ } }
    });
    if (document.activeElement !== ingaggio && bozza.ingaggio === "") ingaggio.focus();
  }

  const moduloFirma = radice.querySelector("#modulo-firma");
  if (moduloFirma) moduloFirma.addEventListener("submit", async (e) => {
    e.preventDefault();
    await firma();
  });

  /* ── Il vivaio ── */
  su("[data-in-vivaio]", "click", async (e) => {
    const g = PER_ID.get(e.currentTarget.dataset.inVivaio);
    const squadra = squadraCorrente();
    if (!g || !squadra || !possoToccare(squadra.id)) return;
    if (perchéNoVivaio(g, squadra.id).length) return;
    await scriviRosa(squadra.id, rosaDi(squadra.id), pesiMortiDi(squadra.id), [
      ...vivaioDi(squadra.id),
      { giocatoreId: g.id, nome: g.nome, ruolo: g.ruolo, quotazione: g.quotazione,
        preso: new Date().toISOString() },
    ]);
    await annota("vivaio", `${g.nome} nel vivaio di ${squadra.nome}: nessun altro può prenderlo`, squadra.id);
    chiudiFoglio();
  });

  su("[data-libera-giovane]", "click", async (e) => {
    const id = e.currentTarget.dataset.liberaGiovane;
    const squadra = squadraCorrente();
    const g = vivaioDi(squadra.id).find((x) => x.giocatoreId === id);
    if (!g) return;
    if (!confirm(`Togli ${g.nome} dal vivaio? Torna libero per tutti.`)) return;
    await scriviRosa(squadra.id, rosaDi(squadra.id), pesiMortiDi(squadra.id),
      vivaioDi(squadra.id).filter((x) => x.giocatoreId !== id));
    await annota("vivaio", `${g.nome} esce dal vivaio di ${squadra.nome}`, squadra.id);
  });

  /* La prelazione: il foglio si apre già col prezzo di allora e col
     contratto che l'età permette. Non c'è niente da contrattare — è il
     premio per averlo visto per primo. */
  su("[data-promuovi]", "click", (e) => {
    const id = e.currentTarget.dataset.promuovi;
    const g = PER_ID.get(id);
    const squadra = squadraCorrente();
    const dal = vivaioDi(squadra.id).find((x) => x.giocatoreId === id);
    if (!g || !dal) return;
    const rookie = REGOLE.contratti[REGOLE.primavera.prelazione.contratto];
    /* Il Rookie è un pluriennale e uno slot lo occupa: se non ce ne sono, la
       prelazione non si perde — cambia contratto. Il diritto è sul prezzo e
       sull'esclusiva, non sulla durata. */
    const puòRookie = g.eta != null && g.eta <= rookie.etaMax
      && contoDi(squadra.id).slotLiberi >= 1;
    bozza = {
      tipo: puòRookie ? REGOLE.primavera.prelazione.contratto : "ANNUALE",
      anni: puòRookie ? rookie.anni[0] : 1,
      ingaggio: String(dal.quotazione),
    };
    apriFoglio({ tipo: "firma", giocatoreId: id, daVivaio: true });
  });

  /* Togliere dalla rosa: la scelta fra le due strade sta nel foglio, con i
     numeri di tutt'e due sotto gli occhi. */
  su("[data-togli]", "click", (e) => {
    apriFoglio({ tipo: "svincolo", giocatoreId: e.currentTarget.dataset.togli });
  });

  su("[data-svincola]", "click", async (e) => {
    const modo = e.currentTarget.dataset.svincola;
    const id = foglioAperto?.giocatoreId;
    const squadra = squadraCorrente();
    const contratto = rosaDi(squadra.id).find((c) => c.giocatoreId === id);
    if (!contratto) return;
    const scelto = modiSvincolo(contratto)[modo];
    if (!scelto) return;
    if (!confirm(
      `Svincolare ${contratto.nome}?\n\n` +
      (scelto.anni > 1
        ? `${soldi(scelto.ingaggio)} all'anno per ${scelto.anni} stagioni — ${soldi(scelto.totale)} in tutto.`
        : `${soldi(scelto.ingaggio)} restano sul tuo tetto fino a fine stagione.`) +
      `\n\nVa in waiver per ${REGOLE.mercato.oreWaiver} ore, e in quel tempo le altre squadre possono reclamarlo.`
    )) return;
    chiudiFoglio();

    const restanti = rosaDi(squadra.id).filter((c) => c.giocatoreId !== id);
    /* L'ingaggio non sparisce con il giocatore. Un contratto firmato è una
       decisione che si porta fino in fondo, non una casella da svuotare quando
       il giocatore delude: quel che si può scegliere è se pagarla tutta adesso
       o dilazionarla, e la dilazione costa. */
    const pesi = [...pesiMortiDi(squadra.id), {
      giocatoreId: id, nome: contratto.nome, ruolo: contratto.ruolo,
      ingaggio: scelto.ingaggio, anni: scelto.anni, modo: scelto.modo,
      svincolato: new Date().toISOString(),
    }];
    await scriviRosa(squadra.id, restanti, pesi);

    /* Art. 10 — chi viene tagliato non torna subito libero: resta 48 ore in
       waiver. Serve a impedire la corsa al click sul giocatore appena tagliato. */
    await db.collection("mercato").doc("w" + Date.now().toString(36)).set({
      tipo: "WAIVER", giocatoreId: id, nome: contratto.nome, ruolo: contratto.ruolo,
      apertaIl: new Date().toISOString(),
      scadeIl: new Date(Date.now() + REGOLE.mercato.oreWaiver * 3600000).toISOString(),
      offerte: [], stato: "APERTA", tagliatoDa: squadra.id,
    });
    await annota("mercato",
      `${contratto.nome} svincolato da ${squadra.nome}: ${soldi(scelto.ingaggio)}` +
      (scelto.anni > 1 ? ` all'anno per ${scelto.anni} stagioni` : " fino a fine stagione"),
      squadra.id);
  });

  agganciaOfferte();
  agganciaDraft();
  agganciaAlbo();
  agganciaMercato();
  agganciaSocieta();
  agganciaGestione();
}

/* ── Le offerte ai giocatori in scadenza, i comandi ───────────────── */

function agganciaOfferte() {
  su("#apri-offerta", "click", () => {
    bozzaOfferta = { giocatoreId: "", tipo: "ANNUALE", anni: 1, ingaggio: "" };
    apriFoglio({ tipo: "offerta" });
  });

  const chi = radice.querySelector("#off-chi");
  if (chi) chi.addEventListener("change", (e) => {
    bozzaOfferta.giocatoreId = e.target.value;
    disegna();
  });
  const quanto = radice.querySelector("#off-ingaggio");
  if (quanto) quanto.addEventListener("input", (e) => { bozzaOfferta.ingaggio = e.target.value; disegna(); });
  su("[data-off-tipo]", "click", (e) => {
    bozzaOfferta.tipo = e.currentTarget.dataset.offTipo;
    const anni = REGOLE.contratti[bozzaOfferta.tipo].anni;
    if (!anni.includes(bozzaOfferta.anni)) bozzaOfferta.anni = anni[0];
    disegna();
  });
  su("[data-off-anni]", "click", (e) => { bozzaOfferta.anni = Number(e.currentTarget.dataset.offAnni); disegna(); });

  const modulo = radice.querySelector("#modulo-offerta");
  if (modulo) modulo.addEventListener("submit", async (e) => {
    e.preventDefault();
    const mia = squadraCorrente();
    const scelto = inScadenzaAltrui(mia.id).find((c) => c.giocatoreId === bozzaOfferta.giocatoreId);
    if (!scelto || !possoToccare(mia.id)) return;
    if (offerteFatteDa(mia.id) >= REGOLE.offerteScadenza.perStagione) return;
    if (offertaSu(scelto.giocatoreId)) { alert("C'è già un'offerta viva su questo giocatore."); return; }

    await db.collection("offerte").doc("o" + Date.now().toString(36)).set({
      stagione: STAGIONE,
      giocatoreId: scelto.giocatoreId, nome: scelto.nome, ruolo: scelto.ruolo,
      daChi: mia.id, proprietaria: scelto.squadraId,
      ingaggio: aQuarti(bozzaOfferta.ingaggio), tipo: bozzaOfferta.tipo, anni: bozzaOfferta.anni,
      ingaggioDiOra: scelto.ingaggio,
      stato: "SEGRETA", proposta: new Date().toISOString(),
    });
    /* Nel registro non ci va né chi ha offerto né a chi: il registro lo
       leggono tutti, e l'offerta la deve vedere solo il commissioner. */
    await annota("offerta", "Un'offerta a un giocatore in scadenza è arrivata al commissioner", null);
    chiudiFoglio();
  });

  su("[data-ritira-offerta]", "click", async (e) => {
    const o = stato.offerte.find((x) => x.id === e.currentTarget.dataset.ritiraOfferta);
    if (!o || o.stato !== "SEGRETA") return;
    if (!confirm(`Ritiri l'offerta per ${o.nome}? Non conterà fra quelle spese.`)) return;
    await db.collection("offerte").doc(o.id).set({ ...o, stato: "RITIRATA", chiusa: new Date().toISOString() });
  });

  su("[data-riferisci]", "click", async (e) => {
    if (!sonoCommissioner()) return;
    const o = stato.offerte.find((x) => x.id === e.currentTarget.dataset.riferisci);
    if (!o || o.stato !== "SEGRETA") return;
    const prop = squadraDi(o.proprietaria);
    if (!confirm(
      `Riferisco a ${prop?.nome} che qualcuno offre ${soldi(o.ingaggio)} × ${o.anni} a ${o.nome}.\n\n` +
      `Non saprà da chi. Ha ${REGOLE.offerteScadenza.oreRisposta} ore per pareggiare.`
    )) return;
    await db.collection("offerte").doc(o.id).set({
      ...o, stato: "RIFERITA", riferita: new Date().toISOString(),
      scadeIl: new Date(Date.now() + REGOLE.offerteScadenza.oreRisposta * 3600000).toISOString(),
    });
    await annota("offerta",
      `${prop?.nome}: qualcuno offre ${soldi(o.ingaggio)} × ${o.anni} ${o.anni === 1 ? "anno" : "anni"} a ${o.nome}. Pareggia entro ${REGOLE.offerteScadenza.oreRisposta} ore o a fine stagione cambia squadra`,
      o.proprietaria);
  });

  su("[data-pareggia]", "click", async (e) => {
    const o = stato.offerte.find((x) => x.id === e.currentTarget.dataset.pareggia);
    if (!o || o.stato !== "RIFERITA") return;
    const mia = squadraCorrente();
    if (!mia || mia.id !== o.proprietaria || !possoToccare(mia.id)) return;
    if (perchéNoPareggio(o).length) return;
    if (!confirm(
      `Pareggi per ${o.nome}?\n\n` +
      `Il contratto si riscrive: ${soldi(o.ingaggio)} × ${o.anni} ${o.anni === 1 ? "anno" : "anni"} ` +
      `(${REGOLE.contratti[o.tipo].nome}), al posto dei ${soldi(o.ingaggioDiOra ?? 0)} di adesso. Vale da subito.`
    )) return;

    const rosa = rosaDi(mia.id).map((c) => c.giocatoreId === o.giocatoreId
      ? { ...c, tipo: o.tipo, anni: o.anni, ingaggio: o.ingaggio, pareggiato: new Date().toISOString() }
      : c);
    await scriviRosa(mia.id, rosa);
    await db.collection("offerte").doc(o.id).set({ ...o, stato: "PAREGGIATA", chiusa: new Date().toISOString() });
    await annota("offerta",
      `${mia.nome} pareggia e tiene ${o.nome}: ${soldi(o.ingaggio)} × ${o.anni} ${o.anni === 1 ? "anno" : "anni"}`,
      mia.id);
  });
}

/* ── Gli effetti del draft ────────────────────────────────── */

/* Quale ordine ha scelto il commissioner nel modulo d'apertura. Sta fuori
   dalla funzione perché il disegno la ricrea a ogni tocco. */
let ordineDraft = "classifica";

function agganciaDraft() {
  su("[data-ordine]", "click", (e) => {
    ordineDraft = e.currentTarget.dataset.ordine;
    for (const b of radice.querySelectorAll("[data-ordine]"))
      b.setAttribute("aria-pressed", String(b.dataset.ordine === ordineDraft));
  });

  const modulo = radice.querySelector("#modulo-draft");
  if (modulo) modulo.addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!sonoCommissioner()) return;
    if (stato.squadre.length < 2) { alert("Prima iscrivi le squadre."); return; }
    const anno = Number(radice.querySelector("#draft-anno").value);
    const giri = Math.max(1, Math.min(6, Number(radice.querySelector("#draft-giri").value)));
    const stagione = `${anno}/${String(anno + 1).slice(2)}`;
    const id = idDraft(stagione);
    if (stato.draft.has(id)) { alert(`Il draft ${stagione} esiste già.`); return; }

    /* Le scelte nascono senza numero: chi le possiede si sa subito — serve
       per scambiarle — ma in che ordine sceglierà si saprà solo all'apertura,
       quando la classifica di quella stagione esiste davvero. */
    const scelte = [];
    for (let giro = 1; giro <= giri; giro++)
      for (const sq of stato.squadre)
        scelte.push({ giro, numero: null, origine: sq.id, diChi: sq.id,
                      giocatoreId: null, nome: null, quando: null });

    await db.doc(`draft/${id}`).set({
      stagione, giri, serpente: REGOLE.draft.serpente, stato: "PREPARATO",
      scelte, creato: new Date().toISOString(),
    });
    await annota("draft", `Preparato il draft ${stagione}: ${scelte.length} scelte in ${giri} giri`, null);
  });

  su("#apri-draft", "click", async (e) => {
    if (!sonoCommissioner()) return;
    const d = stato.draft.get(e.currentTarget.dataset.draft);
    if (!d || d.stato !== "PREPARATO") return;

    const ordine = ordineDraft === "sorteggio"
      ? [...stato.squadre.map((x) => x.id)].sort(() => Math.random() - 0.5)
      : ordineInverso();
    const primo = squadraDi(ordine[0])?.nome ?? "—";
    if (!confirm(`Apro il draft ${d.stagione}. Sceglie per primo ${primo}.\n\n` +
                 `Da qui in poi l'ordine non si tocca più. Procedo?`)) return;

    /* La serpentina: al secondo giro si va al contrario, al terzo di nuovo
       dritto. Senza, chi ha la prima scelta si prende i tre migliori e il
       draft è finito prima di cominciare. */
    const posto = new Map(ordine.map((id, i) => [id, i]));
    const scelte = (d.scelte ?? []).map((x) => ({ ...x }));
    let numero = 0;
    for (let giro = 1; giro <= d.giri; giro++) {
      const alContrario = d.serpente && giro % 2 === 0;
      const diQuestoGiro = scelte
        .filter((x) => x.giro === giro)
        .sort((a, b) => (posto.get(a.origine) ?? 0) - (posto.get(b.origine) ?? 0));
      if (alContrario) diQuestoGiro.reverse();
      for (const x of diQuestoGiro) x.numero = ++numero;
    }
    await db.doc(`draft/${d.id}`).update({
      scelte, stato: "APERTO", ordine, apertoIl: new Date().toISOString(),
    });
    await annota("draft", `Draft ${d.stagione} aperto: sceglie per primo ${primo}`, ordine[0]);
  });

  su("#passa-turno", "click", async (e) => {
    if (!sonoCommissioner()) return;
    const d = stato.draft.get(e.currentTarget.dataset.draft);
    const t = turnoDi(d);
    if (!t) return;
    const chi = squadraDi(t.diChi)?.nome ?? "—";
    if (!confirm(`Salto il turno di ${chi}? La scelta si perde e si passa al prossimo.`)) return;
    const scelte = d.scelte.map((x) => x.numero === t.numero
      ? { ...x, giocatoreId: "SALTATA", nome: "turno saltato", quando: new Date().toISOString() } : x);
    await db.doc(`draft/${d.id}`).update({ scelte });
    await annota("draft", `${chi} salta la scelta numero ${t.numero}`, t.diChi);
  });

  su("#chiudi-draft", "click", async (e) => {
    if (!sonoCommissioner()) return;
    const d = stato.draft.get(e.currentTarget.dataset.draft);
    if (!d) return;
    if (!confirm(`Chiudo il draft ${d.stagione}? Le scelte non usate si perdono.`)) return;
    await db.doc(`draft/${d.id}`).update({ stato: "CHIUSO", chiusoIl: new Date().toISOString() });
    await annota("draft", `Draft ${d.stagione} chiuso`, null);
  });
}

/**
 * Passa delle scelte da una squadra all'altra.
 *
 * Prende tutti i passaggi insieme e non uno alla volta: uno scambio che
 * muove scelte nei due sensi tocca lo stesso documento due volte, e la
 * seconda scrittura partirebbe dallo stato di prima — cancellando la
 * prima. Qui ogni draft si riscrive una volta sola.
 *
 * L'identificativo di una scelta è «draft|giro|origine»: non il numero,
 * che al momento dello scambio spesso non esiste ancora, e non un codice
 * inventato, che si perderebbe alla prima riscrittura dell'array.
 */
async function muoviScelte(passaggi) {
  const destinazione = new Map();
  for (const { chiavi, aChi } of passaggi)
    for (const chiave of chiavi ?? []) destinazione.set(String(chiave), aChi);
  if (!destinazione.size) return;

  const perDraft = new Set([...destinazione.keys()].map((k) => k.split("|")[0]));
  for (const draftId of perDraft) {
    const d = stato.draft.get(draftId);
    if (!d) continue;
    const scelte = d.scelte.map((x) => {
      const aChi = destinazione.get(`${draftId}|${x.giro}|${x.origine}`);
      return aChi && !x.giocatoreId ? { ...x, diChi: aChi } : x;
    });
    await db.doc(`draft/${draftId}`).update({ scelte });
  }
}

/* ── Gli effetti dell'albo ────────────────────────────────── */

function agganciaAlbo() {
  su("[data-verdetto]", "click", (e) => {
    const [stagione, competizione] = e.currentTarget.dataset.verdetto.split("|");
    const gia = verdettoDi(stagione, competizione);
    bozzaVerdetto = {
      stagione, competizione,
      /* Correggendo un verdetto si riparte da quello scritto, non da zero:
         rifare dieci tocchi per spostare una posizione sarebbe una punizione. */
      ordine: (gia?.classifica ?? []).map((s) => s.squadraId).filter((id) => squadraDi(id)),
    };
    apriFoglio({ tipo: "verdetto" });
  });

  su("[data-aggiungi-posto]", "click", (e) => {
    bozzaVerdetto.ordine = [...bozzaVerdetto.ordine, e.currentTarget.dataset.aggiungiPosto];
    disegna();
  });
  su("[data-togli-posto]", "click", (e) => {
    const i = Number(e.currentTarget.dataset.togliPosto);
    bozzaVerdetto.ordine = bozzaVerdetto.ordine.filter((_, x) => x !== i);
    disegna();
  });

  su("#salva-verdetto", "click", async (e) => {
    const { stagione, competizione, ordine } = bozzaVerdetto;
    if (!ordine.length) return;
    e.currentTarget.disabled = true;
    const gara = REGOLE.competizioni.find((c) => c.id === competizione);

    /* Nell'albo si scrive il nome che la squadra aveva allora, non solo il suo
       identificativo: fra tre stagioni quella squadra può essersi rinominata o
       ritirata, e l'albo deve continuare a raccontare cos'è successo. */
    const classifica = ordine.map((id, i) => ({
      squadraId: id,
      nome: squadraDi(id)?.nome ?? "—",
      capitale: gara.capitale[i] ?? 0,
      denaro: gara.denaro?.[i] ?? 0,
    }));

    const id = `${stagione.replace("/", "-")}-${competizione}`;
    const gia = verdettoDi(stagione, competizione);
    await db.collection("albo").doc(id).set({
      stagione, competizione, classifica,
      scritto: new Date().toISOString(),
      premiVersati: gia?.premiVersati ?? false,
    });
    await annota("albo",
      `${gara.nome} ${stagione}: vince ${classifica[0].nome}`,
      classifica[0].squadraId);

    /* La classifica dei tornei lunghi decide anche gli spareggi del mercato
       (art. 9.4): scriverla qui e poi doverla ricopiare in Gestione sarebbe
       il modo migliore per ritrovarsi due verità diverse. */
    if (competizione === "APERTURA" || competizione === "CLAUSURA") {
      for (const [i, riga] of classifica.entries()) {
        const squadra = squadraDi(riga.squadraId);
        if (squadra && squadra.posizione !== i + 1) await scriviSquadra({ ...squadra, posizione: i + 1 });
      }
    }
    chiudiFoglio();
  });

  su("[data-premi]", "click", async (e) => {
    const verdetto = stato.albo.find((a) => a.id === e.currentTarget.dataset.premi);
    if (!verdetto || verdetto.premiVersati) return;
    const gara = REGOLE.competizioni.find((c) => c.id === verdetto.competizione);
    const totale = verdetto.classifica.reduce((s, r) => s + (r.capitale ?? 0), 0);
    if (!confirm(`Verso ${totale} M di premi alle squadre per ${gara.nome} ${verdetto.stagione}. Si fa una volta sola. Procedo?`)) return;

    e.currentTarget.disabled = true;
    for (const riga of verdetto.classifica) {
      if (!riga.capitale || !squadraDi(riga.squadraId)) continue;
      await muoviCapitale(riga.squadraId, aQuarti(riga.capitale), `${gara.nome} ${verdetto.stagione}`);
    }
    await db.collection("albo").doc(verdetto.id).set({ ...verdetto, premiVersati: true });
    await annota("albo", `Premi di ${gara.nome} ${verdetto.stagione} versati: ${totale} M in tutto`, null);
  });
}

/* ── Gli effetti del mercato ──────────────────────────────── */

function agganciaMercato() {
  su("[data-offri]", "click", (e) => {
    const m = stato.mercato.find((x) => x.id === e.currentTarget.dataset.offri);
    const mia = (m?.offerte ?? []).find((o) => o.squadraId === squadraCorrente()?.id);
    bozza = mia
      ? { tipo: mia.tipo, anni: mia.anni, ingaggio: String(aMilioni(mia.ingaggio)) }
      : { tipo: "ANNUALE", anni: 1, ingaggio: "" };
    apriFoglio({ tipo: "busta", trattativaId: e.currentTarget.dataset.offri });
  });

  const moduloBusta = radice.querySelector("#modulo-busta");
  if (moduloBusta) moduloBusta.addEventListener("submit", async (e) => {
    e.preventDefault();
    const squadra = squadraCorrente();
    if (!squadra) { chiudiFoglio(); return; }
    const offerta = { squadraId: squadra.id, ingaggio: aQuarti(bozza.ingaggio),
                      anni: bozza.anni, tipo: bozza.tipo, quando: new Date().toISOString() };

    let m = stato.mercato.find((x) => x.id === moduloBusta.dataset.trattativa);
    if (!m) {
      /* Trattativa nuova su un giocatore libero. Se qualcuno l'ha aperta un
         istante fa, ci si accoda alla sua invece di aprirne una seconda. */
      const giocatoreId = moduloBusta.dataset.perGiocatore;
      const g = PER_ID.get(giocatoreId);
      m = trattativaAperta(giocatoreId);
      if (!m) {
        m = { id: "m" + Date.now().toString(36), tipo: "FREE_AGENCY",
              giocatoreId, nome: g.nome, ruolo: g.ruolo,
              apertaIl: new Date().toISOString(),
              scadeIl: new Date(Date.now() + REGOLE.mercato.oreFreeAgency * 3600000).toISOString(),
              offerte: [], stato: "APERTA" };
      }
    }
    if (m.stato !== "APERTA") { chiudiFoglio(); return; }

    const altre = (m.offerte ?? []).filter((o) => o.squadraId !== squadra.id);
    const { id, ...corpo } = m;
    await db.collection("mercato").doc(id).set({ ...corpo, offerte: [...altre, offerta] });
    /* Il registro dice che una busta è arrivata, non quanto vale: pubblicarne
       l'importo prima dell'apertura vanificherebbe la busta. */
    await annota("mercato", `${squadra.nome} deposita una busta per ${m.nome}`, squadra.id);
    chiudiFoglio();
  });

  su("#nuovo-scambio", "click", () => {
    bozzaScambio = { conChi: null, cedeDa: [], cedeA: [], capitaleDa: "", capitaleA: "" };
    apriFoglio({ tipo: "scambio" });
  });

  const scegliCon = radice.querySelector("#scambio-con");
  if (scegliCon) scegliCon.addEventListener("change", (e) => {
    bozzaScambio = { conChi: e.target.value || null, cedeDa: [], cedeA: [], capitaleDa: "", capitaleA: "" };
    disegna();
  });

  const scambia = (elenco, id) =>
    elenco.includes(id) ? elenco.filter((x) => x !== id) : [...elenco, id];
  su("[data-cede-da]", "click", (e) => { bozzaScambio.cedeDa = scambia(bozzaScambio.cedeDa, e.currentTarget.dataset.cedeDa); disegna(); });
  su("[data-cede-a]", "click", (e) => { bozzaScambio.cedeA = scambia(bozzaScambio.cedeA, e.currentTarget.dataset.cedeA); disegna(); });
  su("[data-scelta-da]", "click", (e) => { bozzaScambio.scelteDa = scambia(bozzaScambio.scelteDa ?? [], e.currentTarget.dataset.sceltaDa); disegna(); });
  su("[data-scelta-a]", "click", (e) => { bozzaScambio.scelteA = scambia(bozzaScambio.scelteA ?? [], e.currentTarget.dataset.sceltaA); disegna(); });

  for (const [selettore, campo] of [["#cap-da", "capitaleDa"], ["#cap-a", "capitaleA"]]) {
    const elemento = radice.querySelector(selettore);
    if (elemento) elemento.addEventListener("input", (ev) => { bozzaScambio[campo] = ev.target.value; disegna(); });
  }

  const moduloScambio = radice.querySelector("#modulo-scambio");
  if (moduloScambio) moduloScambio.addEventListener("submit", async (e) => {
    e.preventDefault();
    const mia = squadraCorrente();
    const con = squadraDi(bozzaScambio.conChi);
    if (!mia || !con) return;
    const proposta = {
      da: mia.id, a: con.id,
      cedeDa: bozzaScambio.cedeDa, cedeA: bozzaScambio.cedeA,
      scelteDa: bozzaScambio.scelteDa ?? [], scelteA: bozzaScambio.scelteA ?? [],
      capitaleDa: bozzaScambio.capitaleDa ? aQuarti(bozzaScambio.capitaleDa) : 0,
      capitaleA: bozzaScambio.capitaleA ? aQuarti(bozzaScambio.capitaleA) : 0,
      proposto: new Date().toISOString(),
      scadeIl: new Date(Date.now() + REGOLE.mercato.oreAccettazioneScambio * 3600000).toISOString(),
      stato: "PROPOSTO",
    };
    if (perchéNoScambio({ daId: mia.id, aId: con.id, ...proposta }).length) { disegna(); return; }
    await db.collection("scambi").doc(Date.now().toString(36)).set(proposta);
    await annota("scambio", `${mia.nome} propone uno scambio a ${con.nome}`, mia.id);
    chiudiFoglio();
  });

  su("[data-accetta]", "click", async (e) => {
    const s = stato.scambi.find((x) => x.id === e.currentTarget.dataset.accetta);
    if (!s || s.stato !== "PROPOSTO") return;
    const motivi = perchéNoScambio({ daId: s.da, aId: s.a, cedeDa: s.cedeDa, cedeA: s.cedeA,
                                     capitaleDa: s.capitaleDa, capitaleA: s.capitaleA });
    if (motivi.length) { alert("Lo scambio non è più valido:\n\n" + motivi.join("\n")); return; }
    if (!confirm("Accetti lo scambio? I giocatori passano subito, con il loro contratto.")) return;

    e.currentTarget.disabled = true;
    const pacchettoDa = rosaDi(s.da).filter((c) => s.cedeDa.includes(c.giocatoreId));
    const pacchettoA = rosaDi(s.a).filter((c) => s.cedeA.includes(c.giocatoreId));

    await scriviRosa(s.da, rosaDopoScambio(s.da, s.cedeDa, pacchettoA));
    await scriviRosa(s.a, rosaDopoScambio(s.a, s.cedeA, pacchettoDa));
    if (s.capitaleDa) { await muoviCapitale(s.da, -s.capitaleDa, `Scambio con ${squadraDi(s.a)?.nome ?? "—"}`);
                        await muoviCapitale(s.a, s.capitaleDa, `Scambio con ${squadraDi(s.da)?.nome ?? "—"}`); }
    if (s.capitaleA) { await muoviCapitale(s.a, -s.capitaleA, `Scambio con ${squadraDi(s.da)?.nome ?? "—"}`);
                       await muoviCapitale(s.da, s.capitaleA, `Scambio con ${squadraDi(s.a)?.nome ?? "—"}`); }

    /* Le scelte non si spostano di posto: cambia solo di chi sono. Una
       scelta resta sempre «la prima del 2028 del Borgo United» — è quello
       che la rende una cosa di cui si può parlare, e che negli anni si
       ricorda. */
    await muoviScelte([{ chiavi: s.scelteDa, aChi: s.a }, { chiavi: s.scelteA, aChi: s.da }]);

    await db.collection("scambi").doc(s.id).set({ ...s, stato: "ACCETTATO", chiusoIl: new Date().toISOString() });
    const quante = (c) => c?.length ? `${c.length} ${c.length === 1 ? "scelta" : "scelte"} al draft` : "";
    const nomi = (p, scelte) => [
      p.length ? p.map((c) => c.nome).join(", ") : "", quante(scelte),
    ].filter(Boolean).join(" + ") || "niente";
    await annota("scambio",
      `${squadraDi(s.da)?.nome} ↔ ${squadraDi(s.a)?.nome}: ${nomi(pacchettoDa, s.scelteDa)} per ${nomi(pacchettoA, s.scelteA)}`, s.a);
  });

  su("[data-rifiuta]", "click", async (e) => {
    const s = stato.scambi.find((x) => x.id === e.currentTarget.dataset.rifiuta);
    if (!s) return;
    await db.collection("scambi").doc(s.id).set({ ...s, stato: "RIFIUTATO", chiusoIl: new Date().toISOString() });
    await annota("scambio", `${squadraDi(s.a)?.nome} rifiuta lo scambio di ${squadraDi(s.da)?.nome}`, s.a);
  });

  su("[data-ritira-scambio]", "click", async (e) => {
    const s = stato.scambi.find((x) => x.id === e.currentTarget.dataset.ritiraScambio);
    if (!s) return;
    await db.collection("scambi").doc(s.id).set({ ...s, stato: "RITIRATO", chiusoIl: new Date().toISOString() });
    await annota("scambio", `${squadraDi(s.da)?.nome} ritira la sua proposta`, s.da);
  });
}

/* ── Gli effetti della società ────────────────────────────── */

function agganciaSocieta() {
  su("[data-stadio]", "click", async (e) => {
    const bottone = e.currentTarget;
    const livello = Number(bottone.dataset.stadio);
    const squadra = squadraCorrente();
    const s = societaDi(squadra.id);
    const salto = costoSalto(s.stadio, livello);
    const arrivo = stadioAl(livello);

    const domanda = salto.ricostruzione
      ? `Saltare al livello ${livello} vuol dire demolire e ricostruire da zero: ${soldi(aQuarti(salto.costo))}. Procedo?`
      : `Costruire lo stadio ${arrivo.nome} per ${soldi(aQuarti(salto.costo))}?`;
    if (!confirm(domanda)) return;

    bottone.disabled = true;
    try {
      await scriviSocieta(squadra.id, { stadio: livello });
      await muoviCapitale(squadra.id, -aQuarti(salto.costo),
        `${salto.ricostruzione ? "Ricostruzione" : "Costruzione"} stadio ${arrivo.nome}`);
    } catch (errore) {
      alert(errore.message ?? "Non è riuscito.");
      bottone.disabled = false;
    }
  });

  su("#amplia-vivaio", "click", async (e) => {
    const squadra = squadraCorrente();
    const s = societaDi(squadra.id);
    const ampliamento = costoAmpliamento(s.capienzaGiovanile);
    if (!ampliamento) return;
    if (!confirm(`Portare il settore giovanile a ${ampliamento.capienza} posti per ${soldi(aQuarti(ampliamento.costo))}? Poi costerà ${soldi(aQuarti(ampliamento.mantenimento))} l'anno.`)) return;

    e.currentTarget.disabled = true;
    try {
      await scriviSocieta(squadra.id, { capienzaGiovanile: ampliamento.capienza });
      await muoviCapitale(squadra.id, -aQuarti(ampliamento.costo),
        `Settore giovanile a ${ampliamento.capienza} posti`);
    } catch (errore) {
      alert(errore.message ?? "Non è riuscito.");
    }
  });

  su("[data-osservatore]", "click", async (e) => {
    const campionato = e.currentTarget.dataset.osservatore;
    const squadra = squadraCorrente();
    const s = societaDi(squadra.id);
    const scelto = REGOLE.capitale.osservatori.find((o) => o.campionato === campionato);
    if (!scelto || s.osservatori.includes(campionato)) return;
    if (!confirm(`Mandare un osservatore in ${campionato} per una stagione? Costa ${soldi(aQuarti(scelto.costo))}.`)) return;

    e.currentTarget.disabled = true;
    try {
      await scriviSocieta(squadra.id, { osservatori: [...s.osservatori, campionato] });
      await muoviCapitale(squadra.id, -aQuarti(scelto.costo), `Osservatore su ${campionato}`);
    } catch (errore) {
      alert(errore.message ?? "Non è riuscito.");
    }
  });

  const moduloCapitale = radice.querySelector("#modulo-capitale");
  if (moduloCapitale) moduloCapitale.addEventListener("submit", async (e) => {
    e.preventDefault();
    const causale = radice.querySelector("#cap-causale").value.trim();
    /* Il meno lungo «−» si scrive facilmente col telefono e non è un meno. */
    const scritto = radice.querySelector("#cap-importo").value.replace("−", "-").replace(",", ".");
    const importo = Number(scritto);
    if (!causale || !Number.isFinite(importo) || importo === 0) { alert("Servono una causale e un importo diverso da zero."); return; }
    try {
      await muoviCapitale(squadraCorrente().id, aQuarti(importo), causale);
    } catch (errore) {
      alert(errore.message ?? "Non è riuscito.");
    }
  });
}

/** I risultati della ricerca dentro la pagina Rosa. Non passa dal
 *  disegno generale: il campo perderebbe il fuoco a ogni lettera. */
function mostraRisultatiRosa(testo) {
  const zona = radice.querySelector("#risultati-rosa");
  if (!zona) return;
  const cercato = testo.trim().toLowerCase();
  if (cercato.length < 2) { zona.innerHTML = ""; return; }

  const presi = tesserati();
  const trovati = LISTONE
    .filter((g) => !presi.has(g.id) && g.nome.toLowerCase().includes(cercato))
    .slice(0, 8);

  zona.innerHTML = trovati.length
    ? `<div class="elenco" style="margin-top:10px">${trovati.map((g) => `
        <button class="voce" data-giocatore="${pulito(g.id)}">
          <span class="ruolo ${g.ruolo}">${g.ruolo}</span>
          <span class="corpo"><span class="nome">${pulito(g.nome)} <span class="mantra">${pulito(scriviMantra(g))}</span></span>
            <span class="dettaglio">${pulito(g.squadra)}${g.eta != null ? ` · ${g.eta} anni` : ""}</span></span>
          <span class="coda"><span class="prezzo num">${g.quotazione} M</span></span>
        </button>`).join("")}</div>`
    : `<div class="vuoto riquadro" style="margin-top:10px">Nessun giocatore libero con questo nome.</div>`;

  zona.querySelectorAll("[data-giocatore]").forEach((b) =>
    b.addEventListener("click", () => {
      bozza = { tipo: "ANNUALE", anni: 1, ingaggio: "" };
      if (siamoAlMercato()) {
        const aperta = trattativaAperta(b.dataset.giocatore);
        apriFoglio({ tipo: "busta", trattativaId: aperta?.id ?? null, giocatoreId: b.dataset.giocatore });
      } else {
        apriFoglio({ tipo: "firma", giocatoreId: b.dataset.giocatore });
      }
    }));
}

/** Mette il giocatore in rosa, se le regole lo consentono. */
async function firma() {
  const g = PER_ID.get(foglioAperto.giocatoreId);
  const squadra = squadraCorrente();
  const contratti = rosaDi(squadra.id);
  const conto = contoDi(squadra.id);
  const ingaggio = aQuarti(bozza.ingaggio);

  const motivi = perchéNo({
    giocatore: g, tipo: bozza.tipo, ingaggio, ingaggioScritto: Number(bozza.ingaggio), anni: bozza.anni, conto,
    contrattiTampone: contratti.filter((c) => c.tipo === "TAMPONE").length,
  });
  if (motivi.length) { disegna(); return; }

  /* Chi promuove dal proprio vivaio sta tesserando uno che è già suo: è il
     diritto di prelazione, e il controllo di sotto lo scambierebbe per un
     furto altrui se non lo si mettesse da parte prima. */
  const daVivaio = foglioAperto?.daVivaio
    ? vivaioDi(squadra.id).find((x) => x.giocatoreId === g.id) ?? null
    : null;

  /* Qualcuno potrebbe averlo appena preso: l'ultima parola è al database. */
  if (!daVivaio && tesserati().has(g.id)) {
    alert(`${g.nome} è appena stato preso da un'altra squadra.`);
    chiudiFoglio();
    return;
  }

  const nuovo = {
    giocatoreId: g.id, nome: g.nome, ruolo: g.ruolo,
    tipo: bozza.tipo, anni: bozza.anni, ingaggio,
    firmato: new Date().toISOString(),
    ...(daVivaio ? { dalVivaio: true } : {}),
  };
  /* Una sola scrittura: se viene dal vivaio, il posto si libera nello stesso
     momento in cui nasce il contratto. */
  await scriviRosa(squadra.id, [...contratti, nuovo], pesiMortiDi(squadra.id),
    daVivaio ? vivaioDi(squadra.id).filter((x) => x.giocatoreId !== g.id) : undefined);

  /* Se la firma nasce da un turno di draft, quel turno si consuma: la
     scelta porta il nome di chi è stato preso e non torna più libera. */
  const daDraft = foglioAperto?.daDraft;
  if (daDraft) {
    const d = stato.draft.get(daDraft.draft);
    if (d) {
      const scelte = d.scelte.map((x) => x.numero === daDraft.numero
        ? { ...x, giocatoreId: g.id, nome: g.nome, quando: new Date().toISOString() } : x);
      const finite = scelte.every((x) => x.giocatoreId);
      await db.doc(`draft/${d.id}`).update({
        scelte, ...(finite ? { stato: "CHIUSO", chiusoIl: new Date().toISOString() } : {}),
      });
    }
  }

  await annota(daDraft ? "draft" : daVivaio ? "vivaio" : "contratto",
    daDraft
      ? `Draft ${daDraft.stagione}, scelta ${daDraft.numero}: ${g.nome} a ${squadra.nome} per ${soldi(ingaggio)}`
      : daVivaio
      ? `${squadra.nome} esercita la prelazione su ${g.nome}: dal vivaio alla rosa per ${soldi(ingaggio)} × ${bozza.anni} ${bozza.anni === 1 ? "anno" : "anni"}`
      : `${g.nome} a ${squadra.nome} per ${soldi(ingaggio)} × ${bozza.anni} ${bozza.anni === 1 ? "anno" : "anni"} (${REGOLE.contratti[bozza.tipo].nome})`,
    squadra.id);
  chiudiFoglio();
}

/* ── Gestione: squadre, nome della lega, azzeramento ──────── */

function agganciaGestione() {
  su("#aggiungi-squadra", "click", () => apriFoglio({ tipo: "squadra", squadraId: null }));
  su("[data-modifica]", "click", (e) => apriFoglio({ tipo: "squadra", squadraId: e.currentTarget.dataset.modifica }));

  /* I colori delle maglie: dieci tinte distinguibili a colpo d'occhio nella
     schermata d'ingresso, dove le squadre si riconoscono dalla sigla colorata. */
  const COLORI = ["#2C7A52", "#1B4A76", "#7C2620", "#6A4708", "#4A2A6B",
                  "#1F6B6B", "#8A3B6B", "#3E5C1E", "#8A4B12", "#2E3B7A"];

  /** La sigla si ricava dal nome: iniziali se ci sono più parole, prime tre
   *  lettere se è una sola. Si corregge a mano dalla scheda della squadra. */
  function siglaDa(nome) {
    const parole = nome.split(/[\s'']+/).filter(Boolean);
    if (parole.length >= 2) return parole.slice(0, 3).map((p) => p[0]).join("").toUpperCase();
    return nome.slice(0, 3).toUpperCase();
  }

  const moduloIscrizioni = radice.querySelector("#modulo-iscrizioni");
  if (moduloIscrizioni) moduloIscrizioni.addEventListener("submit", async (e) => {
    e.preventDefault();
    const esito = radice.querySelector("#esito-iscrizioni");
    const righe = radice.querySelector("#elenco-squadre").value
      .split("\n").map((r) => r.trim()).filter(Boolean);

    if (!righe.length) {
      esito.innerHTML = `<div class="avviso errore">Scrivi almeno una squadra, una per riga.</div>`;
      return;
    }
    const nomi = righe.map((r) => r.split(",")[0].trim());
    if (new Set(nomi.map((n) => n.toLowerCase())).size !== nomi.length) {
      esito.innerHTML = `<div class="avviso errore">Ci sono due squadre con lo stesso nome: nella lega i nomi sono unici.</div>`;
      return;
    }

    e.submitter && (e.submitter.disabled = true);
    for (const [indice, riga] of righe.entries()) {
      const [nome, presidente] = riga.split(",").map((x) => (x ?? "").trim());
      const id = "s" + (indice + 1);
      await scriviSquadra({
        id, nome, sigla: siglaDa(nome), presidente: presidente ?? "",
        pin: CODICE_PREDEFINITO, colore: COLORI[indice % COLORI.length], ordine: indice + 1,
      });
      /* La dotazione dell'art. 14 nasce con la squadra, e si vede nel registro:
         un capitale che compare senza una riga che lo spieghi è un capitale su
         cui prima o poi qualcuno discute. */
      await scriviSocieta(id, { capitale: aQuarti(REGOLE.capitale.dotazione) });
      await annota("lega", `${nome} iscritta con ${soldi(aQuarti(REGOLE.capitale.dotazione))} di dotazione`, id);
    }
  });

  su("#codice-uguale", "click", async (e) => {
    e.currentTarget.disabled = true;
    const daCambiare = stato.squadre.filter((s) => s.pin !== CODICE_PREDEFINITO);
    for (const s of daCambiare) await scriviSquadra({ ...s, pin: CODICE_PREDEFINITO });
    await annota("lega", `Codice ${CODICE_PREDEFINITO} per tutte le squadre`, null);
  });

  const moduloSquadra = radice.querySelector("#modulo-squadra");
  if (moduloSquadra) moduloSquadra.addEventListener("submit", async (e) => {
    e.preventDefault();
    const id = moduloSquadra.dataset.id || "s" + Date.now().toString(36);
    const nuova = !moduloSquadra.dataset.id;
    const squadra = {
      id,
      nome: radice.querySelector("#sq-nome").value.trim(),
      sigla: radice.querySelector("#sq-sigla").value.trim().toUpperCase(),
      presidente: radice.querySelector("#sq-presidente").value.trim(),
      pin: radice.querySelector("#sq-pin")?.value.trim() ?? squadraDi(id)?.pin ?? CODICE_PREDEFINITO,
      colore: radice.querySelector("#sq-colore").value,
      ordine: squadraDi(id)?.ordine ?? stato.squadre.length + 1,
    };
    if (serveIlCodice() && !/^[0-9]{4}$/.test(squadra.pin)) { alert("Il codice è di quattro cifre."); return; }
    await scriviSquadra(squadra);
    if (nuova) {
      await scriviSocieta(id, { capitale: aQuarti(REGOLE.capitale.dotazione) });
      await annota("lega", `${squadra.nome} iscritta con ${soldi(aQuarti(REGOLE.capitale.dotazione))} di dotazione`, id);
    } else {
      await annota("lega", `${squadra.nome} aggiornata`, id);
    }
    chiudiFoglio();
  });

  su("[data-ritira]", "click", async (e) => {
    const id = e.currentTarget.dataset.ritira;
    const squadra = squadraDi(id);
    if (!confirm(`Ritirare ${squadra.nome} dalla lega?`)) return;
    await db.collection("squadre").doc(id).delete();
    await db.collection("rose").doc(id).delete().catch(() => {});
    await db.collection("societa").doc(id).delete().catch(() => {});
    await annota("lega", `${squadra.nome} ritirata dalla lega`, null);
    chiudiFoglio();
  });

  su("[data-codice]", "click", async (e) => {
    const chiedi = e.currentTarget.dataset.codice === "si";
    if (chiedi === serveIlCodice()) return;
    await db.doc("lega/config").update({ chiediCodice: chiedi });
    await annota("lega", chiedi
      ? "Per entrare adesso serve il codice della squadra"
      : "Per entrare basta toccare la propria squadra", null);
  });

  su("[data-fase]", "click", async (e) => {
    const nuova = e.currentTarget.dataset.fase;
    if (nuova === fase()) return;
    await db.doc("lega/config").update({ fase: nuova });
    await annota("lega", nuova === "MERCATO"
      ? "Mercato aperto: sui liberi si depositano buste"
      : "Si compongono le rose: dal listone si firma subito", null);
  });

  su("[data-posizione]", "change", async (e) => {
    const squadra = squadraDi(e.currentTarget.dataset.posizione);
    const valore = e.currentTarget.value.trim();
    if (!squadra) return;
    const posizione = valore === "" ? null : Number(valore);
    await scriviSquadra({ ...squadra, posizione });
  });

  const fileQuotazioni = radice.querySelector("#file-quotazioni");
  if (fileQuotazioni) fileQuotazioni.addEventListener("change", async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const dillo = (tipo, testo) => { stato.esitoQuotazioni = { tipo, testo }; disegna(); };
    dillo("neutro", `Leggo ${pulito(file.name)}…`);
    try {
      const righe = await leggiFoglio(file);
      if (!righe.length) {
        dillo("errore", `Non ho trovato nessuna riga con una colonna «Nome».
          Controlla di aver scaricato il file delle quotazioni.`);
        return;
      }
      const letto = leggiQuotazioni(righe);
      const quanti = Object.keys(letto.quotazioni).length;
      if (!quanti && !letto.nuovi.length) {
        dillo("errore", `Ho letto ${letto.lette} righe ma nessuna quotazione:
          manca la colonna «Qt.A» o l'identificativo.`);
        return;
      }

      await db.doc("listone/aggiornamento").set({
        quando: new Date().toISOString(),
        file: file.name,
        quotazioni: letto.quotazioni,
        mantra: letto.mantra,
        nuovi: letto.nuovi,
      });
      await annota("listone",
        `Quotazioni aggiornate da ${file.name}: ${quanti} giocatori${letto.nuovi.length ? `, ${letto.nuovi.length} nuovi nel listone` : ""}`,
        null);
      dillo("bene", `${quanti} quotazioni aggiornate${
        letto.nuovi.length ? ` · ${letto.nuovi.length} giocatori nuovi nel listone` : ""}${
        letto.senzaId ? ` · ${letto.senzaId} righe saltate perché senza identificativo` : ""}.`);
    } catch (errore) {
      dillo("errore", `Non sono riuscito a leggere il file: ${pulito(errore.message ?? errore)}`);
    }
  });

  su("#esegui-passaggi", "click", async (e) => {
    if (!sonoCommissioner()) return;
    const promesse = stato.offerte.filter((o) => o.stato === "VINTA");
    if (!promesse.length) return;
    if (!confirm(`Sposto ${promesse.length} ${promesse.length === 1 ? "giocatore" : "giocatori"} con il contratto offerto. Procedo?`)) return;
    e.currentTarget.disabled = true;

    const fermi = [];
    for (const o of promesse) {
      const vecchia = rosaDi(o.proprietaria);
      const contratto = vecchia.find((c) => c.giocatoreId === o.giocatoreId);
      if (!contratto) { fermi.push(`${o.nome}: non è più nella rosa di partenza.`); continue; }

      /* Il conto di chi lo riceve si fa adesso, non quando l'offerta è nata:
         nel frattempo può aver firmato altri dieci e non averci più posto. */
      const conto = contoDi(o.daChi);
      const motivi = perchéNo({
        giocatore: PER_ID.get(o.giocatoreId), tipo: o.tipo, ingaggio: o.ingaggio,
        ingaggioScritto: aMilioni(o.ingaggio), anni: o.anni, conto,
        contrattiTampone: rosaDi(o.daChi).filter((c) => c.tipo === "TAMPONE").length,
      });
      if (motivi.length) { fermi.push(`${o.nome} → ${squadraDi(o.daChi)?.nome}: ${motivi[0]}`); continue; }

      await scriviRosa(o.proprietaria, vecchia.filter((c) => c.giocatoreId !== o.giocatoreId));
      await scriviRosa(o.daChi, [...rosaDi(o.daChi), {
        giocatoreId: o.giocatoreId, nome: o.nome, ruolo: o.ruolo,
        tipo: o.tipo, anni: o.anni, ingaggio: o.ingaggio,
        firmato: new Date().toISOString(), daOfferta: true,
      }]);
      await db.collection("offerte").doc(o.id).set({ ...o, stato: "ESEGUITA", eseguita: new Date().toISOString() });
      await annota("offerta",
        `${o.nome} passa a ${squadraDi(o.daChi)?.nome} per ${soldi(o.ingaggio)} × ${o.anni}: nessuno aveva pareggiato`,
        o.daChi);
    }
    if (fermi.length) alert("Questi passaggi non si sono potuti fare:\n\n" + fermi.join("\n"));
  });

  su("#parte-per-estero", "click", async () => {
    const scelta = radice.querySelector("#chi-parte")?.value;
    if (!scelta) { alert("Scegli chi è partito."); return; }
    const [squadraId, giocatoreId, dove] = scelta.split("|");
    const squadra = squadraDi(squadraId);
    const contratto = rosaDi(squadraId).find((c) => c.giocatoreId === giocatoreId);
    const peso = pesiMortiDi(squadraId).find((x) => x.giocatoreId === giocatoreId);
    const chi = contratto?.nome ?? peso?.nome ?? "—";
    const quanto = (dove === "rosa" ? contratto?.ingaggio : peso?.ingaggio) ?? 0;
    if (!confirm(
      `${chi} lascia la Serie A.\n\n` +
      `${squadra?.nome} libera ${soldi(quanto)} di tetto oggi stesso` +
      (dove === "rosa" ? " e un posto in rosa" : "") + `. Non va in waiver: è fuori dal listone.\n\nProcedo?`
    )) return;

    /* Si toglie da tutt'e due i posti in cui poteva stare: chi era già stato
       svincolato e poi parte non deve continuare a pesare. */
    await scriviRosa(squadraId,
      rosaDi(squadraId).filter((c) => c.giocatoreId !== giocatoreId),
      pesiMortiDi(squadraId).filter((x) => x.giocatoreId !== giocatoreId));
    await annota("lega",
      `${chi} lascia la Serie A: ${squadra?.nome} libera ${soldi(quanto)} subito`, squadraId);
  });

  su("#libera-pesi", "click", async (e) => {
    /* Non si cancella tutto: chi ha spalmato se lo porta dietro. Scalano di
       una stagione, e spariscono quando arrivano a zero — se sparissero
       tutti insieme, la spalmatura sarebbe uno sconto e non una dilazione. */
    let liberato = 0, restano = 0;
    const dopo = new Map();
    for (const s of stato.squadre) {
      const pesi = pesiMortiDi(s.id);
      if (!pesi.length) continue;
      const tenuti = [];
      for (const x of pesi) {
        const anni = (Number(x.anni) || 1) - 1;
        if (anni > 0) { tenuti.push({ ...x, anni }); restano += x.ingaggio; }
        else liberato += x.ingaggio;
      }
      dopo.set(s.id, tenuti);
    }
    if (!dopo.size) return;
    if (!confirm(
      `Fine stagione: libero ${soldi(liberato)} di ingaggi svincolati.` +
      (restano ? `\n\n${soldi(restano)} restano: sono gli svincoli spalmati, che scalano di una stagione.` : "") +
      `\n\nProcedo?`
    )) return;
    e.currentTarget.disabled = true;
    for (const [id, tenuti] of dopo) await scriviRosa(id, rosaDi(id), tenuti);
    await annota("lega",
      `Fine stagione: liberati ${soldi(liberato)} di ingaggi svincolati` +
      (restano ? `, ${soldi(restano)} spalmati restano in carico` : ""), null);
  });

  su("#salva-lega", "click", async () => {
    const nome = radice.querySelector("#rinomina-lega").value.trim();
    if (!nome) return;
    await db.doc("lega/config").update({ nome });
    await annota("lega", `La lega si chiama «${nome}»`, null);
  });

  su("#azzera", "click", async () => {
    const scritto = radice.querySelector("#conferma-azzera").value.trim();
    if (scritto !== stato.config.nome) { alert("Scrivi il nome della lega per confermare."); return; }
    if (!confirm("Cancello squadre, rose e registro. Il listone resta. Procedo?")) return;
    for (const s of stato.squadre) {
      await db.collection("rose").doc(s.id).delete().catch(() => {});
      await db.collection("societa").doc(s.id).delete().catch(() => {});
      await db.collection("squadre").doc(s.id).delete().catch(() => {});
    }
    const vecchie = await db.collection("registro").limit(500).get();
    for (const d of vecchie.docs) await db.collection("registro").doc(d.id).delete().catch(() => {});
    await annota("lega", "La lega è stata riportata a zero", null);
    stato.vista = "lega";
    disegna();
  });
}

/* ═══════════════════════════════════════════════════════════════
   AVVIO
   ═══════════════════════════════════════════════════════════════ */

riprendiIo();
disegna();

(async () => {
  /* Quattro situazioni, un solo avvio:
     · il sito pubblico, dove il database è Firebase e arriva da una promessa
       (`DYNASTY_DB_ATTESA`) perché la libreria si carica dopo questo script;
     · la demo, che ne mette uno finto su `window.DYNASTY_DB`;
     · la lega su claude.ai, dove il database lo dà la piattaforma;
     · la pagina aperta da sola, dove `claude` non esiste affatto e l'unica
       cosa sensata è dirlo invece di rompersi.
     Nessuna di queste tocca `window.claude`, che è della piattaforma e in un
     artifact pubblicato non si lascia sostituire. */
  db = (window.DYNASTY_DB_ATTESA ? await window.DYNASTY_DB_ATTESA : null)
    ?? window.DYNASTY_DB
    ?? (typeof claude !== "undefined" ? await claude.use("db") : null);
  if (!db) { stato.pronto = true; disegna(); return; }
  ascolta();
})();
</script>
