/* ── Pagina: la lega ──────────────────────────────────────── */

function paginaLega() {
  if (stato.squadre.length === 0) {
    return `<h1>${pulito(stato.config.nome)}</h1>
      <div class="vuoto riquadro" style="margin-top:16px">
        Nessuna squadra iscritta.${sonoCommissioner() ? " Vai in Gestione e iscrivi i presidenti." : " Il commissioner deve ancora iscriverle."}
      </div>`;
  }

  const righe = stato.squadre.map((s) => {
    const conto = contoDi(s.id);
    const quota = Math.min(100, Math.round((conto.speso / conto.tetto) * 100));
    const stato_ =
      conto.sforato ? `<span class="targhetta no">sfora di ${soldi(conto.speso - conto.tetto)}</span>`
      : conto.numero >= REGOLE.rosaMin ? `<span class="targhetta ok">rosa completa</span>`
      : `<span class="targhetta forse">${conto.postiDaRiempire} da prendere</span>`;
    return `<tr>
      <td><b>${pulito(s.nome)}</b><br><span style="font-size:12px;color:var(--luce-media)">${pulito(s.presidente || "—")}</span></td>
      <td class="n num">${conto.numero}</td>
      <td class="n num">${soldi(conto.ingaggi)}</td>
      <td class="n num" style="color:${conto.pesoMorto > 0 ? "var(--allarme)" : "var(--luce-fioca)"}">${conto.pesoMorto > 0 ? soldi(conto.pesoMorto) : "—"}</td>
      <td class="n num" style="color:${conto.sforato ? "var(--allarme)" : "inherit"}">${soldi(conto.spazio)}</td>
      <td class="n num">${conto.slotUsati}/${REGOLE.slotPluriennali}</td>
      <td>${stato_}<div class="barra-tetto" style="margin-top:6px;height:5px"><span class="${conto.sforato ? "sforato" : ""}" style="width:${quota}%"></span></div></td>
    </tr>`;
  }).join("");

  const tesserati_ = tesserati().size;

  return `
    <h1>${pulito(stato.config.nome)}</h1>
    <p style="color:var(--luce-media); margin:6px 0 18px">
      ${stato.squadre.length} squadre · ${tesserati_} giocatori sotto contratto ·
      ${LISTONE.length - tesserati_} ancora liberi
    </p>
    <div class="riquadro scorre">
      <table class="tabellina">
        <thead><tr>
          <th>Squadra</th><th style="text-align:right">Rosa</th><th style="text-align:right">Ingaggi</th>
          <th style="text-align:right">Svincolati</th>
          <th style="text-align:right">Spazio</th><th style="text-align:right">Slot</th><th>Tetto</th>
        </tr></thead>
        <tbody>${righe}</tbody>
      </table>
    </div>
    <p style="font-size:12.5px;color:var(--luce-media);margin-top:12px">
      Tetto salariale ${REGOLE.tetto} M · rosa da ${REGOLE.rosaMin} a ${REGOLE.rosaMax} ·
      ${REGOLE.slotPluriennali} slot pluriennali · nessun minimo per ruolo
    </p>`;
}

/* ── Pagina: la rosa ──────────────────────────────────────── */

function paginaRosa() {
  const squadra = squadraCorrente();
  if (!squadra) {
    return `<h1>Rosa</h1><div class="vuoto riquadro" style="margin-top:16px">
      Nessuna squadra da mostrare.</div>`;
  }

  const contratti = rosaDi(squadra.id);
  const pesiMorti = pesiMortiDi(squadra.id);
  const conto = contoRosa(contratti, pesiMorti);
  const posso = possoToccare(squadra.id);
  const quota = Math.min(100, Math.round((conto.speso / conto.tetto) * 100));

  /* Il commissioner lavora su qualunque rosa: gli serve un selettore. */
  const selettore = sonoCommissioner()
    ? `<label class="campo" style="margin-bottom:14px"><span>Squadra su cui lavori</span>
        <select id="scegli-squadra">
          ${stato.squadre.map((s) => `<option value="${pulito(s.id)}" ${s.id === squadra.id ? "selected" : ""}>${pulito(s.nome)}</option>`).join("")}
        </select></label>`
    : "";

  /* Com'è fatta la rosa, non com'è obbligata a essere: la lega non impone
     minimi per ruolo, quindi questi numeri raccontano e non giudicano.
     Reparti e ruoli Mantra stanno sulla stessa riga: erano due griglie che
     dicevano la stessa cosa, e la prima non ci stava nemmeno in larghezza. */
  const perRuolo = ORDINE_RUOLI.map((r) => `<span class="conta-ruolo reparto ${r}">
      <b>${r}</b> ${conto.perRuolo[r] ?? 0}</span>`).join("");

  /* I ruoli Mantra che hai in rosa. Un giocatore ne copre spesso due, quindi la
     somma supera il numero dei giocatori: è giusto così, ed è il motivo per cui
     serve guardarli — sapere di avere otto difensori non dice se puoi schierare
     una difesa a tre. */
  const conteggioMantra = {};
  for (const c of contratti) {
    for (const r of PER_ID.get(c.giocatoreId)?.mantra ?? []) conteggioMantra[r] = (conteggioMantra[r] ?? 0) + 1;
  }
  const rigaMantra = ORDINE_MANTRA.filter((r) => conteggioMantra[r])
    .map((r) => `<span class="conta-ruolo" title="${pulito(RUOLI_MANTRA[r]?.nome ?? r)}">
       <b>${r}</b> ${conteggioMantra[r]}</span>`).join("");

  const inRosa = [...contratti]
    .sort((a, b) => ORDINE_RUOLI.indexOf(a.ruolo) - ORDINE_RUOLI.indexOf(b.ruolo) || b.ingaggio - a.ingaggio)
    .map((c) => {
      const g = PER_ID.get(c.giocatoreId);
      const regola = REGOLE.contratti[c.tipo];
      return `<div class="voce">
        <span class="ruolo ${c.ruolo}">${c.ruolo}</span>
        <span class="corpo">
          <span class="nome">${pulito(c.nome)} <span class="mantra">${pulito(scriviMantra(g ?? {}))}</span></span>
          <span class="dettaglio">
            ${pulito(g?.squadra ?? "")}
            <span class="targhetta contratto">${pulito(regola?.nome ?? c.tipo)}${c.anni > 1 ? " · " + c.anni + " anni" : ""}</span>
          </span>
        </span>
        <span class="coda">
          <span class="prezzo num">${soldi(c.ingaggio)}</span>
          ${posso ? `<button class="bottone piccolo" data-togli="${pulito(c.giocatoreId)}">Togli</button>` : ""}
        </span>
      </div>`;
    }).join("");

  const avvisi = [];
  if (conto.sforato) {
    avvisi.push(`<div class="avviso errore">La rosa sfora il tetto di ${soldi(conto.speso - conto.tetto)}.</div>`);
  }
  if (conto.numero > 0 && conto.numero < REGOLE.rosaMin) {
    avvisi.push(`<div class="avviso attenzione">Mancano ${conto.postiDaRiempire}
      ${conto.postiDaRiempire === 1 ? "giocatore" : "giocatori"} per arrivare al minimo di
      ${REGOLE.rosaMin}. Che ruoli siano lo decidi tu.</div>`);
  }
  if (conto.numero >= REGOLE.rosaMin && !conto.sforato) {
    avvisi.push(`<div class="avviso bene">Rosa a posto: ${conto.numero} giocatori su un massimo
      di ${REGOLE.rosaMax}, tetto rispettato.</div>`);
  }

  return `
    <p class="occhiello">${pulito(squadra.nome)}</p>
    <h1 style="margin:6px 0 18px">La tua <span class="acceso">rosa</span></h1>
    ${selettore}

    <div class="tetto ${conto.sforato ? "sforato" : ""}" style="margin-bottom:14px">
      <div style="flex:1 1 148px;min-width:0">
        <div class="occhiello" style="color:inherit;opacity:.6">Spazio salariale</div>
        <div class="cifra num">${soldi(conto.spazio)}</div>
        <div class="sotto num">${soldi(conto.speso)} spesi su ${REGOLE.tetto} M di tetto${
          conto.pesoMorto > 0 ? `, di cui ${soldi(conto.pesoMorto)} di svincolati` : ""}</div>
      </div>
      <div style="flex:1 1 104px;min-width:0">
        <div class="occhiello" style="color:inherit;opacity:.6">In rosa</div>
        <div class="cifra num" style="font-size:clamp(26px,7vw,34px)">${conto.numero}<span style="font-size:17px;opacity:.6">/${REGOLE.rosaMin}</span></div>
        <div class="sotto">${conto.slotLiberi} slot pluriennali liberi</div>
      </div>
      <div class="barra-tetto"><span class="${conto.sforato ? "sforato" : ""}" style="width:${quota}%"></span></div>
    </div>

    <div class="filtri scorrevoli" style="margin-bottom:16px">${perRuolo}${
      rigaMantra ? `<span class="separa-ruoli"></span>${rigaMantra}` : ""}</div>
    ${avvisi.length ? `<div style="display:flex;flex-direction:column;gap:8px;margin-bottom:16px">${avvisi.join("")}</div>` : ""}

    ${posso ? `<div class="sezione">
      <div class="intestazione-sezione"><h2>Aggiungi dal listone</h2></div>
      <input type="search" id="cerca-per-rosa" placeholder="Cerca il giocatore che hai preso"
             autocomplete="off" spellcheck="false">
      <div id="risultati-rosa"></div>
    </div>` : `<div class="avviso neutro" style="margin-bottom:16px">
      Stai guardando la rosa di un'altra squadra: puoi leggerla, non cambiarla.</div>`}

    ${pesiMorti.length ? `<div class="sezione">
      <div class="intestazione-sezione"><h2>Pesano ancora</h2>
        <span class="conteggio">${soldi(conto.pesoMorto)}</span></div>
      <p style="font-size:13px;color:var(--luce-media);margin-bottom:10px">
        Giocatori che hai svincolato. Non sono più in rosa, ma il loro ingaggio resta sul tetto
        fino a fine stagione: il posto si libera, lo spazio no.
      </p>
      <div class="elenco">${pesiMorti.map((x) => `<div class="voce">
        <span class="ruolo ${pulito(x.ruolo)}" style="opacity:.55">${pulito(x.ruolo)}</span>
        <span class="corpo">
          <span class="nome" style="color:var(--luce-media)">${pulito(x.nome)}</span>
          <span class="dettaglio">svincolato il ${new Date(x.svincolato).toLocaleDateString("it-IT", { day: "numeric", month: "long" })}</span>
        </span>
        <span class="coda"><span class="prezzo num" style="color:var(--allarme)">${soldi(x.ingaggio)}</span></span>
      </div>`).join("")}</div>
    </div>` : ""}

    <div class="sezione">
      <div class="intestazione-sezione"><h2>Sotto contratto</h2>
        <span class="conteggio">${conto.numero}</span></div>
      ${contratti.length ? `<div class="elenco">${inRosa}</div>`
        : `<div class="vuoto riquadro">Ancora nessuno. Cerca qui sopra il primo giocatore.</div>`}
    </div>`;
}

/* ── Pagina: il listone ───────────────────────────────────── */

const filtri = { testo: "", ruolo: null, mantra: null, soloPrimavera: false, soloLiberi: true, etaMax: null };

function listoneFiltrato() {
  const presi = tesserati();
  const testo = filtri.testo.trim().toLowerCase();
  return LISTONE.filter((g) => {
    if (filtri.soloLiberi && presi.has(g.id)) return false;
    if (filtri.ruolo && g.ruolo !== filtri.ruolo) return false;
    if (filtri.mantra && !(g.mantra ?? []).includes(filtri.mantra)) return false;
    if (filtri.etaMax != null && (g.eta == null || g.eta > filtri.etaMax)) return false;
    if (filtri.soloPrimavera && primavera(g).stato === "no") return false;
    if (testo && !g.nome.toLowerCase().includes(testo) && !g.squadra.toLowerCase().includes(testo)) return false;
    return true;
  });
}

function bloccoListone({ soloLettura = false } = {}) {
  const trovati = listoneFiltrato();
  const presi = tesserati();
  const mostrati = trovati.slice(0, 120);

  const righe = mostrati.map((g) => {
    const p = primavera(g);
    const squadraId = presi.get(g.id);
    const suaSquadra = squadraId ? squadraDi(squadraId) : null;
    const etichettaPrimavera =
      p.stato === "forse" ? `<span class="targhetta forse" title="${pulito(p.motivo)}">primavera?</span>` : "";
    return `<button class="voce" ${soloLettura ? "disabled" : `data-giocatore="${pulito(g.id)}"`}>
      <span class="ruolo ${g.ruolo}">${g.ruolo}</span>
      <span class="corpo">
        <span class="nome">${pulito(g.nome)} <span class="mantra">${pulito(scriviMantra(g))}</span></span>
        <span class="dettaglio">
          ${pulito(g.squadra)}${g.eta != null ? ` · ${g.eta} anni` : ` · <span style="color:var(--avviso)">età ignota</span>`}
          ${etichettaPrimavera}
          ${suaSquadra ? `<span class="targhetta neutra">${pulito(suaSquadra.nome)}</span>` : ""}
        </span>
      </span>
      <span class="coda"><span class="prezzo num">${g.quotazione} M</span></span>
    </button>`;
  }).join("");

  return `
    <input type="search" id="cerca-listone" value="${pulito(filtri.testo)}"
           placeholder="Cerca per cognome o squadra" autocomplete="off" spellcheck="false">
    <div class="filtri scorrevoli">
      <button class="pillola" data-ruolo="" aria-pressed="${!filtri.ruolo && !filtri.mantra}">Tutti</button>
      ${ORDINE_RUOLI.map((r) => `<button class="pillola" data-ruolo="${r}" aria-pressed="${filtri.ruolo === r}">${NOME_RUOLO_PL[r][0].toUpperCase() + NOME_RUOLO_PL[r].slice(1)}</button>`).join("")}
    </div>
    <div class="filtri scorrevoli">
      ${ORDINE_MANTRA.map((r) => `<button class="pillola mantra-filtro" data-mantra="${r}"
          aria-pressed="${filtri.mantra === r}" title="${pulito(RUOLI_MANTRA[r]?.nome ?? r)}">${r}</button>`).join("")}
    </div>
    <div class="filtri scorrevoli">
      <button class="pillola primavera" id="filtro-primavera" aria-pressed="${filtri.soloPrimavera}">Primavera</button>
      ${[21, 23, 26].map((e) => `<button class="pillola" data-eta="${e}" aria-pressed="${filtri.etaMax === e}">Under ${e + 1}</button>`).join("")}
      <button class="pillola" id="filtro-liberi" aria-pressed="${filtri.soloLiberi}">Solo liberi</button>
    </div>
    <p style="font-size:12.5px;color:var(--luce-media);margin:0 0 10px">
      ${trovati.length} giocatori${trovati.length > mostrati.length ? ` · ne vedi i primi ${mostrati.length}, restringi la ricerca` : ""}
    </p>
    ${trovati.length ? `<div class="elenco">${righe}</div>`
      : `<div class="vuoto riquadro">Nessun giocatore con questi filtri.</div>`}`;
}

function paginaListone() {
  return `
    <h1>Il <span class="acceso">listone</span></h1>
    <p style="color:var(--luce-media); font-size:13.5px; margin:6px 0 2px">
      ${LISTONE.length} giocatori di Serie A ${pulito(STAGIONE)}.
      <b>Primavera</b> = fino a ${REGOLE.primavera.etaMax} anni e non oltre
      ${REGOLE.primavera.quotazioneMax} M.
    </p>
    ${bloccoListone()}`;
}

/* ── Il foglio della firma ────────────────────────────────── */

/* Quello che si sta componendo nel foglio, finché non si firma. */
let bozza = { tipo: "ANNUALE", anni: 1, ingaggio: "" };

function disegnaFoglio() {
  if (foglioAperto?.tipo === "firma") return foglioFirma(foglioAperto.giocatoreId);
  if (foglioAperto?.tipo === "squadra") return foglioSquadra(foglioAperto.squadraId);
  if (foglioAperto?.tipo === "codice") return foglioCodice(foglioAperto.chi);
  if (foglioAperto?.tipo === "busta") return foglioBusta(foglioAperto.trattativaId, foglioAperto.giocatoreId);
  if (foglioAperto?.tipo === "scambio") return foglioScambio();
  if (foglioAperto?.tipo === "verdetto") return foglioVerdetto();
  return "";
}

function foglioFirma(giocatoreId) {
  const g = PER_ID.get(giocatoreId);
  const squadra = squadraCorrente();
  if (!g || !squadra) return "";

  const contratti = rosaDi(squadra.id);
  const conto = contoDi(squadra.id);
  const quantiTampone = contratti.filter((c) => c.tipo === "TAMPONE").length;
  const p = primavera(g);

  const tipi = Object.entries(REGOLE.contratti).map(([id, regola]) => {
    /* Un tipo che dipende dall'età si spegne da solo quando l'età non si
       conosce, e dice perché: meglio del rifiuto scoperto dopo. */
    const serveEtà = regola.etaMax != null || regola.etaMin != null;
    const impossibile =
      (serveEtà && g.eta == null) ? "serve l'età del giocatore"
      : (regola.etaMax != null && g.eta > regola.etaMax) ? `ne ha ${g.eta}, oltre i ${regola.etaMax}`
      : (regola.etaMin != null && g.eta < regola.etaMin) ? `ne ha ${g.eta}, sotto i ${regola.etaMin}`
      : (regola.slot && conto.slotLiberi < 1) ? "slot pluriennali finiti"
      : (id === "TAMPONE" && quantiTampone >= regola.maxStagione) ? "già usati tutti e tre"
      : null;
    return `<button type="button" class="scelta" data-tipo="${id}"
              aria-pressed="${bozza.tipo === id}" ${impossibile ? "disabled" : ""}>
        <b>${regola.nome}${impossibile ? ` — ${impossibile}` : ""}</b>
        <small>${regola.nota}</small>
      </button>`;
  }).join("");

  const regolaScelta = REGOLE.contratti[bozza.tipo];
  const sceltaAnni = regolaScelta.anni.length > 1
    ? `<label class="campo"><span>Per quanti anni</span>
        <div class="filtri" style="margin:0">
          ${regolaScelta.anni.map((a) => `<button type="button" class="pillola" data-anni="${a}" aria-pressed="${bozza.anni === a}">${a} anni</button>`).join("")}
        </div></label>`
    : "";

  /* Il preventivo: cosa costa negli anni, con la progressione del tipo. */
  const ingaggioQuarti = bozza.ingaggio === "" ? NaN : aQuarti(bozza.ingaggio);
  let preventivo = "";
  if (Number.isFinite(ingaggioQuarti) && ingaggioQuarti > 0 && bozza.anni > 1 && regolaScelta.tasso) {
    const anni = [];
    let corrente = ingaggioQuarti;
    for (let i = 0; i < bozza.anni; i++) {
      anni.push(`${LISTONE_GREZZO.annoInizio + i}/${String(LISTONE_GREZZO.annoInizio + 1 + i).slice(2)} · ${soldi(Math.round(corrente))}`);
      corrente = corrente * regolaScelta.tasso;
    }
    preventivo = `<div class="avviso neutro"><b>Quanto pesa negli anni</b><br>${anni.join(" &nbsp;·&nbsp; ")}</div>`;
  }

  const motivi = Number.isFinite(ingaggioQuarti) && ingaggioQuarti > 0
    ? perchéNo({ giocatore: g, tipo: bozza.tipo, ingaggio: ingaggioQuarti, ingaggioScritto: Number(bozza.ingaggio),
                 anni: bozza.anni, conto, contrattiTampone: quantiTampone })
    : [];

  return `<div class="velo" data-velo>
    <div class="foglio" role="dialog" aria-modal="true" aria-label="Firma di ${pulito(g.nome)}">
      <div class="foglio-testa">
        <span class="ruolo ${g.ruolo}" style="width:36px;height:36px;border-radius:9px">${g.ruolo}</span>
        <div>
          <h2>${pulito(g.nome)}</h2>
          <p style="font-size:13px;color:var(--luce-media)">
            ${(g.mantra ?? []).map((r) => pulito(RUOLI_MANTRA[r]?.nome ?? r)).join(" · ")}<br>
            ${pulito(g.squadra)} · quotato ${g.quotazione} M${g.eta != null ? ` · ${g.eta} anni al ${REGOLE.etaAl}` : " · età ignota"}
            ${p.stato === "forse" ? ` · <span style="color:var(--avviso)">primavera da verificare</span>` : ""}
          </p>
        </div>
        <button class="chiudi" data-chiudi aria-label="Chiudi">×</button>
      </div>

      <form id="modulo-firma" class="moduli">
        <label class="campo"><span>Quanto lo paghi — a passi di 0,25 M</span>
          <input type="number" id="ingaggio" step="0.25" min="0.25" max="${REGOLE.tetto}"
                 value="${pulito(bozza.ingaggio)}" placeholder="es. 3,5" inputmode="decimal" required></label>

        <div><span style="display:block;font-size:12px;font-weight:600;color:var(--luce-media);margin-bottom:6px">Che contratto</span>
          <div class="scelte">${tipi}</div></div>

        ${sceltaAnni}
        ${preventivo}
        ${motivi.length ? `<div class="avviso errore">${motivi.map(pulito).join("<br>")}</div>` : ""}

        <button class="bottone primario largo" type="submit"
          ${motivi.length || !Number.isFinite(ingaggioQuarti) || ingaggioQuarti <= 0 ? "disabled" : ""}>
          Metti in rosa${Number.isFinite(ingaggioQuarti) && ingaggioQuarti > 0 ? ` per ${soldi(ingaggioQuarti)}` : ""}
        </button>
        <p style="font-size:12px;color:var(--luce-media);text-align:center">
          Dopo la firma restano ${soldi(Math.max(0, conto.spazio - (Number.isFinite(ingaggioQuarti) ? ingaggioQuarti : 0)))} di spazio.
        </p>
      </form>
    </div></div>`;
}

/* ── Pagina: il mercato ───────────────────────────────────── */

function paginaMercato() {
  const squadra = squadraCorrente();
  const aperte = stato.mercato.filter((m) => m.stato === "APERTA").sort((a, b) => Date.parse(a.scadeIl) - Date.parse(b.scadeIl));
  const chiuse = stato.mercato.filter((m) => m.stato === "CHIUSA").sort((a, b) => Date.parse(b.chiusaIl ?? 0) - Date.parse(a.chiusaIl ?? 0)).slice(0, 12);
  const mieiScambi = stato.scambi.filter((s) => s.stato === "PROPOSTO" && (s.da === squadra?.id || s.a === squadra?.id));
  const altriScambi = stato.scambi.filter((s) => s.stato !== "PROPOSTO").sort((a, b) => Date.parse(b.proposto) - Date.parse(a.proposto)).slice(0, 8);
  const spese = squadra ? offerteSpeseDa(squadra.id) : 0;

  const schedaTrattativa = (m) => {
    const mia = (m.offerte ?? []).find((o) => o.squadraId === squadra?.id);
    const g = PER_ID.get(m.giocatoreId);
    const waiver = m.tipo === "WAIVER";
    return `<div class="voce">
      <span class="ruolo ${pulito(m.ruolo)}">${pulito(m.ruolo)}</span>
      <span class="corpo">
        <span class="nome">${pulito(m.nome)} <span class="mantra">${pulito(scriviMantra(g ?? {}))}</span></span>
        <span class="dettaglio">
          ${pulito(g?.squadra ?? "")}${g?.eta != null ? ` · ${g.eta} anni` : ""}
          <span class="targhetta ${waiver ? "forse" : "neutra"}">${waiver ? "waiver" : "free agency"}</span>
          <span class="targhetta neutra">${(m.offerte ?? []).length} ${(m.offerte ?? []).length === 1 ? "busta" : "buste"}</span>
        </span>
      </span>
      <span class="coda">
        <span style="font-size:12px;color:var(--luce-fioca);text-align:right">chiude<br>${fraQuanto(m.scadeIl)}</span>
        ${squadra && possoToccare(squadra.id)
          ? `<button class="bottone piccolo" data-offri="${pulito(m.id)}">${mia ? "Ritocca" : "Offri"}</button>` : ""}
      </span>
    </div>`;
  };

  const schedaChiusa = (m) => {
    const vincitrice = m.vincitore ? squadraDi(m.vincitore) : null;
    return `<div class="voce">
      <span class="ruolo ${pulito(m.ruolo)}">${pulito(m.ruolo)}</span>
      <span class="corpo">
        <span class="nome">${pulito(m.nome)}</span>
        <span class="dettaglio">
          ${vincitrice ? `a ${pulito(vincitrice.nome)}` : "nessuna offerta valida"}
          <span class="targhetta neutra">${(m.offerte ?? []).length} buste</span>
          ${m.scartate ? `<span class="targhetta forse">${m.scartate} non più valide</span>` : ""}
        </span>
      </span>
      <span class="coda">${vincitrice
        ? `<span class="prezzo num">${soldi(vincitoreFra(m.offerte ?? [])?.ingaggio ?? 0)}</span>`
        : `<span class="targhetta neutra">libero</span>`}</span>
    </div>`;
  };

  const schedaScambio = (s) => {
    const da = squadraDi(s.da), a = squadraDi(s.a);
    const nomi = (ids, squadraId) => ids.length
      ? ids.map((id) => pulito(rosaDi(squadraId).find((c) => c.giocatoreId === id)?.nome ?? PER_ID.get(id)?.nome ?? "—")).join(", ")
      : "—";
    const tocca = s.a === squadra?.id && possoToccare(squadra.id);
    return `<div class="riquadro" style="margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px">
        <b>${pulito(da?.nome ?? "—")} → ${pulito(a?.nome ?? "—")}</b>
        <span style="font-size:12px;color:var(--luce-fioca)">
          ${s.stato === "PROPOSTO" ? `scade ${fraQuanto(s.scadeIl)}` : pulito(s.stato.toLowerCase())}</span>
      </div>
      <div class="scorre"><table class="tabellina" style="margin-bottom:6px">
        <tr><td style="width:50%"><span class="occhiello">dà</span><br>${nomi(s.cedeDa, s.da)}
          ${s.capitaleDa ? `<br><span class="targhetta neutra">${soldi(s.capitaleDa)} di Capitale</span>` : ""}</td>
        <td><span class="occhiello">riceve</span><br>${nomi(s.cedeA, s.a)}
          ${s.capitaleA ? `<br><span class="targhetta neutra">${soldi(s.capitaleA)} di Capitale</span>` : ""}</td></tr>
      </table></div>
      ${tocca ? `<div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="bottone primario piccolo" data-accetta="${pulito(s.id)}">Accetta</button>
          <button class="bottone piccolo" data-rifiuta="${pulito(s.id)}">Rifiuta</button>
        </div>` : ""}
      ${s.da === squadra?.id && s.stato === "PROPOSTO"
        ? `<button class="bottone piccolo" data-ritira-scambio="${pulito(s.id)}">Ritira la proposta</button>` : ""}
    </div>`;
  };

  return `
    <h1>Il <span class="acceso">mercato</span></h1>
    <p style="color:var(--luce-media);margin:6px 0 14px">
      L'asta di settembre si fa al tavolo. Qui passa quello che viene dopo: i giocatori rimasti
      liberi, chi viene tagliato e gli scambi fra squadre.
      ${squadra ? `Hai speso <b>${spese}</b> offerte su ${REGOLE.mercato.offertePerStagione} (art. 9.1).` : ""}
    </p>

    <div class="avviso attenzione" style="margin-bottom:18px">
      <b>Le buste sono chiuse per accordo, non per crittografia.</b> L'applicazione non mostra a
      nessuno le offerte altrui prima dell'apertura, ma chi sa aprire il database della lega
      potrebbe leggerle. Fra dieci persone che si conoscono va bene saperlo, ed è giusto dirlo.
    </div>

    <div class="sezione">
      <div class="intestazione-sezione"><h2>Trattative aperte</h2>
        <span class="conteggio">${aperte.length}</span></div>
      ${aperte.length ? `<div class="elenco">${aperte.map(schedaTrattativa).join("")}</div>`
        : `<div class="vuoto riquadro">Nessuna trattativa aperta. Apri il <b>Listone</b>, scegli un
           giocatore libero e deposita la prima busta: gli altri avranno
           ${REGOLE.mercato.oreFreeAgency} ore per rilanciare.</div>`}
    </div>

    <div class="sezione">
      <div class="intestazione-sezione"><h2>Scambi da decidere</h2>
        <span class="conteggio">${mieiScambi.length}</span></div>
      ${squadra && possoToccare(squadra.id)
        ? `<button class="bottone" id="nuovo-scambio" style="margin-bottom:10px">Proponi uno scambio</button>` : ""}
      ${mieiScambi.length ? mieiScambi.map(schedaScambio).join("")
        : `<div class="vuoto riquadro">Nessuna proposta sul tavolo.</div>`}
    </div>

    ${chiuse.length ? `<div class="sezione">
      <div class="intestazione-sezione"><h2>Trattative chiuse</h2></div>
      <div class="elenco">${chiuse.map(schedaChiusa).join("")}</div>
    </div>` : ""}

    ${altriScambi.length ? `<div class="sezione">
      <div class="intestazione-sezione"><h2>Scambi conclusi</h2></div>
      ${altriScambi.map(schedaScambio).join("")}
    </div>` : ""}`;
}

/* ── Pagina: la società ───────────────────────────────────── */

function paginaSocieta() {
  const squadra = squadraCorrente();
  if (!squadra) return `<h1>Società</h1><div class="vuoto riquadro" style="margin-top:16px">Nessuna squadra da mostrare.</div>`;

  const s = societaDi(squadra.id);
  const posso = possoToccare(squadra.id);
  const conto = contoStadio(s.stadio);
  const vivaio = giovanileDa(s.capienzaGiovanile);
  const ampliamento = costoAmpliamento(s.capienzaGiovanile);
  const manutenzione = manutenzioneAnnua(s);

  const selettore = sonoCommissioner()
    ? `<label class="campo" style="margin-bottom:14px"><span>Squadra su cui lavori</span>
        <select id="scegli-squadra">
          ${stato.squadre.map((x) => `<option value="${pulito(x.id)}" ${x.id === squadra.id ? "selected" : ""}>${pulito(x.nome)}</option>`).join("")}
        </select></label>`
    : "";

  /* ── Lo stadio ── */
  const prossimo = s.stadio < 5 ? costoSalto(s.stadio, s.stadio + 1) : null;
  const scalaStadi = REGOLE.capitale.stadi.map((livello) => {
    const c = contoStadio(livello.livello);
    const attuale = livello.livello === s.stadio;
    const salto = costoSalto(s.stadio, livello.livello);
    const raggiungibile = livello.livello > s.stadio;
    return `<tr class="${attuale ? "questa" : ""}">
      <td><b>${livello.livello} · ${pulito(livello.nome)}</b>${attuale ? ` <span class="targhetta ok">il tuo</span>` : ""}</td>
      <td class="n num">${soldi(aQuarti(livello.costruzione))}</td>
      <td class="n num">${soldi(aQuarti(livello.manutenzione))}</td>
      <td class="n num">${soldi(aQuarti(c.incasso))}<br><span style="font-size:11px;color:var(--luce-fioca)">${soldi(aQuarti(livello.incassoPerGara))} a gara</span></td>
      <td class="n num" style="color:var(--ok)">+${soldi(aQuarti(c.netto))}</td>
      <td class="n num">${c.rientro.toFixed(1)}</td>
      <td>${raggiungibile && posso
        ? `<button class="bottone piccolo" data-stadio="${livello.livello}"
             ${s.capitale < aQuarti(salto.costo) ? "disabled" : ""}>
             ${salto.ricostruzione ? "Ricostruisci" : "Costruisci"} · ${soldi(aQuarti(salto.costo))}</button>`
        : ""}</td>
    </tr>`;
  }).join("");

  /* ── Gli osservatori ── */
  const reteOsservatori = REGOLE.capitale.osservatori.map((o) => {
    const attivo = s.osservatori.includes(o.campionato);
    return `<button class="scelta" data-osservatore="${pulito(o.campionato)}"
              aria-pressed="${attivo}" ${!posso || attivo || s.capitale < aQuarti(o.costo) ? "disabled" : ""}>
        <b>${pulito(o.campionato)}${attivo ? " — attivo" : ""}</b>
        <small>${pulito(o.paese)} · ${soldi(aQuarti(o.costo))} per una stagione</small>
      </button>`;
  }).join("");

  /* ── I movimenti ── */
  const movimenti = s.movimenti.length
    ? s.movimenti.map((m) => `<div class="voce">
        <span class="corpo">
          <span class="nome">${pulito(m.causale)}</span>
          <span class="dettaglio">${new Date(m.quando).toLocaleDateString("it-IT", { day: "numeric", month: "short", year: "numeric" })}</span>
        </span>
        <span class="coda">
          <span class="prezzo num" style="color:${m.quanto < 0 ? "var(--allarme)" : "var(--ok)"}">
            ${m.quanto < 0 ? "−" : "+"}${soldi(Math.abs(m.quanto))}</span>
          <span style="font-size:12px;color:var(--luce-fioca)" class="num">saldo ${soldi(m.saldo)}</span>
        </span>
      </div>`).join("")
    : `<div class="vuoto riquadro">Nessun movimento: il Capitale è ancora quello di partenza.</div>`;

  return `
    <p class="occhiello">${pulito(squadra.nome)}</p>
    <h1 style="margin:6px 0 18px">La tua <span class="acceso">società</span></h1>
    ${selettore}

    <div class="tetto" style="margin-bottom:14px">
      <div style="flex:1 1 130px;min-width:0">
        <div class="occhiello" style="color:inherit;opacity:.6">Capitale</div>
        <div class="cifra num">${soldi(s.capitale)}</div>
        <div class="sotto">${manutenzione > 0 ? `${soldi(manutenzione)} di mantenimento all'anno` : "nessun costo fisso"}</div>
      </div>
      <div style="flex:1 1 132px;min-width:0">
        <div class="occhiello" style="color:inherit;opacity:.6">Stadio</div>
        <div class="cifra num" style="font-size:clamp(22px,6vw,28px)">${conto ? pulito(conto.nome) : "nessuno"}</div>
        <div class="sotto">${conto ? `+${soldi(aQuarti(conto.netto))} l'anno · ${conto.fantapunti} fantapunti in casa` : "si gioca in trasferta da sempre"}</div>
      </div>
    </div>

    <div class="avviso neutro" style="margin-bottom:18px">
      Il <b>Capitale</b> non è spazio salariale e non ci si trasforma (art. 14): il tetto limita gli
      ingaggi, il Capitale è denaro che si accumula e si investe in stadio, settore giovanile e
      osservatori. ${posso ? "" : "Stai guardando la società di un'altra squadra."}
    </div>

    <div class="sezione">
      <div class="intestazione-sezione"><h2>Stadio</h2>
        ${prossimo ? `<span class="conteggio">prossimo livello ${soldi(aQuarti(prossimo.costo))}</span>` : `<span class="conteggio">al massimo</span>`}</div>
      <p style="font-size:13px;color:var(--luce-media);margin-bottom:10px">
        Si sale un livello alla volta pagando la differenza; per saltarne uno si demolisce e si
        ricostruisce da zero. <b>L'incasso è quello di una stagione intera</b>: il guadagno a ogni
        gara in casa moltiplicato per le ${REGOLE.capitale.gareInCasa} che se ne giocano.
        L'anno in cui lo costruisci ne incassi circa la metà, perché lo stadio apre alla
        ${REGOLE.capitale.operativoDallaGiornata}ª giornata (art. 15.1): sei mesi di cantiere.
        <b>Rientro</b> sono gli anni che il netto impiega a ripagare la costruzione.
      </p>
      <div class="riquadro scorre">
        <table class="tabellina">
          <thead><tr>
            <th>Livello</th><th style="text-align:right">Costruzione</th><th style="text-align:right">Manut./anno</th>
            <th style="text-align:right">Incasso/anno</th><th style="text-align:right">Netto/anno</th>
            <th style="text-align:right">Rientro</th><th></th>
          </tr></thead>
          <tbody>${scalaStadi}</tbody>
        </table>
      </div>
    </div>

    <div class="sezione">
      <div class="intestazione-sezione"><h2>Settore giovanile</h2>
        <span class="conteggio">${s.capienzaGiovanile} posti</span></div>
      <p style="font-size:13px;color:var(--luce-media);margin-bottom:10px">
        I giovani non percepiscono ingaggio e non occupano spazio salariale: costano Capitale.
        ${vivaio.mantenimento > 0 ? `Oggi il vivaio costa ${soldi(aQuarti(vivaio.mantenimento))} l'anno.` : ""}
      </p>
      <div class="riquadro">
        ${ampliamento
          ? `<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
              <div><b>Portare la capienza a ${ampliamento.capienza}</b>
                <div style="font-size:13px;color:var(--luce-media)">
                  ${soldi(aQuarti(ampliamento.costo))} adesso · ${soldi(aQuarti(ampliamento.mantenimento))} l'anno</div></div>
              ${posso ? `<button class="bottone" id="amplia-vivaio" ${s.capitale < aQuarti(ampliamento.costo) ? "disabled" : ""}>
                ${s.capitale < aQuarti(ampliamento.costo) ? "Capitale insufficiente" : "Amplia"}</button>` : ""}
            </div>`
          : `<p style="font-size:13.5px;color:var(--luce-media)">Il settore giovanile è alla capienza massima: ${s.capienzaGiovanile} posti.</p>`}
      </div>
    </div>

    <div class="sezione">
      <div class="intestazione-sezione"><h2>Rete osservatori</h2>
        <span class="conteggio">${s.osservatori.length} attivi</span></div>
      <p style="font-size:13px;color:var(--luce-media);margin-bottom:10px">
        Un osservatore dà il diritto di <b>pareggiare l'offerta più alta</b> su un giocatore che da
        quel campionato arriva in Serie A. Non è un acquisto esclusivo né uno sconto, e dura una stagione.
      </p>
      <div class="scelte">${reteOsservatori}</div>
    </div>

    <div class="sezione">
      <div class="intestazione-sezione"><h2>Movimenti</h2></div>
      ${s.movimenti.length ? `<div class="elenco">${movimenti}</div>` : movimenti}
      ${sonoCommissioner() ? `
        <div class="riquadro" style="margin-top:12px">
          <h3 style="margin-bottom:8px">Accredita o addebita</h3>
          <p style="font-size:13px;color:var(--luce-media);margin-bottom:10px">
            Premi delle competizioni, sponsor, manutenzione di inizio stagione: le voci che non
            nascono da un pulsante le mette il commissioner, e restano scritte qui.</p>
          <form id="modulo-capitale" class="moduli">
            <label class="campo"><span>Causale</span>
              <input type="text" id="cap-causale" placeholder="es. premio secondo posto" required></label>
            <label class="campo"><span>Importo in milioni — negativo per addebitare</span>
              <input type="number" id="cap-importo" step="0.25" placeholder="es. 12 oppure −3" required></label>
            <button class="bottone largo" type="submit">Registra il movimento</button>
          </form>
        </div>` : ""}
    </div>`;
}

/* ── Il foglio della busta ────────────────────────────────── */

function foglioBusta(trattativaId, giocatoreId) {
  const squadra = squadraCorrente();
  /* Due modi di arrivare qui: rilanciare su una trattativa già aperta, o
     aprirne una nuova su un giocatore libero. Nel secondo caso la trattativa
     non esiste ancora e nasce con la prima busta. */
  const m = trattativaId
    ? stato.mercato.find((x) => x.id === trattativaId)
    : { id: null, giocatoreId, nome: PER_ID.get(giocatoreId)?.nome, ruolo: PER_ID.get(giocatoreId)?.ruolo,
        offerte: [], stato: "APERTA", tipo: "FREE_AGENCY",
        scadeIl: new Date(Date.now() + REGOLE.mercato.oreFreeAgency * 3600000).toISOString() };
  if (!m || !squadra) return "";
  const g = PER_ID.get(m.giocatoreId);
  const contratti = rosaDi(squadra.id);
  const conto = contoDi(squadra.id);
  const mia = (m.offerte ?? []).find((o) => o.squadraId === squadra.id);

  const tipi = Object.entries(REGOLE.contratti).map(([id, regola]) => {
    const serveEtà = regola.etaMax != null || regola.etaMin != null;
    const impossibile =
      (serveEtà && g.eta == null) ? "serve l'età del giocatore"
      : (regola.etaMax != null && g.eta > regola.etaMax) ? `ne ha ${g.eta}, oltre i ${regola.etaMax}`
      : (regola.etaMin != null && g.eta < regola.etaMin) ? `ne ha ${g.eta}, sotto i ${regola.etaMin}`
      : (regola.slot && conto.slotLiberi < 1) ? "slot pluriennali finiti"
      : null;
    return `<button type="button" class="scelta" data-tipo="${id}" aria-pressed="${bozza.tipo === id}" ${impossibile ? "disabled" : ""}>
        <b>${regola.nome}${impossibile ? ` — ${impossibile}` : ""}</b><small>${regola.nota}</small></button>`;
  }).join("");

  const regolaScelta = REGOLE.contratti[bozza.tipo];
  const sceltaAnni = regolaScelta.anni.length > 1
    ? `<label class="campo"><span>Per quanti anni</span><div class="filtri" style="margin:0">
        ${regolaScelta.anni.map((a) => `<button type="button" class="pillola" data-anni="${a}" aria-pressed="${bozza.anni === a}">${a} anni</button>`).join("")}
      </div></label>` : "";

  const quarti = bozza.ingaggio === "" ? NaN : aQuarti(bozza.ingaggio);
  const motivi = Number.isFinite(quarti) && quarti > 0
    ? perchéNo({ giocatore: g, tipo: bozza.tipo, ingaggio: quarti, ingaggioScritto: Number(bozza.ingaggio),
                 anni: bozza.anni, conto, contrattiTampone: contratti.filter((c) => c.tipo === "TAMPONE").length })
    : [];
  const spese = offerteSpeseDa(squadra.id);
  const fuoriQuota = !mia && spese >= REGOLE.mercato.offertePerStagione;

  return `<div class="velo" data-velo><div class="foglio" role="dialog" aria-modal="true">
    <div class="foglio-testa">
      <span class="ruolo ${g.ruolo}" style="width:36px;height:36px;border-radius:9px">${g.ruolo}</span>
      <div><h2>${pulito(g.nome)}</h2>
        <p style="font-size:13px;color:var(--luce-media)">
          ${pulito(g.squadra)} · quotato ${g.quotazione} M${g.eta != null ? ` · ${g.eta} anni` : ""}
          · chiude ${fraQuanto(m.scadeIl)}</p></div>
      <button class="chiudi" data-chiudi aria-label="Chiudi">×</button>
    </div>

    <div class="avviso neutro" style="margin-bottom:14px">
      ${(m.offerte ?? []).length
        ? `Ci sono <b>${(m.offerte ?? []).length} buste</b> depositate. Quanto valgono lo saprai
           all'apertura, come tutti gli altri.`
        : `Sei il primo. Da adesso gli altri hanno ${REGOLE.mercato.oreFreeAgency} ore per rilanciare.`}
      ${mia ? `<br>La tua offerta di adesso: <b>${soldi(mia.ingaggio)} × ${mia.anni} ${mia.anni === 1 ? "anno" : "anni"}</b>.` : ""}
    </div>

    ${fuoriQuota ? `<div class="avviso errore">Hai già speso tutte e
      ${REGOLE.mercato.offertePerStagione} le offerte della stagione (art. 9.1).</div>`
    : `<form id="modulo-busta" class="moduli" data-trattativa="${pulito(m.id ?? "")}"
             data-per-giocatore="${pulito(m.giocatoreId)}">
        <label class="campo"><span>Quanto offri — a passi di 0,25 M</span>
          <input type="number" id="ingaggio" step="0.25" min="0.25" max="${REGOLE.tetto}"
                 value="${pulito(bozza.ingaggio)}" placeholder="es. 3,5" inputmode="decimal" required></label>
        <div><span style="display:block;font-size:12px;font-weight:600;color:var(--luce-media);margin-bottom:6px">Che contratto</span>
          <div class="scelte">${tipi}</div></div>
        ${sceltaAnni}
        ${motivi.length ? `<div class="avviso errore">${motivi.map(pulito).join("<br>")}</div>` : ""}
        <button class="bottone primario largo" type="submit"
          ${motivi.length || !Number.isFinite(quarti) || quarti <= 0 ? "disabled" : ""}>
          ${mia ? "Cambia la busta" : "Deposita la busta"}</button>
        <p style="font-size:12px;color:var(--luce-media);text-align:center">
          ${mia ? "Ritoccare non consuma una seconda offerta." : `Ti resteranno ${REGOLE.mercato.offertePerStagione - spese - 1} offerte.`}
        </p>
      </form>`}
  </div></div>`;
}

/* ── Il foglio dello scambio ──────────────────────────────── */

let bozzaScambio = { conChi: null, cedeDa: [], cedeA: [], capitaleDa: "", capitaleA: "" };

function foglioScambio() {
  const mia = squadraCorrente();
  if (!mia) return "";
  const altre = stato.squadre.filter((s) => s.id !== mia.id);
  const con = bozzaScambio.conChi ? squadraDi(bozzaScambio.conChi) : null;

  const listaGiocatori = (squadraId, selezionati, attributo) =>
    rosaDi(squadraId).length
      ? [...rosaDi(squadraId)]
          .sort((a, b) => ORDINE_RUOLI.indexOf(a.ruolo) - ORDINE_RUOLI.indexOf(b.ruolo) || b.ingaggio - a.ingaggio)
          .map((c) => `<button type="button" class="scelta" ${attributo}="${pulito(c.giocatoreId)}"
              aria-pressed="${selezionati.includes(c.giocatoreId)}">
              <b>${pulito(c.nome)} · ${c.ruolo}</b>
              <small>${soldi(c.ingaggio)} · ${pulito(REGOLE.contratti[c.tipo]?.nome ?? c.tipo)}${c.anni > 1 ? ` ${c.anni} anni` : ""}</small>
            </button>`).join("")
      : `<p style="font-size:13px;color:var(--luce-media)">Rosa vuota.</p>`;

  const motivi = con
    ? perchéNoScambio({
        daId: mia.id, aId: con.id,
        cedeDa: bozzaScambio.cedeDa, cedeA: bozzaScambio.cedeA,
        capitaleDa: bozzaScambio.capitaleDa ? aQuarti(bozzaScambio.capitaleDa) : 0,
        capitaleA: bozzaScambio.capitaleA ? aQuarti(bozzaScambio.capitaleA) : 0,
      })
    : [];

  return `<div class="velo" data-velo><div class="foglio" role="dialog" aria-modal="true">
    <div class="foglio-testa">
      <div><h2>Proponi uno scambio</h2>
        <p style="font-size:13px;color:var(--luce-media)">
          I giocatori viaggiano con il loro contratto. Si scambia anche Capitale, mai spazio
          salariale (art. 11.1).</p></div>
      <button class="chiudi" data-chiudi aria-label="Chiudi">×</button>
    </div>

    <form id="modulo-scambio" class="moduli">
      <label class="campo"><span>Con quale squadra</span>
        <select id="scambio-con">
          <option value="">Scegli…</option>
          ${altre.map((s) => `<option value="${pulito(s.id)}" ${bozzaScambio.conChi === s.id ? "selected" : ""}>${pulito(s.nome)}</option>`).join("")}
        </select></label>

      ${con ? `
        <div><span style="display:block;font-size:12px;font-weight:600;color:var(--luce-media);margin-bottom:6px">
          Dai — dalla rosa di ${pulito(mia.nome)}</span>
          <div class="scelte">${listaGiocatori(mia.id, bozzaScambio.cedeDa, "data-cede-da")}</div></div>

        <div><span style="display:block;font-size:12px;font-weight:600;color:var(--luce-media);margin-bottom:6px">
          Ricevi — dalla rosa di ${pulito(con.nome)}</span>
          <div class="scelte">${listaGiocatori(con.id, bozzaScambio.cedeA, "data-cede-a")}</div></div>

        <div class="scelte">
          <label class="campo"><span>Capitale che dai</span>
            <input type="number" id="cap-da" step="0.25" min="0" value="${pulito(bozzaScambio.capitaleDa)}" placeholder="0"></label>
          <label class="campo"><span>Capitale che ricevi</span>
            <input type="number" id="cap-a" step="0.25" min="0" value="${pulito(bozzaScambio.capitaleA)}" placeholder="0"></label>
        </div>

        ${motivi.length ? `<div class="avviso errore">${motivi.map(pulito).join("<br>")}</div>`
          : `<div class="avviso bene">Le due rose restano valide. ${pulito(con.nome)} ha
             ${REGOLE.mercato.oreAccettazioneScambio} ore per rispondere.</div>`}

        <button class="bottone primario largo" type="submit" ${motivi.length ? "disabled" : ""}>
          Manda la proposta a ${pulito(con.nome)}</button>
      ` : ""}
    </form>
  </div></div>`;
}

/* ── Pagina: l'albo d'oro ─────────────────────────────────── */

const MEDAGLIE = ["oro", "argento", "bronzo"];

function paginaAlbo() {
  const stagioni = stagioniDellAlbo();
  const trofei = bacheca();
  const posso = sonoCommissioner();

  const scheda = (stagione, competizione) => {
    const verdetto = verdettoDi(stagione, competizione.id);
    if (!verdetto) {
      return `<div class="riquadro albo-vuoto">
        <div>
          <b>${pulito(competizione.nome)}</b>
          <div style="font-size:12.5px;color:var(--luce-fioca)">${pulito(competizione.formato)}</div>
        </div>
        ${posso ? `<button class="bottone piccolo" data-verdetto="${stagione}|${competizione.id}">Scrivi la classifica</button>`
                : `<span class="targhetta neutra">non ancora assegnata</span>`}
      </div>`;
    }
    const podio = verdetto.classifica.slice(0, 3).map((s, i) => `
      <div class="gradino ${MEDAGLIE[i]}">
        <span class="posto">${i + 1}</span>
        <span class="chi">${pulito(s.nome)}</span>
        ${competizione.capitale[i] != null ? `<span class="premio num">${competizione.capitale[i]} M</span>` : ""}
        ${competizione.denaro?.[i] != null ? `<span class="premio-denaro num">${competizione.denaro[i]} €</span>` : ""}
      </div>`).join("");
    const resto = verdetto.classifica.slice(3);

    return `<div class="riquadro">
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px">
        <b>${pulito(competizione.nome)}</b>
        ${posso ? `<button class="bottone piccolo" data-verdetto="${stagione}|${competizione.id}">Correggi</button>` : ""}
      </div>
      <div class="podio">${podio}</div>
      ${resto.length ? `<div class="coda-classifica">
        ${resto.map((s, i) => `<span>${i + 4}. ${pulito(s.nome)}${
          competizione.capitale[i + 3] != null ? ` <span class="num" style="color:var(--luce-fioca)">${competizione.capitale[i + 3]} M</span>` : ""}</span>`).join("")}
      </div>` : ""}
      ${verdetto.premiVersati
        ? `<div style="font-size:12px;color:var(--ok);margin-top:8px">Premi in Capitale versati</div>`
        : posso ? `<button class="bottone piccolo" style="margin-top:8px" data-premi="${verdetto.id}">Versa i premi in Capitale</button>` : ""}
    </div>`;
  };

  return `
    <h1>Albo <span class="acceso">d'oro</span></h1>
    <p style="color:var(--luce-media);margin:6px 0 18px">
      Quello che resta quando la stagione è finita. Le classifiche si scrivono qui una volta sola,
      e da qui non si cancellano più.
    </p>

    ${trofei.length ? `<div class="sezione">
      <div class="intestazione-sezione"><h2>La bacheca</h2></div>
      <div class="elenco">
        ${trofei.map((s) => `<div class="voce">
          <span class="corpo">
            <span class="nome">${pulito(s.nome)}</span>
            <span class="dettaglio">${Object.entries(s.per).map(([c, n]) =>
              `${pulito(REGOLE.competizioni.find((x) => x.id === c)?.nome ?? c)}${n > 1 ? ` ×${n}` : ""}`).join(" · ")}</span>
          </span>
          <span class="coda"><span class="trofei num">${s.totale}</span></span>
        </div>`).join("")}
      </div>
    </div>` : ""}

    ${stagioni.map((stagione) => `<div class="sezione">
      <div class="intestazione-sezione"><h2>${pulito(stagione)}</h2>
        ${stagione === STAGIONE ? `<span class="conteggio">stagione in corso</span>` : ""}</div>
      <div style="display:flex;flex-direction:column;gap:10px">
        ${REGOLE.competizioni.map((c) => scheda(stagione, c)).join("")}
      </div>
    </div>`).join("")}`;
}

/* ── Il foglio del verdetto ───────────────────────────────── */

/* L'ordine che il commissioner sta componendo: le squadre dalla prima
   all'ultima. Si costruisce toccando, perché su un telefono trascinare dieci
   righe in ordine è un esercizio di pazienza. */
let bozzaVerdetto = { stagione: null, competizione: null, ordine: [] };

function foglioVerdetto() {
  const competizione = REGOLE.competizioni.find((c) => c.id === bozzaVerdetto.competizione);
  if (!competizione) return "";
  const scelte = bozzaVerdetto.ordine;
  const restano = stato.squadre.filter((s) => !scelte.includes(s.id));

  return `<div class="velo" data-velo><div class="foglio" role="dialog" aria-modal="true">
    <div class="foglio-testa">
      <div>
        <h2>${pulito(competizione.nome)}</h2>
        <p style="font-size:13px;color:var(--luce-media)">${pulito(bozzaVerdetto.stagione)} · tocca le squadre dalla prima all'ultima</p>
      </div>
      <button class="chiudi" data-chiudi aria-label="Chiudi">×</button>
    </div>

    <div class="moduli">
      ${scelte.length ? `<div class="elenco">
        ${scelte.map((id, i) => `<div class="voce">
          <span class="ruolo" style="background:${pulito(squadraDi(id)?.colore ?? "#DADDD2")};color:#12140F">${i + 1}</span>
          <span class="corpo"><span class="nome">${pulito(squadraDi(id)?.nome ?? "—")}</span>
            <span class="dettaglio">${competizione.capitale[i] != null ? `${competizione.capitale[i]} M di premio` : "nessun premio"}${
              competizione.denaro?.[i] != null ? ` · ${competizione.denaro[i]} €` : ""}</span></span>
          <span class="coda"><button class="bottone piccolo" data-togli-posto="${i}">Togli</button></span>
        </div>`).join("")}
      </div>` : `<div class="avviso neutro">Tocca la squadra arrivata prima.</div>`}

      ${restano.length ? `<div class="scelte">
        ${restano.map((s) => `<button type="button" class="scelta" data-aggiungi-posto="${pulito(s.id)}">
          <b>${pulito(s.nome)}</b><small>${pulito(s.presidente || "")}</small></button>`).join("")}
      </div>` : `<div class="avviso bene">Classifica completa: ${scelte.length} squadre.</div>`}

      <button class="bottone primario largo" id="salva-verdetto" ${scelte.length < 1 ? "disabled" : ""}>
        Scrivi nell'albo${scelte.length && restano.length ? ` (solo le prime ${scelte.length})` : ""}
      </button>
    </div>
  </div></div>`;
}

/* ── Pagina: il registro ──────────────────────────────────── */

function paginaRegistro() {
  if (!stato.registro.length) {
    return `<h1>Il <span class="acceso">registro</span></h1><div class="vuoto riquadro" style="margin-top:16px">
      Ancora nessuna operazione. Qui finisce tutto quello che succede nella lega, in ordine di tempo.</div>`;
  }
  const righe = stato.registro.map((v) => {
    const quando = new Date(v.quando);
    const data = quando.toLocaleDateString("it-IT", { day: "numeric", month: "short" });
    const ora = quando.toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" });
    return `<div class="voce">
      <span class="corpo">
        <span class="nome">${pulito(v.dettaglio)}</span>
        <span class="dettaglio">${pulito(v.chi)} · ${pulito(v.cosa)}</span>
      </span>
      <span class="coda"><span style="font-size:12px;color:var(--luce-fioca)">${data}<br>${ora}</span></span>
    </div>`;
  }).join("");
  return `<h1>Il <span class="acceso">registro</span></h1>
    <p style="color:var(--luce-media);margin:6px 0 14px">
      Le ultime ${stato.registro.length} operazioni della lega, dalla più recente.</p>
    <div class="elenco">${righe}</div>`;
}

function foglioCodice(chi) {
