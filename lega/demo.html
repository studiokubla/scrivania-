    return Object.keys(dati)

    return {
      id: percorso.split("/").pop(),
      path: percorso,

      const query = {
        path: percorso,
        orderBy: (campo, verso = "asc") => costruisci({ campo, verso }, quanti),
        limit: (n) => costruisci(ordine, n),
        where: () => query,
        doc: (id) => documento(percorso + "/" + (id ?? "d" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7))),

<body>
<title>Dynasty League — demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* ─────────────────────────────────────────────────────────────
   Dynasty League — il front office di una lega da dieci squadre.
   Tavolo verde e inchiostro: i colori del campo, non quelli di un
   foglio di calcolo. I numeri sono sempre tabulari perché nelle
   colonne del tetto salariale le cifre devono incolonnarsi.
   ───────────────────────────────────────────────────────────── */

:root {
  /* Carta fredda, inchiostro con bias verde: il verde è il colore
     strutturale della lega, non un accento acceso buttato sopra. */
  --carta:          #F7F7F3;
  --carta-alta:     #FFFFFF;
  --carta-bassa:    #EBEDE6;
  --bordo:          #DADDD2;
  --bordo-forte:    #C3C7B9;
  --inchiostro:     #14170F;
  --inchiostro-med: #5B6154;
  --inchiostro-lieve:#868C7E;

  --campo:          #1E5F3F;
  --campo-chiaro:   #E4EFE7;
  --campo-vivo:     #2C7A52;

  --allarme:        #96271A;
  --allarme-tenue:  #F7E4E1;
  --avviso:         #8A6110;
  --avviso-tenue:   #F7EEDC;
  --ok:             #1E5F3F;
  --ok-tenue:       #E4EFE7;

  --ombra: 0 1px 2px rgba(20,23,15,.06), 0 4px 14px rgba(20,23,15,.05);
  --ombra-alta: 0 2px 6px rgba(20,23,15,.10), 0 18px 40px rgba(20,23,15,.12);

  --raggio: 12px;
  --raggio-s: 8px;
  --display: "Bricolage Grotesque", "Archivo", system-ui, sans-serif;
  --testo: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --carta:          #12140F;
    --carta-alta:     #1B1E17;
    --carta-bassa:    #23271E;
    --bordo:          #2E3328;
    --bordo-forte:    #434839;
    --inchiostro:     #EFF0E9;
    --inchiostro-med: #A2A899;
    --inchiostro-lieve:#7C8375;

    --campo:          #63BE8B;
    --campo-chiaro:   #1C2C22;
    --campo-vivo:     #7ED3A3;

    --allarme:        #E98B7C;
    --allarme-tenue:  #2E1D19;
    --avviso:         #DDB25A;
    --avviso-tenue:   #2B2416;
    --ok:             #63BE8B;
    --ok-tenue:       #1C2C22;

    --ombra: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
    --ombra-alta: 0 2px 6px rgba(0,0,0,.5), 0 18px 40px rgba(0,0,0,.45);
  }
}

:root[data-theme="dark"] {
  --carta:          #12140F;
  --carta-alta:     #1B1E17;

  --ombra-alta: 0 2px 6px rgba(0,0,0,.5), 0 18px 40px rgba(0,0,0,.45);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--carta);
  color: var(--inchiostro);
  font-family: var(--testo);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  padding-bottom: env(safe-area-inset-bottom);
}

h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; letter-spacing: -.015em; }
h1 { font-size: clamp(26px, 5vw, 38px); font-weight: 800; line-height: 1.05; }
h2 { font-size: 20px; font-weight: 600; }
h3 { font-size: 16px; font-weight: 600; }
p { margin: 0; }

.num { font-variant-numeric: tabular-nums; }

.occhiello {
  font-size: 11px; font-weight: 600; letter-spacing: .12em;
  text-transform: uppercase; color: var(--inchiostro-lieve);
}

button { font-family: inherit; font-size: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible {
  outline: 2px solid var(--campo); outline-offset: 2px;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

/* ── Impalcatura ──────────────────────────────────────────── */

.guscio { min-height: 100vh; display: flex; flex-direction: column; }

.testata {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; gap: 12px;
  padding: 12px 16px;
  background: color-mix(in srgb, var(--carta) 88%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--bordo);
}
.marchio {
  display: flex; align-items: center; gap: 9px; min-width: 0;
  font-family: var(--display); font-weight: 800; letter-spacing: -.02em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.marchio .sigla {
  width: 26px; height: 26px; border-radius: 7px; flex: none;
  background: var(--campo); color: var(--carta-alta);
  display: grid; place-items: center; font-size: 14px; line-height: 1;
  color: #F7F7F3;
}
.testata .spinta { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.chi-sono { font-size: 12px; color: var(--inchiostro-med); text-align: right; line-height: 1.25; }
.chi-sono b { display: block; color: var(--inchiostro); font-size: 13px; }

.lavoro { flex: 1; width: 100%; max-width: 1120px; margin: 0 auto; padding: 20px 16px 110px; }
@media (min-width: 860px) { .lavoro { padding-bottom: 40px; } }

/* Navigazione: in basso sul telefono (all'asta si sta seduti col

/* ═══════════════════════════════════════════════════════════════
   ARITMETICA DEGLI INGAGGI

   Gli importi si contano in quarti di milione, in numeri interi. In
   virgola mobile 0.1 + 0.2 non fa 0.3, e un tetto salariale sbagliato
   di un centesimo è un tetto salariale sbagliato. Si torna ai milioni
   solo per scriverli a schermo.
   ═══════════════════════════════════════════════════════════════ */

const QUARTI = 4;
const aQuarti = (milioni) => Math.round(Number(milioni) * QUARTI);
const aMilioni = (quarti) => quarti / QUARTI;

/** «7,5 M» — con la virgola, come si scrive in italiano. */
function soldi(quarti, conUnita = true) {
  const m = aMilioni(quarti);
  const testo = Number.isInteger(m) ? String(m) : m.toFixed(2).replace(/0$/, "");
  return testo.replace(".", ",") + (conUnita ? " M" : "");
}

/* ═══════════════════════════════════════════════════════════════
   LE REGOLE, COME FUNZIONI

   Funzioni pure: prendono una rosa e restituiscono un giudizio. Non
   toccano il database e non disegnano niente, così si possono leggere
   una per una e verificare che dicano quello che dice il regolamento.
   ═══════════════════════════════════════════════════════════════ */

/** Quanto pesa un contratto sul tetto di quest'anno: il primo anno. */
const pesoAnnuale = (contratto) => contratto.ingaggio;

/** Il conto della rosa: speso, spazio, slot, minimi di ruolo. */
function contoRosa(contratti) {
  const speso = contratti.reduce((somma, c) => somma + pesoAnnuale(c), 0);
  const tetto = aQuarti(REGOLE.tetto);
  const perRuolo = { P: 0, D: 0, C: 0, A: 0 };
  for (const c of contratti) perRuolo[c.ruolo] = (perRuolo[c.ruolo] || 0) + 1;

  const slotUsati = contratti.filter((c) => REGOLE.contratti[c.tipo]?.slot).length;

  const mancanti = ORDINE_RUOLI
    .map((r) => ({ ruolo: r, quanti: Math.max(0, REGOLE.minimiRuolo[r] - perRuolo[r]) }))
    .filter((m) => m.quanti > 0);

  const postiDaRiempire = Math.max(0, REGOLE.rosaMin - contratti.length);

  return {
    numero: contratti.length,
    speso,
    tetto,
    spazio: tetto - speso,
    sforato: speso > tetto,
    perRuolo,
    mancanti,
    postiDaRiempire,
    slotUsati,
    slotLiberi: REGOLE.slotPluriennali - slotUsati,
    /* Art. 8.6 — quanto va tenuto da parte per poter completare la rosa
       minima. Senza questa riserva una squadra spende tutto su tre nomi
       e poi non può più tesserare un portiere. */
    riserva: aQuarti(postiDaRiempire * REGOLE.riservaPerSlotMancante),
  };
}

/** L'età del giocatore vale al 1° settembre: il listone la dà già così. */
const etaAllaFirma = (giocatore) => giocatore.eta;

/**
 * Si può firmare questo contratto? Restituisce l'elenco dei motivi per
 * cui no — vuoto se sì.
 *
 * Ogni motivo cita il numero che lo rende tale: «ne ha 27», «restano
 * 3,5 M». Un rifiuto che non dice il numero costringe a indovinare.
 */
function perchéNo({ giocatore, tipo, ingaggio, ingaggioScritto, anni, conto, contrattiTampone }) {
  const regola = REGOLE.contratti[tipo];
  const no = [];
  if (!regola) return ["Questo tipo di contratto non esiste."];

  if (!Number.isFinite(ingaggio) || ingaggio <= 0) no.push("Manca l'ingaggio.");
  /* Il passo va controllato sull'importo come è stato scritto: `aQuarti`
     arrotonda, e dopo l'arrotondamento 3,30 M è indistinguibile da 3,25 M. */
  if (ingaggioScritto != null && Math.abs(ingaggioScritto * 4 - Math.round(ingaggioScritto * 4)) > 1e-9) {
    no.push(`Gli ingaggi si muovono a passi di 0,25 M: ${soldi(ingaggio)} è il più vicino.`);
  }
  if (!regola.anni.includes(anni)) {
    no.push(`Un ${regola.nome} dura ${regola.anni.join(" o ")} ${regola.anni.length === 1 && regola.anni[0] === 1 ? "anno" : "anni"}.`);
  }

  const eta = etaAllaFirma(giocatore);
  if (regola.etaMax != null) {
    if (eta == null) no.push(`Il ${regola.nome} dipende dall'età, e del giocatore non la conosciamo.`);
    else if (eta > regola.etaMax) no.push(`Il ${regola.nome} è per gli Under ${regola.etaMax + 1}: ne ha ${eta} al ${REGOLE.etaAl}.`);
  }
  if (regola.etaMin != null) {
    if (eta == null) no.push(`Il ${regola.nome} dipende dall'età, e del giocatore non la conosciamo.`);
    else if (eta < regola.etaMin) no.push(`Il ${regola.nome} è per gli Over ${regola.etaMin}: ne ha ${eta} al ${REGOLE.etaAl}.`);
  }
  if (regola.ingaggioMax != null && ingaggio > aQuarti(regola.ingaggioMax)) {
    no.push(`Un ${regola.nome} non supera ${regola.ingaggioMax} M.`);
  }
  if (regola.slot && conto.slotLiberi < 1) {
    no.push(`Gli slot pluriennali sono finiti: ne sono ammessi ${REGOLE.slotPluriennali}.`);
  }
  if (tipo === "TAMPONE" && contrattiTampone >= regola.maxStagione) {
    no.push(`I contratti Tampone sono ${regola.maxStagione} a stagione, e sono già stati usati.`);
  }
  if (conto.numero >= REGOLE.rosaMax) {
    no.push(`La rosa è al massimo: ${REGOLE.rosaMax} giocatori.`);
  }

  /* Il tetto, e la riserva per completare la rosa. Il posto che si sta
     riempiendo adesso non conta più fra quelli da riempire. */
  const postiDopo = Math.max(0, REGOLE.rosaMin - (conto.numero + 1));
  const riservaDopo = aQuarti(postiDopo * REGOLE.riservaPerSlotMancante);
  const spazioDopo = conto.spazio - ingaggio;
  if (spazioDopo < 0) {
    no.push(`Sfora il tetto di ${soldi(-spazioDopo)}: lo spazio è ${soldi(conto.spazio)}.`);
  } else if (spazioDopo < riservaDopo) {
    no.push(
      `Restano ${soldi(spazioDopo)}, ma servono almeno ${soldi(riservaDopo)} ` +
      `per completare la rosa (${postiDopo} posti × ${String(REGOLE.riservaPerSlotMancante).replace(".", ",")} M).`,
    );
  }
  return no;
}

/* ── Gli scambi (art. 11.1) ───────────────────────────────── */

/**
 * Come resterebbe una rosa dopo uno scambio.
 *
 * Si scambiano giocatori **con il loro contratto** e Capitale, mai spazio
 * salariale (art. 11.1.1): l'ingaggio viaggia con il giocatore, e la squadra
 * che lo riceve se lo prende com'è.
 */
function rosaDopoScambio(squadraId, cede, riceve) {
  const restano = rosaDi(squadraId).filter((c) => !cede.includes(c.giocatoreId));
  return [...restano, ...riceve];
}

/**
 * Perché lo scambio non si può fare — su **entrambi i lati** (art. 11.1.2).
 *
 * Validare un lato solo sarebbe peggio che non validare: farebbe passare la
 * proposta e lascerebbe l'altra squadra a scoprire il problema quando ormai
 * ha accettato. Qui la proposta non parte proprio, e dice di chi è il guaio.
 */
function perchéNoScambio({ daId, aId, cedeDa, cedeA, capitaleDa, capitaleA }) {
  const no = [];
  const nomeDa = squadraDi(daId)?.nome ?? "la prima squadra";
  const nomeA = squadraDi(aId)?.nome ?? "l'altra squadra";

  if (!cedeDa.length && !cedeA.length && !capitaleDa && !capitaleA) {
    return ["Lo scambio è vuoto: metti almeno un giocatore o del Capitale."];
  }

  const contrattiDa = rosaDi(daId);
  const contrattiA = rosaDi(aId);
  const pacchettoDa = contrattiDa.filter((c) => cedeDa.includes(c.giocatoreId));
  const pacchettoA = contrattiA.filter((c) => cedeA.includes(c.giocatoreId));

  for (const [nome, rosaNuova] of [
    [nomeDa, rosaDopoScambio(daId, cedeDa, pacchettoA)],
    [nomeA, rosaDopoScambio(aId, cedeA, pacchettoDa)],
  ]) {
    const conto = contoRosa(rosaNuova);
    if (conto.sforato) no.push(`${nome} sforerebbe il tetto di ${soldi(conto.speso - conto.tetto)}.`);
    if (conto.numero > REGOLE.rosaMax) no.push(`${nome} arriverebbe a ${conto.numero} giocatori, oltre i ${REGOLE.rosaMax}.`);
    if (conto.slotLiberi < 0) no.push(`${nome} avrebbe ${conto.slotUsati} contratti pluriennali, oltre i ${REGOLE.slotPluriennali}.`);
    /* I minimi di ruolo si controllano solo se la rosa era già completa: a
       mercato aperto una rosa in costruzione li viola per forza, e bloccare
       lì ogni scambio renderebbe la funzione inutile proprio quando serve. */
    const eraCompleta = contoRosa(nome === nomeDa ? contrattiDa : contrattiA).mancanti.length === 0;
    if (eraCompleta && conto.mancanti.length) {
      no.push(`${nome} scenderebbe sotto il minimo di ruolo: ${conto.mancanti.map((m) => `${m.quanti} ${NOME_RUOLO_PL[m.ruolo]}`).join(", ")}.`);
    }
  }

  if (capitaleDa > societaDi(daId).capitale) no.push(`${nomeDa} non ha ${soldi(capitaleDa)} di Capitale.`);
  if (capitaleA > societaDi(aId).capitale) no.push(`${nomeA} non ha ${soldi(capitaleA)} di Capitale.`);

  return no;
}

/* ── L'economia della società (artt. 14-17) ───────────────── */

/** Lo stadio a un certo livello. Livello 0 = non c'è ancora. */
const stadioAl = (livello) => REGOLE.capitale.stadi.find((s) => s.livello === livello) ?? null;

/** Il conto annuo dello stadio: quanto incassa, quanto costa, quanto resta. */
function contoStadio(livello) {
  const s = stadioAl(livello);
  if (!s) return null;
  const incasso = s.incassoPerGara * REGOLE.capitale.gareInCasa;
  return { ...s, incasso, netto: incasso - s.manutenzione, rientro: s.costruzione / (incasso - s.manutenzione) };
}

/**
 * Quanto costa passare da un livello all'altro (art. 15.2).
 *
 * Si sale **un livello alla volta** pagando la differenza fra i due costi di
 * costruzione. Per saltare un livello si demolisce e si ricostruisce da zero,
 * e allora si paga tutto: è la ragione per cui conviene pianificare invece di
 * rincorrere.
 */
function costoSalto(da, a) {
  const arrivo = stadioAl(a);
  if (!arrivo) return null;
  if (a === da + 1) return { costo: arrivo.costruzione - (stadioAl(da)?.costruzione ?? 0), ricostruzione: false };
  return { costo: arrivo.costruzione, ricostruzione: true };
}

/** Il gradino del settore giovanile che tiene una certa capienza. */
const giovanileDa = (capienza) =>
  REGOLE.capitale.giovanile.find((g) => g.capienza === capienza) ?? REGOLE.capitale.giovanile[0];

/** Quanto costa ampliare il settore giovanile da una capienza alla successiva. */
function costoAmpliamento(capienzaAttuale) {
  const indice = REGOLE.capitale.giovanile.findIndex((g) => g.capienza === capienzaAttuale);
  const prossimo = REGOLE.capitale.giovanile[indice + 1];
  if (!prossimo) return null;
  return { ...prossimo, costo: prossimo.investimento - giovanileDa(capienzaAttuale).investimento };
}

/** Il mantenimento che la società paga ogni anno: stadio più settore giovanile. */
function manutenzioneAnnua(societa) {
  const stadio = stadioAl(societa.stadio)?.manutenzione ?? 0;
  const giovanile = giovanileDa(societa.capienzaGiovanile).mantenimento;
  return aQuarti(stadio + giovanile);
}

/**
 * Idoneità al settore giovanile (art. 16.1).
 *
 * Tre requisiti — età, presenze in Serie A, quotazione — che la lega
 * possiede in momenti diversi. Età e quotazione arrivano col listone il
 * primo giorno; le presenze della stagione precedente, alla prima
 * stagione, non esistono e nessuno può darle a posteriori.
 *
 * Perciò la risposta non è sì o no: è sì, no, oppure «non ancora». Dire
 * «non idoneo» a un ragazzo di diciotto anni perché manca un dato
 * sarebbe una bugia comoda; dire «idoneo» sarebbe una bugia pericolosa.
 */
function primavera(giocatore) {
  const motivi = [];
  if (giocatore.quotazione > REGOLE.primavera.quotazioneMax) {
    motivi.push(`quotato ${giocatore.quotazione} M, oltre i ${REGOLE.primavera.quotazioneMax} M`);
  }
  if (giocatore.eta != null && giocatore.eta > REGOLE.primavera.etaMax) {
    motivi.push(`ha ${giocatore.eta} anni, oltre i ${REGOLE.primavera.etaMax}`);
  }
  if (motivi.length) return { stato: "no", motivo: motivi.join("; ") };
  if (giocatore.eta == null) return { stato: "forse", motivo: "manca la sua età" };
  return { stato: "forse", motivo: "mancano le presenze della stagione precedente" };
}

/* ═══════════════════════════════════════════════════════════════
   LO STATO CONDIVISO

   Quello che cambia — squadre, rose, registro — vive nel database
   dell'artifact: dieci persone lo leggono e lo scrivono insieme, e
   ognuno vede le mosse degli altri mentre accadono. Non c'è un server
   da tenere acceso e non c'è niente da configurare.

   Struttura:
     lega/config          nome della lega, stagione, fase
     squadre/<id>         nome, sigla, colore, presidente, PIN
     rose/<id>            i contratti di quella squadra
     registro/<id>        una riga per operazione
   ═══════════════════════════════════════════════════════════════ */

let db = null;

const stato = {
  pronto: false,
  config: null,
  squadre: [],
  rose: new Map(),
  societa: new Map(),
  mercato: [],
  scambi: [],
  registro: [],
  io: null,                // { ruolo: "commissioner" | "presidente", squadraId }
  vista: "lega",
  errore: null,
};

const CHIAVE_IO = "dynasty-league-io";

function ricordaIo(io) {
  stato.io = io;
  try { localStorage.setItem(CHIAVE_IO, JSON.stringify(io)); } catch { /* finestra privata: pazienza */ }
}
function dimenticaIo() {
  stato.io = null;
  try { localStorage.removeItem(CHIAVE_IO); } catch { /* niente */ }
}
function riprendiIo() {
  try {
    const salvato = localStorage.getItem(CHIAVE_IO);
    if (salvato) stato.io = JSON.parse(salvato);
  } catch { stato.io = null; }
}

/** La rosa di una squadra, sempre un array (anche se il documento non c'è). */
const rosaDi = (squadraId) => stato.rose.get(squadraId)?.contratti ?? [];

const squadraDi = (id) => stato.squadre.find((s) => s.id === id) ?? null;

/** Il conto societario di una squadra. Una squadra appena iscritta ha la
 *  dotazione dell'art. 14, nessuno stadio e la capienza base del vivaio. */
function societaDi(squadraId) {
  const salvata = stato.societa.get(squadraId);
  return {
    capitale: salvata?.capitale ?? aQuarti(REGOLE.capitale.dotazione),
    stadio: salvata?.stadio ?? 0,
    capienzaGiovanile: salvata?.capienzaGiovanile ?? REGOLE.capitale.giovanile[0].capienza,
    osservatori: salvata?.osservatori ?? [],
    movimenti: salvata?.movimenti ?? [],
  };
}

/** La squadra su cui sto lavorando: la mia, o quella che il commissioner ha scelto. */
function squadraCorrente() {
  if (!stato.io) return null;
  if (stato.io.ruolo === "presidente") return squadraDi(stato.io.squadraId);
  return squadraDi(stato.squadraScelta ?? stato.squadre[0]?.id) ?? null;
}

const sonoCommissioner = () => stato.io?.ruolo === "commissioner";

/**
 * In che momento della stagione siamo.
 *
 * `COMPOSIZIONE` è il giorno dopo l'asta, che si fa al tavolo: si scrivono in
 * fretta i venticinque nomi con la cifra segnata a matita, e chiedere una busta
 * chiusa per ognuno sarebbe assurdo. `MERCATO` è tutto il resto della stagione:
 * lì un giocatore libero se lo contendono in più squadre, e passa dalle buste.
 */
const fase = () => stato.config?.fase ?? "COMPOSIZIONE";

/**
 * La lega chiede un codice per entrare?
 *
 * Di norma no: chi ha il link tocca la sua squadra ed è dentro. Fra dieci
 * amici il codice non difendeva granché — chiunque avesse il link poteva
 * leggere tutta la lega comunque — e in cambio costava una scocciatura a
 * ognuno, ogni volta, dal telefono. Chi preferisce tenerlo lo riaccende dal
 * pannello: allora serve a non entrare per sbaglio nella squadra di un altro.
 */
const serveIlCodice = () => stato.config?.chiediCodice === true;
const siamoAlMercato = () => fase() === "MERCATO";

/** Posso muovere questa rosa? Il presidente la propria, il commissioner tutte. */
const possoToccare = (squadraId) =>
  sonoCommissioner() || (stato.io?.ruolo === "presidente" && stato.io.squadraId === squadraId);

/** Tutti i giocatori sotto contratto, con la squadra che li ha. */
function tesserati() {
  const mappa = new Map();
  for (const [squadraId, rosa] of stato.rose) {
    for (const c of rosa.contratti ?? []) mappa.set(c.giocatoreId, squadraId);
  }
  return mappa;
}

/* ── Il tempo del mercato ─────────────────────────────────── */

/**
 * Le scadenze si risolvono quando qualcuno apre la pagina, non con un
 * processo che gira di notte.
 *
 * Per una lega di dieci persone basta, e ha una proprietà che conta più della
 * puntualità: l'esito dipende solo dall'orario di scadenza scritto nel
 * documento, non da chi guarda né da quando. Chi apre per primo non vince
 * niente — si limita a far succedere una cosa che era già decisa.
 */
let staRisolvendo = false;

async function risolviScadenze() {
  if (staRisolvendo || !db || !stato.io) return;
  const adesso = Date.now();

  const scadute = stato.mercato.filter((m) => m.stato === "APERTA" && Date.parse(m.scadeIl) <= adesso);
  const scambiScaduti = stato.scambi.filter((s) => s.stato === "PROPOSTO" && Date.parse(s.scadeIl) <= adesso);
  if (!scadute.length && !scambiScaduti.length) return;

  staRisolvendo = true;
  try {
    for (const trattativa of scadute) await chiudiTrattativa(trattativa);
    for (const scambio of scambiScaduti) {
      await db.collection("scambi").doc(scambio.id).set({ ...scambio, stato: "SCADUTO" });
      await annota("scambio", `Proposta di scambio scaduta senza risposta`, scambio.da);
    }
  } catch (e) {
    console.warn("scadenze non risolte", e);
  } finally {
    staRisolvendo = false;
  }
}

/**
 * Chi vince un'offerta (art. 9.3-9.4).
 *
 * Vince l'ingaggio più alto; a parità la durata maggiore; a parità ancora la
 * squadra **peggio piazzata** in classifica. Quest'ultimo criterio è
 * rovesciato rispetto ai regolamenti vecchi, dove vinceva chi stava meglio:
 * dare la precedenza a chi va male è il modo delle leghe americane di non far
 * scappare via i primi.
 */
function vincitoreFra(offerte) {
  if (!offerte.length) return null;
  return [...offerte].sort((a, b) =>
    b.ingaggio - a.ingaggio ||
    b.anni - a.anni ||
    (posizioneDi(b.squadraId) - posizioneDi(a.squadraId))
  )[0];
}

/** La posizione in classifica, o l'ordine di iscrizione se non c'è ancora. */
const posizioneDi = (squadraId) =>
  squadraDi(squadraId)?.posizione ?? squadraDi(squadraId)?.ordine ?? 99;

/** Chiude una trattativa scaduta e, se qualcuno ha offerto, assegna. */
async function chiudiTrattativa(trattativa) {
  const valide = (trattativa.offerte ?? []).filter((o) => {
    /* Un'offerta fatta ieri può essere diventata impossibile: la squadra ha
       riempito la rosa o speso lo spazio. Si scarta, non si forza. */
    const conto = contoRosa(rosaDi(o.squadraId));
    const g = PER_ID.get(trattativa.giocatoreId);
    if (!g) return false;
    return perchéNo({
      giocatore: g, tipo: o.tipo, ingaggio: o.ingaggio, ingaggioScritto: aMilioni(o.ingaggio),
      anni: o.anni, conto, contrattiTampone: rosaDi(o.squadraId).filter((c) => c.tipo === "TAMPONE").length,
    }).length === 0;
  });

  const vince = vincitoreFra(valide);
  await db.collection("mercato").doc(trattativa.id).set({
    ...trattativa, stato: "CHIUSA", chiusaIl: new Date().toISOString(),
    vincitore: vince?.squadraId ?? null,
    scartate: (trattativa.offerte ?? []).length - valide.length,
  });

  if (!vince) {
    await annota("mercato", `${trattativa.nome}: nessuna offerta valida, resta libero`, null);
    return;
  }

  const g = PER_ID.get(trattativa.giocatoreId);
  const squadra = squadraDi(vince.squadraId);
  await scriviRosa(vince.squadraId, [...rosaDi(vince.squadraId), {
    giocatoreId: g.id, nome: g.nome, ruolo: g.ruolo,
    tipo: vince.tipo, anni: vince.anni, ingaggio: vince.ingaggio,
    firmato: new Date().toISOString(),
  }]);
  await annota("mercato",
    `${g.nome} va a ${squadra?.nome ?? "—"} per ${soldi(vince.ingaggio)} × ${vince.anni} ` +
    `${vince.anni === 1 ? "anno" : "anni"} (${(trattativa.offerte ?? []).length} offerte)`,
    vince.squadraId);
}

/** Quante offerte ha già speso una squadra in questa stagione (art. 9.1). */
const offerteSpeseDa = (squadraId) =>
  stato.mercato.filter((m) => (m.offerte ?? []).some((o) => o.squadraId === squadraId)).length;

/** Il giocatore è già in trattativa? Non se ne aprono due sullo stesso. */
const trattativaAperta = (giocatoreId) =>
  stato.mercato.find((m) => m.stato === "APERTA" && m.giocatoreId === giocatoreId) ?? null;

/** Quanto manca, detto come lo direbbe una persona. */
function fraQuanto(scadenza) {
  const minuti = Math.max(0, Math.round((Date.parse(scadenza) - Date.now()) / 60000));
  if (minuti < 1) return "sta per chiudersi";
  if (minuti < 60) return `fra ${minuti} ${minuti === 1 ? "minuto" : "minuti"}`;
  const ore = Math.round(minuti / 60);
  if (ore < 24) return `fra ${ore} ${ore === 1 ? "ora" : "ore"}`;
  const giorni = Math.round(ore / 24);
  return `fra ${giorni} ${giorni === 1 ? "giorno" : "giorni"}`;
}

/* ── Scritture ────────────────────────────────────────────── */

/** Scrive nel registro. Una riga per operazione, con chi e quando. */
async function annota(cosa, dettaglio, squadraId) {
  if (!db) return;
  const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  try {
    await db.collection("registro").doc(id).set({
      quando: new Date().toISOString(),
      cosa,
      dettaglio,
      squadraId: squadraId ?? null,
      chi: sonoCommissioner() ? "Commissioner" : squadraDi(stato.io?.squadraId)?.nome ?? "—",
    });
  } catch (e) {
    console.warn("registro non scritto", e);
  }
}

/** Sostituisce la rosa di una squadra. Il documento è uno per squadra:
 *  chi tocca la propria non disturba quella degli altri. */
async function scriviRosa(squadraId, contratti) {
  if (!db) throw new Error("Il database non è disponibile.");
  await db.collection("rose").doc(squadraId).set({ contratti, aggiornata: new Date().toISOString() });
}

/**
 * Muove il Capitale e lascia la traccia di com'è cambiato.
 *
 * Ogni movimento porta il saldo che c'era prima e quello dopo: un conto in cui
 * si legge solo il totale corrente non permette a nessuno di ricostruire dove
 * sono finiti i soldi, ed è esattamente la discussione che il registro deve
 * evitare (art. 14).
 */
async function muoviCapitale(squadraId, quanto, causale) {
  if (!db) throw new Error("Il database non è disponibile.");
  const societa = societaDi(squadraId);
  const dopo = societa.capitale + quanto;
  if (dopo < 0) throw new Error("Il Capitale non basta.");

  const movimenti = [
    { quando: new Date().toISOString(), causale, quanto, saldo: dopo },
    ...societa.movimenti,
  ].slice(0, 60);

  await db.collection("societa").doc(squadraId).set({ ...societa, capitale: dopo, movimenti });
  await annota("capitale",
    `${squadraDi(squadraId)?.nome ?? "—"}: ${quanto < 0 ? "−" : "+"}${soldi(Math.abs(quanto))} — ${causale}`,
    squadraId);
  return dopo;
}

/** Cambia una voce del conto societario (stadio, vivaio, osservatori). */
async function scriviSocieta(squadraId, modifiche) {
  if (!db) throw new Error("Il database non è disponibile.");
  await db.collection("societa").doc(squadraId).set({ ...societaDi(squadraId), ...modifiche });
}

async function scriviSquadra(squadra) {
  if (!db) throw new Error("Il database non è disponibile.");
  const { id, ...corpo } = squadra;
  await db.collection("squadre").doc(id).set(corpo);
}

/* ── Ascolto ──────────────────────────────────────────────── */

function ascolta() {
  db.doc("lega/config").onSnapshot(
    (istantanea) => {
      stato.config = istantanea.exists ? istantanea.data() : null;
      stato.pronto = true;
      disegna();
    },
    (e) => { stato.errore = e; stato.pronto = true; disegna(); },
  );

  db.collection("squadre").onSnapshot((istantanea) => {
    stato.squadre = istantanea.docs
      .map((d) => ({ id: d.id, ...d.data() }))
      .sort((a, b) => (a.ordine ?? 0) - (b.ordine ?? 0) || a.nome.localeCompare(b.nome, "it"));
    disegna();
  });

  db.collection("rose").onSnapshot((istantanea) => {
    stato.rose = new Map(istantanea.docs.map((d) => [d.id, d.data()]));
    disegna();
  });

  db.collection("mercato").onSnapshot((istantanea) => {
    stato.mercato = istantanea.docs.map((d) => ({ id: d.id, ...d.data() }));
    risolviScadenze();
    disegna();
  });

  db.collection("scambi").onSnapshot((istantanea) => {
    stato.scambi = istantanea.docs.map((d) => ({ id: d.id, ...d.data() }));
    risolviScadenze();
    disegna();
  });

  db.collection("societa").onSnapshot((istantanea) => {
    stato.societa = new Map(istantanea.docs.map((d) => [d.id, d.data()]));
    disegna();
  });

  db.collection("registro").orderBy("quando", "desc").limit(120).onSnapshot((istantanea) => {
    stato.registro = istantanea.docs.map((d) => ({ id: d.id, ...d.data() }));
    disegna();
  });
}

/* ═══════════════════════════════════════════════════════════════
   DISEGNO

   Un solo punto che ridisegna, chiamato ogni volta che il database
   manda qualcosa di nuovo. Le pagine sono funzioni che restituiscono
   HTML; gli effetti si riattaccano dopo, in `dopoIlDisegno`.
   ═══════════════════════════════════════════════════════════════ */

const radice = document.getElementById("radice");

/** Testo dell'utente dentro l'HTML: sempre passato di qui. */
function pulito(testo) {
  return String(testo ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
}

let foglioAperto = null;   // { tipo, ...dati }

function apriFoglio(foglio) { foglioAperto = foglio; disegna(); }
function chiudiFoglio() { foglioAperto = null; disegna(); }

function disegna() {
  const dentro = [];

  if (!stato.pronto) {
    dentro.push(`<div class="lavoro"><p class="occhiello">Dynasty League</p>
      <h1 style="margin-top:6px">Apro la lega…</h1></div>`);
  } else if (!db) {
    dentro.push(vistaSenzaDatabase());
  } else if (!stato.config) {
    dentro.push(vistaFondazione());
  } else if (!stato.io || !identitàValida()) {
    dentro.push(vistaIngresso());
  } else {
    dentro.push(vistaApplicazione());
  }

  if (foglioAperto) dentro.push(disegnaFoglio());
  radice.innerHTML = dentro.join("");
  dopoIlDisegno();
}

/** Chi dice di essere esiste ancora? Una squadra cancellata non deve
 *  lasciare il suo presidente dentro una pagina che non ha più senso. */
function identitàValida() {
  if (stato.io.ruolo === "commissioner") return true;
  return Boolean(squadraDi(stato.io.squadraId));
}

/* ── Prima di tutto: la lega non esiste ancora ────────────── */

  return `<div class="lavoro">

    <div class="avviso attenzione" style="margin-bottom:18px">
      Questa copia della pagina non raggiunge il database della lega, quindi rose e
      contratti non si vedono. Apri il link dell'app pubblicata per lavorare sulla lega.
    </div>
    ${bloccoListone({ soloLettura: true })}

}

    <p style="color:var(--inchiostro-med); margin-bottom:20px; max-width:52ch">

/* ── Chi sei ──────────────────────────────────────────────── */

function vistaIngresso() {
  const squadre = stato.squadre.map((s) => {
    const conto = contoRosa(rosaDi(s.id));
    return `<button class="voce" data-entra="${pulito(s.id)}">
      <span class="ruolo" style="background:${pulito(s.colore || "#DADDD2")};color:#12140F">${pulito(s.sigla)}</span>

      </span>

    </button>`;
  }).join("");

    ${stato.squadre.length === 0

         entra da commissioner e iscrivi i dieci presidenti.</div>`

         ${!serveIlCodice()
           ? `<p style="font-size:12.5px;color:var(--inchiostro-med);margin:-4px 0 14px">

           : stato.squadre.every((s) => s.pin === CODICE_PREDEFINITO)
           ? `<p style="font-size:12.5px;color:var(--inchiostro-med);margin:-4px 0 14px">

    <button class="bottone largo" data-entra="commissioner">Entro da commissioner</button>

}

/* ── L'applicazione ───────────────────────────────────────── */

function vistaApplicazione() {
  const pagine = [
    { id: "lega", nome: "Lega" },
    { id: "rosa", nome: "Rosa" },
    { id: "listone", nome: "Listone" },
