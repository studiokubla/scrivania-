}

/* ── Pagina: la lega ──────────────────────────────────────── */

function paginaLega() {
  if (stato.squadre.length === 0) {
    return `<h1>${pulito(stato.config.nome)}</h1>
      <div class="vuoto riquadro" style="margin-top:16px">
        Nessuna squadra iscritta.${sonoCommissioner() ? " Vai in Gestione e iscrivi i presidenti." : " Il commissioner deve ancora iscriverle."}
      </div>`;
  }

  const righe = stato.squadre.map((s) => {
    const conto = contoRosa(rosaDi(s.id));
    const quota = Math.min(100, Math.round((conto.speso / conto.tetto) * 100));
    const stato_ =
      conto.sforato ? `<span class="targhetta no">sfora di ${soldi(conto.speso - conto.tetto)}</span>`
      : conto.numero >= REGOLE.rosaMin ? `<span class="targhetta ok">rosa completa</span>`
      : `<span class="targhetta forse">${conto.postiDaRiempire} da prendere</span>`;
    return `<tr>
      <td><b>${pulito(s.nome)}</b><br><span style="font-size:12px;color:var(--inchiostro-med)">${pulito(s.presidente || "—")}</span></td>
      <td class="n num">${conto.numero}</td>
      <td class="n num">${soldi(conto.speso)}</td>
      <td class="n num" style="color:${conto.sforato ? "var(--allarme)" : "inherit"}">${soldi(conto.spazio)}</td>
      <td class="n num">${conto.slotUsati}/${REGOLE.slotPluriennali}</td>
      <td>${stato_}<div class="barra-tetto" style="margin-top:6px;height:5px"><span class="${conto.sforato ? "sforato" : ""}" style="width:${quota}%"></span></div></td>
    </tr>`;
  }).join("");

  const tesserati_ = tesserati().size;

  return `
    <h1>${pulito(stato.config.nome)}</h1>
    <p style="color:var(--inchiostro-med); margin:6px 0 18px">
      ${stato.squadre.length} squadre · ${tesserati_} giocatori sotto contratto ·
      ${LISTONE.length - tesserati_} ancora liberi
    </p>
    <div class="riquadro scorre">
      <table class="tabellina">
        <thead><tr>
          <th>Squadra</th><th style="text-align:right">Rosa</th><th style="text-align:right">Ingaggi</th>
          <th style="text-align:right">Spazio</th><th style="text-align:right">Slot</th><th>Tetto</th>
        </tr></thead>
        <tbody>${righe}</tbody>
      </table>
    </div>
    <p style="font-size:12.5px;color:var(--inchiostro-med);margin-top:12px">
      Tetto salariale ${REGOLE.tetto} M · rosa da ${REGOLE.rosaMin} a ${REGOLE.rosaMax} ·
      ${REGOLE.slotPluriennali} slot pluriennali · minimi ${ORDINE_RUOLI.map((r) => REGOLE.minimiRuolo[r] + r).join(" ")}
    </p>`;
}

/* ── Pagina: la rosa ──────────────────────────────────────── */

function paginaRosa() {
  const squadra = squadraCorrente();
  if (!squadra) {
    return `<h1>Rosa</h1><div class="vuoto riquadro" style="margin-top:16px">
      Nessuna squadra da mostrare.</div>`;
  }

  const contratti = rosaDi(squadra.id);
  const conto = contoRosa(contratti);
  const posso = possoToccare(squadra.id);
  const quota = Math.min(100, Math.round((conto.speso / conto.tetto) * 100));

  /* Il commissioner lavora su qualunque rosa: gli serve un selettore. */
  const selettore = sonoCommissioner()
    ? `<label class="campo" style="margin-bottom:14px"><span>Squadra su cui lavori</span>
        <select id="scegli-squadra">
          ${stato.squadre.map((s) => `<option value="${pulito(s.id)}" ${s.id === squadra.id ? "selected" : ""}>${pulito(s.nome)}</option>`).join("")}
        </select></label>`
    : "";

  const perRuolo = ORDINE_RUOLI.map((r) => {
    const quanti = conto.perRuolo[r] ?? 0;
    const minimo = REGOLE.minimiRuolo[r];
    return `<div class="dato ${quanti < minimo ? "manca" : ""}">
      <div class="etichetta">${NOME_RUOLO_PL[r]}</div>
      <div class="valore num">${quanti}<span style="font-size:13px;color:var(--inchiostro-lieve)">/${minimo}</span></div>
    </div>`;
  }).join("");

  const inRosa = [...contratti]
    .sort((a, b) => ORDINE_RUOLI.indexOf(a.ruolo) - ORDINE_RUOLI.indexOf(b.ruolo) || b.ingaggio - a.ingaggio)
    .map((c) => {
      const g = PER_ID.get(c.giocatoreId);
      const regola = REGOLE.contratti[c.tipo];
      return `<div class="voce">
        <span class="ruolo ${c.ruolo}">${c.ruolo}</span>
        <span class="corpo">
          <span class="nome">${pulito(c.nome)}</span>
          <span class="dettaglio">
            ${pulito(g?.squadra ?? "")}
            <span class="targhetta contratto">${pulito(regola?.nome ?? c.tipo)}${c.anni > 1 ? " · " + c.anni + " anni" : ""}</span>
          </span>
        </span>
        <span class="coda">
          <span class="prezzo num">${soldi(c.ingaggio)}</span>
          ${posso ? `<button class="bottone piccolo" data-togli="${pulito(c.giocatoreId)}">Togli</button>` : ""}
        </span>
      </div>`;
    }).join("");

  const avvisi = [];
  if (conto.sforato) {
    avvisi.push(`<div class="avviso errore">La rosa sfora il tetto di ${soldi(conto.speso - conto.tetto)}.</div>`);
  }
  if (conto.mancanti.length) {
    avvisi.push(`<div class="avviso attenzione">Mancano al minimo di ruolo:
      ${conto.mancanti.map((m) => `${m.quanti} ${NOME_RUOLO_PL[m.ruolo]}`).join(", ")}.</div>`);
  }
  if (!conto.mancanti.length && conto.numero >= REGOLE.rosaMin && !conto.sforato) {
    avvisi.push(`<div class="avviso bene">Rosa a posto: ${conto.numero} giocatori, minimi di ruolo rispettati, tetto rispettato.</div>`);
  }

  return `
    <p class="occhiello">${pulito(squadra.nome)}</p>
    <h1 style="margin:6px 0 16px">Rosa</h1>
    ${selettore}

    <div class="tetto ${conto.sforato ? "sforato" : ""}" style="margin-bottom:14px">
      <div style="flex:1 1 190px">
        <div class="occhiello" style="color:inherit;opacity:.6">Spazio salariale</div>
        <div class="cifra num">${soldi(conto.spazio)}</div>
        <div class="sotto num">${soldi(conto.speso)} spesi su ${REGOLE.tetto} M di tetto</div>
      </div>
      <div style="flex:1 1 130px">
        <div class="occhiello" style="color:inherit;opacity:.6">In rosa</div>
        <div class="cifra num" style="font-size:32px">${conto.numero}<span style="font-size:17px;opacity:.6">/${REGOLE.rosaMin}</span></div>
        <div class="sotto">${conto.slotLiberi} slot pluriennali liberi</div>
      </div>
      <div class="barra-tetto"><span class="${conto.sforato ? "sforato" : ""}" style="width:${quota}%"></span></div>
    </div>

    <div class="griglia-dati" style="margin-bottom:14px">${perRuolo}</div>
    ${avvisi.length ? `<div style="display:flex;flex-direction:column;gap:8px;margin-bottom:16px">${avvisi.join("")}</div>` : ""}

    ${posso ? `<div class="sezione">
      <div class="intestazione-sezione"><h2>Aggiungi dal listone</h2></div>
      <input type="search" id="cerca-per-rosa" placeholder="Cerca il giocatore che hai preso"
             autocomplete="off" spellcheck="false">
      <div id="risultati-rosa"></div>
    </div>` : `<div class="avviso neutro" style="margin-bottom:16px">
      Stai guardando la rosa di un'altra squadra: puoi leggerla, non cambiarla.</div>`}

    <div class="sezione">
      <div class="intestazione-sezione"><h2>Sotto contratto</h2>
        <span class="conteggio">${conto.numero}</span></div>
      ${contratti.length ? `<div class="elenco">${inRosa}</div>`
        : `<div class="vuoto riquadro">Ancora nessuno. Cerca qui sopra il primo giocatore.</div>`}
    </div>`;
}

/* ── Pagina: il listone ───────────────────────────────────── */

const filtri = { testo: "", ruolo: null, soloPrimavera: false, soloLiberi: true, etaMax: null };

function listoneFiltrato() {
  const presi = tesserati();
  const testo = filtri.testo.trim().toLowerCase();
  return LISTONE.filter((g) => {
    if (filtri.soloLiberi && presi.has(g.id)) return false;
    if (filtri.ruolo && g.ruolo !== filtri.ruolo) return false;
    if (filtri.etaMax != null && (g.eta == null || g.eta > filtri.etaMax)) return false;
    if (filtri.soloPrimavera && primavera(g).stato === "no") return false;
    if (testo && !g.nome.toLowerCase().includes(testo) && !g.squadra.toLowerCase().includes(testo)) return false;
    return true;
  });
}

function bloccoListone({ soloLettura = false } = {}) {
  const trovati = listoneFiltrato();
  const presi = tesserati();
  const mostrati = trovati.slice(0, 120);

  const righe = mostrati.map((g) => {
    const p = primavera(g);
    const squadraId = presi.get(g.id);
    const suaSquadra = squadraId ? squadraDi(squadraId) : null;
    const etichettaPrimavera =
      p.stato === "forse" ? `<span class="targhetta forse" title="${pulito(p.motivo)}">primavera?</span>` : "";
    return `<button class="voce" ${soloLettura ? "disabled" : `data-giocatore="${pulito(g.id)}"`}>
      <span class="ruolo ${g.ruolo}">${g.ruolo}</span>
      <span class="corpo">
        <span class="nome">${pulito(g.nome)}</span>
        <span class="dettaglio">
          ${pulito(g.squadra)}${g.eta != null ? ` · ${g.eta} anni` : ` · <span style="color:var(--avviso)">età ignota</span>`}
          ${etichettaPrimavera}
          ${suaSquadra ? `<span class="targhetta neutra">${pulito(suaSquadra.nome)}</span>` : ""}
        </span>
      </span>
      <span class="coda"><span class="prezzo num">${g.quotazione} M</span></span>
    </button>`;
  }).join("");

  return `
    <input type="search" id="cerca-listone" value="${pulito(filtri.testo)}"
           placeholder="Cerca per cognome o squadra" autocomplete="off" spellcheck="false">
    <div class="filtri">
      <button class="pillola" data-ruolo="" aria-pressed="${!filtri.ruolo}">Tutti</button>
      ${ORDINE_RUOLI.map((r) => `<button class="pillola" data-ruolo="${r}" aria-pressed="${filtri.ruolo === r}">${NOME_RUOLO_PL[r][0].toUpperCase() + NOME_RUOLO_PL[r].slice(1)}</button>`).join("")}
    </div>
    <div class="filtri" style="margin-top:-4px">
      <button class="pillola primavera" id="filtro-primavera" aria-pressed="${filtri.soloPrimavera}">Primavera</button>
      ${[21, 23, 26].map((e) => `<button class="pillola" data-eta="${e}" aria-pressed="${filtri.etaMax === e}">Under ${e + 1}</button>`).join("")}
      <button class="pillola" id="filtro-liberi" aria-pressed="${filtri.soloLiberi}">Solo liberi</button>
    </div>
    <p style="font-size:12.5px;color:var(--inchiostro-med);margin:0 0 10px">
      ${trovati.length} giocatori${trovati.length > mostrati.length ? ` · ne vedi i primi ${mostrati.length}, restringi la ricerca` : ""}
    </p>
    ${trovati.length ? `<div class="elenco">${righe}</div>`
      : `<div class="vuoto riquadro">Nessun giocatore con questi filtri.</div>`}`;
}

function paginaListone() {
  return `
    <h1>Listone</h1>
    <p style="color:var(--inchiostro-med); margin:6px 0 4px">
      I ${LISTONE.length} giocatori di Serie A ${pulito(STAGIONE)}, con quotazione ed età.
      Il filtro <b>Primavera</b> tiene chi può entrare nel settore giovanile:
      fino a ${REGOLE.primavera.etaMax} anni e non oltre ${REGOLE.primavera.quotazioneMax} M di quotazione.
    </p>
    ${bloccoListone()}`;
}

/* ── Il foglio della firma ────────────────────────────────── */

/* Quello che si sta componendo nel foglio, finché non si firma. */
let bozza = { tipo: "ANNUALE", anni: 1, ingaggio: "" };

function disegnaFoglio() {
  if (foglioAperto?.tipo === "firma") return foglioFirma(foglioAperto.giocatoreId);
  if (foglioAperto?.tipo === "squadra") return foglioSquadra(foglioAperto.squadraId);
  if (foglioAperto?.tipo === "codice") return foglioCodice(foglioAperto.chi);
  if (foglioAperto?.tipo === "busta") return foglioBusta(foglioAperto.trattativaId, foglioAperto.giocatoreId);
  if (foglioAperto?.tipo === "scambio") return foglioScambio();
  return "";
}

function foglioFirma(giocatoreId) {
  const g = PER_ID.get(giocatoreId);
  const squadra = squadraCorrente();
  if (!g || !squadra) return "";

  const contratti = rosaDi(squadra.id);
  const conto = contoRosa(contratti);
  const quantiTampone = contratti.filter((c) => c.tipo === "TAMPONE").length;
  const p = primavera(g);

  const tipi = Object.entries(REGOLE.contratti).map(([id, regola]) => {
    /* Un tipo che dipende dall'età si spegne da solo quando l'età non si
       conosce, e dice perché: meglio del rifiuto scoperto dopo. */
    const serveEtà = regola.etaMax != null || regola.etaMin != null;
    const impossibile =
      (serveEtà && g.eta == null) ? "serve l'età del giocatore"
      : (regola.etaMax != null && g.eta > regola.etaMax) ? `ne ha ${g.eta}, oltre i ${regola.etaMax}`
      : (regola.etaMin != null && g.eta < regola.etaMin) ? `ne ha ${g.eta}, sotto i ${regola.etaMin}`
      : (regola.slot && conto.slotLiberi < 1) ? "slot pluriennali finiti"
      : (id === "TAMPONE" && quantiTampone >= regola.maxStagione) ? "già usati tutti e tre"
      : null;
    return `<button type="button" class="scelta" data-tipo="${id}"
              aria-pressed="${bozza.tipo === id}" ${impossibile ? "disabled" : ""}>
        <b>${regola.nome}${impossibile ? ` — ${impossibile}` : ""}</b>
        <small>${regola.nota}</small>
      </button>`;
  }).join("");

  const regolaScelta = REGOLE.contratti[bozza.tipo];
  const sceltaAnni = regolaScelta.anni.length > 1
    ? `<label class="campo"><span>Per quanti anni</span>
        <div class="filtri" style="margin:0">
          ${regolaScelta.anni.map((a) => `<button type="button" class="pillola" data-anni="${a}" aria-pressed="${bozza.anni === a}">${a} anni</button>`).join("")}
        </div></label>`
    : "";

  /* Il preventivo: cosa costa negli anni, con la progressione del tipo. */
  const ingaggioQuarti = bozza.ingaggio === "" ? NaN : aQuarti(bozza.ingaggio);
  let preventivo = "";
  if (Number.isFinite(ingaggioQuarti) && ingaggioQuarti > 0 && bozza.anni > 1 && regolaScelta.tasso) {
    const anni = [];
    let corrente = ingaggioQuarti;
    for (let i = 0; i < bozza.anni; i++) {
      anni.push(`${LISTONE_GREZZO.annoInizio + i}/${String(LISTONE_GREZZO.annoInizio + 1 + i).slice(2)} · ${soldi(Math.round(corrente))}`);
      corrente = corrente * regolaScelta.tasso;
    }
    preventivo = `<div class="avviso neutro"><b>Quanto pesa negli anni</b><br>${anni.join(" &nbsp;·&nbsp; ")}</div>`;
  }

  const motivi = Number.isFinite(ingaggioQuarti) && ingaggioQuarti > 0
    ? perchéNo({ giocatore: g, tipo: bozza.tipo, ingaggio: ingaggioQuarti, ingaggioScritto: Number(bozza.ingaggio),
                 anni: bozza.anni, conto, contrattiTampone: quantiTampone })
    : [];

  return `<div class="velo" data-velo>
    <div class="foglio" role="dialog" aria-modal="true" aria-label="Firma di ${pulito(g.nome)}">
      <div class="foglio-testa">
        <span class="ruolo ${g.ruolo}" style="width:36px;height:36px;border-radius:9px">${g.ruolo}</span>
        <div>
          <h2>${pulito(g.nome)}</h2>
          <p style="font-size:13px;color:var(--inchiostro-med)">
            ${pulito(g.squadra)} · quotato ${g.quotazione} M${g.eta != null ? ` · ${g.eta} anni al ${REGOLE.etaAl}` : " · età ignota"}
            ${p.stato === "forse" ? ` · <span style="color:var(--avviso)">primavera da verificare</span>` : ""}
          </p>
        </div>
        <button class="chiudi" data-chiudi aria-label="Chiudi">×</button>
      </div>

      <form id="modulo-firma" class="moduli">
        <label class="campo"><span>Quanto lo paghi — a passi di 0,25 M</span>
          <input type="number" id="ingaggio" step="0.25" min="0.25" max="${REGOLE.tetto}"
                 value="${pulito(bozza.ingaggio)}" placeholder="es. 3,5" inputmode="decimal" required></label>

        <div><span style="display:block;font-size:12px;font-weight:600;color:var(--inchiostro-med);margin-bottom:6px">Che contratto</span>
          <div class="scelte">${tipi}</div></div>

        ${sceltaAnni}
        ${preventivo}
        ${motivi.length ? `<div class="avviso errore">${motivi.map(pulito).join("<br>")}</div>` : ""}

        <button class="bottone primario largo" type="submit"
          ${motivi.length || !Number.isFinite(ingaggioQuarti) || ingaggioQuarti <= 0 ? "disabled" : ""}>
          Metti in rosa${Number.isFinite(ingaggioQuarti) && ingaggioQuarti > 0 ? ` per ${soldi(ingaggioQuarti)}` : ""}
        </button>
        <p style="font-size:12px;color:var(--inchiostro-med);text-align:center">
          Dopo la firma restano ${soldi(Math.max(0, conto.spazio - (Number.isFinite(ingaggioQuarti) ? ingaggioQuarti : 0)))} di spazio.
        </p>
      </form>
    </div></div>`;
}

/* ── Pagina: il mercato ───────────────────────────────────── */

function paginaMercato() {
  const squadra = squadraCorrente();
  const aperte = stato.mercato.filter((m) => m.stato === "APERTA").sort((a, b) => Date.parse(a.scadeIl) - Date.parse(b.scadeIl));
  const chiuse = stato.mercato.filter((m) => m.stato === "CHIUSA").sort((a, b) => Date.parse(b.chiusaIl ?? 0) - Date.parse(a.chiusaIl ?? 0)).slice(0, 12);
  const mieiScambi = stato.scambi.filter((s) => s.stato === "PROPOSTO" && (s.da === squadra?.id || s.a === squadra?.id));
  const altriScambi = stato.scambi.filter((s) => s.stato !== "PROPOSTO").sort((a, b) => Date.parse(b.proposto) - Date.parse(a.proposto)).slice(0, 8);
  const spese = squadra ? offerteSpeseDa(squadra.id) : 0;

  const schedaTrattativa = (m) => {
    const mia = (m.offerte ?? []).find((o) => o.squadraId === squadra?.id);
    const g = PER_ID.get(m.giocatoreId);
    const waiver = m.tipo === "WAIVER";
    return `<div class="voce">
      <span class="ruolo ${pulito(m.ruolo)}">${pulito(m.ruolo)}</span>
      <span class="corpo">
        <span class="nome">${pulito(m.nome)}</span>
        <span class="dettaglio">
          ${pulito(g?.squadra ?? "")}${g?.eta != null ? ` · ${g.eta} anni` : ""}
          <span class="targhetta ${waiver ? "forse" : "neutra"}">${waiver ? "waiver" : "free agency"}</span>
          <span class="targhetta neutra">${(m.offerte ?? []).length} ${(m.offerte ?? []).length === 1 ? "busta" : "buste"}</span>
        </span>
      </span>
      <span class="coda">
        <span style="font-size:12px;color:var(--inchiostro-lieve);text-align:right">chiude<br>${fraQuanto(m.scadeIl)}</span>
        ${squadra && possoToccare(squadra.id)
          ? `<button class="bottone piccolo" data-offri="${pulito(m.id)}">${mia ? "Ritocca" : "Offri"}</button>` : ""}
      </span>
    </div>`;
  };

  const schedaChiusa = (m) => {
    const vincitrice = m.vincitore ? squadraDi(m.vincitore) : null;
    return `<div class="voce">
      <span class="ruolo ${pulito(m.ruolo)}">${pulito(m.ruolo)}</span>
      <span class="corpo">
        <span class="nome">${pulito(m.nome)}</span>
        <span class="dettaglio">
          ${vincitrice ? `a ${pulito(vincitrice.nome)}` : "nessuna offerta valida"}
          <span class="targhetta neutra">${(m.offerte ?? []).length} buste</span>
          ${m.scartate ? `<span class="targhetta forse">${m.scartate} non più valide</span>` : ""}
        </span>
      </span>
      <span class="coda">${vincitrice
        ? `<span class="prezzo num">${soldi(vincitoreFra(m.offerte ?? [])?.ingaggio ?? 0)}</span>`
        : `<span class="targhetta neutra">libero</span>`}</span>
    </div>`;
  };

  const schedaScambio = (s) => {
    const da = squadraDi(s.da), a = squadraDi(s.a);
    const nomi = (ids, squadraId) => ids.length
      ? ids.map((id) => pulito(rosaDi(squadraId).find((c) => c.giocatoreId === id)?.nome ?? PER_ID.get(id)?.nome ?? "—")).join(", ")
      : "—";
    const tocca = s.a === squadra?.id && possoToccare(squadra.id);
    return `<div class="riquadro" style="margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px">
        <b>${pulito(da?.nome ?? "—")} → ${pulito(a?.nome ?? "—")}</b>
        <span style="font-size:12px;color:var(--inchiostro-lieve)">
          ${s.stato === "PROPOSTO" ? `scade ${fraQuanto(s.scadeIl)}` : pulito(s.stato.toLowerCase())}</span>
      </div>
      <div class="scorre"><table class="tabellina" style="margin-bottom:6px">
        <tr><td style="width:50%"><span class="occhiello">dà</span><br>${nomi(s.cedeDa, s.da)}
          ${s.capitaleDa ? `<br><span class="targhetta neutra">${soldi(s.capitaleDa)} di Capitale</span>` : ""}</td>
        <td><span class="occhiello">riceve</span><br>${nomi(s.cedeA, s.a)}
          ${s.capitaleA ? `<br><span class="targhetta neutra">${soldi(s.capitaleA)} di Capitale</span>` : ""}</td></tr>
      </table></div>
      ${tocca ? `<div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="bottone primario piccolo" data-accetta="${pulito(s.id)}">Accetta</button>
          <button class="bottone piccolo" data-rifiuta="${pulito(s.id)}">Rifiuta</button>
        </div>` : ""}
      ${s.da === squadra?.id && s.stato === "PROPOSTO"
        ? `<button class="bottone piccolo" data-ritira-scambio="${pulito(s.id)}">Ritira la proposta</button>` : ""}
    </div>`;
  };

  return `
    <h1>Mercato</h1>
    <p style="color:var(--inchiostro-med);margin:6px 0 14px">
      L'asta di settembre si fa al tavolo. Qui passa quello che viene dopo: i giocatori rimasti
      liberi, chi viene tagliato e gli scambi fra squadre.
      ${squadra ? `Hai speso <b>${spese}</b> offerte su ${REGOLE.mercato.offertePerStagione} (art. 9.1).` : ""}
    </p>

    <div class="avviso attenzione" style="margin-bottom:18px">
      <b>Le buste sono chiuse per accordo, non per crittografia.</b> L'applicazione non mostra a
      nessuno le offerte altrui prima dell'apertura, ma chi sa aprire il database della lega
      potrebbe leggerle. Fra dieci persone che si conoscono va bene saperlo, ed è giusto dirlo.
    </div>

    <div class="sezione">
      <div class="intestazione-sezione"><h2>Trattative aperte</h2>
        <span class="conteggio">${aperte.length}</span></div>
      ${aperte.length ? `<div class="elenco">${aperte.map(schedaTrattativa).join("")}</div>`
        : `<div class="vuoto riquadro">Nessuna trattativa aperta. Apri il <b>Listone</b>, scegli un
           giocatore libero e deposita la prima busta: gli altri avranno
           ${REGOLE.mercato.oreFreeAgency} ore per rilanciare.</div>`}
    </div>

    <div class="sezione">
      <div class="intestazione-sezione"><h2>Scambi da decidere</h2>
        <span class="conteggio">${mieiScambi.length}</span></div>
      ${squadra && possoToccare(squadra.id)
        ? `<button class="bottone" id="nuovo-scambio" style="margin-bottom:10px">Proponi uno scambio</button>` : ""}
      ${mieiScambi.length ? mieiScambi.map(schedaScambio).join("")
        : `<div class="vuoto riquadro">Nessuna proposta sul tavolo.</div>`}
    </div>

    ${chiuse.length ? `<div class="sezione">
      <div class="intestazione-sezione"><h2>Trattative chiuse</h2></div>
      <div class="elenco">${chiuse.map(schedaChiusa).join("")}</div>
    </div>` : ""}

    ${altriScambi.length ? `<div class="sezione">
      <div class="intestazione-sezione"><h2>Scambi conclusi</h2></div>
      ${altriScambi.map(schedaScambio).join("")}
    </div>` : ""}`;
}

/* ── Pagina: la società ───────────────────────────────────── */

function paginaSocieta() {
  const squadra = squadraCorrente();
  if (!squadra) return `<h1>Società</h1><div class="vuoto riquadro" style="margin-top:16px">Nessuna squadra da mostrare.</div>`;

  const s = societaDi(squadra.id);
  const posso = possoToccare(squadra.id);
  const conto = contoStadio(s.stadio);
  const vivaio = giovanileDa(s.capienzaGiovanile);
  const ampliamento = costoAmpliamento(s.capienzaGiovanile);
  const manutenzione = manutenzioneAnnua(s);

  const selettore = sonoCommissioner()
    ? `<label class="campo" style="margin-bottom:14px"><span>Squadra su cui lavori</span>
        <select id="scegli-squadra">
          ${stato.squadre.map((x) => `<option value="${pulito(x.id)}" ${x.id === squadra.id ? "selected" : ""}>${pulito(x.nome)}</option>`).join("")}
        </select></label>`
    : "";

  /* ── Lo stadio ── */
  const prossimo = s.stadio < 5 ? costoSalto(s.stadio, s.stadio + 1) : null;
  const scalaStadi = REGOLE.capitale.stadi.map((livello) => {
    const c = contoStadio(livello.livello);
    const attuale = livello.livello === s.stadio;
    const salto = costoSalto(s.stadio, livello.livello);
    const raggiungibile = livello.livello > s.stadio;
    return `<tr style="${attuale ? "background:var(--campo-chiaro)" : ""}">
      <td><b>${livello.livello} · ${pulito(livello.nome)}</b>${attuale ? ` <span class="targhetta ok">il tuo</span>` : ""}</td>
      <td class="n num">${soldi(aQuarti(livello.costruzione))}</td>
      <td class="n num">${soldi(aQuarti(livello.manutenzione))}</td>
      <td class="n num">${soldi(aQuarti(c.incasso))}<br><span style="font-size:11px;color:var(--inchiostro-lieve)">${soldi(aQuarti(livello.incassoPerGara))} a gara</span></td>
      <td class="n num" style="color:var(--ok)">+${soldi(aQuarti(c.netto))}</td>
      <td class="n num">${c.rientro.toFixed(1)}</td>
      <td>${raggiungibile && posso
        ? `<button class="bottone piccolo" data-stadio="${livello.livello}"
             ${s.capitale < aQuarti(salto.costo) ? "disabled" : ""}>
             ${salto.ricostruzione ? "Ricostruisci" : "Costruisci"} · ${soldi(aQuarti(salto.costo))}</button>`
        : ""}</td>
    </tr>`;
  }).join("");

  /* ── Gli osservatori ── */
  const reteOsservatori = REGOLE.capitale.osservatori.map((o) => {
    const attivo = s.osservatori.includes(o.campionato);
    return `<button class="scelta" data-osservatore="${pulito(o.campionato)}"
              aria-pressed="${attivo}" ${!posso || attivo || s.capitale < aQuarti(o.costo) ? "disabled" : ""}>
        <b>${pulito(o.campionato)}${attivo ? " — attivo" : ""}</b>
        <small>${pulito(o.paese)} · ${soldi(aQuarti(o.costo))} per una stagione</small>
      </button>`;
  }).join("");

  /* ── I movimenti ── */
  const movimenti = s.movimenti.length
    ? s.movimenti.map((m) => `<div class="voce">
        <span class="corpo">
          <span class="nome">${pulito(m.causale)}</span>
          <span class="dettaglio">${new Date(m.quando).toLocaleDateString("it-IT", { day: "numeric", month: "short", year: "numeric" })}</span>
        </span>
        <span class="coda">
          <span class="prezzo num" style="color:${m.quanto < 0 ? "var(--allarme)" : "var(--ok)"}">
            ${m.quanto < 0 ? "−" : "+"}${soldi(Math.abs(m.quanto))}</span>
          <span style="font-size:12px;color:var(--inchiostro-lieve)" class="num">saldo ${soldi(m.saldo)}</span>
        </span>
      </div>`).join("")
    : `<div class="vuoto riquadro">Nessun movimento: il Capitale è ancora quello di partenza.</div>`;

  return `
    <p class="occhiello">${pulito(squadra.nome)}</p>
    <h1 style="margin:6px 0 16px">Società</h1>
    ${selettore}

    <div class="tetto" style="margin-bottom:14px">
      <div style="flex:1 1 190px">
        <div class="occhiello" style="color:inherit;opacity:.6">Capitale</div>
        <div class="cifra num">${soldi(s.capitale)}</div>
        <div class="sotto">${manutenzione > 0 ? `${soldi(manutenzione)} di mantenimento all'anno` : "nessun costo fisso"}</div>
      </div>
      <div style="flex:1 1 160px">
        <div class="occhiello" style="color:inherit;opacity:.6">Stadio</div>
        <div class="cifra num" style="font-size:28px">${conto ? pulito(conto.nome) : "nessuno"}</div>
        <div class="sotto">${conto ? `+${soldi(aQuarti(conto.netto))} l'anno · ${conto.fantapunti} fantapunti in casa` : "si gioca in trasferta da sempre"}</div>
      </div>
    </div>

    <div class="avviso neutro" style="margin-bottom:18px">
      Il <b>Capitale</b> non è spazio salariale e non ci si trasforma (art. 14): il tetto limita gli
      ingaggi, il Capitale è denaro che si accumula e si investe in stadio, settore giovanile e
      osservatori. ${posso ? "" : "Stai guardando la società di un'altra squadra."}
    </div>

    <div class="sezione">
      <div class="intestazione-sezione"><h2>Stadio</h2>
        ${prossimo ? `<span class="conteggio">prossimo livello ${soldi(aQuarti(prossimo.costo))}</span>` : `<span class="conteggio">al massimo</span>`}</div>
      <p style="font-size:13px;color:var(--inchiostro-med);margin-bottom:10px">
        Si sale un livello alla volta pagando la differenza; per saltarne uno si demolisce e si
        ricostruisce da zero. <b>L'incasso è quello di una stagione intera</b>: il guadagno a ogni
        gara in casa moltiplicato per le ${REGOLE.capitale.gareInCasa} che se ne giocano.
        L'anno in cui lo costruisci ne incassi circa la metà, perché lo stadio apre alla
        ${REGOLE.capitale.operativoDallaGiornata}ª giornata (art. 15.1): sei mesi di cantiere.
        <b>Rientro</b> sono gli anni che il netto impiega a ripagare la costruzione.
      </p>
      <div class="riquadro scorre">
        <table class="tabellina">
          <thead><tr>
            <th>Livello</th><th style="text-align:right">Costruzione</th><th style="text-align:right">Manut./anno</th>
            <th style="text-align:right">Incasso/anno</th><th style="text-align:right">Netto/anno</th>
            <th style="text-align:right">Rientro</th><th></th>
          </tr></thead>
          <tbody>${scalaStadi}</tbody>
        </table>
      </div>
    </div>

    <div class="sezione">
      <div class="intestazione-sezione"><h2>Settore giovanile</h2>
        <span class="conteggio">${s.capienzaGiovanile} posti</span></div>
      <p style="font-size:13px;color:var(--inchiostro-med);margin-bottom:10px">
        I giovani non percepiscono ingaggio e non occupano spazio salariale: costano Capitale.
        ${vivaio.mantenimento > 0 ? `Oggi il vivaio costa ${soldi(aQuarti(vivaio.mantenimento))} l'anno.` : ""}
      </p>
      <div class="riquadro">
        ${ampliamento
          ? `<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
              <div><b>Portare la capienza a ${ampliamento.capienza}</b>
                <div style="font-size:13px;color:var(--inchiostro-med)">
                  ${soldi(aQuarti(ampliamento.costo))} adesso · ${soldi(aQuarti(ampliamento.mantenimento))} l'anno</div></div>
              ${posso ? `<button class="bottone" id="amplia-vivaio" ${s.capitale < aQuarti(ampliamento.costo) ? "disabled" : ""}>
                ${s.capitale < aQuarti(ampliamento.costo) ? "Capitale insufficiente" : "Amplia"}</button>` : ""}
            </div>`
          : `<p style="font-size:13.5px;color:var(--inchiostro-med)">Il settore giovanile è alla capienza massima: ${s.capienzaGiovanile} posti.</p>`}
      </div>
    </div>

    <div class="sezione">
      <div class="intestazione-sezione"><h2>Rete osservatori</h2>
        <span class="conteggio">${s.osservatori.length} attivi</span></div>
      <p style="font-size:13px;color:var(--inchiostro-med);margin-bottom:10px">
        Un osservatore dà il diritto di <b>pareggiare l'offerta più alta</b> su un giocatore che da
        quel campionato arriva in Serie A. Non è un acquisto esclusivo né uno sconto, e dura una stagione.
      </p>
      <div class="scelte">${reteOsservatori}</div>
    </div>

    <div class="sezione">
      <div class="intestazione-sezione"><h2>Movimenti</h2></div>
      ${s.movimenti.length ? `<div class="elenco">${movimenti}</div>` : movimenti}
      ${sonoCommissioner() ? `
        <div class="riquadro" style="margin-top:12px">
          <h3 style="margin-bottom:8px">Accredita o addebita</h3>
          <p style="font-size:13px;color:var(--inchiostro-med);margin-bottom:10px">
            Premi delle competizioni, sponsor, manutenzione di inizio stagione: le voci che non
            nascono da un pulsante le mette il commissioner, e restano scritte qui.</p>
          <form id="modulo-capitale" class="moduli">
            <label class="campo"><span>Causale</span>
              <input type="text" id="cap-causale" placeholder="es. premio secondo posto" required></label>
            <label class="campo"><span>Importo in milioni — negativo per addebitare</span>
              <input type="number" id="cap-importo" step="0.25" placeholder="es. 12 oppure −3" required></label>
            <button class="bottone largo" type="submit">Registra il movimento</button>
          </form>
        </div>` : ""}
    </div>`;
}

/* ── Il foglio della busta ────────────────────────────────── */

function foglioBusta(trattativaId, giocatoreId) {
  const squadra = squadraCorrente();
  /* Due modi di arrivare qui: rilanciare su una trattativa già aperta, o
     aprirne una nuova su un giocatore libero. Nel secondo caso la trattativa
     non esiste ancora e nasce con la prima busta. */
  const m = trattativaId
    ? stato.mercato.find((x) => x.id === trattativaId)
    : { id: null, giocatoreId, nome: PER_ID.get(giocatoreId)?.nome, ruolo: PER_ID.get(giocatoreId)?.ruolo,
        offerte: [], stato: "APERTA", tipo: "FREE_AGENCY",
        scadeIl: new Date(Date.now() + REGOLE.mercato.oreFreeAgency * 3600000).toISOString() };
  if (!m || !squadra) return "";
  const g = PER_ID.get(m.giocatoreId);
  const contratti = rosaDi(squadra.id);
  const conto = contoRosa(contratti);
  const mia = (m.offerte ?? []).find((o) => o.squadraId === squadra.id);

  const tipi = Object.entries(REGOLE.contratti).map(([id, regola]) => {
    const serveEtà = regola.etaMax != null || regola.etaMin != null;
    const impossibile =
      (serveEtà && g.eta == null) ? "serve l'età del giocatore"
      : (regola.etaMax != null && g.eta > regola.etaMax) ? `ne ha ${g.eta}, oltre i ${regola.etaMax}`
      : (regola.etaMin != null && g.eta < regola.etaMin) ? `ne ha ${g.eta}, sotto i ${regola.etaMin}`
      : (regola.slot && conto.slotLiberi < 1) ? "slot pluriennali finiti"
      : null;
    return `<button type="button" class="scelta" data-tipo="${id}" aria-pressed="${bozza.tipo === id}" ${impossibile ? "disabled" : ""}>
        <b>${regola.nome}${impossibile ? ` — ${impossibile}` : ""}</b><small>${regola.nota}</small></button>`;
  }).join("");

  const regolaScelta = REGOLE.contratti[bozza.tipo];
  const sceltaAnni = regolaScelta.anni.length > 1
    ? `<label class="campo"><span>Per quanti anni</span><div class="filtri" style="margin:0">
        ${regolaScelta.anni.map((a) => `<button type="button" class="pillola" data-anni="${a}" aria-pressed="${bozza.anni === a}">${a} anni</button>`).join("")}
      </div></label>` : "";

  const quarti = bozza.ingaggio === "" ? NaN : aQuarti(bozza.ingaggio);
  const motivi = Number.isFinite(quarti) && quarti > 0
    ? perchéNo({ giocatore: g, tipo: bozza.tipo, ingaggio: quarti, ingaggioScritto: Number(bozza.ingaggio),
                 anni: bozza.anni, conto, contrattiTampone: contratti.filter((c) => c.tipo === "TAMPONE").length })
    : [];
  const spese = offerteSpeseDa(squadra.id);
  const fuoriQuota = !mia && spese >= REGOLE.mercato.offertePerStagione;

  return `<div class="velo" data-velo><div class="foglio" role="dialog" aria-modal="true">
    <div class="foglio-testa">
      <span class="ruolo ${g.ruolo}" style="width:36px;height:36px;border-radius:9px">${g.ruolo}</span>
      <div><h2>${pulito(g.nome)}</h2>
        <p style="font-size:13px;color:var(--inchiostro-med)">
          ${pulito(g.squadra)} · quotato ${g.quotazione} M${g.eta != null ? ` · ${g.eta} anni` : ""}
          · chiude ${fraQuanto(m.scadeIl)}</p></div>
      <button class="chiudi" data-chiudi aria-label="Chiudi">×</button>
    </div>

    <div class="avviso neutro" style="margin-bottom:14px">
      ${(m.offerte ?? []).length
        ? `Ci sono <b>${(m.offerte ?? []).length} buste</b> depositate. Quanto valgono lo saprai
           all'apertura, come tutti gli altri.`
        : `Sei il primo. Da adesso gli altri hanno ${REGOLE.mercato.oreFreeAgency} ore per rilanciare.`}
      ${mia ? `<br>La tua offerta di adesso: <b>${soldi(mia.ingaggio)} × ${mia.anni} ${mia.anni === 1 ? "anno" : "anni"}</b>.` : ""}
    </div>

    ${fuoriQuota ? `<div class="avviso errore">Hai già speso tutte e
      ${REGOLE.mercato.offertePerStagione} le offerte della stagione (art. 9.1).</div>`
    : `<form id="modulo-busta" class="moduli" data-trattativa="${pulito(m.id ?? "")}"
             data-per-giocatore="${pulito(m.giocatoreId)}">
        <label class="campo"><span>Quanto offri — a passi di 0,25 M</span>
          <input type="number" id="ingaggio" step="0.25" min="0.25" max="${REGOLE.tetto}"
                 value="${pulito(bozza.ingaggio)}" placeholder="es. 3,5" inputmode="decimal" required></label>
        <div><span style="display:block;font-size:12px;font-weight:600;color:var(--inchiostro-med);margin-bottom:6px">Che contratto</span>
          <div class="scelte">${tipi}</div></div>
        ${sceltaAnni}
        ${motivi.length ? `<div class="avviso errore">${motivi.map(pulito).join("<br>")}</div>` : ""}
        <button class="bottone primario largo" type="submit"
          ${motivi.length || !Number.isFinite(quarti) || quarti <= 0 ? "disabled" : ""}>
          ${mia ? "Cambia la busta" : "Deposita la busta"}</button>
        <p style="font-size:12px;color:var(--inchiostro-med);text-align:center">
          ${mia ? "Ritoccare non consuma una seconda offerta." : `Ti resteranno ${REGOLE.mercato.offertePerStagione - spese - 1} offerte.`}
        </p>
      </form>`}
  </div></div>`;
}

/* ── Il foglio dello scambio ──────────────────────────────── */

let bozzaScambio = { conChi: null, cedeDa: [], cedeA: [], capitaleDa: "", capitaleA: "" };

function foglioScambio() {
  const mia = squadraCorrente();
  if (!mia) return "";
  const altre = stato.squadre.filter((s) => s.id !== mia.id);
  const con = bozzaScambio.conChi ? squadraDi(bozzaScambio.conChi) : null;

  const listaGiocatori = (squadraId, selezionati, attributo) =>
    rosaDi(squadraId).length
      ? [...rosaDi(squadraId)]
          .sort((a, b) => ORDINE_RUOLI.indexOf(a.ruolo) - ORDINE_RUOLI.indexOf(b.ruolo) || b.ingaggio - a.ingaggio)
          .map((c) => `<button type="button" class="scelta" ${attributo}="${pulito(c.giocatoreId)}"
              aria-pressed="${selezionati.includes(c.giocatoreId)}">
              <b>${pulito(c.nome)} · ${c.ruolo}</b>
              <small>${soldi(c.ingaggio)} · ${pulito(REGOLE.contratti[c.tipo]?.nome ?? c.tipo)}${c.anni > 1 ? ` ${c.anni} anni` : ""}</small>
            </button>`).join("")
      : `<p style="font-size:13px;color:var(--inchiostro-med)">Rosa vuota.</p>`;

  const motivi = con
    ? perchéNoScambio({
        daId: mia.id, aId: con.id,
        cedeDa: bozzaScambio.cedeDa, cedeA: bozzaScambio.cedeA,
        capitaleDa: bozzaScambio.capitaleDa ? aQuarti(bozzaScambio.capitaleDa) : 0,
        capitaleA: bozzaScambio.capitaleA ? aQuarti(bozzaScambio.capitaleA) : 0,
      })
    : [];

  return `<div class="velo" data-velo><div class="foglio" role="dialog" aria-modal="true">
    <div class="foglio-testa">
      <div><h2>Proponi uno scambio</h2>
        <p style="font-size:13px;color:var(--inchiostro-med)">
          I giocatori viaggiano con il loro contratto. Si scambia anche Capitale, mai spazio
          salariale (art. 11.1).</p></div>
      <button class="chiudi" data-chiudi aria-label="Chiudi">×</button>
    </div>

    <form id="modulo-scambio" class="moduli">
      <label class="campo"><span>Con quale squadra</span>
        <select id="scambio-con">
          <option value="">Scegli…</option>
          ${altre.map((s) => `<option value="${pulito(s.id)}" ${bozzaScambio.conChi === s.id ? "selected" : ""}>${pulito(s.nome)}</option>`).join("")}
        </select></label>

      ${con ? `
        <div><span style="display:block;font-size:12px;font-weight:600;color:var(--inchiostro-med);margin-bottom:6px">
          Dai — dalla rosa di ${pulito(mia.nome)}</span>
          <div class="scelte">${listaGiocatori(mia.id, bozzaScambio.cedeDa, "data-cede-da")}</div></div>

        <div><span style="display:block;font-size:12px;font-weight:600;color:var(--inchiostro-med);margin-bottom:6px">
          Ricevi — dalla rosa di ${pulito(con.nome)}</span>
          <div class="scelte">${listaGiocatori(con.id, bozzaScambio.cedeA, "data-cede-a")}</div></div>

        <div class="scelte">
          <label class="campo"><span>Capitale che dai</span>
            <input type="number" id="cap-da" step="0.25" min="0" value="${pulito(bozzaScambio.capitaleDa)}" placeholder="0"></label>
          <label class="campo"><span>Capitale che ricevi</span>
            <input type="number" id="cap-a" step="0.25" min="0" value="${pulito(bozzaScambio.capitaleA)}" placeholder="0"></label>
        </div>

        ${motivi.length ? `<div class="avviso errore">${motivi.map(pulito).join("<br>")}</div>`
          : `<div class="avviso bene">Le due rose restano valide. ${pulito(con.nome)} ha
             ${REGOLE.mercato.oreAccettazioneScambio} ore per rispondere.</div>`}

        <button class="bottone primario largo" type="submit" ${motivi.length ? "disabled" : ""}>
          Manda la proposta a ${pulito(con.nome)}</button>
      ` : ""}
    </form>
  </div></div>`;
}

/* ── Pagina: il registro ──────────────────────────────────── */

function paginaRegistro() {
  if (!stato.registro.length) {
    return `<h1>Registro</h1><div class="vuoto riquadro" style="margin-top:16px">
      Ancora nessuna operazione. Qui finisce tutto quello che succede nella lega, in ordine di tempo.</div>`;
  }
  const righe = stato.registro.map((v) => {
    const quando = new Date(v.quando);
    const data = quando.toLocaleDateString("it-IT", { day: "numeric", month: "short" });
    const ora = quando.toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" });
    return `<div class="voce">
      <span class="corpo">
        <span class="nome">${pulito(v.dettaglio)}</span>
        <span class="dettaglio">${pulito(v.chi)} · ${pulito(v.cosa)}</span>
      </span>
      <span class="coda"><span style="font-size:12px;color:var(--inchiostro-lieve)">${data}<br>${ora}</span></span>
    </div>`;
  }).join("");
  return `<h1>Registro</h1>
    <p style="color:var(--inchiostro-med);margin:6px 0 14px">
      Le ultime ${stato.registro.length} operazioni della lega, dalla più recente.</p>
    <div class="elenco">${righe}</div>`;
}

/* ── Pagina: gestione (solo commissioner) ─────────────────── */

function paginaGestione() {
  const righe = stato.squadre.map((s) => {
    const conto = contoRosa(rosaDi(s.id));
    return `<div class="voce">
      <span class="ruolo" style="background:${pulito(s.colore || "#DADDD2")};color:#12140F">${pulito(s.sigla)}</span>
      <span class="corpo">
        <span class="nome">${pulito(s.nome)}</span>
        <span class="dettaglio">${pulito(s.presidente || "presidente da assegnare")}${serveIlCodice() ? ` · codice ${pulito(s.pin || "—")}` : ""} · ${conto.numero} in rosa</span>
      </span>
      <span class="coda">
        <button class="bottone piccolo" data-modifica="${pulito(s.id)}">Modifica</button>
      </span>
    </div>`;
  }).join("");

  const mancano = 10 - stato.squadre.length;

  return `
    <h1>Gestione</h1>
    <p style="color:var(--inchiostro-med);margin:6px 0 18px">
      Le squadre della lega e chi le guida.
    </p>

    <div class="sezione">
      <div class="intestazione-sezione"><h2>Come si entra</h2></div>
      <div class="riquadro">
        <div class="scelte">
          <button class="scelta" data-codice="no" aria-pressed="${!serveIlCodice()}">
            <b>Basta toccare la squadra</b>
            <small>Chi ha il link è della lega. Un tocco e si è dentro, anche dal telefono.</small></button>
          <button class="scelta" data-codice="si" aria-pressed="${serveIlCodice()}">
            <b>Chiedi un codice</b>
            <small>Quattro cifre per ciascuno. Evita di entrare per sbaglio nella squadra di un altro.</small></button>
        </div>
        <p style="font-size:12.5px;color:var(--inchiostro-med);margin-top:10px">
          In nessuno dei due casi il codice difende dei segreti: chiunque abbia il link può
          leggere tutta la lega comunque. Serve solo a non sbagliare porta.
        </p>
      </div>
    </div>

    <div class="sezione">
      <div class="intestazione-sezione"><h2>Squadre</h2>
        <span class="conteggio">${stato.squadre.length} su 10</span></div>
      ${stato.squadre.length ? `<div class="elenco" style="margin-bottom:12px">${righe}</div>` : ""}
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="bottone" id="aggiungi-squadra">Aggiungi una squadra</button>
        ${serveIlCodice() && stato.squadre.some((s) => s.pin !== CODICE_PREDEFINITO)
          ? `<button class="bottone" id="codice-uguale">Rimetti ${CODICE_PREDEFINITO} a tutti</button>` : ""}
      </div>

      ${stato.squadre.length === 0 ? `
        <div class="riquadro" style="margin-top:14px">
          <h3 style="margin-bottom:6px">Iscrivi tutte le squadre in una volta</h3>
          <p style="font-size:13px;color:var(--inchiostro-med);margin-bottom:10px">
            Una riga per squadra: <b>nome della squadra, presidente</b>. Il presidente si può
            lasciare fuori e aggiungerlo dopo. Ognuna nasce con la dotazione di
            ${REGOLE.capitale.dotazione} M (art. 14) e con il codice ${CODICE_PREDEFINITO}.
          </p>
          <form id="modulo-iscrizioni" class="moduli">
            <textarea id="elenco-squadre" rows="10" spellcheck="false"
              placeholder="Real Marasca, Giulio&#10;Atletico Sorata, Marta&#10;Borgo United, Ivan"
              style="width:100%;padding:11px 13px;font:inherit;font-size:14px;line-height:1.7;
                     color:var(--inchiostro);background:var(--carta-alta);
                     border:1px solid var(--bordo-forte);border-radius:var(--raggio-s);resize:vertical"></textarea>
            <button class="bottone primario largo" type="submit">Iscrivi le squadre</button>
            <div id="esito-iscrizioni"></div>
          </form>
        </div>` : ""}
    </div>

    <div class="sezione">
      <div class="intestazione-sezione"><h2>A che punto siamo</h2></div>
      <div class="riquadro">
        <p style="font-size:13.5px;color:var(--inchiostro-med);margin-bottom:12px">
          Il giorno dopo l'asta si scrivono le rose così come sono uscite dal tavolo: si cerca il
          giocatore e si mette dentro. A stagione avviata invece un giocatore libero se lo
          contendono in più squadre, e allora passa dalle buste chiuse
          (${REGOLE.mercato.oreFreeAgency} ore, art. 9).
        </p>
        <div class="scelte">
          <button class="scelta" data-fase="COMPOSIZIONE" aria-pressed="${fase() === "COMPOSIZIONE"}">
            <b>Si compongono le rose</b><small>Dal listone si firma subito, senza aspettare.</small></button>
          <button class="scelta" data-fase="MERCATO" aria-pressed="${fase() === "MERCATO"}">
            <b>Mercato aperto</b><small>Sui liberi si depositano buste e vince la più alta.</small></button>
        </div>
      </div>
    </div>

    <div class="sezione">
      <div class="intestazione-sezione"><h2>Classifica</h2></div>
      <div class="riquadro">
        <p style="font-size:13.5px;color:var(--inchiostro-med);margin-bottom:12px">
          A parità di offerta vince la squadra <b>peggio piazzata</b> (art. 9.4): è il modo di non
          far scappare via i primi. Scrivi qui la classifica della stagione scorsa — 1 alla prima,
          10 all'ultima.
        </p>
        <div class="scelte">
          ${stato.squadre.map((s) => `<label class="campo"><span>${pulito(s.nome)}</span>
            <input type="number" min="1" max="${stato.squadre.length}" data-posizione="${pulito(s.id)}"
                   value="${s.posizione ?? ""}" placeholder="${s.ordine ?? ""}"></label>`).join("")}
        </div>
      </div>
    </div>

    <div class="sezione">
      <div class="intestazione-sezione"><h2>La lega</h2></div>
      <div class="riquadro moduli">
        <label class="campo"><span>Nome della lega</span>
          <input type="text" id="rinomina-lega" value="${pulito(stato.config.nome)}" maxlength="40"></label>
        <button class="bottone" id="salva-lega">Salva il nome</button>
      </div>
    </div>

    <div class="sezione">
      <div class="intestazione-sezione"><h2>Ripartire da zero</h2></div>
      <div class="riquadro">
        <p style="font-size:13.5px;color:var(--inchiostro-med);margin-bottom:12px">
          Toglie squadre, rose e registro. Il listone e la lega restano.
          Scrivi <b>${pulito(stato.config.nome)}</b> per confermare.
        </p>
        <div class="moduli">
          <input type="text" id="conferma-azzera" placeholder="Nome della lega">
          <button class="bottone pericolo" id="azzera">Cancella squadre e rose</button>
        </div>
      </div>
    </div>`;
}

function foglioSquadra(squadraId) {
  const s = squadraId ? squadraDi(squadraId) : null;
  const nuova = !s;
  return `<div class="velo" data-velo><div class="foglio" role="dialog" aria-modal="true">
    <div class="foglio-testa">
      <h2>${nuova ? "Nuova squadra" : pulito(s.nome)}</h2>
      <button class="chiudi" data-chiudi aria-label="Chiudi">×</button>
    </div>
    <form id="modulo-squadra" class="moduli" data-id="${pulito(squadraId ?? "")}">
      <label class="campo"><span>Nome della squadra</span>
        <input type="text" id="sq-nome" value="${pulito(s?.nome ?? "")}" maxlength="30" required></label>
      <label class="campo"><span>Sigla — due o tre lettere</span>
        <input type="text" id="sq-sigla" value="${pulito(s?.sigla ?? "")}" maxlength="3" required></label>
      <label class="campo"><span>Presidente</span>
        <input type="text" id="sq-presidente" value="${pulito(s?.presidente ?? "")}" maxlength="30"></label>
      ${serveIlCodice() ? `<label class="campo"><span>Codice d'ingresso — quattro cifre</span>
        <input type="text" id="sq-pin" value="${pulito(s?.pin ?? CODICE_PREDEFINITO)}" inputmode="numeric"
               pattern="[0-9]{4}" maxlength="4" required></label>` : ""}
      <label class="campo"><span>Colore</span>
        <input type="color" id="sq-colore" value="${pulito(s?.colore ?? "#2C7A52")}"
               style="height:44px;padding:4px"></label>
      <button class="bottone primario largo" type="submit">${nuova ? "Iscrivi la squadra" : "Salva"}</button>
      ${!nuova && rosaDi(squadraId).length === 0
        ? `<button type="button" class="bottone pericolo largo" data-ritira="${pulito(squadraId)}">Ritira dalla lega</button>`
        : !nuova ? `<p style="font-size:12px;color:var(--inchiostro-med);text-align:center">
            Una squadra con dei contratti non si ritira: i suoi giocatori resterebbero senza squadra.</p>` : ""}
    </form>
  </div></div>`;
}

function foglioCodice(chi) {
  const squadra = chi === "commissioner" ? null : squadraDi(chi);
  return `<div class="velo" data-velo><div class="foglio" role="dialog" aria-modal="true" style="max-width:400px">
    <div class="foglio-testa">
      <h2>${squadra ? pulito(squadra.nome) : "Commissioner"}</h2>
      <button class="chiudi" data-chiudi aria-label="Chiudi">×</button>
    </div>
    <form id="modulo-codice" class="moduli" data-chi="${pulito(chi)}">
      <label class="campo"><span>Il tuo codice — quattro cifre</span>
        <input type="text" id="codice" inputmode="numeric" pattern="[0-9]{4}" maxlength="4"
               autocomplete="off" autofocus required></label>
      <div id="esito-codice"></div>
      <button class="bottone primario largo" type="submit">Entra</button>
    </form>
  </div></div>`;
}

/* ═══════════════════════════════════════════════════════════════
   GLI EFFETTI

   Il disegno rifà l'HTML da capo, quindi gli ascoltatori si
   riattaccano ogni volta. È il prezzo di non avere una libreria, e
   per una pagina di questa misura è un prezzo basso.
   ═══════════════════════════════════════════════════════════════ */

const su = (selettore, evento, azione) => {
  radice.querySelectorAll(selettore).forEach((elemento) => elemento.addEventListener(evento, azione));
};

function dopoIlDisegno() {
  /* Navigazione, uscita, identità */
  su("[data-vista]", "click", (e) => { stato.vista = e.currentTarget.dataset.vista; disegna(); });
  su("#esci", "click", () => { dimenticaIo(); stato.vista = "lega"; disegna(); });
  su("[data-entra]", "click", (e) => {
    const chi = e.currentTarget.dataset.entra;
    if (serveIlCodice()) { apriFoglio({ tipo: "codice", chi }); return; }
    ricordaIo(chi === "commissioner" ? { ruolo: "commissioner" } : { ruolo: "presidente", squadraId: chi });
    stato.vista = "lega";
    disegna();
  });
  su("[data-chiudi], [data-velo]", "click", (e) => { if (e.target === e.currentTarget) chiudiFoglio(); });

  /* Fondazione */
  const fondazione = radice.querySelector("#modulo-fondazione");
  if (fondazione) fondazione.addEventListener("submit", async (e) => {
    e.preventDefault();
    const nome = radice.querySelector("#nome-lega").value.trim();
    const esito = radice.querySelector("#esito-fondazione");
    try {
      await db.doc("lega/config").set({
        nome: nome || "Dynasty League",
        stagione: STAGIONE,
        chiediCodice: false,
        pinCommissioner: CODICE_PREDEFINITO,
        fondata: new Date().toISOString(),
      });
      ricordaIo({ ruolo: "commissioner" });
      await annota("lega", `Lega «${nome}» aperta per la stagione ${STAGIONE}`, null);
    } catch (errore) {
      esito.innerHTML = `<div class="avviso errore">Non sono riuscito ad aprire la lega: ${pulito(errore.message ?? errore.code ?? errore)}</div>`;
    }
  });

  /* Codice d'ingresso */
  const campoCodice = radice.querySelector("#codice");
  if (campoCodice && document.activeElement !== campoCodice) campoCodice.focus();

  const moduloCodice = radice.querySelector("#modulo-codice");
  if (moduloCodice) moduloCodice.addEventListener("submit", (e) => {
    e.preventDefault();
    const chi = moduloCodice.dataset.chi;
    const scritto = radice.querySelector("#codice").value.trim();
    const atteso = chi === "commissioner" ? stato.config.pinCommissioner : squadraDi(chi)?.pin;
    if (scritto !== atteso) {
      radice.querySelector("#esito-codice").innerHTML =
        `<div class="avviso errore">Codice sbagliato. Se l'hai perso, chiedilo al commissioner.</div>`;
      return;
    }
    ricordaIo(chi === "commissioner" ? { ruolo: "commissioner" } : { ruolo: "presidente", squadraId: chi });
    foglioAperto = null;
    stato.vista = "lega";
    disegna();
  });

  /* Listone: filtri e ricerca */
  const cerca = radice.querySelector("#cerca-listone");
  if (cerca) cerca.addEventListener("input", (e) => {
    filtri.testo = e.target.value;
    const posizione = e.target.selectionStart;
    disegna();
    const nuovo = radice.querySelector("#cerca-listone");
    if (nuovo) { nuovo.focus(); nuovo.setSelectionRange(posizione, posizione); }
  });
  su("[data-ruolo]", "click", (e) => {
    const r = e.currentTarget.dataset.ruolo;
    filtri.ruolo = r === "" ? null : r === filtri.ruolo ? null : r;
    disegna();
  });
  su("[data-eta]", "click", (e) => {
    const eta = Number(e.currentTarget.dataset.eta);
    filtri.etaMax = filtri.etaMax === eta ? null : eta;
    disegna();
  });
  su("#filtro-primavera", "click", () => { filtri.soloPrimavera = !filtri.soloPrimavera; disegna(); });
  su("#filtro-liberi", "click", () => { filtri.soloLiberi = !filtri.soloLiberi; disegna(); });

  /* Dal listone al foglio della firma */
  su("[data-giocatore]", "click", (e) => {
    /* Un click nato dentro un foglio appartiene al foglio, non all'elenco che
       sta sotto: senza questa riga un modulo che portasse lo stesso attributo
       riaprirebbe la scheda invece di lasciar lavorare il suo bottone. */
    if (e.currentTarget.closest(".velo")) return;
    const id = e.currentTarget.dataset.giocatore;
    if (tesserati().has(id)) return;
    if (!squadraCorrente() || !possoToccare(squadraCorrente().id)) return;
    bozza = { tipo: "ANNUALE", anni: 1, ingaggio: "" };
    if (siamoAlMercato()) {
      const aperta = trattativaAperta(id);
      apriFoglio({ tipo: "busta", trattativaId: aperta?.id ?? null, giocatoreId: id });
    } else {
      apriFoglio({ tipo: "firma", giocatoreId: id });
    }
  });

  /* Ricerca dentro la pagina Rosa */
  const cercaRosa = radice.querySelector("#cerca-per-rosa");
  if (cercaRosa) {
    cercaRosa.addEventListener("input", (e) => mostraRisultatiRosa(e.target.value));
    if (cercaRosa.dataset.testo) cercaRosa.value = cercaRosa.dataset.testo;
  }

  /* Il commissioner cambia squadra su cui lavora */
  const scegli = radice.querySelector("#scegli-squadra");
  if (scegli) scegli.addEventListener("change", (e) => { stato.squadraScelta = e.target.value; disegna(); });

  /* Firma */
  su("[data-tipo]", "click", (e) => {
    const tipo = e.currentTarget.dataset.tipo;
    bozza.tipo = tipo;
    const anni = REGOLE.contratti[tipo].anni;
    if (!anni.includes(bozza.anni)) bozza.anni = anni[0];
    disegna();
  });
  su("[data-anni]", "click", (e) => { bozza.anni = Number(e.currentTarget.dataset.anni); disegna(); });

  const ingaggio = radice.querySelector("#ingaggio");
  if (ingaggio) {
    ingaggio.addEventListener("input", (e) => {
      bozza.ingaggio = e.target.value;
      const posizione = e.target.selectionStart;
      disegna();
      const nuovo = radice.querySelector("#ingaggio");
      if (nuovo) { nuovo.focus(); try { nuovo.setSelectionRange(posizione, posizione); } catch { /* number input */ } }
    });
    if (document.activeElement !== ingaggio && bozza.ingaggio === "") ingaggio.focus();
  }

  const moduloFirma = radice.querySelector("#modulo-firma");
  if (moduloFirma) moduloFirma.addEventListener("submit", async (e) => {
    e.preventDefault();
    await firma();
  });

  /* Togliere dalla rosa */
  su("[data-togli]", "click", async (e) => {
    const id = e.currentTarget.dataset.togli;
    const squadra = squadraCorrente();
    const contratto = rosaDi(squadra.id).find((c) => c.giocatoreId === id);
    if (!contratto) return;
    if (!confirm(`Togliere ${contratto.nome} dalla rosa? Va in waiver per ${REGOLE.mercato.oreWaiver} ore: in quel tempo le altre squadre possono reclamarlo.`)) return;
    const restanti = rosaDi(squadra.id).filter((c) => c.giocatoreId !== id);
    await scriviRosa(squadra.id, restanti);

    /* Art. 10 — chi viene tagliato non torna subito libero: resta 48 ore in
       waiver. Serve a impedire la corsa al click sul giocatore appena tagliato. */
    await db.collection("mercato").doc("w" + Date.now().toString(36)).set({
      tipo: "WAIVER", giocatoreId: id, nome: contratto.nome, ruolo: contratto.ruolo,
      apertaIl: new Date().toISOString(),
      scadeIl: new Date(Date.now() + REGOLE.mercato.oreWaiver * 3600000).toISOString(),
      offerte: [], stato: "APERTA", tagliatoDa: squadra.id,
    });
    await annota("mercato", `${contratto.nome} tagliato da ${squadra.nome}: in waiver per ${REGOLE.mercato.oreWaiver} ore`, squadra.id);
  });

  agganciaMercato();
  agganciaSocieta();
  agganciaGestione();
}

/* ── Gli effetti del mercato ──────────────────────────────── */

function agganciaMercato() {
  su("[data-offri]", "click", (e) => {
    const m = stato.mercato.find((x) => x.id === e.currentTarget.dataset.offri);
    const mia = (m?.offerte ?? []).find((o) => o.squadraId === squadraCorrente()?.id);
    bozza = mia
      ? { tipo: mia.tipo, anni: mia.anni, ingaggio: String(aMilioni(mia.ingaggio)) }
      : { tipo: "ANNUALE", anni: 1, ingaggio: "" };
    apriFoglio({ tipo: "busta", trattativaId: e.currentTarget.dataset.offri });
  });

  const moduloBusta = radice.querySelector("#modulo-busta");
  if (moduloBusta) moduloBusta.addEventListener("submit", async (e) => {
    e.preventDefault();
    const squadra = squadraCorrente();
    if (!squadra) { chiudiFoglio(); return; }
    const offerta = { squadraId: squadra.id, ingaggio: aQuarti(bozza.ingaggio),
                      anni: bozza.anni, tipo: bozza.tipo, quando: new Date().toISOString() };

    let m = stato.mercato.find((x) => x.id === moduloBusta.dataset.trattativa);
    if (!m) {
      /* Trattativa nuova su un giocatore libero. Se qualcuno l'ha aperta un
         istante fa, ci si accoda alla sua invece di aprirne una seconda. */
      const giocatoreId = moduloBusta.dataset.perGiocatore;
      const g = PER_ID.get(giocatoreId);
      m = trattativaAperta(giocatoreId);
      if (!m) {
        m = { id: "m" + Date.now().toString(36), tipo: "FREE_AGENCY",
              giocatoreId, nome: g.nome, ruolo: g.ruolo,
              apertaIl: new Date().toISOString(),
              scadeIl: new Date(Date.now() + REGOLE.mercato.oreFreeAgency * 3600000).toISOString(),
              offerte: [], stato: "APERTA" };
      }
    }
    if (m.stato !== "APERTA") { chiudiFoglio(); return; }

    const altre = (m.offerte ?? []).filter((o) => o.squadraId !== squadra.id);
    const { id, ...corpo } = m;
    await db.collection("mercato").doc(id).set({ ...corpo, offerte: [...altre, offerta] });
    /* Il registro dice che una busta è arrivata, non quanto vale: pubblicarne
       l'importo prima dell'apertura vanificherebbe la busta. */
    await annota("mercato", `${squadra.nome} deposita una busta per ${m.nome}`, squadra.id);
    chiudiFoglio();
  });

  su("#nuovo-scambio", "click", () => {
    bozzaScambio = { conChi: null, cedeDa: [], cedeA: [], capitaleDa: "", capitaleA: "" };
    apriFoglio({ tipo: "scambio" });
  });

  const scegliCon = radice.querySelector("#scambio-con");
  if (scegliCon) scegliCon.addEventListener("change", (e) => {
    bozzaScambio = { conChi: e.target.value || null, cedeDa: [], cedeA: [], capitaleDa: "", capitaleA: "" };
    disegna();
  });

  const scambia = (elenco, id) =>
    elenco.includes(id) ? elenco.filter((x) => x !== id) : [...elenco, id];
  su("[data-cede-da]", "click", (e) => { bozzaScambio.cedeDa = scambia(bozzaScambio.cedeDa, e.currentTarget.dataset.cedeDa); disegna(); });
  su("[data-cede-a]", "click", (e) => { bozzaScambio.cedeA = scambia(bozzaScambio.cedeA, e.currentTarget.dataset.cedeA); disegna(); });

  for (const [selettore, campo] of [["#cap-da", "capitaleDa"], ["#cap-a", "capitaleA"]]) {
    const elemento = radice.querySelector(selettore);
    if (elemento) elemento.addEventListener("input", (ev) => { bozzaScambio[campo] = ev.target.value; disegna(); });
  }

  const moduloScambio = radice.querySelector("#modulo-scambio");
  if (moduloScambio) moduloScambio.addEventListener("submit", async (e) => {
    e.preventDefault();
    const mia = squadraCorrente();
    const con = squadraDi(bozzaScambio.conChi);
    if (!mia || !con) return;
    const proposta = {
      da: mia.id, a: con.id,
      cedeDa: bozzaScambio.cedeDa, cedeA: bozzaScambio.cedeA,
      capitaleDa: bozzaScambio.capitaleDa ? aQuarti(bozzaScambio.capitaleDa) : 0,
      capitaleA: bozzaScambio.capitaleA ? aQuarti(bozzaScambio.capitaleA) : 0,
      proposto: new Date().toISOString(),
      scadeIl: new Date(Date.now() + REGOLE.mercato.oreAccettazioneScambio * 3600000).toISOString(),
      stato: "PROPOSTO",
    };
    if (perchéNoScambio({ daId: mia.id, aId: con.id, ...proposta }).length) { disegna(); return; }
    await db.collection("scambi").doc(Date.now().toString(36)).set(proposta);
    await annota("scambio", `${mia.nome} propone uno scambio a ${con.nome}`, mia.id);
    chiudiFoglio();
  });

  su("[data-accetta]", "click", async (e) => {
    const s = stato.scambi.find((x) => x.id === e.currentTarget.dataset.accetta);
    if (!s || s.stato !== "PROPOSTO") return;
    const motivi = perchéNoScambio({ daId: s.da, aId: s.a, cedeDa: s.cedeDa, cedeA: s.cedeA,
                                     capitaleDa: s.capitaleDa, capitaleA: s.capitaleA });
    if (motivi.length) { alert("Lo scambio non è più valido:\n\n" + motivi.join("\n")); return; }
    if (!confirm("Accetti lo scambio? I giocatori passano subito, con il loro contratto.")) return;

    e.currentTarget.disabled = true;
    const pacchettoDa = rosaDi(s.da).filter((c) => s.cedeDa.includes(c.giocatoreId));
    const pacchettoA = rosaDi(s.a).filter((c) => s.cedeA.includes(c.giocatoreId));

    await scriviRosa(s.da, rosaDopoScambio(s.da, s.cedeDa, pacchettoA));
    await scriviRosa(s.a, rosaDopoScambio(s.a, s.cedeA, pacchettoDa));
    if (s.capitaleDa) { await muoviCapitale(s.da, -s.capitaleDa, `Scambio con ${squadraDi(s.a)?.nome ?? "—"}`);
                        await muoviCapitale(s.a, s.capitaleDa, `Scambio con ${squadraDi(s.da)?.nome ?? "—"}`); }
    if (s.capitaleA) { await muoviCapitale(s.a, -s.capitaleA, `Scambio con ${squadraDi(s.da)?.nome ?? "—"}`);
                       await muoviCapitale(s.da, s.capitaleA, `Scambio con ${squadraDi(s.a)?.nome ?? "—"}`); }

    await db.collection("scambi").doc(s.id).set({ ...s, stato: "ACCETTATO", chiusoIl: new Date().toISOString() });
    const nomi = (p) => p.length ? p.map((c) => c.nome).join(", ") : "nessun giocatore";
    await annota("scambio",
      `${squadraDi(s.da)?.nome} ↔ ${squadraDi(s.a)?.nome}: ${nomi(pacchettoDa)} per ${nomi(pacchettoA)}`, s.a);
  });

  su("[data-rifiuta]", "click", async (e) => {
    const s = stato.scambi.find((x) => x.id === e.currentTarget.dataset.rifiuta);
    if (!s) return;
    await db.collection("scambi").doc(s.id).set({ ...s, stato: "RIFIUTATO", chiusoIl: new Date().toISOString() });
    await annota("scambio", `${squadraDi(s.a)?.nome} rifiuta lo scambio di ${squadraDi(s.da)?.nome}`, s.a);
  });

  su("[data-ritira-scambio]", "click", async (e) => {
    const s = stato.scambi.find((x) => x.id === e.currentTarget.dataset.ritiraScambio);
    if (!s) return;
    await db.collection("scambi").doc(s.id).set({ ...s, stato: "RITIRATO", chiusoIl: new Date().toISOString() });
    await annota("scambio", `${squadraDi(s.da)?.nome} ritira la sua proposta`, s.da);
  });
}

/* ── Gli effetti della società ────────────────────────────── */

function agganciaSocieta() {
  su("[data-stadio]", "click", async (e) => {
    const bottone = e.currentTarget;
    const livello = Number(bottone.dataset.stadio);
    const squadra = squadraCorrente();
    const s = societaDi(squadra.id);
    const salto = costoSalto(s.stadio, livello);
    const arrivo = stadioAl(livello);

    const domanda = salto.ricostruzione
      ? `Saltare al livello ${livello} vuol dire demolire e ricostruire da zero: ${soldi(aQuarti(salto.costo))}. Procedo?`
      : `Costruire lo stadio ${arrivo.nome} per ${soldi(aQuarti(salto.costo))}?`;
    if (!confirm(domanda)) return;

    bottone.disabled = true;
    try {
      await scriviSocieta(squadra.id, { stadio: livello });
      await muoviCapitale(squadra.id, -aQuarti(salto.costo),
        `${salto.ricostruzione ? "Ricostruzione" : "Costruzione"} stadio ${arrivo.nome}`);
    } catch (errore) {
      alert(errore.message ?? "Non è riuscito.");
      bottone.disabled = false;
    }
  });

  su("#amplia-vivaio", "click", async (e) => {
    const squadra = squadraCorrente();
    const s = societaDi(squadra.id);
    const ampliamento = costoAmpliamento(s.capienzaGiovanile);
    if (!ampliamento) return;
    if (!confirm(`Portare il settore giovanile a ${ampliamento.capienza} posti per ${soldi(aQuarti(ampliamento.costo))}? Poi costerà ${soldi(aQuarti(ampliamento.mantenimento))} l'anno.`)) return;

    e.currentTarget.disabled = true;
    try {
      await scriviSocieta(squadra.id, { capienzaGiovanile: ampliamento.capienza });
      await muoviCapitale(squadra.id, -aQuarti(ampliamento.costo),
        `Settore giovanile a ${ampliamento.capienza} posti`);
    } catch (errore) {
      alert(errore.message ?? "Non è riuscito.");
    }
  });

  su("[data-osservatore]", "click", async (e) => {
    const campionato = e.currentTarget.dataset.osservatore;
    const squadra = squadraCorrente();
    const s = societaDi(squadra.id);
    const scelto = REGOLE.capitale.osservatori.find((o) => o.campionato === campionato);
    if (!scelto || s.osservatori.includes(campionato)) return;
    if (!confirm(`Mandare un osservatore in ${campionato} per una stagione? Costa ${soldi(aQuarti(scelto.costo))}.`)) return;

    e.currentTarget.disabled = true;
    try {
      await scriviSocieta(squadra.id, { osservatori: [...s.osservatori, campionato] });
      await muoviCapitale(squadra.id, -aQuarti(scelto.costo), `Osservatore su ${campionato}`);
    } catch (errore) {
      alert(errore.message ?? "Non è riuscito.");
    }
  });

  const moduloCapitale = radice.querySelector("#modulo-capitale");
  if (moduloCapitale) moduloCapitale.addEventListener("submit", async (e) => {
    e.preventDefault();
    const causale = radice.querySelector("#cap-causale").value.trim();
    /* Il meno lungo «−» si scrive facilmente col telefono e non è un meno. */
    const scritto = radice.querySelector("#cap-importo").value.replace("−", "-").replace(",", ".");
    const importo = Number(scritto);
    if (!causale || !Number.isFinite(importo) || importo === 0) { alert("Servono una causale e un importo diverso da zero."); return; }
    try {
      await muoviCapitale(squadraCorrente().id, aQuarti(importo), causale);
    } catch (errore) {
      alert(errore.message ?? "Non è riuscito.");
    }
  });
}

/** I risultati della ricerca dentro la pagina Rosa. Non passa dal
 *  disegno generale: il campo perderebbe il fuoco a ogni lettera. */
function mostraRisultatiRosa(testo) {
  const zona = radice.querySelector("#risultati-rosa");
  if (!zona) return;
  const cercato = testo.trim().toLowerCase();
  if (cercato.length < 2) { zona.innerHTML = ""; return; }

  const presi = tesserati();
  const trovati = LISTONE
    .filter((g) => !presi.has(g.id) && g.nome.toLowerCase().includes(cercato))
    .slice(0, 8);

  zona.innerHTML = trovati.length
    ? `<div class="elenco" style="margin-top:10px">${trovati.map((g) => `
        <button class="voce" data-giocatore="${pulito(g.id)}">
          <span class="ruolo ${g.ruolo}">${g.ruolo}</span>
          <span class="corpo"><span class="nome">${pulito(g.nome)}</span>
            <span class="dettaglio">${pulito(g.squadra)}${g.eta != null ? ` · ${g.eta} anni` : ""}</span></span>
          <span class="coda"><span class="prezzo num">${g.quotazione} M</span></span>
        </button>`).join("")}</div>`
    : `<div class="vuoto riquadro" style="margin-top:10px">Nessun giocatore libero con questo nome.</div>`;

  zona.querySelectorAll("[data-giocatore]").forEach((b) =>
    b.addEventListener("click", () => {
      bozza = { tipo: "ANNUALE", anni: 1, ingaggio: "" };
      if (siamoAlMercato()) {
        const aperta = trattativaAperta(b.dataset.giocatore);
        apriFoglio({ tipo: "busta", trattativaId: aperta?.id ?? null, giocatoreId: b.dataset.giocatore });
      } else {
        apriFoglio({ tipo: "firma", giocatoreId: b.dataset.giocatore });
      }
    }));
}

/** Mette il giocatore in rosa, se le regole lo consentono. */
async function firma() {
  const g = PER_ID.get(foglioAperto.giocatoreId);
  const squadra = squadraCorrente();
  const contratti = rosaDi(squadra.id);
  const conto = contoRosa(contratti);
  const ingaggio = aQuarti(bozza.ingaggio);

  const motivi = perchéNo({
    giocatore: g, tipo: bozza.tipo, ingaggio, ingaggioScritto: Number(bozza.ingaggio), anni: bozza.anni, conto,
    contrattiTampone: contratti.filter((c) => c.tipo === "TAMPONE").length,
  });
  if (motivi.length) { disegna(); return; }

  /* Qualcuno potrebbe averlo appena preso: l'ultima parola è al database. */
  if (tesserati().has(g.id)) {
    alert(`${g.nome} è appena stato preso da un'altra squadra.`);
    chiudiFoglio();
    return;
  }

  const nuovo = {
    giocatoreId: g.id, nome: g.nome, ruolo: g.ruolo,
    tipo: bozza.tipo, anni: bozza.anni, ingaggio,
    firmato: new Date().toISOString(),
  };
  await scriviRosa(squadra.id, [...contratti, nuovo]);
  await annota("contratto",
    `${g.nome} a ${squadra.nome} per ${soldi(ingaggio)} × ${bozza.anni} ${bozza.anni === 1 ? "anno" : "anni"} (${REGOLE.contratti[bozza.tipo].nome})`,
    squadra.id);
  chiudiFoglio();
}

/* ── Gestione: squadre, nome della lega, azzeramento ──────── */

function agganciaGestione() {
  su("#aggiungi-squadra", "click", () => apriFoglio({ tipo: "squadra", squadraId: null }));
  su("[data-modifica]", "click", (e) => apriFoglio({ tipo: "squadra", squadraId: e.currentTarget.dataset.modifica }));

  /* I colori delle maglie: dieci tinte distinguibili a colpo d'occhio nella
     schermata d'ingresso, dove le squadre si riconoscono dalla sigla colorata. */
  const COLORI = ["#2C7A52", "#1B4A76", "#7C2620", "#6A4708", "#4A2A6B",
                  "#1F6B6B", "#8A3B6B", "#3E5C1E", "#8A4B12", "#2E3B7A"];

  /** La sigla si ricava dal nome: iniziali se ci sono più parole, prime tre
   *  lettere se è una sola. Si corregge a mano dalla scheda della squadra. */
  function siglaDa(nome) {
    const parole = nome.split(/[\s'']+/).filter(Boolean);
    if (parole.length >= 2) return parole.slice(0, 3).map((p) => p[0]).join("").toUpperCase();
    return nome.slice(0, 3).toUpperCase();
  }

  const moduloIscrizioni = radice.querySelector("#modulo-iscrizioni");
  if (moduloIscrizioni) moduloIscrizioni.addEventListener("submit", async (e) => {
    e.preventDefault();
    const esito = radice.querySelector("#esito-iscrizioni");
    const righe = radice.querySelector("#elenco-squadre").value
      .split("\n").map((r) => r.trim()).filter(Boolean);

    if (!righe.length) {
      esito.innerHTML = `<div class="avviso errore">Scrivi almeno una squadra, una per riga.</div>`;
      return;
    }
    const nomi = righe.map((r) => r.split(",")[0].trim());
    if (new Set(nomi.map((n) => n.toLowerCase())).size !== nomi.length) {
      esito.innerHTML = `<div class="avviso errore">Ci sono due squadre con lo stesso nome: nella lega i nomi sono unici.</div>`;
      return;
    }

    e.submitter && (e.submitter.disabled = true);
    for (const [indice, riga] of righe.entries()) {
      const [nome, presidente] = riga.split(",").map((x) => (x ?? "").trim());
      const id = "s" + (indice + 1);
      await scriviSquadra({
        id, nome, sigla: siglaDa(nome), presidente: presidente ?? "",
        pin: CODICE_PREDEFINITO, colore: COLORI[indice % COLORI.length], ordine: indice + 1,
      });
      /* La dotazione dell'art. 14 nasce con la squadra, e si vede nel registro:
         un capitale che compare senza una riga che lo spieghi è un capitale su
         cui prima o poi qualcuno discute. */
      await scriviSocieta(id, { capitale: aQuarti(REGOLE.capitale.dotazione) });
      await annota("lega", `${nome} iscritta con ${soldi(aQuarti(REGOLE.capitale.dotazione))} di dotazione`, id);
    }
  });

  su("#codice-uguale", "click", async (e) => {
    e.currentTarget.disabled = true;
    const daCambiare = stato.squadre.filter((s) => s.pin !== CODICE_PREDEFINITO);
    for (const s of daCambiare) await scriviSquadra({ ...s, pin: CODICE_PREDEFINITO });
    await annota("lega", `Codice ${CODICE_PREDEFINITO} per tutte le squadre`, null);
  });

  const moduloSquadra = radice.querySelector("#modulo-squadra");
  if (moduloSquadra) moduloSquadra.addEventListener("submit", async (e) => {
    e.preventDefault();
    const id = moduloSquadra.dataset.id || "s" + Date.now().toString(36);
    const nuova = !moduloSquadra.dataset.id;
    const squadra = {
      id,
      nome: radice.querySelector("#sq-nome").value.trim(),
      sigla: radice.querySelector("#sq-sigla").value.trim().toUpperCase(),
      presidente: radice.querySelector("#sq-presidente").value.trim(),
      pin: radice.querySelector("#sq-pin")?.value.trim() ?? squadraDi(id)?.pin ?? CODICE_PREDEFINITO,
      colore: radice.querySelector("#sq-colore").value,
      ordine: squadraDi(id)?.ordine ?? stato.squadre.length + 1,
    };
    if (serveIlCodice() && !/^[0-9]{4}$/.test(squadra.pin)) { alert("Il codice è di quattro cifre."); return; }
    await scriviSquadra(squadra);
    if (nuova) {
      await scriviSocieta(id, { capitale: aQuarti(REGOLE.capitale.dotazione) });
      await annota("lega", `${squadra.nome} iscritta con ${soldi(aQuarti(REGOLE.capitale.dotazione))} di dotazione`, id);
    } else {
      await annota("lega", `${squadra.nome} aggiornata`, id);
    }
    chiudiFoglio();
  });

  su("[data-ritira]", "click", async (e) => {
    const id = e.currentTarget.dataset.ritira;
    const squadra = squadraDi(id);
    if (!confirm(`Ritirare ${squadra.nome} dalla lega?`)) return;
    await db.collection("squadre").doc(id).delete();
    await db.collection("rose").doc(id).delete().catch(() => {});
    await db.collection("societa").doc(id).delete().catch(() => {});
    await annota("lega", `${squadra.nome} ritirata dalla lega`, null);
    chiudiFoglio();
  });

  su("[data-codice]", "click", async (e) => {
    const chiedi = e.currentTarget.dataset.codice === "si";
    if (chiedi === serveIlCodice()) return;
    await db.doc("lega/config").update({ chiediCodice: chiedi });
    await annota("lega", chiedi
      ? "Per entrare adesso serve il codice della squadra"
      : "Per entrare basta toccare la propria squadra", null);
  });

  su("[data-fase]", "click", async (e) => {
    const nuova = e.currentTarget.dataset.fase;
    if (nuova === fase()) return;
    await db.doc("lega/config").update({ fase: nuova });
    await annota("lega", nuova === "MERCATO"
      ? "Mercato aperto: sui liberi si depositano buste"
      : "Si compongono le rose: dal listone si firma subito", null);
  });

  su("[data-posizione]", "change", async (e) => {
    const squadra = squadraDi(e.currentTarget.dataset.posizione);
    const valore = e.currentTarget.value.trim();
    if (!squadra) return;
    const posizione = valore === "" ? null : Number(valore);
    await scriviSquadra({ ...squadra, posizione });
  });

  su("#salva-lega", "click", async () => {
    const nome = radice.querySelector("#rinomina-lega").value.trim();
    if (!nome) return;
    await db.doc("lega/config").update({ nome });
    await annota("lega", `La lega si chiama «${nome}»`, null);
  });

  su("#azzera", "click", async () => {
    const scritto = radice.querySelector("#conferma-azzera").value.trim();
    if (scritto !== stato.config.nome) { alert("Scrivi il nome della lega per confermare."); return; }
    if (!confirm("Cancello squadre, rose e registro. Il listone resta. Procedo?")) return;
    for (const s of stato.squadre) {
      await db.collection("rose").doc(s.id).delete().catch(() => {});
      await db.collection("societa").doc(s.id).delete().catch(() => {});
      await db.collection("squadre").doc(s.id).delete().catch(() => {});
    }
    const vecchie = await db.collection("registro").limit(500).get();
    for (const d of vecchie.docs) await db.collection("registro").doc(d.id).delete().catch(() => {});
    await annota("lega", "La lega è stata riportata a zero", null);
    stato.vista = "lega";
    disegna();
  });
}

/* ═══════════════════════════════════════════════════════════════
   AVVIO
   ═══════════════════════════════════════════════════════════════ */

riprendiIo();
disegna();

(async () => {
  /* Quattro situazioni, un solo avvio:
     · il sito pubblico, dove il database è Firebase e arriva da una promessa
       (`DYNASTY_DB_ATTESA`) perché la libreria si carica dopo questo script;
     · la demo, che ne mette uno finto su `window.DYNASTY_DB`;
     · la lega su claude.ai, dove il database lo dà la piattaforma;
     · la pagina aperta da sola, dove `claude` non esiste affatto e l'unica
       cosa sensata è dirlo invece di rompersi.
     Nessuna di queste tocca `window.claude`, che è della piattaforma e in un
     artifact pubblicato non si lascia sostituire. */
  db = (window.DYNASTY_DB_ATTESA ? await window.DYNASTY_DB_ATTESA : null)
    ?? window.DYNASTY_DB
    ?? (typeof claude !== "undefined" ? await claude.use("db") : null);
  if (!db) { stato.pronto = true; disegna(); return; }
  ascolta();
})();
